<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日模擬題｜觀護人練習臺</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#20334b;background:#f3f6fa;line-height:1.6}*{box-sizing:border-box}body{margin:0}header{background:#173553;color:white;padding:24px max(20px,calc((100vw - 1250px)/2))}h1{margin:5px 0;font-size:1.7rem}header p{margin:5px 0;color:#d7e5f4}header a{color:#d7e5f4}button,select{font:inherit;border:1px solid #cad5e2;border-radius:8px;padding:7px 12px;background:white;color:#20334b}button{cursor:pointer}button:hover{background:#edf4fc}button:disabled{opacity:.5;cursor:default}.tools,.layout{max-width:1250px;margin:18px auto;padding:0 18px}.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}aside button{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px}aside button[aria-current="true"]{border-color:#215e9f;background:#e7f0fb}small,.muted{color:#60748a;font-size:.85rem}.panel{background:white;border:1px solid #dce4ed;border-radius:12px;padding:24px;min-width:0}h2{font-size:1.25rem;margin:0 0 12px}h3{font-size:1rem}label{display:inline-flex;gap:6px;align-items:center}textarea{display:block;width:100%;min-height:240px;resize:vertical;font:inherit;padding:12px;border:1px solid #bdccdd;border-radius:8px;margin:8px 0}.text{white-space:pre-wrap;overflow-wrap:anywhere}details{border-top:1px solid #e0e7ef;padding:14px 0}summary{cursor:pointer;font-weight:600}.table-wrap{overflow:auto;margin-top:12px}table{border-collapse:collapse;width:100%;min-width:680px;table-layout:fixed;font-size:.9rem}th,td{border:1px solid #d6e0ec;padding:10px;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}th{background:#edf3fa;text-align:left}th:first-child{width:18%}th:nth-child(2){width:32%}th:nth-child(3){width:20%}th:nth-child(4){width:30%}.nav{display:flex;justify-content:space-between;margin-top:20px}.status{max-width:1250px;margin:8px auto;padding:0 18px;color:#60748a}.badge{display:inline-block;background:#fff1dc;color:#795013;border-radius:6px;font-size:.8rem;padding:3px 8px;margin-bottom:12px}footer{max-width:1250px;margin:25px auto;padding:0 18px;color:#60748a;font-size:.85rem}.error{color:#a33131}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{max-height:210px;overflow:auto}.panel{padding:18px}}@media print{header,.tools,aside,footer,.nav,textarea,#draft-status,.review-control{display:none}.layout{display:block;margin:0;padding:0}.panel{border:0;padding:0}details{display:block}table{min-width:0;font-size:9pt}.table-wrap{overflow:visible}}
</style></head><body>
<header><a href="../v2.4/">← 觀護人練習臺</a><h1>每日模擬題</h1><p>讀案例 → 列爭點 → 寫答案 → 對照參考架構</p></header>
<div class="tools"><label>科目 <select id="subject"><option value="">全部科目</option></select></label><button id="refresh">更新題庫</button><button id="export">匯出學習紀錄</button><button id="import">匯入學習紀錄</button><button id="print">列印目前題目</button><input id="upload" type="file" accept="application/json,.json" hidden></div>
<p id="status" class="status" role="status" aria-live="polite">正在載入題庫…</p><p id="notice" class="status" role="status" aria-live="polite"></p>
<div class="layout"><aside id="list" aria-label="模擬題清單"></aside><main id="main" class="panel"><p>正在讀取模擬題。</p></main></div>
<footer>題目及參考架構依來源文件整理，尚待內容核對，非官方解答。作答紀錄保存在目前瀏覽器；跨裝置使用請匯出／匯入。此頁不提供自動評分。</footer>
<script>
'use strict';
const $=id=>document.getElementById(id), KEY='probation-daily-github:records:v1';
let questions=[],records={},current='',storageWritable=true,loading=false,rawStorage='';
const category=q=>q.subject.includes('跨科')?'跨科整合':q.subject.replace(/（.*$/,'').trim();
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const signature=q=>JSON.stringify([q.question,q.issues,q.outline,q.theoryTable]);
function validRecord(r){return r&&typeof r==='object'&&typeof r.answer==='string'&&r.answer.length<=100000&&typeof r.review==='boolean'&&typeof r.updatedAt==='string'&&(r.questionSnapshot===undefined||typeof r.questionSnapshot==='string');}
try{rawStorage=localStorage.getItem(KEY)||'{}';const parsed=JSON.parse(rawStorage);if(!parsed||typeof parsed!=='object'||Array.isArray(parsed)||!Object.values(parsed).every(validRecord))throw Error();records=Object.fromEntries(Object.entries(parsed));}catch(e){storageWritable=false;$('notice').textContent='原有本機紀錄無法讀取，已保留原資料；請先匯出備份。本次作答暫存於頁面。';}
function visible(){return questions.filter(q=>!$('subject').value||category(q)===$('subject').value);}
function persist(){if(!storageWritable)return false;try{localStorage.setItem(KEY,JSON.stringify(records));return true;}catch(e){$('notice').textContent='本機儲存失敗，請匯出學習紀錄。';return false;}}
function save(){const q=questions.find(q=>q.id===current);if(!q||!$('answer'))return;records[current]={answer:$('answer').value,review:$('review').checked,updatedAt:new Date().toISOString(),questionSnapshot:signature(q)};const ok=persist();$('draft-status').textContent=(ok?'草稿已儲存於此瀏覽器':'草稿暫存在此頁，請匯出備份')+' · '+records[current].answer.length+' 字';renderList();}
function renderList(){const list=visible();$('list').innerHTML=list.map(q=>`<button data-id="${esc(q.id)}" aria-current="${q.id===current}"><small>${esc(category(q))} · ${records[q.id]?.review?'★ 待複習':records[q.id]?.answer?'已有草稿':'尚未作答'}</small><br>${esc(q.date)}</button>`).join('');for(const b of $('list').querySelectorAll('button'))b.onclick=()=>{current=b.dataset.id;render();};}
function render(){renderList();const q=questions.find(q=>q.id===current);if(!q){$('main').innerHTML='<p>此科目目前沒有題目。</p>';return;}const r=records[q.id]||{answer:'',review:false};const changed=r.questionSnapshot&&r.questionSnapshot!==signature(q);const table=q.theoryTable;const list=visible(),index=list.findIndex(x=>x.id===q.id);
 $('main').innerHTML=`<h2>${esc(q.date)}｜${esc(category(q))}</h2><span class="badge">待內容核對</span><p class="muted">${esc(q.subject)}</p>${changed?'<p class="error">本題參考內容已更新，原作答仍保留；請重新對照。</p>':''}<h3>案例與問題</h3><div class="text">${esc(q.question)}</div><h3>我的作答</h3><textarea id="answer" maxlength="100000" aria-label="我的作答" placeholder="先列爭點，再寫規範、案例涵攝與結論。"></textarea><label class="review-control"><input id="review" type="checkbox">★ 待複習</label><p id="draft-status" class="muted"></p><details><summary>核心爭點與複習方向</summary><div class="text">${esc(q.issues)}</div></details><details><summary>參考答題架構</summary><div class="text">${esc(q.outline)}</div></details><details><summary>理論與個案應用四欄表格</summary><div class="table-wrap"><table><thead><tr>${table[0].map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${table.slice(1).map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details><details><summary>原始考題出處</summary><p class="text">${esc(q.sourceReference||'來源文件未擷取到獨立出處欄位，待補充核對。')}</p><p class="muted">以上依來源文件標示，尚未核對考選部原卷。</p></details><div class="nav"><button id="previous" ${index<=0?'disabled':''}>上一題</button><span class="muted">${index+1} / ${list.length}</span><button id="next" ${index>=list.length-1?'disabled':''}>下一題</button></div>`;
 $('answer').value=r.answer;$('review').checked=r.review;$('draft-status').textContent=r.updatedAt?'上次作答：'+new Date(r.updatedAt).toLocaleString('zh-TW'):'尚未作答';$('answer').oninput=save;$('review').onchange=save;
 $('previous').onclick=()=>{current=list[index-1].id;render();};$('next').onclick=()=>{current=list[index+1].id;render();};
}
function validateData(d){if(d.schemaVersion!==1||!Array.isArray(d.questions)||!d.questions.length||d.count!==d.questions.length)throw Error('題庫格式不符');const ids=new Set();for(const q of d.questions){if(!q||typeof q.id!=='string'||ids.has(q.id)||!/^\d{4}-\d{2}-\d{2}$/.test(q.date)||!['subject','question','issues','outline'].every(k=>typeof q[k]==='string'&&q[k].trim())||!Array.isArray(q.theoryTable)||q.theoryTable.length<2||!q.theoryTable.every(row=>Array.isArray(row)&&row.length===4&&row.every(c=>typeof c==='string')))throw Error('題目或表格格式不符');ids.add(q.id);}if(/(?:docs|drive)\.google\.com/i.test(JSON.stringify(d)))throw Error('題庫含不應公開的來源連結');}
async function load(){if(loading)return;loading=true;$('refresh').disabled=true;try{const response=await fetch('./questions.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();validateData(data);const filter=$('subject').value;questions=data.questions.slice().sort((a,b)=>b.date.localeCompare(a.date));$('subject').innerHTML='<option value="">全部科目</option>'+[...new Set(questions.map(category))].map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');if(questions.some(q=>category(q)===filter))$('subject').value=filter;if(!visible().some(q=>q.id===current))current=visible()[0]?.id||'';$('status').textContent='題庫 '+questions.length+' 題 · 來源最後更新：'+new Date(data.updatedAt).toLocaleString('zh-TW');render();}catch(e){$('status').textContent='題庫更新失敗：'+e.message+'。請稍後再試。';if(!questions.length)$('main').innerHTML='<p>目前無法載入題庫，請點「更新題庫」重試。</p>';}finally{loading=false;$('refresh').disabled=false;}}
function download(body,name){const url=URL.createObjectURL(new Blob([typeof body==='string'?body:JSON.stringify(body,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 $('subject').onchange=()=>{current=visible()[0]?.id||'';render();};$('refresh').onclick=load;
 $('export').onclick=()=>{download({format:'probation-daily-github-records',schemaVersion:1,exportedAt:new Date().toISOString(),records},'daily-simulation-records-'+new Date().toISOString().slice(0,10)+'.json');if(!storageWritable&&rawStorage!=='{}')download(rawStorage,'daily-simulation-original-storage.json');$('notice').textContent='已匯出，請保存下載檔案。';};
 $('import').onclick=()=>$('upload').click();$('upload').onchange=async()=>{try{const file=$('upload').files[0];if(!file)return;if(file.size>5*1024*1024)throw Error('檔案超過 5 MB');const data=JSON.parse(await file.text());if(data.format!=='probation-daily-github-records'||data.schemaVersion!==1||!data.records||typeof data.records!=='object'||Array.isArray(data.records)||!Object.values(data.records).every(validRecord))throw Error('紀錄格式不符，請使用此 GitHub 模擬題頁面的備份');const entries=Object.entries(data.records);if(!entries.length)throw Error('檔案沒有作答紀錄');if(!confirm('匯入 '+entries.length+' 筆紀錄，會取代同題的現有作答。是否繼續？'))return;records=Object.fromEntries([...Object.entries(records),...entries]);if(!storageWritable)$('notice').textContent='紀錄已載入此頁，原本無法讀取的本機資料仍保留；請匯出備份。';else if(persist())$('notice').textContent='紀錄已匯入。';render();}catch(e){$('notice').textContent='匯入失敗：'+e.message;}finally{$('upload').value='';}};
 $('print').onclick=()=>{const states=[...$('main').querySelectorAll('details')].map(d=>[d,d.open]);for(const[d]of states)d.open=true;window.print();for(const[d,open]of states)d.open=open;};
 load();
</script></body></html>
