<style>body{margin:0;background:#f3f6f5;color:#19352f;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;line-height:1.8}main{max-width:1060px;margin:auto;padding:32px 20px}h1{font-size:clamp(25px,5vw,38px);margin:.3em 0}h2{font-size:21px}h3{font-size:17px}small,.muted{color:#526b62}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.pill{background:#e0eee7;border-radius:20px;padding:4px 14px}select,input,button,textarea{font:inherit;border:1px solid #b8c9c0;border-radius:9px;padding:9px;background:white;color:inherit}input{min-width:200px;flex:1}button{cursor:pointer;background:#225e4c;color:white}article{background:white;border:1px solid #dce5df;border-radius:15px;margin:20px 0;padding:23px}summary{cursor:pointer;font-weight:650}pre{white-space:pre-wrap;font:inherit}textarea{width:100%;box-sizing:border-box;min-height:170px}a{color:#19604c;overflow-wrap:anywhere}li{margin:8px 0}.warn{background:#fff4d8;border-radius:9px;padding:12px 16px}dl{display:grid;grid-template-columns:90px 1fr;gap:8px}dt{font-weight:bold}dd{margin:0}.results{border-top:1px solid #cbd9d1;margin-top:16px;padding-top:14px}.counts{font-size:16px;margin-bottom:18px}.badge{font-size:13px;color:#5c685e}label{display:inline-flex;gap:6px;align-items:center}@media(max-width:580px){main{padding:18px 12px}article{padding:16px}dl{grid-template-columns:1fr}input{min-width:100px;width:100%}}</style>
<main><small>觀護人學習平臺 · 兩版各自保留 · 2026-10-26</small><h1>觀護人六科，190題逐題試評</h1><p>原有版本完整保留；補充版本沿用54題、新增136題。每題可自行切換查看要點、來源與四項試評。</p>
<p class="warn">未經專家答案集校準。新增題目的文字命中不代表答案正確；來源不足、數量或選擇要求、否定與反例須人工覆核時，不給總分。這份檢查版不寫入正式站的作答紀錄。</p>
<details><summary>為什麼是190題，而不是192題？</summary><p>108至115年六科原卷中，110年諮商與輔導、115年刑法各只有三大題，並非各缺一題。保留官方大題為單位，不拆子題湊數。</p><p><a href="https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?t=Q&code=110130&c=103&s=0810&q=1" target="_blank" rel="noopener">110年諮商與輔導原卷</a> · <a href="https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?t=Q&code=115120&c=103&s=0503&q=1" target="_blank" rel="noopener">115年刑法原卷</a></p></details>
<p class="counts" id="counts"></p><div class="bar"><label>科目<select id="subject"><option value="">全部六科</option></select></label><label>範圍<select id="scope"><option value="">全部190題</option><option value="new">新增136題</option><option value="retained">沿用54題</option></select></label><input id="search" placeholder="搜尋年度、題號、考點或原題" aria-label="搜尋題目"></div><p id="resultCount" class="muted"></p><section id="cards"></section><button id="more" hidden>再顯示20題</button></main>
<script src="questions.js"></script><script src="legal-pilots.js"></script><script src="full-pilots.js"></script><script src="pending-pilots-data.js"></script><script src="answer-calibrations.js"></script><script src="full-pilots-all.js"></script><script src="probation-trial-data.js"></script><script src="probation-trial.js"></script><script>
'use strict';const records=window.PROBATION_TRIAL_MANIFEST.questions.map(m=>{const q=window.QUESTION_BANK.find(q=>q.id===m.id);const originalRule=window.FULL_PILOT_RUBRICS[m.id];const retained=m.status==='existing-unchanged';return {question:q,retained,originalRule,rule:retained?originalRule:window.PROBATION_TRIAL_RUBRICS[m.id]}});const byId=Object.fromEntries(records.map(r=>[r.question.id,r]));
const el=id=>document.getElementById(id),node=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
for(const s of [...new Set(records.map(r=>r.question.subject))]){const o=node('option',s);o.value=s;el('subject').append(o)}
const statuses=Object.values(window.PROBATION_TRIAL_RUBRICS).reduce((a,r)=>(a[r.contentStatus]=(a[r.contentStatus]||0)+1,a),{});
el('counts').textContent='190題｜兩版試評各自保留｜補充136題、沿用54題｜逐題來源與待核對事項均保留。';
let limit=20,filtered=[];
function link(title,url){const a=node('a',title);if(/^https?:/.test(url)||url.startsWith('index.html?'))a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
function list(parent,items){const ul=node('ul');for(const item of items||[])ul.append(node('li',item));parent.append(ul)}
function card(row){const q=row.question,r=row.rule,a=node('article');a.id='question-'+q.id;a.append(node('span',row.retained?'沿用既有試評 · 未重做':'新增逐題試評 · 未經專家校準'),node('h2',q.id+'｜'+r.title));const d=node('details');d.append(node('summary','查看完整原題與參考依據'));d.append(node('h3','完整原題'),node('pre',q.body),link('考選部原卷',q.sourceUrl));d.append(node('h3','參考答案／答題要點'));if(r.referenceAnswer)d.append(node('p',r.referenceAnswer));else list(d,(r.criteria||[]).map(c=>c.hint));d.append(node('h3','四項試評依據'));const dl=node('dl');for(const [key,label] of [['issue','考點／爭點'],['rule','法條／理論'],['analysis','分析／應用'],['structure','結構表達']]){dl.append(node('dt',label));dl.append(node('dd',(r.criteria||[]).filter(c=>c.category===key).map(c=>c.hint).join('；') || (key==='structure'?'依本題各問分段，列出理由與對應結論。':'依所選版本逐題要點及參考綱要核對，實質正確性仍須覆核。')))}d.append(dl);d.append(node('h3','來源及其支持範圍'));const ul=node('ul');for(const s of r.sources||[]){const li=node('li');li.append(link(s.title,s.url));li.append(node('span','｜'+(s.scope||s.coverage||s.section||'原有參考來源，完整適用須覆核。')+'｜'+(row.displayProvider==='original'?'原有版本所附來源，保留其原查證標記':s.checkedAt&&s.verification!=='existing-reference-not-rechecked'?'本次定向查證：'+s.checkedAt:'既有來源，本次未重新全面核對')));ul.append(li)}d.append(ul);if(r.openIssues?.length){d.append(node('h3','待查證及覆核事項'));list(d,r.openIssues)}if(r.constraints?.length){d.append(node('h3','原題特殊要求'));list(d,r.constraints.map(c=>c.hint))}a.append(d);a.append(link('在練習臺開啟本題','index.html?q='+encodeURIComponent(q.id)));if(!row.retained){const box=node('details');box.append(node('summary','試用本題四項試評'));const t=node('textarea');t.setAttribute('aria-label',q.id+'試評答案');t.placeholder='貼上自己的答案，按下方按鈕檢查；這裡不儲存答案。';const b=node('button','查看四項試評理由'),res=node('div');res.className='results';res.hidden=true;b.addEventListener('click',()=>{const result=window.gradeProbationTrial(t.value,q);res.replaceChildren();res.hidden=false;res.append(node('p',result.total===null?'總分：待覆核（不代表答錯）':'辨識線索：'+result.total+'／100（非正確率或國考分數）'));for(const item of result.dimensionReasons){res.append(node('h3',item.label),node('p',item.hint));if(item.evidence)res.append(node('p','原句：'+item.evidence))}list(res,result.warnings)});box.append(t,b,res);a.append(box)}return a}
function versionCard(row){
  const wrap=node('section'),bar=node('div');bar.className='bar';const label=node('label','查看試評版本 '),select=node('select');select.setAttribute('aria-label',row.question.id+'查看試評版本');for(const [id,text] of [['original','原有版本'],['supplement','補充版本']]){const o=node('option',text);o.value=id;select.append(o)}label.append(select);bar.append(label);wrap.append(bar);
  const views={};for(const key of ['original','supplement']){const view=card({...row,retained:true,displayProvider:key,rule:key==='original'?row.originalRule:row.rule});view.removeAttribute('id');view.querySelector('span').textContent=key==='original'?'原有版本 · 網站現有內容完整保留':row.retained?'補充版本 · 本題沿用原已完成試評':'補充版本 · 本次逐題補充';view.hidden=key!=='original';views[key]=view;wrap.append(view)}
  const trial=node('details');trial.append(node('summary','用同一份答案切換兩版試評'));const t=node('textarea');t.setAttribute('aria-label',row.question.id+'共用答案');t.placeholder='兩版共用這份答案，結果分開保留；檢查版不寫入網站紀錄。';const b=node('button','以目前版本試評'),res=node('div'),saved={};res.className='results';trial.append(t,b,res);wrap.append(trial);
  function show(){views.original.hidden=select.value!=='original';views.supplement.hidden=select.value!=='supplement';res.replaceChildren();const result=saved[select.value];if(!result){res.append(node('p',(select.value==='original'?'原有版本':'補充版本')+'：尚未試評。切換不會自動重評。'));return}res.append(node('p',(select.value==='original'?'原有版本':'補充版本')+'｜'+(result.total===null?'待覆核（不代表答錯）':'辨識線索 '+result.total+'／100（非國考分數）')));if(result.answer!==t.value)res.append(node('p','以下是先前答案的結果；答案已修改，請重新試評。'));for(const [key,name] of [['issue','考點／爭點'],['rule','法條／理論'],['analysis','分析／應用'],['structure','結構表達']]){res.append(node('h3',name));const rows=(result.evidence||[]).filter(x=>x.category===key);list(res,rows.length?rows.map(x=>x.label+'：'+x.hint+(x.evidence?'｜原句：'+x.evidence:'')):['依所選版本的段落與結論規則檢查；仍須人工覆核實質完整性。'])}list(res,result.warnings)}
  b.addEventListener('click',()=>{const useSupplement=select.value==='supplement'&&!row.retained;saved[select.value]=useSupplement?window.gradeProbationTrial(t.value,row.question):window.gradeFullPilot(t.value,row.question);show()});select.addEventListener('change',show);t.addEventListener('input',()=>{if(saved[select.value])show()});show();return wrap;
}
function render(reset=true){if(reset)limit=20;const s=el('subject').value,scope=el('scope').value,term=el('search').value.trim().toLowerCase();filtered=records.filter(r=>(!s||r.question.subject===s)&&(!scope||(scope==='retained')===r.retained)&&(!term||(r.question.id+r.question.body+r.rule.title).toLowerCase().includes(term)));el('resultCount').textContent='符合'+filtered.length+'題；顯示'+Math.min(limit,filtered.length)+'題。';el('cards').replaceChildren(...filtered.slice(0,limit).map(versionCard));el('more').hidden=limit>=filtered.length}
for(const id of ['subject','scope'])el(id).addEventListener('change',()=>render());el('search').addEventListener('input',()=>render());el('more').addEventListener('click',()=>{limit+=20;render(false)});render();
window.TrialReview={records,byId};
</script></html>
