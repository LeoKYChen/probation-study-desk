<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>咚咚鼠的咚咚時間｜116觀護人342題</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#315b7c"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="../pwa/icon-180.png"><link rel="stylesheet" href="../offline.css"><script src="../offline.js" defer></script><link rel="stylesheet" href="../assets/study-theme.css">
</head>
<body><header><a href="../">← 觀護人練習臺</a><nav><a href="../v2.5/">考古題練習</a><a href="../daily-simulation/">每日模擬題</a></nav></header>
<main><section class="hero"><div><p class="eyebrow">116 年觀護人・專題練習</p><h1>咚咚鼠的<br>咚咚時間<span aria-hidden="true">🐭</span></h1><p>今天敲開一個考點，慢慢把理解寫成答案。</p><button id="random" disabled>抽一題，開始咚咚 →</button></div><aside><strong>先寫，再看。</strong><p>列爭點 → 寫規範或理論 → 連結事實 → 提出結論</p><p class="hint">編製擬答，非官方答案。原稿90題已完成兩輪修訂，其餘252題仍待逐題覆核。</p></aside></section>
<section class="stats" aria-label="練習進度"><div><strong id="total">342</strong><span>專題題庫</span></div><div><strong id="written">0</strong><span>已有作答</span></div><div><strong id="reviews">0</strong><span>待複習</span></div></section>
<section class="toolbar"><h2>選一題，開始練習</h2><div class="filters"><label>科目<select id="subject"><option value="">全部科目</option></select></label><label>題型<select id="type"><option value="">全部題型</option><option>基礎</option><option>進階</option><option>實例</option></select></label><label>練習狀態<select id="status"><option value="">全部題目</option><option value="unwritten">尚未作答</option><option value="written">已有作答</option><option value="review">待複習</option><option value="cross">交錯題</option></select></label><label class="search">搜尋<input id="search" type="search" placeholder="題號、題名或題目關鍵字"></label></div><div class="utilities"><span id="count" role="status">正在載入題庫…</span><button class="quiet" id="export">匯出作答</button><button class="quiet" id="import">匯入作答</button><input id="file" type="file" accept="application/json,.json" hidden></div></section>
<p id="notice" role="status" aria-live="polite"></p><section id="cards" class="cards" aria-label="題目清單"></section>
</main><footer>作答儲存在目前瀏覽器；換裝置前請匯出備份。每日模擬題與本頁各自保存。</footer>
<dialog id="practice"><div class="dialog-head"><span id="meta"></span><button id="close" class="quiet">關閉 ✕</button></div><h2 id="title"></h2><p id="qid" class="eyebrow"></p><div id="prompt" class="prompt"></div><div class="answer-label"><label for="answer">我的作答</label><span id="words">0字</span></div><textarea id="answer" placeholder="先列爭點，再寫出你的分析。"></textarea><div class="save-row"><label><input type="checkbox" id="review"> 標記待複習</label><span id="saveStatus" role="status"></span></div><details id="reference"><summary>寫完了，展開參考解答</summary><div id="solution"></div></details><p class="hint">本頁採自行核對，未提供自動評分。法源查讀日期與修訂狀態請見解答原文。</p></dialog></body></html>
