ect": "刑事訴訟法", "question": "少年甲現年 17 歲，因在網路上尋找打工機會，遭電信詐欺集團吸收擔任水房提款車手。某日晚間 9 時，甲在自動櫃員機提領贓款時遭警員當場以現行犯逮捕，並扣押其身上之提款卡與智慧型手機。警員將甲帶回警局後，甲之父母因離異且疏於管教，警方僅撥打一次電話無人接聽即作罷，未再行通知其他適當之人。翌日上午 9 時，警員製作筆錄時，甲明確表示欲選任律師為辯護人，警員乃准予甲聯絡法扶律師並等候。迄同日上午 11 時，因警員急於移送少年法院，乃對甲告稱：「律師等了兩個小時還沒來，我們時間有限，你現在老實招供算你配合，不然移送法院直接收容關起來！」甲因孤立無援且心生恐懼，遂於警詢中坦承知悉所領款項為詐騙贓款，並交出手機解鎖密碼供警員檢視通訊軟體群組對話紀錄。嗣甲經少年法院裁定移送檢察官起訴。於通常刑事審判中，甲之辯護人主張：警員未通知法定代理人到場、未滿 4 小時即逕行訊問且施以脅迫，其警詢自白及衍生之手機通訊紀錄均無證據能力。試問：(一) 請依《刑事訴訟法》、《少年事件處理法》及實務見解，檢討警員對甲之詢問程序是否合法？甲之警詢自白及自其手機取得之通訊紀錄，於法院審判時有無證據能力？（25 分）(二) 少年調查官或觀護人於審前調查中，若發現甲兼具心理順從脆弱性、缺乏家庭依附及合理化犯罪行為之傾向，應如何運用心理學、犯罪學或諮商輔導理論擬定輔導對策？請以標準四欄表格具體分析說明。", "issues": "爭點一：偵查中等候辯護人時間之計算與未達法定期間逕行詢問之效果\n《刑事訴訟法》第 31 條之 1 第 2 項後段規定，偵查中等候辯護人到場之時間，自告知時起不得逾「4 小時」。警員僅等候 2 小時即逕行訊問，明顯違反法定等候程序。\n爭點二：少年詢問法定代理人或適當成人在場權之違反\n《少年事件處理法》第 3 條之 1 第 1 項前段明定：「少年受訊問或詢問時，其法定代理人、現在保護少年之人或其他適當之人得陪同在場。」警方未窮盡通知義務，違反少年程序保障與 CRC 第 24 號一般性意見書意旨。\n爭點三：自白任意性之欠缺與違法取證之排除\n警員以「不坦白就直接收容」告稱，構成《刑事訴訟法》第 156 條第 1 項之「強暴、脅迫、利誘、詐欺、疲勞訊問或其他不正之方法」，自白欠缺任意性，依法應絕對排除證據能力。\n手機解鎖通訊紀錄涉及「毒樹果實理論（Fruit of the Poisonous Tree）」在臺灣實務之適用，應依《刑事訴訟法》第 158 條之 4 權衡法則審酌警察違法意圖、人權侵害情節與公共利益。", "outline": "(一) 警員詢問程序之合法性及自白與通訊紀錄之證據能力\n警員詢問程序具重大違法：\n違反等候辯護人之法定程序：依《刑事訴訟法》第 31 條之 1 第 2 項後段，司法警察等候辯護人到場之期間不得逾 4 小時。警員僅准予等候 2 小時即逕行訊問，已實質剝奪甲之防禦權。\n違反少年在場權之實質保障：依《少年事件處理法》第 3 條之 1 及 CRC 第 24 號一般性意見書第 60 點，少年受詢問時應有父母或適當之人陪同。警員未積極聯絡其他適當成年人，造成少年處於無任何心理與法律支持之封閉孤立環境。\n施以不正訊問：警員告稱「移送法院直接收容關起來」，係以非法的惡害通知脅迫少年，違反《刑事訴訟法》第 98 條及第 156 條第 1 項規定。\n甲之警詢自白無證據能力：\n依《刑事訴訟法》第 156 條第 1 項規定，自白須具備任意性。警員既施以不正脅迫，且剝奪辯護權與在場權，該自白非出於任意性，應「絕對排除」，不得作為證據。\n自手機取得之通訊紀錄之證據能力（衍生證據）：\n甲交付密碼係因不正訊問之自白所衍生。依我國最高法院實務（如 96 年台上字第 4177 號判決），針對違法自白衍生之二次證據，雖未直接採取美國嚴格之毒樹果實理論，惟仍應類推適用《刑事訴訟法》第 158 條之 4 權衡法則。\n本案警員違法情節重大（兼具脅迫、侵犯少年在場權及辯護權），若容許該手機通訊紀錄作為證據，將形同鼓勵違法取供，嚴重危害司法純潔性與正當程序，法院應裁定排除其證據能力。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["Gudjonsson 順從性理論（Gudjonsson Suggestibility Theory）", "英國犯罪心理學家 Gisli Gudjonsson 提出，探討個案在封閉、權力不對等之司法詢問情境下產生「虛偽自白（False Confession）」之心理機制。該理論指出，個案在面對權威施壓、缺乏社會支持與高度焦慮時，易採取「依從（Compliance）」策略，即為了逃避眼前的威脅（如被羈押或收容）而屈從陳述。易混淆處：順從性自白並非個案認知上相信自己有罪（不同於內化型虛偽自白 Internalized False Confession），而是外在短期動機驅使的暫時妥協。", "心理順從性、權威施壓、孤立情境、虛偽自白", "甲年僅 17 歲，遭遇警方逮捕後被隔絕於孤立警局，在父母未到場、律師未陪同之極端恐懼下，警員威脅「移送法院直接收容」，甲為求迅速脫離該高壓情境而產生高度心理順從，符合順從性自白之心理特徵。觀護人於調查時應詳查其自白動機，避免將屈從陳述誤判為具高度惡性之全然認罪。"], ["班度拉社會認知論之道德推脫（Moral Disengagement）", "Albert Bandura 提出，個人在從事違背普遍道德規範之行為時，會透過內在認知重構以解除道德自我約束，避免內疚與自我譴責。主要機制包括：道德辯護（將行為重塑為具合理價值）、責任分散與轉移（推諉為「我只是聽從群組指令領錢，主謀不是我」）、忽視或曲解後果，以及去人性化。易混淆處：道德推脫並非個案欠缺道德辨識能力，而是藉由認知防衛機轉阻斷道德罪惡感之運作。", "道德推脫、責任轉移、認知重構、合理化機制", "甲涉入詐欺水房擔任車手，常抱持「我只是單純打工跑腿領錢，騙人的又不是我」之責任轉移心態。觀護人在擬定個別處遇計畫時，應引導甲直面被害人遭詐騙後傾家蕩產的具體痛苦，拆解其「打工賺零用錢」的自我合理化認知，重建其對被害人損害之道德同理心與個人責任感。"], ["理情行為治療之非理性信念重構（Ellis's REBT）", "Albert Ellis 創立之理情行為治療（REBT）主張，人的情緒與適應不良行為（C）非直接由誘發事件（A）引起，而是源自於對事件的非理性信念（Beliefs, B），如「絕對化要求」、「過度概括」與「災難化思維」。改變機制在於透過積極駁斥（Disputing, D），協助個案建立有效且理性的新哲學（Effective New Philosophy, E）。易混淆處：REBT 並非單純提供情感同理，而是帶有強烈指導性與邏輯思辨之認知介入，需直接挑戰個案根深蒂固的非理性思考。", "ABCDE模式、非理性信念、積極駁斥、認知重組", "甲生長於離異家庭，長期缺乏親職支持，內心常存有「我家裡沒人管我，我做什麼都無所謂，只有錢能證明我的存在」之災難化與絕對化非理性信念，進而被詐騙高薪誘惑吸引。觀護人輔導時應以 ABC 模式解析其思維盲點，強力駁斥其「物質金錢等於自我價值」之非理性認知，並協助其建立健全的自尊與合法職業認同。"]], "sourceReference": "111 年公務人員特種考試司法人員三等考試觀護人類科（選試少年事件處理法）「刑事訴訟法與保安處分執行法」第 1 題", "reviewStatus": "待核對"}, {"id": "2026-09-25-1", "date": "2026-09-25", "subject": "保安處分執行法", "question": "案例事實：甲現年 20 歲，於 17 歲時因涉犯重傷罪，經少年法院依《少年事件處理法》第 27 條第 1 項規定裁定移送檢察官偵查起訴，嗣經判處有期徒刑 3 年確定，並於判決內依《刑法》第 93 條第 1 項規定，諭知於刑之執行完畢後交付保護管束 2 年。甲於入監執行期滿釋放時已滿 20 歲，由地檢署觀護人依《保安處分執行法》執行保護管束。於保護管束執行期間，甲無正當理由多次未於觀護人指定期日報到，觀護人經實施不預告訪視，發現甲多次涉足聲色場所、深夜不歸，且對同住祖母有言語恐嚇與毀損物品行為。觀護人採集其尿液送驗後，呈現第三級毒品愷他命（Ketamine）陽性反應。\n\n試問：(一) 針對甲之上開違規情事，觀護人得採取何種法律上之處置？若擬撤銷其保護管束，其法定要件、法定程序及撤銷後之法律效果各為何？（請依《保安處分執行法》及實務規範作答）(二) 若甲受處分原因兼具精神藥物濫用與童年創傷依附困境，觀護人在擬定個案處遇計畫時，得運用何種犯罪學、心理學或諮商輔導理論以因應其成癮與違規行為？請以標準四欄表格具體分析說明。", "issues": "爭點一：保護管束受處分人之遵守義務與觀護人裁量處置\n《保安處分執行法》第 74 條之 2 明定受保護管束人應遵守之各款事項（包括保持善良品行、服從觀護人命令、定期報到、不得與不良分子交往等）。\n觀護人得依同法第 65 條之 1、第 74 條之 3 規定採取約談、告誡、增強訪視頻率，或命其接受醫療、戒癮治療等輔導處置。\n爭點二：撤銷保護管束之要件、程序與法律效果\n要件：違反應遵守事項情節重大（《保安處分執行法》第 74 條之 3 第 1 項、第 2 項）。\n程序：由檢察官聲請管轄法院裁定（刑事訴訟法第 481 條第 1 項、保安處分執行法第 65 條之 1）。\n法律效果：刑後保護管束遭撤銷時，與「假釋中交付保護管束」不同，需檢討《刑法》第 93 條第 1 項宣告之刑後保護管束性質與替代執行之實務適用問題。\n爭點三：跨領域專業處遇之連結\n將行為改變技術、復發預防模式及依附創傷理論，具體扣合甲涉足不良場所、吸毒、家暴衝突與缺席報到之事實。", "outline": "(一) 觀護人得採取之處置、撤銷保護管束之要件、程序與法律效果\n觀護人得採取之告誡與處置權限：\n遵守義務違反之確認：甲未按期報到、深夜不歸涉足不當場所、施用毒品及家庭暴力行為，違反《保安處分執行法》第 74 條之 2 第 1 款（保持善良品行）、第 2 款（服從觀護人命令）及第 4 款（定期報告生活狀況）。\n告誡與輔導處置：依《保安處分執行法》第 74 條之 3 第 1 項，觀護人得予以告誡，促其遵守；同時得依個案需要，依同法第 65 條之 1 命其定期接受尿液採驗，並得協調社會福利、醫療機構施以戒癮諮商或毒品危害防制處遇。\n聲請撤銷保護管束之實體要件：\n依《保安處分執行法》第 74 條之 3 第 2 項，受保護管束人違反遵守事項「情節重大」者，得聲請撤銷。\n甲兼具施用毒品、無正當理由拒絕報到、恐嚇家屬等連續且嚴重危害公共安全之行為，已非單純生活規律欠佳，符合情節重大要件。\n管轄與法定程序：\n觀護人報請執行檢察官，由檢察官依《刑事訴訟法》第 481 條第 1 項向該案犯罪事實最後審判之管轄法院裁定。\n撤銷保護管束後之法律效果：\n甲所受者為《刑法》第 93 條第 1 項之「刑後保護管束」，其徒刑 3 年已執行完畢。依現行法制，刑後保護管束與假釋中保護管束不同（後者撤銷會導致入監執行殘刑）；實務上刑後保護管束撤銷後，因母刑已執行完畢，不得再送監執行原宣告刑，此乃保安處分獨立執行之法律特性。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["馬勒斯基復發預防模式（Relapse Prevention Model）", "此為認知行為取向模式，主張物質成癮與偏差行為的復發並非道德失敗，而是面對高風險情境時「應對技能不足」與「認知失衡」的結果。核心機制在於識別促發誘因、中斷「禁戒破毀效應」，並建立因應策略。易混淆處：常與精神分析之衝突論或道德勸告混淆；復發預防強調「技能訓練與環境控制」，承認微小滑脫（Slip）不等於完全復發（Relapse）。", "高風險情境、應對技能、禁戒破毀效應、誘因識別", "甲施用三級毒品並深夜流連不良場所，觀護人應會同心理師協助甲繪製「高風險情境地圖」，找出其涉足特定場所與毒品接觸的社交誘因；教導拒絕同儕技巧及壓力應對策略，打破其「吸食一次便自我放棄」的認知偏差。"], ["動機晤談法（Motivational Interviewing, MI）", "由 Miller 與 Rollnick 提出，植基於人本主義，認為個案的抗拒是輔導關係未調諧的信號而非本性頑劣。改變機制在於透過同理傾聽、引導個案探索其價值觀與現狀間的「內在不一致性」，激發其自我改變語言。易混淆處：非指導性說服或論辯；觀護人不可站在說教者立場直接駁斥甲的防衛，而是引導其自行發現行為後果與生涯期待之衝突。", "表達同理、開展不一致、順應抗拒、增強自我效能", "甲無正當理由多次拒絕向觀護處所報到，呈現高度防衛與抗拒。觀護人於面談時應避免直接威脅撤銷，改以開放式提問探討甲對滿 20 歲成年後生涯自主的渴望，對照目前因吸毒與家暴面臨刑事處分的現實，促使其自發產生配合定期報到的改變動機。"], ["依附理論與創傷知情模式（Attachment Theory & TIC）", "Bowlby 之依附理論指出，早期主要照顧者回應不足會形成不安全依附，在成年初期轉化為情緒調節障礙與人際攻擊。創傷知情模式主張「不問你哪裡有問題，而問你經歷了什麼」，個案的恐嚇與攻擊常為長期創傷激發的防衛機轉。易混淆處：並非免除受處分人之違法責任，而是在維持明確規範邊界的同時，理解其破壞性行為背後的情緒失控機制。", "不安全依附、創傷知情、安全基地、界限設定", "甲對同住祖母施以言語恐嚇與毀損，反映出其家庭依附關係嚴重斷裂與情緒調節瓦解。觀護人介入時一方面設定嚴格人身安全底線（防止暴力），另一方面引介家庭支持資源，協助建立穩定、具支持性的外部安全基地，降低其因家庭衝突引發的暴衝與失序行為。"]], "sourceReference": "103 年公務人員特種考試司法人員三等考試觀護人類科（選試少年事件處理法）「刑事訴訟法與保安處分執行法」第 4 題", "reviewStatus": "待核對"}, {"id": "drive-3f2121a79168093c4e2d", "date": "2026-10-08", "subject": "少年事件處理法", "question": "案例事實：\n少年甲現年 15 歲，因涉及校園聚眾鬥毆成傷並多次吸食第三級新興管制藥品「依託咪酯煙彈（俗稱睡眠煙彈）」，經少年法院審理後裁定交付保護管束。少年保護官於保護管束接案調查時，發現甲情緒極度躁動、注意力渙散且伴隨急性藥物戒斷焦慮，有嚴重成癮之虞；因該少年法院現階段並未配置專責之心理輔導員，保護官遂依執行職權，命甲於保護管束期間，每週固定前往市立醫院之青少年精神科戒癮門診接受專業心理諮商與衛教晤談，並定期向保護官回報就診情形。詎料，甲自認「我又沒病，法官只叫我來找你報到，你憑什麼逼我去看精神科看醫生」，先後連續三次無正當理由爽約未前往醫院晤談，亦未依保護官指定期日到場說明。保護官查訪案家，其家長亦消極表示管不動。試問：\n(一) 少年保護官命甲定期前往外部醫院接受專業心理諮商與戒癮晤談，其法律依據為何？甲無正當理由拒不接受晤談時，少年保護官得否對甲寄發「勸導書」？其法定要件與程序為何？若甲經二次以上勸導仍置之不理，少年保護官得向少年法院聲請何種強制處遇？（15 分）(二) 面對甲之強烈心理防衛、否認成癮事實與逃避諮商，少年保護官在執行輔導時，應如何運用心理諮商理論（如跨理論模式 TTM、動機晤談法 MI、羅傑斯人本心理學），化解其抗拒並建立治療同盟？請以標準四欄表格具體分析說明。（10 分）", "issues": "1. 爭點一：少年保護官命少年接受外部諮商晤談之法規依據\n   * 《少年事件處理法》第 50 條第 1 項保護管束之執行目的；第 55 條第 1 項前段指示遵守事項權限。\n   * 《少年保護事件審理細則》相關規定及《保安處分執行法》第 65 條之 1、第 74 條之 2 規定，保護官為健全少年身心發展，得命受保護管束人前往適當醫療或社會福利機構接受必要之諮商、治療或輔導。\n2. 爭點二：勸導書（少事法第 55 條第 2 項）之核發要件與程序\n   * 少年不遵守保護官指示之應遵守事項，保護官「得予以勸導」；勸導書須載明違反之具體事實及不服從之法律後果，送達少年及法定代理人。\n3. 爭點三：勸導無效後之強制處分（留置觀察與撤銷保護管束）\n   * 留置觀察（少事法第 55 條第 3 項）：受保護管束少年經勸導「二次以上」仍不服從，保護官得聲請少年法院裁定命留置於少年觀護所中予以「五日內之觀察」。\n   * 撤銷更易感化教育（少事法第 55 條第 4 項）：若少年留置觀察後，或在保護管束期間違反應遵守事項「情節重大」足認保護管束難收效果者，保護官得聲請少年法院裁定撤銷保護管束，將所餘之執行期間令入感化處所施以感化教育。", "outline": "(一) 外部機構諮商命令之法源、勸導書核發及後續強制處置\n1. 命甲前往外部機構接受諮商晤談之法規依據：\n   * 依《少年事件處理法》第 50 條第 1 項及第 55 條第 1 項規定，少年保護官於保護管束期間，負有督促、矯治與健全少年自我成長之職責，得告知並指示少年應遵守之具體事項。\n   * 在法院無專責心理輔導員之情況下，依《少年保護事件審理細則》及《少年法院與相關機關處理少年事件聯繫辦法》規定，保護官為協助少年克服藥物濫用與身心障礙，本得連結社區精神醫療與社福資源，命少年至適當醫療院所接受專科醫師或心理師之諮商晤談，此屬落實保護管束法定目的之合法裁量權限。\n2. 寄發勸導書之法定要件與程序：\n   * 法定要件：甲無正當理由連續三次拒絕前往醫院晤談，已構成違反保護官所指示之應遵守事項。\n   * 法定程序：依少事法第 55 條第 2 項規定，少年不遵守指示時，保護官得對其予以勸導。實務上保護官應製作「勸導書」，具體敘明甲違反應遵守事項之事實，並載明再不遵守將面臨聲請留置觀察或撤銷保護管束之法律效果，合法送達予甲及其法定代理人，督促其改正。\n3. 經二次以上勸導仍不服從時之強制處遇聲請：\n   * 聲請留置觀察：依少事法第 55 條第 3 項，甲經保護官勸導二次以上仍不服從者，保護官得檢具相關事證，聲請少年法院法官裁定命將甲留置於少年觀護所中予以「五日內之觀察」，透過短期震撼隔離促其反省。\n   * 聲請撤銷保護管束更易感化教育：若甲於留置觀察後仍拒不接受輔導，或其違規吸毒鬥毆情節重大，足認保護管束難以達到健全教化效果，保護官得依少事法第 55 條第 4 項規定，聲請少年法院裁定「撤銷保護管束，所餘之執行期間令入感化處所施以感化教育」。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["跨理論模式之動機發展（Prochaska & DiClemente's Transtheoretical Model, TTM）", "James Prochaska 與 Carlo DiClemente 提出，成癮與違法行為之戒除絕非單純之意志力問題，而是經歷五大階段之螺旋發展：(1) 懵懂期（Precontemplation，無改變意圖、合理化吸毒與缺席）；(2) 沉思期（Contemplation，覺察問題但深陷改變與抗拒之矛盾 Ambivalence）；(3) 準備期（Preparation，形成改變承諾並擬定初步策略）；(4) 行動期（Action，具體遵從治療晤談與行為改變）；(5) 維持期（Maintenance，鞏固新行為並防範復發）。核心改變機制：輔導者不可對處於懵懂期或沉思期之個案採取行動期之高壓要求，否則必引發強烈阻抗；應依其所處階段提供對應的改變歷程技巧（如意識覺醒、自我再評價）。易混淆處：常將個案的「防衛拒絕」誤判為「惡性重大不可救藥」；在 TTM 視角下，拒絕諮商只是個案深處懵懂期之正常心理現象，需要的是動機引導而非立即施加刑罰威嚇。", "跨理論模式、螺旋改變歷程、懵懂期、沉思期、意識覺醒、自我再評價", "少年甲堅稱「我又沒生病，憑什麼叫我去醫院」，拒絕前往外部診所接受成癮諮商，明顯處於「懵懂期（Precontemplation）」。保護官此時若僅以寄發勸導書威脅撤銷保護管束，只會將甲推向極端對立。處遇上保護官應運用 TTM 意識覺醒技術，引導甲探討依託咪酯對其身體神經之真實破壞（如手抖、情緒易怒暴衝），並引導其看見若因缺席被法院裁定留置觀察甚至更易感化教育將喪失自由的客觀現實，促使其由懵懂期跨入「沉思期」，自發體會配合諮商是為自己爭取正常生活之最佳路徑。"], ["動機晤談法：矛盾心理探索與改變語言喚起（Miller & Rollnick's Motivational Interviewing, MI）", "植基於人本主義心理學與自我決定論，專門針對抗拒改變之非自願案主所設計之指導性晤談技術。核心主張：個案之所以遲疑不前，是因為內心存在深刻的「矛盾心理（Ambivalence）」（一邊渴望自由、一邊放不下毒品與同儕）。四大核心精神為 PACE（夥伴關係 Partnership、接納 Acceptance、慈悲 Compassion、喚起 Evocation）。四大諮商流程為：建立關係（Engaging）、聚焦主題（Focusing）、喚起動機（Evoking）、擬定計畫（Planning）。核心技術包括抑制「改正反射（Righting Reflex）」，運用 OARS 技巧（開放式提問、肯定、反映傾聽、摘要），精準識別並增強個案的「改變語言（Change Talk）」，同時柔和順應其「維持現狀語言（Sustain Talk）」。易混淆處：動機晤談並非無原則地討好個案，亦非隱蔽的說服洗腦；其本質是協助個案「由內而外」探索自身價值觀與現狀之不一致，由個案自己說出改變的理由。", "動機晤談、矛盾心理、PACE精神、抑制改正反射、改變語言、OARS技巧", "甲面對保護官之就醫命令產生強烈敵意。保護官應先壓制急於糾正的「改正反射」，運用反映傾聽表達同理：「你覺得被命令去看醫生很委屈，好像被當成有問題的人，心裡非常不服氣。」待甲感受到被理解後，保護官運用開放式提問探索其內在不一致：「你希望未來能重新掌握生活、不再被司法管制，但如果因為缺席諮商而面臨被法院留置或更易感化教育，這符合你對未來的期待嗎？」藉由引導甲自行說出「我不想被關進去」之改變語言，順勢轉化為承諾前往診所晤談的具體行動契約。"], ["羅傑斯人本主義心理學之無條件積極關注與真誠界限（Carl Rogers' Person-Centered Theory）", "Carl Rogers 提出以人為中心治療取向。核心主張：每個人都有朝向自我實現與健康成長之內在驅力。涉案青少年之所以築起高牆防衛、攻擊體系，是因為其在成長歷程中經歷了太多「價值條件化（Conditions of Worth）」與嚴苛否定。人本取向的三大促進性核心特質為：(1) 真誠一致（Congruence / Genuineness）；(2) 無條件積極關注（Unconditional Positive Regard）；(3) 同理心了解（Empathic Understanding）。在司法強制情境下，人本取向強調「溫和而堅定的接納」：接納少年作為獨立人的感受與自尊，但同時維持客觀法律界限。易混淆處：接納不等於縱容違規；無條件積極關注是接納少年的「情緒與存在價值」，但在行為層面仍必須清楚告知法律之後果，使個案在安全被尊重的關係中學會對自己的選擇承擔責任。", "自我實現、價值條件化、真誠一致、無條件積極關注、同理心了解、安全接納", "甲從小因家庭失能與學業挫折被貼滿標籤，預期司法官員只會責罵懲處自己。保護官在面談時，應展現高度之「真誠一致」與「無條件積極關注」：放下官方高高在上的訓誡姿態，真誠向甲表明「我尊重你的感受，我也知道去醫院會讓你感到不安；但保護管束的規定是為了幫助你擺脫毒品控制，我不希望看到你因為一時賭氣而被送進留置所」。這種不加評判的同理與關懷，能有效消解甲的敵意投射，使其體會到保護官並非敵人，進而願意打開心防接受專業醫療協助。"]], "sourceReference": "來源標示：109年觀護人少年事件處理法第2題（依來源文件，尚待核對原卷）。", "reviewStatus": "待內容核對", "warnings": ["依來源文件轉錄；法規時點、考古題出處與參考架構待人工核對，不作官方標準答案。", "來源對法條授權、藥物分級及留置觀察目的之表述須另行核對。"], "studyNotes": ""}, {"id": "drive-2a1708be3e73fd345797", "date": "2026-10-08", "subject": "跨科整合", "question": "16歲甲有注意力不足過動症診斷，最近遭同學嘲笑。教師乙認為甲正在以手機拍攝同學，要求交出手機；甲否認並要求先說明，乙隨即扣住甲雙臂。甲推開乙，造成乙跌倒及手腕骨折。校方只保存事後20秒影片，以「合理管教」結案甲對乙的申訴，並要求甲暫停到校。\n\n少年調查報告以「有精神科診斷、缺課、拒絕道歉」認定甲高風險，建議先收容。母親願意監督，學校輔導教師願意協助，但報告未訪談兩人，也未調查乙使用強制力前的情境。請分析犯罪成立與證據、教育程序、少年收容、CRC及國際標準，並運用犯罪學、心理學與諮商方法提出處遇方案。\n\n考科／爭點連結：刑法傷害、正當防衛與防衛過當；少年事件處理法的調查、責付、收容及保護處分；犯罪學理論、發展與臨床心理知識、諮商輔導。複習主軸是「先確認行為事實，再評估處遇必要性」，勿以診斷或學校懲處代替法律判斷。", "issues": "", "outline": "1. 分開程序與事實。學校認定合理管教，不拘束少年法院對傷害及防衛的判斷；甲涉嫌推人，也不免除校方調查其申訴。\n2. 先補完整證據。保全前後完整影像、在場學生與教師說法、醫療紀錄、扣臂痕跡、班級管教規則及原始申訴。20秒影片未必顯示最初侵害及停止機會。\n3. 傷害責任逐項判斷。檢驗推人、骨折因果與主觀故意；不得由骨折結果倒推甲希望骨折，也不得由ADHD推定沒有故意。刑事責任能力另依法律與專業資料判斷。\n4. 正當防衛是獨立爭點。查明乙是否有法律及事實上的強制理由、危害是否正在發生、扣臂是否過度。若存在現在不法侵害，再檢验甲是否出於防衛及手段是否過當；不能只因乙是教師就排除不法侵害，也不能只因甲不同意就認定乙違法。\n5. 教育措施應有理由及回校安排。要求釐清暫停到校的依據、期間、陳述與救濟、替代教育及對其他學生安全的措施。既有診斷宜提供合理支持，不宜成為排除理由。\n6. 區分調查官與保護官職掌。本題提出裁判前社會調查與處遇建議者為少年調查官；保護管束等裁判後執行主要由少年保護官負責，不宜把職稱與程序階段混用。\n7. 精確寫出收容要件。依《少年事件處理法》第26條第1項第2款，是不能責付或責付顯不適當，且需收容；不能將成人羈押的逃亡、滅證要件直接冒充少年收容的完整法定標準。審理細則第18、19條要求具體評估及最後手段，並持續複評。\n8. 提出可比較的責付方案。母親監督、固定輔導教師、衝突時退出安排、醫療追蹤及短期密集輔導均須實際調查。若否定替代方案，應說明不足之處，而不是只寫「高風險」。\n9. CRC分層引用。CRC第12、19、28条處理表意、安全與教育，第37、40條處理涉法少年；第8、13號解釋體罰與暴力，第24號解釋少年司法。一般性意見不能自行創設教師或甲的罪名。\n10. 三項軟法各有用途。《北京規則》用於程序及比例，《利雅德準則》檢視學校支持與預防；實際收容時，再以《哈瓦那規則》檢查醫療、教育、聯繫及申訴，不能把停學與收容混同。\n11. 處遇須可衡量。以再次肢體衝突、求助成功率、到校、睡眠及支持服務完成情況分別追蹤；「肯不肯道歉」不能取代整體評估。兼顧乙的損害及安全，不以被害人接受修復作為甲留在社區的必備條件。\n\n法規依據：[少年事件處理法，第26、26-2、29、31條等](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=C0010011)；[少年保護事件審理細則，第18、19、20條等](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=C0010015)。本題為自編整合練習，未虛列考古題年度與題號。\n\n一小時複習安排：20分鐘整理責付與收容的法定要件，25分鐘限時作答本題，15分鐘用「犯罪證明／風險評估／教育支持」三條線檢查自己的答案是否混用。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["一般化緊張理論", "Agnew認為目標受阻、正向刺激喪失及負向刺激可能引發憤怒、羞恥等情緒；當合法因應、支持及問題解決能力不足，偏差因應風險增加。不是每種壓力都導致犯罪，也不是刑法免責理論，須評估少年如何解讀壓力及有哪些替代選擇。", "負向刺激、負面情緒、因應資源", "同學嘲笑與突然被扣住可能使甲感到羞辱或威脅；查明欺凌、求助紀錄及甲當時能否安全退出，安排可信任成人與求助路徑。"], ["標籤理論", "著重制度反應、污名與機會封閉如何促使初級偏差轉向次級偏差。被固定描述為危險或問題學生，可能弱化守法身分及教育連結。理論不否認原始行為責任，也不能只因受到懲處便推定一定會再犯。", "污名、角色封閉、次級偏差", "避免把診斷、校方禁止到校造成的缺課全部算成危險。保留學生身分與回校方案，分開記錄主動逃學和被要求不上課。"], ["社會資訊處理／敵意歸因", "少年會依序編碼線索、解讀意圖、選擇目標、產生及評估反應，再執行行動。曾遭欺凌者可能較快把模糊行為解讀為敵意，縮小替代反應；但現場若確有不法侵害，不能將準確的威脅辨識稱為認知扭曲。", "線索、意圖解讀、敵意歸因、反應選擇", "重建乙語氣、姿勢、扣臂強度與甲能看到的線索，再練習說明、呼叫輔導教師及安全退出；不能先假設乙合法，再認定甲誤解。"], ["注意力不足過動症與執行功能評估", "ADHD涉及持續的注意、衝動及／或活動量問題，影響可能包括抑制反應、工作記憶與時間管理；診斷須依專業評估、跨情境及功能損害判斷。診斷不等於暴力傾向、智能低下或刑事責任能力喪失，亦非每名少年都有相同困難。", "注意、抑制、工作記憶、功能評估", "評估甲在衝突及詢問時是否需較短指令、休息或理解確認；查明治療與睡眠狀況。拒絕道歉不能直接解釋成疾病症狀或再犯證據。"], ["風險—需求—反應性模式（RNR）", "風險原則調整介入強度；需求原則處理與再犯相關且可改變的因素；反應性原則依能力、動機、年齡與生活情境調整方法。診斷與一般福利需求不當然是犯罪生成需求，低風險少年接受過密控制也可能破壞保護因素。", "風險、犯罪生成需求、反應性、保護因素", "調查過往暴力與衝突因應，納入母親監督、輔導教師及在學連結。以具體行為與支持資料判断，不能把三個標籤相加便建議收容。"], ["動機式晤談（MI）", "以合作、接納、同理及喚起為精神，使用開放問句、肯定、反映與摘要，探索行為和個人價值的矛盾並引出改變語句。MI尊重自主，協助解決矛盾，不是說服認罪或以治療名義取得自白。", "OARS、矛盾、改變語句、自主", "從甲希望回校、保有尊嚴及不再受欺凌出發，討論降低肢體衝突的可行方法；仍容許甲爭執乙的強制力與自己是否成立防衛。"], ["CBT功能分析與問題解決", "以觸發事件、想法、情緒、身體反應、行為與後果建立行為鏈，透過證據檢驗、替代想法、演練及回饋改變反應。不能把所有反抗都當作非理性，也不能只教壓抑情緒而忽略現實欺凌或不安全環境。", "行為鏈、認知檢驗、替代反應、練習", "分析嘲笑、交手機要求、扣臂及推人各節點；演練用明確短句求助、拉開安全距離與事後保存紀錄。學校同步處理欺凌及教師強制力，才能支持改變。"], ["創傷知情與修復式實務", "創傷知情重視安全、信任、選擇、合作及避免再創傷，不能只凭經歷診斷創傷；修復式實務處理傷害、責任與被害人需求，須有自願、安全及退出條件。兩者均不能取代事實調查或強迫少年放棄抗辯。", "安全、選擇、傷害、責任、自願", "先安排甲與乙各自安全及支持，確認事實與參與意願後才考慮修復。乙的醫療與工作影響需處理；甲不應以接受未釐清的責任或道歉換取回校。"]], "sourceReference": "自編整合練習，非官方考古題（依來源文件）。", "reviewStatus": "待內容核對", "warnings": ["依來源文件轉錄；法規時點、考古題出處與參考架構待人工核對，不作官方標準答案。"], "studyNotes": ""}, {"id": "drive-02c8912ca8cbf78e2390", "date": "2026-10-08", "subject": "少年事件處理法", "question": "改編自 101 年司法特考三等觀護人「少年事件處理法」第 1 題：\n\n16 歲甲涉嫌與成年友人共同竊取機車。甲曾兩度未依通知到校，但之後均由母親陪同到案；母親因夜班工作難以全程監督，舅父願讓甲同住，學校社工亦提出每日聯繫、夜間回報及復學方案。少年法院認為甲「交友複雜、家長管教能力不足」，為進行身心評估及避免再犯，裁定收容於少年觀護所。甲及輔佐人主張尚有責付與社區輔導等替代方案。試依《少年事件處理法》及兒童權利國際標準，分析收容裁定是否合法、法院應如何說理，以及收容後應如何持續審查。", "issues": "- 收容是調查、審理中的暫時處置，不是保護處分，也不是提前處罰。\n- 第 26 條以責付及必要輔導為優先；收容須有不能責付或責付顯不適當等具體理由。\n- 應區分「有再犯或逃亡風險」的事實判斷與「是否只能收容」的必要性判斷。\n- 第 26 條之 1 的收容書與理由告知、第 26 條之 2 的期間及延長限制，以及原因消滅即撤銷，均屬自由剝奪的程序控制。\n- CRC 第 37 條、一般性意見第 24 號及《哈瓦那規則》要求自由剝奪為最後手段與最短適當期間；它們不能取代少事法要件，但會影響條文的合憲與兒少權利導向解釋。\n\n| 理論／方法 | 理論／方法說明 | 核心概念 | 少年個案應用 |\n|---|---|---|---|\n| 收容的暫時處分性 | 少年收容是在事件終結前，為確保調查、審理及進行身心評估、行為觀察與鑑別報告所採的暫時性自由剝奪。它不是對少年行為的刑罰，也不是審理後的感化教育。法院不能用「讓少年得到教訓」作為收容理由；否則會混淆程序保全與實體處遇，並違反無罪推定及比例原則。 | 暫時處置、程序保全、身心評估、非刑罰、無罪推定 | 甲雖涉嫌多次竊盜，法院仍不得只因社會觀感或欲嚇阻甲而收容；必須說明本案在調查、保護或鑑別上為何確有收容需要。 |\n| 責付優先與收容必要性 | 第 26 條的體系要求先評估責付於法定代理人、家長、親屬或適當機關、團體、個人，並可交付少年調查官輔導。只有不能責付或責付顯不適當，且收容對個案目的具有必要性時，才可收容。易混淆處是：家庭功能不佳並不當然等於只能收容；法院仍須檢查替代照顧、社福安置、密集輔導與安全計畫是否可行。 | 責付優先、替代措施、必要性、最小侵害、個別理由 | 甲母夜班無法夜間監督，但舅父願同住、學校社工可每日聯繫，法院應先評估責付舅父、宵禁與密集輔導，而非僅以「母親管不動」直接收容。 |\n| 最後手段與最短期間 | CRC 第 37 條要求對兒童的逮捕、拘留或監禁只能作為最後手段，且限於最短適當期間；一般性意見第 24 號進一步要求定期、實質審查必要性。國內法上，收容期間、延長次數、抗告與原因消滅即撤銷等規定，都是將此原則具體化。期間未逾法定上限不代表當然合比例，法院仍須持續檢查收容理由是否存在。 | 最後手段、最短適當期間、定期審查、原因消滅即撤銷、救濟 | 若甲在收容後已有安全住處、家長與社工提出可執行的監督方案，原收容原因消滅，即應改採替代措施，不能為等待鑑別報告方便而機械性收容至期限屆滿。 |\n| 風險—需求—回應性評估 | 風險—需求—回應性方法要求辨識再犯風險、可改變需求及個案的學習與發展特性；評估結果用於選擇最低必要強度的介入，而不是把高分直接等同收容。少年發展、創傷、障礙、家庭支持及文化背景都會影響回應方式。易混淆處是：風險工具協助結構化判斷，不能取代法定要件與法院說理。 | 風險、犯罪需求、回應性、結構化判斷、人工覆核 | 對甲應分開評估逃離住居、再犯、被幫派利用、物質使用、家庭監督與就學支持；即使風險偏高，也要說明為何電子聯繫、責付、社區支持仍不足，才能支持收容。 |", "outline": "1. 定性：收容是事件終結前的暫時性自由剝奪，不是刑罰或保護處分；目的限於程序、保護及必要鑑別。\n2. 法定要件：依第 26 條先檢驗責付是否可能及適當，再判斷收容是否有具體必要；抽象的「交友複雜」或「家長管不動」不足。\n3. 個案套用：甲雖有未依通知紀錄，但均到案；舅父、社工及復學方案屬具體替代措施。法院須逐一說明其不足，不能跳躍至收容。\n4. 比例原則：檢查收容是否適合、必要及狹義相稱；若以責付、限制接觸、密集輔導與回報可達目的，應採較小侵害手段。\n5. 程序保障：交代收容書、理由告知、輔佐與陳述、抗告等權利；理由須足以讓甲理解並可有效救濟。\n6. 期間控制：說明第 26 條之 2 的調查、審理期間及延長限制；更重要的是原因消滅即應撤銷或改採替代措施。\n7. 國際標準：援引 CRC 第 37 條及一般性意見第 24 號的最後手段、最短適當期間；《哈瓦那規則》則規範被剝奪自由少年的待遇。說明其法律性質，不把軟法誤寫成國內法條。\n8. 結論：若法院未實質評估舅父責付與社區支持，僅以概括風險及鑑別便利為由收容，裁定的必要性與說理即有疑義；即使初始收容合法，也須隨替代方案成熟而重新審查。", "theoryTable": [], "sourceReference": "來源文件：晚間摘要_2026-10-08.md；題目內來源標示依原文件，尚待核對。", "reviewStatus": "待內容核對", "warnings": ["依來源文件轉錄；法規時點、考古題出處與參考架構待人工核對，不作官方標準答案。", "來源未提供可解析的四欄表格，保留題目及參考架構。"], "studyNotes": ""}, {"id": "drive-32342d17cb9304a01995", "date": "2026-10-08", "subject": "少年事件處理法", "question": "來源標示：改編自 112 年公務人員特種考試司法人員考試三等觀護人（選試少年事件處理法／社會工作概論），《刑事訴訟法與保安處分執行法》第 1 題。原題核心為刑罰以外保安處分之目的、主要內容與功能；本題改寫為少年司法情境，非原題逐字引用。\n\n題目：少年甲因反覆參與校園周邊暴力、並有物質使用情形，少年法院評估其再犯風險及家庭支持不足。請說明少年事件處理法的保護目的與保護處分制度，分析法院選擇處遇時應考量的因素；並說明保護處分與刑罰、保安處分的目的及性質差異。最後提出觀護人執行與評估甲個案的具體作法。", "issues": "1. 少年司法基本定位：兼顧少年健全成長、教育／輔導與權利保障；不能把保護事件簡化成「免責」，亦不可只以懲罰或一般嚇阻作唯一目標。\n2. 程序與處遇類型：辨明保護事件程序及法院依法可為的保護處分；依現行法核對各處分要件、期間、執行方式及是否可併行，不可把草案當現行法。\n3. 個別化與比例性：考量行為、年齡與成熟度、危險／需求、家庭與校園資源、被害影響、本人意願及較低侵害替代方案；處遇須有可檢驗目標。\n4. 概念區分：保護處分是少年事件法制內的教育、保護與復歸處遇；刑罰以罪責及法律效果為核心；保安處分則依法律要件，以預防危險或矯治等目的採取。少年案件中三者不得混稱，具體效果均以法律明文為準。\n5. 觀護執行：建立安全與復學計畫，盤點物質使用與暴力觸發情境、家庭監督與同儕影響，跨網絡合作並定期回報法院；避免將風險量表當成單獨裁判依據。\n\n\n\n- 《少年事件處理法》目的、少年／事件範圍、保護事件流程、調查與審理原則、保護處分類型及執行、觀護人職務、保密與前案紀錄。\n- 對照 CRC 第 3 條最佳利益、第 12 條表意權、第 37 條拘禁最後手段與第 40 條兒童司法保障；並能說明 CRC 第 40 條與 CRC 委員會一般性意見第 24 號的位階差異。\n- 作答時先確認題目問的是少年保護處分，不要把刑法保安處分的所有法定效果直接套入；涉及法條號次、期間或修法狀態，考前以最新法規資料庫核對。", "outline": "1. 前言／制度目的：少年司法兼具權利保障、教育輔導及復歸導向；比例與個別化是選擇處遇的重要原則。\n2. 法制定位：交代保護事件和刑事案件區別，列出依法可能的保護處分並簡述功能；法條與要件依考試時有效版本精確作答。\n3. 本案涵攝：甲反覆暴力與物質使用顯示需分別評估衝突處理、成癮／心理健康、同儕、家庭監督及復學支持；不能只依行為次數推定必須採最嚴厲處遇。\n4. 處遇選擇與程序保障：說明必要性、適合性、侵害最小及定期檢視；納入甲的意見、照顧者能力、被害安全與社區資源，訂明可觀察目標。\n5. 觀護執行方案：初評—共同擬定個別化計畫—跨專業轉介（物質使用、心理／家庭、學校）—定期面談與查核—依成效調整並回報法院；兼顧保密及必要資訊分享。\n6. 區辨與結論：以一段比較保護處分、刑罰、保安處分目的及法源，結論回到少年最佳利益、權利保障與具體復歸，而非抽象標籤化。\n\n題庫核對來源：[考選部考畢試題查詢平台（112 年司法特考）](https://wwwq.moex.gov.tw/exam/wFrmExamQandASearch.aspx?y=2023&e=112130)；[法學資料庫題目索引：112 年觀護人第 1 題](https://www.lawbank.com.tw/exam/exam.aspx?EID=7361)。\n\n---\n\n資料截點：2026-10-08（台灣時間晚間）。新聞發布日、事件發生日及法律生效狀態分別標註；來源若僅為摘要或索引，本文避免推演未經原始資料支持的細節。", "theoryTable": [], "sourceReference": "來源文件：晚間摘要｜2026 年 10 月 8 日（週四）.md；題目內來源標示依原文件，尚待核對。", "reviewStatus": "待內容核對", "warnings": ["依來源文件轉錄；法規時點、考古題出處與參考架構待人工核對，不作官方標準答案。", "來源未提供可解析的四欄表格，保留題目及參考架構。"], "studyNotes": ""}, {"id": "drive-a330b60447540c5b31a2", "date": "2026-10-08", "subject": "少年事件處理法", "question": "改編來源：113年公務人員特種考試司法人員三等考試「觀護人（選試少年事件處理法）」第3題（校園刺死案與前案塗銷相關）。\n\n改編題目：  \n近年校園發生少年對少年重大暴力致死案件後，被害人家屬多次訴求廢除或限縮少年前案紀錄塗銷規定。請依《少年事件處理法》相關規定，說明：  \n（一）少年前案塗銷制度之立法意旨為何？  \n（二）塗銷之時間基準與效力範圍為何？  \n（三）若未來修法欲限縮塗銷範圍（例如排除重大暴力案件），應如何從CRC第40條、CRC一般性意見第24號（兒童司法）與第27號（獲得司法正義與有效救濟）、以及《北京規則》等國際標準，評估其正當性與界限？（25分）", "issues": "1. 塗銷制度究為「保護少年健全自我成長」之核心設計，抑或可因重大案件被害人權益而大幅限縮？  \n2. 塗銷時間基準（保護管束／執行完畢後一定期間）與「視為未受裁判」效力，在再犯或後續成人案件中的實務適用。  \n3. 國際標準下，「再社會化」與「被害人有效救濟／知悉權」如何平衡；CRC GC27強調的有效救濟是否包含被害人對少年前案資訊的合理近用？\n\n\n- 《少年事件處理法》第83條之1以下塗銷相關條文（現行規範與近年修法討論）。  \n- 立法目的：避免標籤效應、促進再社會化、與成年犯刑事紀錄有本質差異。  \n- CRC第40條（少年司法正當程序與再融合）、GC24（兒童司法系統）、GC27（access to justice & effective remedy）。  \n- 《北京規則》第21條等關於紀錄保密與限制使用之精神。  \n- 實務常見爭議：塗銷後能否再供再犯加重或保安處分參考？被害人家屬知情權如何保障？", "outline": "1. 破題：點出少年事件處理法以「保障少年健全自我成長」為核心，塗銷制度為去標籤化與再社會化之重要機制；同時承認重大案件中被害人權益與社會防衛需求的緊張關係。  \n2. （一）立法意旨：說明與成年犯刑事紀錄本質不同、避免終身標籤、呼應CRC再融合義務。  \n3. （二）現行規範：塗銷時間基準、效力（視為未受裁判）、例外或實務限制。  \n4. （三）國際標準評估：  \n   - CRC與GC24／GC27要求剝奪自由最後手段、程序公正、有效救濟（含被害人面向）與再社會化並重。  \n   - 《北京規則》等軟法強調紀錄保密，但非絕對禁止在重大再犯情境下的合理使用。  \n   - 結論：全面廢除不符國際標準；限縮應採「重大暴力＋再犯風險」等嚴格要件，並配套被害人支持與資訊提供機制，而非單純擴大公開。  \n5. 結論：修法應在「少年最佳利益」與「有效救濟／社會安全」間尋求比例原則下的平衡，並參考GC27對兒童友善救濟機制的要求。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["標籤理論（Labelling Theory）", "主張一旦被正式標定為「偏差者」或「犯罪人」，後續自我認同與社會反應會強化偏差行為；刑事司法程序本身可能成為繼發偏差的推手。強調去機構化、非正式處遇與紀錄保護的重要性。易混淆處：與單純「汙名」不同，重點在制度性標定與後續機會結構的封閉。", "初級偏差／次級偏差、標定、自我实现預言、去標籤", "重大暴力案件後若永久保留前案並公開，可能使少年被學校、職場、同儕持續排除，增加再犯風險；塗銷制度可降低制度性標定效果，但須搭配實際輔導與被害人修復，否則僅形式去標籤。"], ["再社會化／修復式司法取向", "少年司法應以教育、矯正、修復關係為主，而非純粹應報；強調責任承擔、對被害人之修復與社區再融入。與應報主義區別在於「未來導向」而非「過去懲罰」。", "再融合、修復、責任、社區", "即便發生致死案件，仍應評估該少年是否具備修復意願與能力；塗銷與否可與實際完成修復方案、保護管束成效連結，而非一刀切永久紀錄。"]], "sourceReference": "來源文件：2026-10-08_晚間摘要_繁體中文.md；題目內來源標示依原文件，尚待核對。", "reviewStatus": "待內容核對", "warnings": ["依來源文件轉錄；法規時點、考古題出處與參考架構待人工核對，不作官方標準答案。", "來源引用的一般性意見第27號及紀錄使用主張尚未查核，請勿直接作為定論。"], "studyNotes": ""}, {"id": "drive-88544e732eba25bfa3de", "date": "2026-10-08", "subject": "少年事件處理法", "question": "改編來源：109年公務人員特種考試司法人員等考試，觀護人選試《少年事件處理法》，第1題。原題考查「社區處遇優先原則」意義。\n\n改編題目（25分）：\n某16歲少年甲涉嫌多次在校外與同儕騎乘改裝機車、深夜聚集並竊取機車零件，家庭管教功能薄弱，已中輟且與被害人居住同一社區。少年法院調查後認為甲有改善可能，但被害人及鄰里要求立即收容。請依少年事件處理法及CRC少年司法理念，說明法院選擇社區處遇而非機構收容時，應審酌的法律與實務爭點，並提出具體處遇方案。", "issues": "1. 少年保護優先、個別化與健全成長目的，如何與被害人安全、社區安寧調和。\n2. 社區處遇最後手段性與機構收容必要性：是否有具體逃逸、再犯、受害或調查防礙風險。\n3. 家庭、學校、同儕、物質使用及偏差團體等風險／保護因子。\n4. 處遇是否具體、可監督、可回饋，而非僅宣示「輔導」。\n5. 被害人保護命令、修復性措施與少年程序權利的界線。\n\n\n- 少年事件處理法的保護優先、個別處遇、教育矯治與社區處遇。\n- 調查報告的功能：行為、品格、身心、家庭、社會環境及教育狀況整體評估。\n- CRC第37、40條的少年司法精神，以及CRC委員會一般性意見對最後手段、最短期間、復歸社會的解釋。\n- 《北京規則》之比例原則、個別化與非機構化；《利雅德準則》之社區預防；《哈瓦那規則》對剝奪自由少年的最低保障。三者是軟法標準，應作為解釋與政策參照，不取代國內法。", "outline": "1. 前言：說明少年司法不同於成人刑事政策，以健全成長、教育矯治、社會復歸及最小侵害為核心，同時兼顧被害人與社區安全。\n2. 法律原則：論述社區處遇優先、機構收容最後手段、比例原則、個別化及程序保障；指出不能僅因輿論或鄰里要求即收容。\n3. 個案評估：分別寫明甲的靜態因素、動態風險、家庭與學校功能、同儕影響、被害人安全與可監督性；比較社區方案與收容方案的必要性。\n4. 具體方案：可包括定期報到、夜間／特定地點限制、就學或職訓、家庭親職介入、認知行為與問題解決訓練、同儕脫離、物質使用評估、被害人保護命令、社區服務及定期檢核；每一措施均須說明目的與違反後的漸進處理。\n5. 結論：若社區方案能有效降低風險，應選擇較小侵害的保護處分；若出現具體且高程度的逃逸、再犯或安全風險，才以必要範圍考慮安置／收容，並定期檢討。", "theoryTable": [], "sourceReference": "來源文件：晚間摘要_2026-10-08.md；題目內來源標示依原文件，尚待核對。", "reviewStatus": "待內容核對", "warnings": ["依來源文件轉錄；法規時點、考古題出處與參考架構待人工核對，不作官方標準答案。", "來源未提供可解析的四欄表格，保留題目及參考架構。", "来源混用社區處遇、暫時收容與保護處分概念，請分別核對法源。"], "studyNotes": ""}, {"id": "drive-5698ba1d95964ba9f5de", "date": "2026-10-08", "subject": "少年事件處理法", "question": "少年小傑（15 歲）與成年人阿德，共同在便利商店竊取商品。員警到場查獲後，認為小傑情節輕微、已表悔意，打算當場訓誡後交由家長帶回，不再另行處理，只將阿德函送地方檢察署。\n\n請回答：\n1. 說明全件移送原則的意義與立法理由，並指出其與虞犯（曝險）少年處理方式的差異。（約 9 分）\n2. 員警的做法是否合法？並說明少年法院於調查後，仍可能如何將案件導向刑事程序。（約 8 分）\n3. 就成少共犯案件，說明現行法在偵查與少年程序銜接上的困難，並評析司法院 115-06-25 通過的第 18 條之 2 修正草案之方向。（約 8 分）", "issues": "1. 全件移送的「全件」指什麼：凡少年有觸犯刑罰法律之行為（少事法第 3 條第 1 項第 1 款），司法警察官、檢察官或法院執行職務時知悉，原則上都應移送少年法院（第 18 條第 1 項），不由警察或檢察官自行篩選或處分。\n2. 虞犯（曝險）少年不是一律「應」移送，而是「得」移送或請求少年法院處理（第 18 條第 2 項）；另有少年輔導委員會「行政輔導先行」制度（依行政院 2023 年修法新聞，自 2023-07-01 起施行）。\n3. 少年法院先調查、再決定是否保護處分，或在符合法定情形時裁定移送檢察官依刑事程序處理（先議程序，請核對現行第 27 條要件）。\n4. 成少共犯案件：少年走少年程序、成人走刑事程序，造成共犯關係難釐清、證據保全不易；修正草案想用同行程序與檢察官訊問銜接，但要守住少年人身自由與保護優先。\n\n\n\n1. 熟記第 3 條（少年事件類型）、第 18 條（移送）、第 18 條之 1 以下（警察程序，113-01-01 施行）、先議程序條文（以現行法為準，建議對照全國法規資料庫）。\n2. 做對照表：全件移送 vs 起訴便宜原則；觸法少年 vs 虞犯少年；保護處分 vs 刑事處分。\n3. 追蹤今年兩案修法進度，並練習用「保護優先 vs 偵查需求」寫評論題。\n4. 104 年同卷其他題也值得練：少年事件調查報告應涵蓋的項目、少年幫派案件與搜索票、外國少年犯罪後續處理。\n5. 搭配 CRC 公約第 37 條、第 40 條與《北京規則》，寫出國際標準的法律性質（條約 vs 軟法）。\n\n---", "outline": "前言（約 1 分）\n- 點出少事法立法目的（第 1 條：保障少年健全自我成長）與保護優先精神，引出全件移送原則。\n\n一、全件移送原則（約 9 分）\n1. 意義：少年觸犯刑罰法律之行為，應移送少年法院（第 18 條第 1 項）。\n2. 立法理由：集中專業判斷、避免警檢篩選造成差異、落實保護優先。\n3. 與虞犯對比：虞犯為「得」移送（第 18 條第 2 項），並有行政輔導先行。\n4. 補一句：全件移送不等於全件處罰。\n\n二、員警做法與後續導向（約 8 分）\n1. 結論：員警自行訓誡結案，與全件移送原則不符。\n2. 說明正確處理：依少事法警察程序（第 18 條之 1 以下，112 年修正新增，自 113-01-01 施行）處理，並移送。\n3. 少年法院後續：調查、不付審理、保護處分，或符合法定情形時移送檢察官（先議程序，並寫明條文要件須依現行法）。\n4. 阿德部分依刑事程序處理，點出少年與成人程序分流。\n\n三、成少共犯與草案評析（約 7 至 8 分）\n1. 現行困難：共犯關係、證據保全、程序銜接。\n2. 草案重點：同行書聲請、檢察官得先訊問、24 小時內護送。\n3. 評析：正面（偵查效率、及早發現少年被利用或為被害人）；疑慮（偵查導向壓縮保護優先、少年權利告知與陪同、延長受拘束的風險）。\n4. 結論：草案仍在審議，應同步強化少年權利保障與配套。\n\n結語（約 1 分）\n- 全件移送是保護制度的入口；保護是否優先，取決於移送後的調查與處遇品質。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["全件移送原則", "司法警察官、檢察官或法院執行職務時，知有少年觸犯刑罰法律之行為者，應移送該管少年法院（第 18 條第 1 項）。立法目的是把「是否需要保護、如何處遇」的判斷集中於具少年專業的少年法院，避免偵查機關依案情輕重自行決定放不放，造成個案差別與少年被標籤或被漏接。它是程序上的移送義務，不等於一律處罰；移送後由少年法院依調查結果決定不付審理、保護處分或移送檢察官。易混淆：與刑事案件的起訴便宜原則（檢察官可不起訴）不同，少年案件的篩選權在少年法院，而不在偵查機關。", "少年法院專屬、應移送、保護優先、不由警檢篩選", "小傑竊盜屬觸犯刑罰法律之行為，員警即使認為情節輕微，也不得自行訓誡後結案，應依少事法程序處理並移送少年法院。"], ["虞犯（曝險）少年的處理", "少年有第 3 條第 1 項第 2 款情形（曝險行為）者，司法警察官等「得」移送或請求少年法院處理（第 18 條第 2 項），並有少年輔導委員會「行政輔導先行」的新制。重點是對尚未觸法的少年，優先以行政與輔導資源介入，避免過早進入司法。易混淆：虞犯是「有觸法之虞」，不是已觸犯刑罰法律，所以不適用「應」移送的全件移送。", "得移送、曝險、行政輔導先行、避免標籤", "若小傑僅是夜遊、逃學而無竊盜行為，警察可先通報少年輔導委員會輔導，不必一律移送少年法院。"], ["少年法院調查與先議程序", "少年法院收案後先由少年調查官調查，再決定是否開始審理與如何處遇；符合法定情形者，法院可裁定移送檢察官，改依刑事程序（先議程序，現行第 27 條要件我未於今日逐字核對，請以現行法條為準）。意義是「保護處分為原則、刑事處分為例外」，且決定權在少年法院。易混淆：全件移送是「進入少年法院」，先議程序是「再由少年法院決定是否轉往刑事」，兩者方向不同。", "少年調查官、保護處分原則、刑事處分例外、先議程序", "小傑案移送後，少年法院會調查其家庭、學校、同儕、需保護性，多數情形可能為保護處分；若情節重大且符合法定要件，才可能裁定移送檢察官。"], ["成少共犯與第 18 條之 2 修正草案", "現況：少年與成人分屬不同程序，共犯關係與證據保全困難。司法院 115-06-25 通過草案內容（依司法院新聞稿與媒體報導）：少年經合法通知無正當理由不到場，且有事實足認成年人教唆、幫助、利用少年或共同犯罪，並有調查必要時，司法警察官或司法警察報請檢察官許可後，向少年法院聲請核發同行書；經同行後得先護送至檢察署，由檢察官為必要訊問；檢察官訊問後，應自同行時起 24 小時內護送少年至少年法院。草案尚在函送立法院階段，不是現行法。評析重點：一方面強化偵查與保全證據，另一方面要防止少年被當作偵查工具，並保障少年人身自由、保護優先與可能同為被害人的身分。", "同行書、檢察官訊問、24 小時、人身自由、少年同為被害人", "阿德教唆小傑偷竊時，草案想讓檢察官及早釐清共犯關係並保全證據，但要確認小傑是否遭利用或脅迫，並在 24 小時內回到少年法院，才能及早提供保護處分。"]], "sourceReference": "來源文件：每日重點整理 2026年10月08日.md；題目內來源標示依原文件，尚待核對。", "reviewStatus": "待內容核對", "warnings": ["依來源文件轉錄；法規時點、考古題出處與參考架構待人工核對，不作官方標準答案。", "來源的曝險少年移送及修正草案狀態須核對現行法，勿逕用舊制或草案。"], "studyNotes": ""}, {"id": "drive-dc7b2f103217e03eebef", "date": "2026-10-08", "subject": "少年事件處理法", "question": "16歲甲因涉嫌傷害進入少年保護事件審理。甲的父親、輔佐人、導師及少年調查官到庭；被害少年乙與母親亦到庭，乙希望由信任的社工陪同。乙表示看到甲會害怕；甲表示父親在旁時不敢說明事發經過。一名記者要求旁聽。\n\n請說明各人的程序地位、得否在場與陳述意見；法院如何處理記者旁聽、乙的陪同與隔離需求，以及甲希望父親暫時離場的請求？\n\n改編新增：傷害案例、出庭角色、記者、表意壓力與隔離需求，均非原題文字。建議25分鐘。", "issues": "- 不公開與法院許可旁聽的界線。\n- 法定代理人、輔佐人、調查官與旁聽人的不同角色。\n- 被害人的陳述、陪同及隔離。\n- 暫時不令在場的必要性與少年有效參與。\n\n\n\n5分鐘默寫：「32傳喚通知、34不公開、36意見、36-1被害人、38暫時離場、39調查官」，再口述每位出庭者的法律地位。\n\n今天最值得補強的1個重點：不公開、許可旁聽、陪同在場與暫時不令在場是不同問題；要分別找條文，不能只用「少年最佳利益」一句帶過。", "outline": "1. 案件性質：少年保護事件先用少事法專門規定。\n2. 在場者：第32、33、36、39條分別規範傳喚通知、書記官筆錄、代理人及輔佐人意見、調查官出庭。導師依第34條經法院許可旁聽；記者沒有一般公開旁聽權。\n3. 被害人：第36-1條處理乙及母親陳述、經乙同意的社工陪同及必要隔離；逐項檢驗法定例外。\n4. 暫時離場：第38條允許法院必要時調整陳述時在場人員，甲的請求應個別評估。第36-1條另有被害人陳述時安排，勿混用。\n5. 結論：依角色及必要性安排、保存理由與程序紀錄，兼顧甲表意與乙安全。\n\n法規：[少年事件處理法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=C0010011)。資料庫本次顯示整編截止115/10/2，不能單憑此頁排除其後新公布；另經當日公開資訊搜尋，未核實到改變上述作答依據的修正。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["兒童友善程序", "以可理解說明及安全表達環境促進有效參與；不能只因家長在場就假定少年受到支持。調整須針對具體障礙。", "理解、表意、支持", "詢問甲不敢陳述的原因，評估父親暫離需要。"], ["個別化在場安排", "出庭、旁聽、陪同與暫時離場有不同依據及功能；須按角色與必要性決定，避免用單一規則處理所有人。", "角色、必要性、比例", "分別處理導師、社工與記者，不因乙害怕就排除所有人。"], ["程序參與平衡", "安全措施須兼顧被害人保護與少年理解、回應證據的機會；隔離不能演變成預先認定責任。", "安全、回應、證據", "安排乙適當隔離陳述，同時保障甲理解與回應指述。"]], "sourceReference": "來源文件：晚間摘要_2026-10-08.md；題目內來源標示依原文件，尚待核對。", "reviewStatus": "待內容核對", "warnings": ["依來源文件轉錄；法規時點、考古題出處與參考架構待人工核對，不作官方標準答案。"], "studyNotes": ""}], "templates": [{"subject": "犯罪學", "date": "2026-10-05", "content": "# 觀護人考試申論題答題模板（犯罪學）\n\n適用週一犯罪學練習；可依題目要求增減段落。建議總篇幅控制在 800–1200 字。\n\n---\n\n## 一、答題前檢核（1–2 分鐘）\n\n- [ ] 題目要求：理論分析？處遇設計？兩者都要？\n- [ ] 關鍵事實：家庭、學校、同儕、工作、社區、網路、前科、保護因子。\n- [ ] 指定理論：是否明確列出？若未指定，自行選 2–3 個最貼合的理論。\n- [ ] 時間分配：成因分析約 60%，處遇設計約 40%。\n\n---\n\n## 二、答題架構（建議標題）\n\n### （一）前言（約 80–120 字）\n\n- 簡述少年犯罪成因具多因性，單一理論難以完整解釋。\n- 點明本題將運用哪些理論（例：緊張理論、差別接觸理論、社會控制理論），並說明將連結題目事實與觀護處遇。\n\n範例句型：  \n「少年犯罪行為通常係結構壓力、同儕影響與社會連結弱化等多重因素交互作用所致。本題擬依緊張理論、差別接觸理論及社會控制理論，分析○○之犯罪成因，並據以設計觀護處遇計畫。」\n\n---\n\n### （二）理論分析與事實涵攝（約 400–600 字）\n\n#### 1. 理論表格（建議先列表格，再補充文字）\n\n| 理論／方法 | 理論／方法說明 | 核心概念 | 少年個案應用（連結題目事實） |\n|---|---|---|---|\n| 緊張理論 |  |  |  |\n| 差別接觸理論 |  |  |  |\n| 社會控制理論 |  |  |  |\n\n填寫要點：\n- 「理論說明」：用 2–3 句交代主張、行為成因機制與易混淆處。\n- 「核心概念」：列出 3–5 個關鍵詞即可。\n- 「少年個案應用」：一定要引用題目中的具體事實（家庭、學校、同儕、工作、網路等）。\n\n#### 2. 文字補充（每理論約 80–120 字）\n\n對每個理論再寫一小段，說明：\n- 該理論如何解釋「起始犯罪」與「持續犯罪」。\n- 題目中最能支持此理論的 1–2 個事實。\n- 若有必要，簡要說明該理論的限制（例如：較難解釋偶發性犯罪）。\n\n範例句型：  \n「就緊張理論而言，○○面臨……，使其難以透過合法途徑達成……，因而可能以竊盜作為快速取得金錢的替代手段。此理論較能解釋其因經濟壓力與機會受阻所生之財產犯罪，但對其與同儕共同犯罪之學習歷程則解釋力較弱。」\n\n---\n\n### （三）觀護處遇計畫設計（約 300–400 字）\n\n寫作原則：  \n「理論 → 處遇目標 → 具體措施 → 可追蹤指標」\n\n#### 1. 緊張理論導向處遇\n\n- 處遇目標： 降低結構性壓力，增加合法達成目標的機會。\n- 具體措施：  \n  - 連結職訓、就業輔導、就學銜接。  \n  - 評估經濟扶助需求（低收入、急難救助等）。  \n- 可追蹤指標： 穩定就學／就業月數、收入來源合法化、經濟壓力主觀評分。\n\n#### 2. 差別接觸理論導向處遇\n\n- 處遇目標： 減少與犯罪同儕之高強度接觸，增加正向互動。\n- 具體措施：  \n  - 安排結構化日程（課業、職訓、運動、志工）。  \n  - 引導參與正向同儕團體。  \n  - 認知行為團體：挑戰犯罪合理化信念。  \n- 可追蹤指標： 與犯罪同儕接觸頻率、參與正向活動次數、對犯罪態度量表變化。\n\n#### 3. 社會控制理論導向處遇\n\n- 處遇目標： 強化與家庭、學校、社區及法規範的連結。\n- 具體措施：  \n  - 家庭會談、親職輔導，強化主要照顧者支持。  \n  - 與學校輔導系統合作，提升就學承諾與參與。  \n  - 法治教育、修復式對話或有意義社區服務。  \n- 可追蹤指標： 家庭互動頻率、學校出席率、社區服務完成度、再犯風險評估結果。\n\n---\n\n### （四）成效評估與調整（約 80–120 字）\n\n- 說明將如何定期檢視處遇成效（例：每 3 個月檢視一次）。\n- 提出若成效不佳時的調整方向（例：加強家庭介入、轉介心理治療、調整社區服務內容）。\n\n範例句型：  \n「觀護期間擬每三個月檢視就學、就業、家庭互動及同儕接觸等指標，並視再犯風險評估結果調整處遇強度。若發現同儕影響仍強，則增加認知行為團體次數，並強化正向活動安排。」\n\n---\n\n### （五）結語（約 60–80 字）\n\n- 總結：犯罪成因係多理論交互作用。\n- 強調：處遇應兼顧風險降低與保護因子增強，並以教育與復歸為核心。\n\n範例句型：  \n「綜上，○○之犯罪行為係緊張、學習與控制弱化共同作用之結果。觀護處遇應以多理論整合為基礎，兼顧風險降低與保護因子增強，並朝向教育、復歸與社會接納之目標。」\n\n---\n\n## 三、常見扣分點與避免方式\n\n- [ ] 只寫理論不連結事實：每個理論都要引用題目中的具體情節。\n- [ ] 理論混淆：緊張≠同儕影響；控制≠懲罰。寫作前先釐清核心機制。\n- [ ] 處遇空泛：避免只寫「加強輔導」「多關心」，要寫出「誰、做什麼、多久、如何評估」。\n- [ ] 忽略少年特性：強調教育、復歸、最小干預與最後手段原則。\n\n---\n\n## 四、每日練習建議\n\n1. 選一則少年個案新聞或模擬題。\n2. 用本模板寫一題完整申論（控制在 60–90 分鐘）。\n3. 對照答案或老師講評，標記：\n   - 理論說明是否清楚？\n   - 事實涵攝是否具體？\n   - 處遇是否可執行、可評估？\n4. 每週選一題重寫，精簡冗句、強化邏輯。\n\n---\n\n本模板可依不同理論組合（例如：標籤理論、社會學習理論、一般化緊張理論等）調整表格與處遇段落，但整體結構建議維持「前言→理論分析→處遇設計→成效評估→結語」。", "reviewStatus": "待核對", "id": "md-23cb33cc04882f000027"}], "diagnostics": ["（Manus）2026年10月5日｜晚間摘要.md：來源缺少有效四欄理論表，保留題目並待補表格。", "晚間摘要_2026-10-07.md：爭點與架構合併於來源同一節，待人工拆分。", "整理一份繁體中文晚間摘要。以當日最重要且具實質影響的資訊為主，精選約 5 則，涵蓋司法／法制與修法、.md：日期取自文件標題／編製日期；檔名未提供有效日期。"]};

}
function render(){renderList();const q=questions.find(q=>q.id===current);if(!q){$('main').innerHTML='<p>此科目目前沒有題目。</p>';return;}const template=templates.find(t=>t.subject===category(q));const r=records[q.id]||{answer:'',review:false};const changed=r.questionSnapshot&&r.questionSnapshot!==signature(q);const table=q.theoryTable;const list=visible(),index=list.findIndex(x=>x.id===q.id);
 $('main').innerHTML=`<h2>${esc(label(q))}</h2><p class="muted">來源日期：${esc(q.date)}</p><span class="badge">待內容核對</span><p class="muted">${esc(q.subject)}</p>${changed?'<p class="error">本題參考內容已更新，原作答仍保留；請重新對照。</p>':''}${(q.warnings||[]).map(w=>`<p class="error">${esc(w)}</p>`).join('')}<h3>案例與問題</h3><div class="text">${esc(q.question)}</div><h3>我的作答</h3>${template?`<details><summary>看答題模板（犯罪學）</summary><p class="muted">以下為來源模板，非評分標準；篇幅、時間與理論選擇請依本題要求調整。</p><div class="text">${mdHTML(template.content)}</div></details>`:''}<textarea id="answer" maxlength="100000" aria-label="我的作答" placeholder="先列爭點，再寫規範、案例涵攝與結論。"></textarea><label class="review-control"><input id="review" type="checkbox">★ 待複習</label><p id="draft-status" class="muted"></p>${q.studyNotes?`<details><summary>隨題複習：易錯提醒／處遇重點</summary><div class="text">${esc(q.studyNotes)}</div></details>`:''}<details><summary>核心爭點與複習方向</summary><div class="text">${esc(q.issues||"來源尚未提供爭點，待補充。")}</div></details><details><summary>參考答題架構</summary><div class="text">${esc(q.outline||"來源尚未提供答題架構，待補充。")}</div></details><details><summary>理論與個案應用四欄表格</summary>${tableHTML(table)}</details><details><summary>原始考題出處</summary><p class="text">${esc(q.sourceReference||'來源文件未擷取到獨立出處欄位，待補充核對。')}</p><p class="muted">以上依來源文件標示，尚未核對考選部原卷。</p></details><div class="nav"><button id="previous" ${index<=0?'disabled':''}>上一題</button><span class="muted">${index+1} / ${list.length}</span><button id="next" ${index>=list.length-1?'disabled':''}>下一題</button></div>`;
 $('answer').value=r.answer;$('review').checked=r.review;$('draft-status').textContent=r.updatedAt?'上次作答：'+new Date(r.updatedAt).toLocaleString('zh-TW'):'尚未作答';$('answer').oninput=save;$('review').onchange=save;
 $('previous').onclick=()=>{current=list[index-1].id;render();};$('next').onclick=()=>{current=list[index+1].id;render();};
}
function validateData(d){if(d.schemaVersion!==1||!Array.isArray(d.questions)||!d.questions.length||d.count!==d.questions.length)throw Error('題庫格式不符');const ids=new Set();for(const q of d.questions){if(!q||typeof q.id!=='string'||ids.has(q.id)||!/^\d{4}-\d{2}-\d{2}$/.test(q.date)||!['subject','question'].every(k=>typeof q[k]==='string'&&q[k].trim())||!['issues','outline'].every(k=>typeof q[k]==='string')||!Array.isArray(q.theoryTable)||(q.theoryTable.length!==0&&q.theoryTable.length<2)||!q.theoryTable.every(row=>Array.isArray(row)&&row.length===4&&row.every(c=>typeof c==='string')))throw Error('題目或表格格式不符');ids.add(q.id);}if(/(?:docs|drive)\.google\.com/i.test(JSON.stringify(d)))throw Error('題庫含不應公開的來源連結');}
async function load(){if(loading)return;loading=true;$('refresh').disabled=true;try{let data;if(location.protocol==='file:'){data=INITIAL_DATA;}else{const response=await fetch('./questions.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);data=await response.json();}validateData(data);templates=data.templates||[];const filter=$('subject').value||new URLSearchParams(location.search).get('subject')||'';questions=data.questions.slice().sort((a,b)=>subjectCompare(category(a),category(b))||b.date.localeCompare(a.date)||a.id.localeCompare(b.id));$('subject').innerHTML='<option value="">全部科目</option>'+[...new Set(questions.map(category))].sort(subjectCompare).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');if(questions.some(q=>category(q)===filter))$('subject').value=filter;if(!visible().some(q=>q.id===current))current=visible()[0]?.id||'';$('status').textContent='題庫 '+questions.length+' 題 · 來源最後更新：'+new Date(data.updatedAt).toLocaleString('zh-TW');render();}catch(e){$('status').textContent='題庫更新失敗：'+e.message+'。請稍後再試。';if(!questions.length)$('main').innerHTML='<p>目前無法載入題庫，請點「更新題庫」重試。</p>';}finally{loading=false;$('refresh').disabled=false;}}
function download(body,name){const url=URL.createObjectURL(new Blob([typeof body==='string'?body:JSON.stringify(body,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 $('subject').onchange=()=>{current=visible()[0]?.id||'';render();};$('refresh').onclick=load;
 $('export').onclick=()=>{download({format:'probation-daily-github-records',schemaVersion:1,exportedAt:new Date().toISOString(),records},'daily-simulation-records-'+new Date().toISOString().slice(0,10)+'.json');if(!storageWritable&&rawStorage!=='{}')download(rawStorage,'daily-simulation-original-storage.json');$('notice').textContent='已匯出，請保存下載檔案。';};
 $('import').onclick=()=>$('upload').click();$('upload').onchange=async()=>{try{const file=$('upload').files[0];if(!file)return;if(file.size>5*1024*1024)throw Error('檔案超過 5 MB');const data=JSON.parse(await file.text());if(data.format!=='probation-daily-github-records'||data.schemaVersion!==1||!data.records||typeof data.records!=='object'||Array.isArray(data.records)||!Object.values(data.records).every(validRecord))throw Error('紀錄格式不符，請使用此 GitHub 模擬題頁面的備份');const entries=Object.entries(data.records);if(!entries.length)throw Error('檔案沒有作答紀錄');if(!confirm('匯入 '+entries.length+' 筆紀錄，會取代同題的現有作答。是否繼續？'))return;records=Object.fromEntries([...Object.entries(records),...entries]);if(!storageWritable)$('notice').textContent='紀錄已載入此頁，原本無法讀取的本機資料仍保留；請匯出備份。';else if(persist())$('notice').textContent='紀錄已匯入。';render();}catch(e){$('notice').textContent='匯入失敗：'+e.message;}finally{$('upload').value='';}};
 $('print').onclick=()=>{const states=[...$('main').querySelectorAll('details')].map(d=>[d,d.open]);for(const[d]of states)d.open=true;window.print();for(const[d,open]of states)d.open=open;};
 window.Daily25={replaceRecords:next=>{const focused=document.activeElement?.id==='answer',start=$('answer')?.selectionStart,end=$('answer')?.selectionEnd;if(!storageWritable)throw Error('本機紀錄需要先匯出備份，未套用雲端');records=next;if(!persist())throw Error('本機保存失敗，請先匯出備份');render();if(focused&&$('answer')){$('answer').focus();$('answer').setSelectionRange(start,end);}}};
 window.addEventListener('storage',event=>{if(event.key===KEY&&event.newValue){try{const next=JSON.parse(event.newValue);if(Object.values(next).every(validRecord)){records=next;render();}}catch{}}});
 load();
</script><script src="../v2.5/backup-core.js"></script><script src="../v2.5/backup-io.js"></script></body></html>
