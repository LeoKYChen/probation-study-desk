'use strict';
const INITIAL_DATA={"schemaVersion": 1, "updatedAt": "2026-10-09T04:00:00Z", "count": 38, "questions": [{"id": "2026-10-07-1", "date": "2026-10-07", "subject": "諮商與輔導（週三固定輪替）", "question": "少年甲現年 16 歲，國中時期因學業嚴重落後、經常逃學並參與宮廟陣頭，被學校及親友貼上「無藥可救」、「流氓胚子」之標籤。甲自幼家庭衝突不斷，自尊低落，深信自己毫無優點、註定失敗。日前，甲因受成年藥頭利誘，涉嫌在街頭替同儕運送第三級新興毒品「依託咪酯煙彈」並參與聚眾鬥毆成傷，案經警方移送少年法院。少年法院審理後，依《少年事件處理法》第 42 條第 1 項第 2 款裁定甲交付保護管束，並命其定期向少年保護官報到及接受個別心理輔導。於第一次保護管束輔導會談時，甲雙手抱胸、眼神冷漠，對保護官冷笑表示：「反正你們每個人都只會把我當成壞孩子看，法官叫我來，我就坐滿一小時，你們要寫報告就隨便寫，我這輩子就是爛命一條！」保護官翻閱卷宗，發現過往調查紀錄全數記載其違法紀錄、不良友伴及偏差行徑（充斥問題飽和之病理陳述），但同時亦記錄甲在陣頭中能吃苦耐勞扛大旗、極重同儕義氣且對汽機車機械修護具有敏銳天賦。試問：(一) 何謂「優勢（Strengths）」？相較於傳統「病理缺失模式（Deficit Model）」，「優勢中心取向（Strengths-Based Approach）」諮商之核心目標與諮商重點為何？少年保護官將此取向應用於司法非自願少年甲時，需注意那些重要之倫理與實務界限？（15 分）(二) 少年保護官在接案輔導甲時，應如何運用優勢中心諮商理論（如正向心理學優勢賦能、敘事治療之外化與生命重寫、阿德勒心理學之自卑超越與鼓勵技術），協助甲解構問題標籤、發掘正向資產並導向合法復歸？請以標準四欄表格具體分析說明。（10 分）", "issues": "爭點一：優勢（Strengths）之內涵與病理模式之翻轉\n優勢定義：個體在面對逆境時所展現之內在能力、心理復原力（Resilience）、個人專長、價值觀以及外在支持網絡。\n優勢模式目標：超越單純之「減低症狀或防堵再犯」，重在「激發內在自尊、賦權（Empowerment）、促進自主成長與建設性社會參與」。\n爭點二：司法非自願案主應用時之實務界限與注意事項\n避免盲目樂觀與脫離現實：優勢取向絕非否定違法行為之危害性，保護官不可流於虛假讚賞，仍須維持堅定之法律規範邊界（Firm Boundaries）。\n真誠接納與同理挑戰並行：區分「接納少年身為人的尊嚴」與「不認同其違法暴力行為」，在安全同盟中挑戰其合理化認知。\n風險評估與優勢培育之衡平：兼顧 RNR（風險-需求-反應）之防逃防再犯監控，與 GLM（良好生活模式）之正向生活目標建立。\n爭點三：跨理論模型之具體操作化\n敘事治療：問題外化對話與尋找獨特結果（閃亮時刻）。\n阿德勒心理學：自卑感之補償與「鼓勵技術（Encouragement）」之精確運用。\n正向心理學：VIA 性格強項轉化為守法自立之實質資產。", "outline": "(一) 優勢之內涵、優勢中心取向之核心目標與司法應用注意事項\n何謂「優勢（Strengths）」：\n指個體所擁有的內在特質、才華能力、道德美德、心理復原力（Resilience），以及環境中可利用之社會資本與支持網絡。即使身處極端逆境或具有違法行徑之個案，其體內仍保有在困境中生存的潛能與資源。\n優勢中心取向諮商之目標與諮商重點：\n核心目標：從傳統「修補缺陷、消除病理」轉向「賦權（Empowerment）與能力建設」，引導個案成為自我生命的作者，建立積極正向之自我效能感。\n諮商重點：(1) 探尋生活中的例外經驗（Exceptions）；(2) 將焦點置於希望、未來與未受創傷污染之健康部分；(3) 協助個案將偏差行為背後之生存動力（如陣頭義氣）轉化為建設性之合法社會功能。\n應用於司法非自願少年個案之重要注意事項：\n維持法律與安全規範之堅定邊界（Firm Boundaries）：優勢取向不等於免除法律責任或忽視被害人創傷。保護官在看見優勢之同時，仍須落實定期採尿、生活常規考核與法律告誡，不可讓個案誤以為違法行為已被淡化。\n避免虛假讚賞，採取具體之「真誠鼓勵」：非自願涉案少年對虛偽讚美極度敏感。保護官應聚焦於少年具體付出之努力與事實（如「我看到你今天準時前來且坦承困難」），而非空洞討好。\n兼顧風險管理與正向賦能：動態平衡「客觀再犯風險評估」與「良好生活目標設定」，使優勢發展成為防範再犯之最穩固防線。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["優勢中心諮商與正向心理學理論（Strength-Based Counseling & Positive Psychology）", "由 Dennis Saleebey 倡導於助人專業，並植基於 Martin Seligman 之正向心理學。核心主張：反對傳統「病理缺失模式（Deficit Model）」，認為過度聚焦於診斷問題與探究缺陷，只會深化個案的無力感與被標籤化。優勢取向主張「每個人（即使是觸犯重罪或身陷毒癮的少年）都擁有與生俱來的內在優勢、適應力與復原力（Resilience）」，生命中的創傷不等於個人的終身命運。四大諮商重點：(1) 辨識與肯定個案之內在美德與性格強項（如 VIA 力量）；(2) 將問題視為環境挑戰而非個人本質缺陷；(3) 尋找正向例外經驗；(4) 賦權（Empowerment）個案成為自我改變的專家。易混淆處：常被誤解為「鴕鳥心態或盲目讚美」；優勢取向絕非否認違法行為的嚴重性或粉飾太平，而是「在堅定規範邊界之同時，透過發掘個案的正向資產，為戒癮與復歸提供真實的心理動能」。", "優勢視角、病理模式翻轉、復原力（Resilience）、賦權（Empowerment）、正向例外、性格強項", "少年甲被學校與家庭全面否定為「壞孩子」，內心抱持「反正我就是爛」之破罐子破摔心態。少年保護官在會談中，不從違法紀錄著手，而是發掘其優勢：甲在陣頭中能吃苦耐勞、對朋友極重義氣、且對機車修護具有強烈敏銳度。保護官肯定其「義氣」背後對歸屬感的忠誠與體能毅力，引導甲覺察：「如果你把這份重義氣的熱忱與修車天賦，用在合法的技職認證上，你將能真正靠自己的力量保護家人。」透過賦權甲主導學習計畫，有效重燃其自尊與求好動機。"], ["麥克·懷特與大衛·愛普斯頓之敘事治療（Michael White & David Epston's Narrative Therapy）", "屬於後現代社會建構論諮商取向。核心主張：「人不是問題，問題才是問題（The person is not the problem, the problem is the problem）」。個案的生活經驗常被主流社會的主導論述（Dominant Discourses）壓制，形成充斥失敗、挫折與罪惡感之「充滿問題的故事（Problem-Saturated Stories）」。核心技術包括：(1) 外化對話（Externalizing Conversation，將問題從人的內在抽離，如將「我是個壞少年」外化為「『衝動與誘惑』這隻怪獸如何在你看見義氣時悄悄爬上你的肩膀？」）；(2) 尋找獨特結果（Unique Outcomes / Sparkle Moments，探尋問題未發生或成功抗拒問題的閃亮時刻）；(3) 重新改寫生命故事（Re-authoring，串連被遺忘的優勢事件，建構充滿力量之替代故事）；(4) 建立外部見證人（Outsider Witness）。易混淆處：外化對話並非替個案「推卸責任」；相反地，唯有將問題客觀外化，個案才能站在主動位置去對抗問題，真正承擔起擊敗問題的個人責任。", "人不是問題/問題才是問題、外化對話、充滿問題的故事、獨特結果（閃亮時刻）、重寫生命故事、外部見證", "甲深陷「我是毒蟲、我是暴力犯」之問題飽和故事。保護官運用外化技術與甲對話：「這一年來，『毒品與衝動』是如何利用你對朋友的講義氣，一步步奪走你的自由與學業？」甲因而與問題拉開距離。接著保護官引導甲回憶獨特結果：「在過去兩週裡，有沒有哪一次朋友邀你去吸煙彈，你卻成功忍住沒有去？那時你是怎麼做到的？」甲回憶起為了探望生病的母親而選擇拒絕。保護官藉此閃亮時刻，協助甲重寫生命故事為「一個雖然生活艱難、但深愛家人且具備抗誘惑勇氣的少年」，徹底打破自我挫敗之負面認同。"], ["阿德勒個體心理學之自卑超越與鼓勵技術（Adlerian Individual Psychology & Encouragement）", "Alfred Adler 提出，人類一切行為均具有「目的性（Teleology）」，源於童年期普遍體驗之「自卑感（Inferiority Feelings）」，並終其一生在追求「優越與歸屬（Superiority and Belonging）」。健康的個體透過培養「社會興趣（Social Interest）」在合作與貢獻中克服自卑；而缺乏勇氣的青少年，則容易發展出「錯誤生活風格（Mistaken Lifestyle）」，透過四個錯誤目標（吸引注意、爭奪權力、尋求報復、顯現無能）獲取虛假的優越感。改變核心機制在於「鼓勵（Encouragement）」：著重努力與進步而非成果、肯定個案在當下的內在力量、重構歸屬感。易混淆處：鼓勵（Encouragement）不同於讚美（Praise）；讚美是「由上而下的外在評價（如『你考得很好，是個很棒的學生』）」，容易使個案產生成敗焦慮；鼓勵則是「平等的同理與內在肯定（如『我看見你今天非常努力克制衝動，你為自己感到驕傲嗎？』）」，旨在賦予個案面對生活任務的內在勇氣。", "目的論、追求優越、自卑感、生活風格、社會興趣、鼓勵技術（非讚美）", "甲自幼學業挫敗，在家庭與學校體制中體驗到極深之自卑與無價值感，因而逃往宮廟陣頭，以聚眾鬥毆與吸毒展現強悍（爭奪權力與報復之錯誤生活風格），企圖獲取虛假之男子氣概與同儕歸屬。保護官在輔導中，應徹底揚棄傳統說教，運用阿德勒之「鼓勵技術」：當甲按時出席保護管束報到時，肯定其「準時守信」的自我負責意志；引導甲加入社區青少年公益修繕服務隊，讓甲親自體驗運用雙手修好鄰里水電而獲得感謝之真實成就，將其追求優越的能量由「破壞性暴力」導向「具備社會興趣的社會有用型貢獻」，重塑健康的生活風格。"]], "sourceReference": "108 年公務人員特種考試司法人員三等考試觀護人類科（選試少年事件處理法）「諮商與輔導」第 1 題", "reviewStatus": "待核對"}, {"date": "2026-10-07", "subject": "諮商與輔導", "question": "16歲甲因渴望同儕認同，長期在社群平台塑造強悍形象，近期參與危險挑戰並協助友人竊取機車；晤談時稱自己「像被另一個人控制」，夢中反覆出現被黑影追逐的情節。請：\n1. 以榮格的集體潛意識、原型、人格面具、陰影及個體化概念進行個案概念化。\n2. 說明三項治療目標及具體介入方法。\n3. 說明如何避免把象徵性解釋當成客觀犯罪事實，並兼顧少年表意權與安全風險評估。\n\n改編新增部分：人格面具、陰影、夢境材料、社群形象、具體介入，以及諮商解釋與司法事實認定的界線；均非原題文字。", "issues": "1. 定義層：準確區分個人潛意識與集體潛意識，並說明原型透過象徵呈現。\n2. 發展層：連結青少年自我認同、同儕歸屬、人格面具與陰影衝突；避免把所有曝險行為都歸因於單一深層心理原因。\n3. 概念化層：以「強悍面具—被排斥的恐懼與依附需要—同儕情境觸發—危險行動」形成動態假設。\n4. 三項治療目標：增進對陰影、衝動與情緒的覺察及整合；降低對強悍人格面具與同儕認同的僵化依附；推進個體化，建立自主價值、替代歸屬及非犯罪生活角色。\n5. 介入與倫理：夢境探索、繪畫或敘事、情緒辨識、家庭及同儕系統工作；明確區分治療假設、司法證據與風險評估。少年仍須獲得可理解的說明及實質表意機會。\n\n今天最值得補強：把「人格面具—陰影—個體化」寫成一條完整的個案機制，並在答案中明確補上：榮格式象徵詮釋只是可共同驗證的臨床假設，不能替代犯罪事實認定或結構化風險評估。\n\n---", "outline": "1. 定義層：準確區分個人潛意識與集體潛意識，並說明原型透過象徵呈現。\n2. 發展層：連結青少年自我認同、同儕歸屬、人格面具與陰影衝突；避免把所有曝險行為都歸因於單一深層心理原因。\n3. 概念化層：以「強悍面具—被排斥的恐懼與依附需要—同儕情境觸發—危險行動」形成動態假設。\n4. 三項治療目標：增進對陰影、衝動與情緒的覺察及整合；降低對強悍人格面具與同儕認同的僵化依附；推進個體化，建立自主價值、替代歸屬及非犯罪生活角色。\n5. 介入與倫理：夢境探索、繪畫或敘事、情緒辨識、家庭及同儕系統工作；明確區分治療假設、司法證據與風險評估。少年仍須獲得可理解的說明及實質表意機會。\n\n今天最值得補強：把「人格面具—陰影—個體化」寫成一條完整的個案機制，並在答案中明確補上：榮格式象徵詮釋只是可共同驗證的臨床假設，不能替代犯罪事實認定或結構化風險評估。\n\n---", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["集體潛意識與原型", "集體潛意識不是個人被壓抑的生活記憶，而是人類共有、以原型形式組織經驗的深層心理結構。原型不能直接被觀察，通常透過夢、幻想、象徵及反覆出現的角色意象呈現；不可把特定夢境機械地套入固定意義。", "集體潛意識、原型、象徵", "「黑影」可先作為威脅、力量或被排斥自我的象徵假設，再由甲本人聯想驗證，不能直接推論其犯意或精神疾病。"], ["人格面具與陰影", "人格面具是個體為適應社會角色而呈現的外在形象；陰影則包含自我不願承認或尚未整合的衝動、情感與能力。人格面具本身不是虛假，陰影也不等同邪惡；問題在於過度認同前者、否認後者，使衝突以失控行為投射或爆發。", "人格面具、陰影、投射", "甲以「強悍、不怕事」取得同儕位置，可能壓抑恐懼、依附需要與無力感；介入可協助辨認衝動前兆並以可接受方式表達。"], ["個體化", "個體化是逐步整合意識與無意識、人格面具與陰影，使人成為較完整且具自主性的自己；不是孤立、任性或只追求個人特殊性。青少年期的重要任務，是在家庭及同儕期待之外形成較穩定的自我認同。", "整合、自我、認同、自主性", "協助甲區分「同儕期待的我」與「我選擇成為的人」，建立不靠危險行為證明價值的身分與生活目標。"], ["夢與象徵探索", "透過夢境、繪畫、敘事或主動想像探索尚未言說的內在衝突。治療者提出暫時性假設並與個案共同驗證，而非宣告唯一正解；若涉及自傷、他傷或犯罪風險，仍須另作結構化風險評估。", "夢境、主動想像、共同詮釋", "請甲描繪黑影、改寫夢的結局，再連結被追逐時的身體感受及現實處境；同步評估再犯、衝動控制與同儕壓力。"]], "sourceReference": "- 年度：115年（2026）\n- 考試：公務人員特種考試司法人員三等考試\n- 類科：觀護人兩組共同科目\n- 科目：諮商與輔導\n- 題號：第二題\n- 原始來源：考選部官方試題PDF；官方卷載明本題25分。[^7]\n- 官方解答：申論題未附官方標準答案，以下是複習與作答建議，不冒充官方擬答。", "reviewStatus": "待核對", "warnings": ["爭點與架構合併於來源同一節，待人工拆分。", "原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "", "id": "md-a8225dbf2d5bfc5a7f8e"}, {"date": "2026-10-07", "subject": "心理學", "question": "某地方法院少年調查與保護工作團隊，試用一份「少年再犯風險篩檢表」作為初談參考。不同觀護人對同一少年評分相近，同一少年隔兩週重測也得到相近分數；但後續稽核發現，量表題目多測到「過去違規次數」及「學校缺席」，對家庭支持、受害經驗、同儕脈絡、心理健康與可改變的保護因子著墨不足；而且不同地區、性別及文化背景少年的分數與實際個案需求並不一致。請：\n\n1. 說明心理測驗的信度與效度，並分析本案何以可能「信度高而效度不足」；\n2. 說明若將分數直接當成危險性或處遇等級，對少年、法院與觀護實務可能造成的問題；\n3. 提出可行的測驗修訂、驗證與實務使用方式。", "issues": "1. 測得穩定，不等於測得正確：重測與評分者一致性支持分數穩定，但不證明分數真正反映「再犯風險」或「個別服務需要」。\n2. 效度是對分數解釋／用途的證據：不是只問測驗「有沒有一種效度」，而要問用這些分數作特定決策是否有充分證據。尤其避免把群體統計關聯當成個人命運。\n3. 少年個案的標籤與公平：若以缺席或既往違規作代理指標，可能忽略貧困、障礙、照顧責任、遭受暴力、校園排除等脈絡，造成偏差分類與不利處遇；亦可能掩蓋保護因子及可介入需求。\n4. 工具只是輔助，不代替專業判斷：評估應結合訪談、家庭／學校資訊、少年觀點、保護因子、發展階段與可更新資料，並讓少年有理解、補充與更正資訊的機會。", "outline": "1. 開頭定義（約 3 分）：信度是測量一致／精確程度；效度是分數解釋與用途有無證據支持。點出「高信度不必然高效度」。\n2. 套用題幹（約 6 分）：本案重測及觀護人間評分一致，支持信度；但題目集中過去違規、缺席而漏掉重要需求、情境與保護因子，且群體間表現不一致，故效度／公平性證據不足。\n3. 實務風險（約 6 分）：錯誤標籤、過度監督、資源錯配、對弱勢群體不利、忽略可改變需求與復歸條件；以單一分數取代個別化調查將損及程序品質及少年最佳利益。\n4. 改進方案（約 7 分）：明確用途；專家與少年／實務工作者檢視內容；本地代表性樣本試測；驗證重測、評分者一致、構念及效標關聯；按地區／性別等群體做偏誤分析；定期追蹤結果與更新工具；搭配訪談、紀錄及保護因子，保留人工覆核與更正程序。\n5. 結論（約 3 分）：工具提供結構化資訊，不是預言或判決；以證據、比例、個別化及復歸導向使用。\n\n複習方向：重測信度、內部一致性、評分者間信度；內容／建構／效標關聯效度；效度與特定用途；信度與效度關係；測量偏誤、常模與公平性；風險／需求／保護因子評估在少年觀護的運用與限制。\n\n題源：[114 年觀護人心理學考古題第 1 題（彙整頁，標示資料來源為考選部）](https://lawplayer.com/exam/probation-officer/114-psychology)。\n\n---", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["心理測驗信度與效度（古典測驗理論）", "心理測量常以觀察分數＝真分數＋測量誤差理解分數。信度指測量結果在特定條件下的一致性／精確性，常檢視重測信度、內部一致性及評分者間信度；信度不足會使分數受偶然誤差影響。效度則是支持「如何解釋及使用測驗分數」的證據與論證，需檢查內容是否涵蓋構念、測量結構是否符合預期、與外部效標的關聯及對不同群體是否公平。信度是效度的重要基礎，但高信度不保證效度；穩定地測錯構念仍是無效。傳統教科書常列內容、建構、效標關聯效度；答題時宜說明它們是累積效度證據的不同面向，不宜當成彼此互斥或一次檢驗即永久成立的標籤。", "一致性、測量誤差、重測、內部一致、評分者間、內容證據、建構證據、效標證據、公平性", "本案不同觀護人及兩週重測結果相近，顯示分數可能穩定；但題目主要計算違規與缺席，未充分涵蓋個別需求、可變風險／保護因子，未必足以推論少年未來再犯。不得因此只憑高分加重監督或限制資源。"], ["測驗修訂與多方法評估", "依預定用途界定構念與決策，再由跨專業團隊檢視題目代表性；以具代表性的少年樣本試測，檢驗信度、效度、差異項目功能及不同群體的測量恆等性／預測公平；與實際結果及個案需求交叉驗證，持續監測誤判與效益。正式決策採結構化專業判斷，整合量表、少年訪談、家庭／學校資料、需要與保護因子，記錄理由並容許覆核。", "目的界定、在地常模、交叉驗證、公平性稽核、多資訊來源、人工覆核", "先把表格定位為「初談提示」而非風險定論；加入家庭支持、同儕、受害經驗、心理／教育需求及保護因子；在不同地區和群體檢查錯誤率；觀護人須以面談釐清缺席與違規背後成因，按個別需求設計監督、輔導及轉介。"]], "sourceReference": "改編自 114 年司法特考三等觀護人（選試社會工作概論／少年事件處理法）「心理學（包括心理測驗）」第 1 題。原題要求說明心理測驗的信度與效度、舉例分析「高信度但低效度」可能造成的問題，並提出改進方法。以下改寫成少年觀護情境，並非原題逐字照錄。", "reviewStatus": "待核對", "warnings": ["原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "", "id": "md-8aab0181bb7902e8000c"}, {"date": "2026-10-07", "subject": "諮商與輔導", "question": "改編自114年觀護人考試「諮商與輔導」第1題\n\n題目：請試述「焦點解決短期治療」（Solution-Focused Brief Therapy, SFBT）的三項基本假設及治療目標。若面對一位因保護管束期間反覆逃學、拒絕與家庭溝通的16歲少年個案，你會如何運用「奇蹟問句」與「量尺問句」技術進行輔導？請結合少年個案事實說明。（25分）", "issues": "- SFBT核心假設與目標（未來導向、例外、資源） vs 問題導向傳統諮商。\n- 技術如何具體應用於少年保護管束／逃學情境，避免陷入「為什麼逃學」的歸因循環。\n- 倫理與實務：觀護人角色下的短期、目標明確處遇。", "outline": "1. SFBT三項基本假設與治療目標（約8–10分）\n2. 奇蹟問句與量尺問句定義與操作（約5分）\n3. 具體應用於本案少年事實（逃學、家庭溝通困難）（約8–10分）\n4. 簡要結論與注意事項（倫理、短期目標、與觀護實務結合）", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["焦點解決短期治療（SFBT）", "後現代建構主義取向，主張諮商應聚焦「未來想要的狀態」與「已存在的例外成功經驗」，而非深入探究問題成因。行為改變機制來自小步驟成功經驗的累積與自我效能提升；重要內涵包括例外詢問、奇蹟問句、量尺問句、讚美與任務指派。易混淆處：非忽視問題，而是「問題存在時仍有解決資源」；與認知行為治療不同，較少直接挑戰認知扭曲，而強調語言建構解決方案。", "例外、未來導向、小改變、個案為專家、奇蹟問句、量尺問句", "本案16歲少年反覆逃學、拒絕家庭溝通。先用奇蹟問句：「如果今晚奇蹟發生，明天醒來你願意去上學、也願意和家人說幾句話，那會是什麼樣子？」引導其描述理想日常；再用量尺問句：「目前你願意去上學的意願從0到10是幾分？什麼會讓你再往上1分？」連結保護管束目標，設計極小可行步驟（例如「明天先到校門口再決定」），強化其既有例外（曾短暫到校的日子）並讚美，避免直接質問「為什麼逃學」。"]], "sourceReference": "題目：請試述「焦點解決短期治療」（Solution-Focused Brief Therapy, SFBT）的三項基本假設及治療目標。若面對一位因保護管束期間反覆逃學、拒絕與家庭溝通的16歲少年個案，你會如何運用「奇蹟問句」與「量尺問句」技術進行輔導？請結合少年個案事實說明。（25分）", "reviewStatus": "待核對", "warnings": ["原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "SFBT基本假設（問題與解決方案不必直接連結；例外存在；小改變引發大改變；個案是自身專家等）、奇蹟問句／量尺問句操作步驟、與少年事件處理法保護處分（保護管束）的銜接、避免標籤化。", "id": "md-cae8aeb644480e942f2c"}, {"date": "2026-10-07", "subject": "諮商與輔導", "question": "少年 A（16 歲）因多次竊盜被法院裁定交付保護管束，由觀護人負責輔導。A 來自單親家庭，母親長期工作忙碌，親子互動稀少；A 在學校人際關係不佳，常被同學排擠，近期更因與同儕衝突而產生退縮行為，拒絕上學。觀護人在訪視時發現 A 有明顯的自卑感與無助感，並表示「反正沒人關心我，做什麼都一樣」。\n請依序回答下列問題：\n（一）從「當事人中心治療」（Person-Centered Therapy）的角度，分析 A 的心理狀態與行為成因，並說明觀護人應如何運用此理論進行輔導。（25 分）\n（二）若改從「認知行為治療」（Cognitive Behavioral Therapy, CBT）的角度，應如何理解 A 的「反正沒人關心我，做什麼都一樣」此一想法？請設計具體的輔導介入策略。（25 分）\n（三）請比較上述兩種理論在少年個案應用上的優缺點，並說明觀護人應如何整合運用。（25 分）\n（四）若 A 同時有輕度憂鬱症狀，觀護人在輔導過程中應注意哪些倫理與實務事項？（25 分）\n\n______________________________________________________________________", "issues": "爭點：\n\n1. 不同諮商理論對同一少年個案的解釋差異。\n2. 理論如何轉化為具體的輔導介入策略。\n3. 觀護人角色與心理治療師角色的界線（尤其涉及憂鬱症狀時）。\n4. 倫理議題（保密、轉介、跨專業合作）。\n\n複習方向：\n\n- 當事人中心治療的核心概念（真誠、無條件正向關懷、同理心）。\n- CBT 的核心概念（認知三角、自動化思考、認知重構）。\n- 少年個案的特殊性（發展階段、家庭系統、同儕影響）。\n- 觀護人輔導的倫理規範（保密例外、危機處理、轉介機制）。\n\n______________________________________________________________________", "outline": "#### （一）當事人中心治療角度\n\n\n\n\n答題要點：\n\n- 說明 A 的自卑感與無助感源於長期缺乏正向關注，自我概念與經驗不一致。\n- 觀護人應提供安全、接納的關係，而非直接給建議。\n- 具體技巧：積極傾聽、情感反映、避免評價。\n\n______________________________________________________________________\n\n#### （二）認知行為治療（CBT）角度\n\n\n\n\n答題要點：\n\n- 識別 A 的自動化思考與認知扭曲類型。\n- 設計具體的認知重構技術（思考記錄表、蘇格拉底式提問）。\n- 結合行為實驗，讓 A 從實際經驗中修正認知。\n\n______________________________________________________________________\n\n#### （三）兩種理論比較與整合\n\n\n\n\n\n整合策略：\n\n1. 初期（1-3 次會談）： 以當事人中心為主，建立信任關係。\n2. 中期（4-8 次會談）： 引入 CBT 技術，協助 A 識別負面認知。\n3. 後期（9 次以後）： 結合兩者，維持接納態度的同時，鼓勵 A 實踐新行為。\n\n______________________________________________________________________\n\n#### （四）倫理與實務事項\n\n答題要點：\n\n1. 保密與保密例外： 向 A 說明保密原則及其例外（如有自傷、傷人風險時需通報）。\n2. 轉介機制： 若 A 有輕度憂鬱症狀，觀護人應評估是否需轉介心理師或精神科醫師，避免超越專業範圍。\n3. 跨專業合作： 與學校輔導老師、心理師、醫師保持聯繫，但需注意資訊分享的界線（需經 A 或其法定代理人同意）。\n4. 危機處理： 若 A 出現自傷意念，需立即啟動危機處理程序（通報、聯繫家長、安排就醫）。\n5. 自我照顧： 觀護人需注意自身情緒耗竭，尋求督導或同儕支持。\n\n______________________________________________________________________", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["當事人中心治療（Person-Centered Therapy）", "由 Carl Rogers 提出，主張人有自我實現的傾向，心理問題源於自我概念與經驗的不一致。治療者提供真誠、無條件正向關懷與同理心的關係，使個案能重新接納自己，恢復成長動力。行為成因非外在因素，而是內在自我價值感被否定。", "自我實現傾向、自我概念、真誠（genuineness）、無條件正向關懷（unconditional positive regard）、同理心（empathy）", "觀護人應避免說教或指導，而是以接納態度傾聽 A 的感受，反映其情緒（如「你覺得沒人關心你，很孤單」），讓 A 感受到被理解與重視，逐步重建自我價值感。"]], "sourceReference": "改編自 113 年司法特考三等觀護人（選試少年事件處理法）第 6 科「諮商與輔導」第 2 題（原題為簡答題，此處改編為申論題）[^19][^20]", "reviewStatus": "待核對", "warnings": ["日期取自文件標題／編製日期；檔名未提供有效日期。", "原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "", "id": "md-7bafb1e0acd146da9b27"}, {"date": "2026-10-07", "subject": "諮商與輔導", "question": "少年小宇，16 歲，因多次竊盜、傷害行為經少年法院裁定保護管束。初次晤談時，他輟學，與父親衝突頻繁，常與同儕夜遊，口頭禪是「都是別人害我的」「你管我幹嘛」，但提到自己想當汽車維修員，只是「反正沒人會給我機會」。\n\n請回答：\n1. 說明現實治療法如何以「控制」與「抉擇」解釋小宇的非行行為。（約 8 分）\n2. 運用 WDEP 系統評估小宇，並說明諮商輔導歷程。（約 11 分）\n3. 小宇屬於非自願個案，請說明在保護管束情境運用現實治療法的限制與因應。（約 6 分）\n\n角色提醒：依少年事件處理法，少年保護管束係由少年保護官執行；「觀護人」屬檢察署體系。考試題幹若寫「輔導者」或「觀護人」，作答時依題幹用語，但可在文中點出執行主體差異。", "issues": "1. 「控制」的意涵：現實治療的 control 是指個人只能控制自己的行為，並藉此滿足需求；它與「外控心理學」那種企圖控制他人的做法是對立的。\n2. 「抉擇」的意涵：行為（含非行）被視為在當下為滿足需求而做的整體行為選擇，強調責任，而不是責備。\n3. WDEP 不是單純的四個問句，而是評估與介入同時進行的工作流程。\n4. 非自願個案：保護管束具有強制性，而現實治療強調當事人自主選擇，要說明兩者如何調和。", "outline": "前言（約 2 分）\n- 點出現實治療法（Glasser）的定位：現在導向、強調責任與選擇，適用於犯罪預防與矯治，並說明本題對象為保護管束少年。\n\n一、控制與抉擇的解釋（約 7 至 8 分）\n1. 選擇理論：五大需求與優質世界，說明行為是為滿足需求而選。\n2. 控制：只能控制自己的行為；區分外控與內控。\n3. 抉擇：整體行為四部分，前輪（行動、思考）可直接改變。\n4. 套用小宇：需求受挫、以夜遊與非行取得歸屬與權力、以「他人害我」迴避責任。\n5. 補一句：責任不等於責備，也不忽略家庭與環境因素。\n\n二、WDEP 評估與輔導歷程（約 10 至 11 分）\n1. 先建立關係（現實治療的前提），以尊重與一致的態度回應非自願個案。\n2. W、D、E、P 逐項說明，每項各配一至兩個具體問句與小宇的事實。\n3. 計畫以 SAMI2C3 檢核；說明追蹤、調整與不接受藉口但不責罵的做法。\n4. 可補充：與家人、學校、職訓或就業資源的連結。\n\n三、非自願情境的限制與因應（約 5 至 6 分）\n1. 限制：保護管束的強制性與遵守事項，可能壓縮「選擇」空間；少年可能只是表面配合。\n2. 因應：區分「必須遵守的法定事項」與「可自主選擇的目標與路徑」；對少年坦白說明角色與保密限制；從少年自己的 Wants（如當修車員）出發，增加內在動機。\n3. 補充限制：需求與環境資源不足時，只靠少年自我調整不夠，需結合家庭與社區資源；對有嚴重精神或危機狀況者，要轉介專業評估。\n\n結語（約 1 分）\n- 小結：現實治療法讓少年從「歸咎他人」轉為「為自己的選擇負責」，但需以信任關係與環境支持為前提。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["選擇理論（Choice Theory，Glasser）", "現實治療法的理論基礎。主張人的行為是由內在動機驅動，目的是滿足先天的基本需求（生存、愛與歸屬、權力、自由、樂趣）。每個人心中有一個「優質世界」（想要的人事物圖像），當「知覺到的現實」與優質世界有落差，就會產生驅力，選擇行動去縮小差距。非行被理解為在需求未被滿足時，採用的無效、不負責的行為策略，而不是疾病。易混淆：選擇理論不否認環境影響，只是強調個人仍保有對自己行為的選擇空間；也不是「怪罪個人」，而是把焦點放在可改變的部分。", "五大需求、優質世界、知覺世界、整體行為、責任", "小宇在家中得不到認同（愛與歸屬受挫），在同儕中獲得被接納與「有力量」的感覺（歸屬、權力），因此夜遊與非行是他目前滿足需求的方式。他想當修車員，是優質世界裡的重要圖像，可以作為輔導切入點。"], ["控制與抉擇（外控 vs 內控；整體行為）", "控制：個人只能真正控制自己的行為，並藉此影響環境以滿足需求；Glasser 批判「外控心理學」（以賞罰、威脅、責備去控制他人），認為這會破壞關係並引發抗拒。抉擇：整體行為包含行動、思考、感受、生理四個部分，其中行動與思考是個人最能直接改變的「前輪」，感受與生理跟著改變。個人因此需為自己的選擇負責。易混淆：責任不等於責備；承認「有選擇」也不是否認少年面對的結構性困境。", "內控與外控、整體行為（行動、思考、感受、生理）、前輪與後輪、責任", "小宇的「都是別人害我」是外控式歸因。輔導者不以說教或威脅施壓，而是引導他看見：同儕與父親他控制不了，他能控制的是「今晚去不去夜遊」「是否去修車廠面談」等具體行動，並由此改變感受與生理（如挫折與易怒）。"], ["WDEP 系統（Wubbolding）", "現實治療的實務流程，四個步驟：W（Wants） 探索需求、想望與知覺；D（Doing） 檢視目前的整體行為，重點在「現在做什麼」而非過去；E（Evaluation） 協助當事人評估自己的行為是否有效、是否可行、是否符合法律與自己的長期目標；P（Planning） 擬定可執行的計畫並承諾。計畫常以 SAMI2C3 檢核（簡單、可達成、可衡量、立即、涉入、自己能控制、承諾、持續）。易混淆：WDEP 是「做什麼」的工具，必須建立在支持性的輔導關係上；它不是審問，也不是逐條要求少年認錯。", "Wants、Doing、Evaluation、Planning、SAMI2C3、輔導關係", "W：你想從家人、學校、工作得到什麼？D：這週實際做了什麼（夜遊、竊盜前後的行動）？E：這些做法讓你更接近「當修車員」嗎？違反保護管束遵守事項的後果是什麼？P：先約定每週到修車廠或職訓單位見習一次、固定時間返家，並於下次會談回報。"], ["現實治療法與其他取向的比較（易混淆處）", "現實治療法重視現在與未來，不挖掘過去創傷或潛意識，這是與精神分析的主要差異；不重視移情，也不認定「心理疾病」，這與醫療模式不同。與行為取向相比，它也談感受，但把重點放在當事人的自我評估與自主選擇；與認知行為取向相近處是都強調思考與行動，但現實治療更強調需求與關係。與個人中心取向相比，輔導者更為指導與提問導向，而不是僅以反映為主。", "重視現在、不談移情、自我評估、關係、與認知行為／個人中心差異", "小宇不信任大人，初期需要輔導者以穩定、不評斷的態度建立關係；但在規劃階段，輔導者要比個人中心取向更主動，協助他把想法轉為具體可檢核的行動。"]], "sourceReference": "", "reviewStatus": "待核對", "warnings": ["原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "1. 熟記 Glasser 五大需求、優質世界、整體行為，以及 Wubbolding 的 WDEP 與 SAMI2C3。\n2. 練習把 WDEP 寫成四組具體問句，並各配一個少年案例。\n3. 準備「非自願個案」的作答模組：說明角色、區分強制與自主、動機式的做法。\n4. 做學派比較表：現實治療、個人中心、認知行為、阿德勒（107 年同卷第四題考阿德勒的社會興趣）、焦點解決。\n5. 107 年同卷還考過：新住民多元文化適應、常用諮商技巧（自由聯想、例外問句、洪水法、語意正確法、蘇格拉底對話）；可列為連帶複習題。\n\n---", "id": "md-70321e87d71ef072303d"}, {"date": "2026-10-07", "subject": "諮商與輔導", "question": "16 歲甲少年經少年法院裁定交付保護管束，近三週持續不到校，說「去學校也沒有用」，夜間常玩遊戲至深夜；但他曾在週二與舅舅打籃球，也有兩次能自行早起。請：（一）說明 SFBT 的三項基本假設與治療目標；（二）示範奇蹟問句及量尺問句，協助甲描繪可觀察的返校小目標；（三）說明如何探索例外與既有因應能力，並與甲共同訂定一週可執行的步驟及追蹤方式；（四）說明觀護人如何在保護管束職責內與家庭、學校及必要心理衛生資源合作，且不將拒學逕自等同違規或犯罪。", "issues": "- 目標由少年參與形成： 將「恢復正常上學」轉成甲本人認可、逐步可觀察的行為，不把返校設為單向命令。\n- 奇蹟問句與量尺問句： 奇蹟問句描繪問題改善後最先出現的細節；量尺先共同定義 0 與 10，再問目前位置、為何不是更低、下一小步是什麼。量尺是對話工具，不是標準化測驗。\n- 例外與因應資源： 探問打球、兩次早起時有哪些不同條件，如何重現；不預設拒學病因，也不把偶發例外誇大為問題已解決。\n- 安全與跨專業評估： 同步留意霸凌、焦慮或憂鬱、自傷風險、睡眠、學習及家庭因素；SFBT 不取代必要的風險評估、診斷或轉介。\n- 司法職責與權利保障： 少年保護官依《少年事件處理法》第 51 條掌理保護管束並就教養、就學等提供相當輔導；應依裁定與查證資料處理，拒學本身不可逕推定為違反法院裁定。與家庭、學校及服務系統分享資訊時，說明保密界線並遵守必要、最小範圍原則。[21]", "outline": "1. 定位理論與目標： 說明 SFBT 的資源、合作及未來取向；目標須由少年參與並化為具體可見的改善。\n2. 描繪偏好未來： 示範奇蹟問句，追問甲本人或重要他人會觀察到什麼細節，避免只寫抽象的「變好」。\n3. 找例外與評估量尺： 以打球、早起經驗詢問當時條件；定義量尺兩端後，探問目前位置、既有力量及前進一格所需行動。\n4. 共訂一週計畫： 由甲選擇小而具體的一步，例如先約一位信任師長、到校參與一節課或調整一晚作息；約定回顧時間、阻礙與追蹤指標，不把分數作診斷。\n5. 交代觀護與安全責任： 評估拒學背後的安全及教育需求；依保護管束職責與照顧者、學校及必要心理衛生資源合作，尊重少年參與、清楚說明資訊分享界線。若涉及裁定或處遇調整，按事實及法定程序處理，不把拒學直接等同違規。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["焦點解決短期治療（SFBT）", "由 de Shazer、Berg 等人發展，主張諮商師與案主合作，從案主認可的偏好未來與可行目標出發；不要求先完整追溯單一病因，也不把行為一概視為個人缺陷。常見假設是案主已有可用資源、改變持續發生且小改變可累積，案主是自身生活的重要知情者。改變機制是找出問題較少或較能因應的例外，辨識可重現條件，以小而可行的行動及回顧進展擴大有效做法。易混淆處：不追溯病因不等於否認創傷與社會脈絡；奇蹟問句不是字面奇蹟或否認困難；量尺不是診斷測驗；正向取向不能取代安全評估。[19] [20]", "合作設定目標、偏好未來、例外問句、奇蹟問句、量尺問句、因應資源、小步驟與追蹤。", "先問甲如何看待不到校。奇蹟問句可問：「假設今晚休息時，讓你不想上學的困難有了改善，明早你最先注意到哪一件小事不同？」追問起床、出門、進校或參加一節課等可觀察差異。量尺由甲界定 0 與 10，問目前在哪一格、什麼讓他不是更低、哪個小行動可往前一格。以和舅舅打球及曾早起的經驗尋找例外，讓甲選定一週內可嘗試的一小步並共同追蹤。"]], "sourceReference": "", "reviewStatus": "待核對", "warnings": ["原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "", "id": "md-2e5a6836c676cf148b98"}, {"id": "2026-10-06-1", "date": "2026-10-06", "subject": "心理學（包括心理測驗，週二固定輪替）", "question": "少年甲現年 16 歲，因涉嫌參與宮廟陣頭聚眾鬥毆將他人圍毆成重傷，並涉入吸食第三級新興毒品「依託咪酯煙彈」，經警方查獲移送少年法院處理。少年法院調查過程中，為深入了解甲之性格特質、心理狀態與再犯風險，囑託少年調查官委請心理測驗員對甲實施標準化人格測驗（明尼蘇達多相人格測驗青少年版 MMPI-A / MMPI-2）。測驗施測前，甲態度冷淡防衛，對測驗員表示：「我好得很，平常都乖乖在家，那些打架吸毒都是朋友陷害我的，你們這測驗根本是想抓我把柄！」測驗結果出爐後，心理測驗員發現甲之效度量尺呈現極端組型：？量表＝0 題、L 量表＝68 分（高於平均）、F 量表＝42 分（顯著偏低）、K 量表＝72 分（極高），形成典型之「倒 V 字型」剖面圖；而臨床量尺（如抗社會性、憂鬱、偏執等）全數落在平均值以下之正常範圍內。試問：(一) 請依 MMPI 之心理測驗理論，詳細說明？、L、F、K 等核心效度量尺之分數意涵？並針對甲所呈現之「倒 V 字型」效度組型，分析其作答態度與此測驗結果在臨床上的真實有效性？（15 分）(二) 少年調查保護官在審前調查與後續保護處遇中，面對甲此種「表面正常但實質高度防衛、缺乏心理洞察力」之非自願少年，應如何運用心理學與諮商理論（如心理動力之自我防衛機轉、羅傑斯人本心理學之條件價值化與真誠一致），穿透其外在防衛並擬定個別化處遇計畫？請以標準四欄表格具體分析說明。（10 分）", "issues": "爭點一：MMPI 核心效度量尺之功能與分數意涵\n？量表（Cannot Say）：遺漏題數，檢驗合作程度。\nL 量表（Lie Scale）：評估受試者是否刻意呈現極端良好之道德形象（裝好 Fake Good）。\nF 量表（Infrequency Scale）：檢驗受試者是否隨意作答、不理解題意或刻意誇大症狀（裝病 Fake Bad / Malingering）。\nK 量表（Correction Scale）：評估微妙心理防衛，具有校正臨床量尺分數之功能。\n爭點二：效度剖面圖組型（Profile Validity）之解讀\n倒 V 型（L、K 高，F 低）：典型「防衛性良好（Defensive Good）」或「裝好（Fake Good）」。受試者極力否認任何心理困擾或人格瑕疵，臨床量尺被嚴重人為壓低，測驗結果無法反映個案之真實病理與再犯風險，具有高度假陰性（False Negative）偏差。\n爭點三：防衛機轉之心理學解讀與人本介入\n將高防衛視為無意識的心理自我保護（反向作用、否認、合理化），避免強行對質；運用羅傑斯之真誠一致與無條件接納，消除價值條件威脅，促使其接納真實自我。", "outline": "(一) MMPI 效度量尺分數意涵及甲案「倒 V 型」組型分析\n核心效度量尺之分數意涵：\n？量表：未作答題數。甲為 0 題，顯示全數作答完畢。\nL 量表：測量受試者自陳道德形象。高分（如 T > 65）代表個案企圖表現超乎常理之道德完美，刻意「裝好（Fake Good）」。\nF 量表：測量罕見或極端病理症狀。低分（T < 45）代表個案否認具有任何異常或情緒困擾。\nK 量表：測量個案對心理弱點之防衛程度。高分（T > 70）反映個案具有極高之心理防衛，缺乏對自我問題之洞察力（Poor Insight）。\n甲案「倒 V 型」剖面圖之臨床解讀與有效性判定：\n作答態度判定：甲呈現 L 與 K 顯著偏高、F 顯著偏低之「倒 V 字型」，反映出典型之「過度防衛性作答」與「追求社會讚許（Social Desirability）」之刻意美化傾向。\n測驗真實有效性：因甲極力隱瞞其真實情感與偏差衝動，其臨床量尺全數落在正常範圍內係屬「人為防衛遮蔽之假象」。該測驗無法客觀反映甲之反社會特質、情緒困擾與再犯風險，效度受到嚴重污染，不得單獨作為判定甲無處遇必要之依據。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["明尼蘇達多相人格測驗之效度量尺衡鑑理論（MMPI Validity Scales Model）", "Hathaway 與 McKinley 開創之經驗效標法人格測驗，其最大特色在於內建多維度「效度量尺」，用以評估受試者作答態度與可信度。四大核心效度量尺包括：(1) ？量表（未作答題數）；(2) L 量表（說謊量尺，檢測刻意裝好 Fake Good）；(3) F 量表（罕見反應量尺，檢測隨意作答或裝病 Fake Bad）；(4) K 量表（防衛量尺，檢驗微妙自我防衛並校正臨床分數）。在司法非自願脈絡下，高 L 與高 K 伴隨低 F 之「倒 V 型」組型，反映個案極力抗拒司法標籤、缺乏心理洞察力（Poor Insight）且刻意隱瞞性格缺陷。易混淆處：常將高 L/K 誤判為個案適應良好或無心理障礙；在司法情境中，高防衛組型代表臨床量尺已被嚴重壓低遮蔽，具有高度假陰性風險。", "效度量尺、？量表、L量表（裝好）、F量表（裝病/求救）、K量表（防衛校正）、倒V型組型", "少年甲涉重傷與吸毒，測驗呈現 L=68、F=42、K=72 之典型「倒 V 型」防衛組型，臨床量尺看似正常。心理測驗員與保護官不可僅憑臨床分數判定甲身心健全，應解讀為甲處於極端防衛與追求社會讚許之作答心態。處遇上調保官應先不直接對質其測驗分數，而是在審前調查中暫緩依此量表定性，改採半結構化深度訪談與行為觀察，待司法防衛降低後再予重測或交叉驗證。"], ["精神分析與心理動力學之自我防衛機轉理論（Anna Freud's Ego Defense Mechanisms）", "Anna Freud 系統化之自我防衛機轉理論。核心主張：自我（Ego）在調解本我衝動、超我道德批判與外部現實壓力時，為防止意識層面被劇烈的焦慮與罪惡感淹沒，會在無意識層面啟動心理防衛機制以扭曲或否認現實。常見防衛機轉包括：否認（Denial，拒絕承認客觀事實）、壓抑（Repression）、投射（Projection）、合理化（Rationalization）與反向作用（Reaction Formation，外在表現出與內在衝動完全相反之誇張行為，如內心極度自卑攻擊卻在測驗中裝作純潔）。易混淆處：防衛機轉並非個案有意識的「說謊」，而是無意識之自我保護策略；強制戳破防衛易引發個案之急性崩潰或暴力暴衝。", "自我防衛機轉、現實焦慮、無意識防衛、否認、合理化、反向作用", "甲在測驗中過度美化自己、在晤談中將聚眾鬥毆合理化為「幫朋友解圍」、並將吸毒否認「只是好玩沒上癮」，本質上是其自我為對抗面臨司法收容之巨大恐懼所啟動的複合型防衛機轉（反向作用、合理化與否認）。觀護人在輔導介入時，切忌採取敵對式拆穿其謊言，而應以溫和同理的態度指出其防衛背後之脆弱與恐懼，協助甲體會「承認自己的無助並不等於毀滅」，逐步引導其放下過度剛硬的心理防線。"], ["羅傑斯人本主義心理學之條件價值化與真誠一致（Carl Rogers' Person-Centered Theory）", "Carl Rogers 創立之個人中心治療取向。核心主張：人天生具有「自我實現」的向善潛能。個體之所以產生心理防衛與虛偽表象，是因為在成長過程中遭受重要他人施加「價值條件（Conditions of Worth）」，使個體學會唯有迎合外在期待才能獲得接納，導致「真實我」與「理想我」嚴重分裂。改變機制在於治療者提供三大促進性條件：(1) 真誠一致（Congruence）；(2) 無條件積極關注（Unconditional Positive Regard）；(3) 同理心了解（Empathic Understanding）。在完全安全、無評價的關係氛圍中，個案能逐步卸下虛偽防衛，重新接納真實自我。易混淆處：人本主義並非放任縱容違法行為；無條件積極關注接納的是「少年身為人的內在尊嚴與感受」，而非贊同其傷害他人的違法行為。", "自我實現、價值條件、真實我與理想我分裂、真誠一致、無條件積極關注、同理心了解", "甲在成長歷程中長期遭受家庭忽視與學校否定，唯有偽裝堅強、裝作無懈可擊才能在街頭生存，導致其在司法心理評量中無法展現真實弱點。保護官在個別晤談中，應展現高度之「真誠一致」與「無條件積極關注」：真誠向甲表明「我不是來評價你是否是個壞孩子，而是想了解你身上發生了什麼事」，給予甲前所未有的心理安全空間，使甲意識到在保護官面前無需「裝好」亦能獲得尊重，從而打破價值條件之桎梏，自發探索健康的成長方向。"]], "sourceReference": "107 年公務人員特種考試司法人員三等考試觀護人類科「心理學（包括心理測驗）」第 4 題", "reviewStatus": "待核對"}, {"date": "2026-10-06", "subject": "心理學", "question": "某觀護人室試用一份量表，協助評估緩刑付保護管束個案的風險及服務需求。重複施測結果相當穩定，但後續資料顯示，量表分數與再犯結果及實際服務需求的關聯薄弱；此外，低收入受測者較常被列為高風險。請：（一）說明心理測驗信度與效度，並解釋為何重測結果穩定不足以證明量表適合此用途；（二）分析錯誤分類可能造成的實務與倫理問題；（三）提出量表驗證、修訂及在觀護決策中的適當使用方案。", "issues": "- 信度不等於效度：重測穩定只支持分數一致性，不能單獨證明量表測到正確構念，或適合預測再犯、分配服務。\n- 效度依用途而定：需明確界定對象、構念、結果指標及追蹤期間；不能把某一用途的效度證據直接移作另一用途。\n- 錯誤分類有實際代價：假陽性可能導致過度監督、污名與不必要限制；假陰性可能使風險管理或服務支持不足。\n- 群體差異需檢驗、不可先下結論：低收入者較常被列高風險，可能涉及題項偏差、樣本選擇、校準或社會脈絡；僅憑差異不能直接斷定歧視成因。", "outline": "1. 界定測量品質：說明信度、效度及信度為效度必要但不充分的關係。\n2. 診斷題幹量表：指出重測結果穩定不能補足預測關聯不足；風險預測與服務需求是不同用途，應分開驗證。\n3. 分析錯分後果：分別說明假陽性與假陰性對監督強度、污名、服務轉介和安全的影響，並討論基準率與錯誤成本。\n4. 提出驗證修訂：定義構念及結果、建立具代表性的本地樣本、檢驗信效度與外部預測表現、進行分群校準與公平性分析，再依結果修訂題項、常模及切點。\n5. 規範實務使用：在證據不足前限縮用途；分數僅作輔助，結合會談、個案資料及專業判斷，設人工覆核、定期稽核、透明告知與申覆機制。\n\n結論句可寫：在本地預測效度及群體公平性尚未建立前，不宜以該量表單獨決定少年或其他個案的監督強度與服務資格；應先驗證、稽核並將量表定位為可被專業判斷覆核的輔助資訊。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["信度分析", "檢查測量結果的一致性或精確程度，可看重測、內部一致性或評分者間一致性。信度高代表結果較穩定，不代表量表測對目標，也不代表適合所有決策。", "一致性、測量誤差；信度是效度的重要基礎，但不足以單獨建立效度。", "若量表用於少年保護管束，重複測得相近分數只說明排序或分數較穩定；不能據此直接提高監督強度或拒絕服務。"], ["效度證據", "評估分數的特定解釋與用途是否有理論及實證支持；效度不是量表永久固定的屬性，須對應特定族群及用途。", "構念效度、效標關聯效度、預測效度；同一量表用於風險分級與服務需求評估，須分別提出證據。", "題幹顯示分數與再犯結果及實際需求關聯薄弱，故目前不足以支持用它作少年再犯預測或服務分配依據。"], ["預測效度與校準檢驗", "須先定義結果、樣本、追蹤期間，再以具代表性的資料檢驗外部效度；除整體區辨能力外，也要看校準、基準率、敏感度、特異度及切點取捨。", "預測誤差、基準率、假陽性／假陰性、校準、外部驗證。", "對少年樣本應檢查不同年齡與處遇群體的表現，不能直接沿用成人樣本的分數解讀；並衡量錯分對監督及服務的不同成本。"], ["分群公平性與錯誤分類稽核", "比較群體間錯分、校準及後果，檢視題項、樣本、資料品質和切點；發現差異後需追查原因，而非只看一個整體準確率。", "分群驗證、誤差分布、偏差來源、透明告知與人工覆核。", "若低收入少年較常被列高風險，應檢視是否由經濟處境代理風險、樣本代表性不足或模型校準差異造成，再決定修題、重設常模或限制用途。"]], "sourceReference": "民國114年（2025）觀護人考試「心理學（包括心理測驗）」第1題。[19]\n\n某觀護人室試用一份量表，協助評估緩刑付保護管束個案的風險及服務需求。重複施測結果相當穩定，但後續資料顯示，量表分數與再犯結果及實際服務需求的關聯薄弱；此外，低收入受測者較常被列為高風險。請：（一）說明心理測驗信度與效度，並解釋為何重測結果穩定不足以證明量表適合此用途；（二）分析錯誤分類可能造成的實務與倫理問題；（三）提出量表驗證、修訂及在觀護決策中的適當使用方案。", "reviewStatus": "待核對", "warnings": ["原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "1. 先用一句話界定信度、效度，明確寫出「信度不等於效度」，並指出效度證據依指定用途而定。\n2. 對照題幹分析：重測穩定支持一致性；與再犯及服務需求關聯薄弱，則削弱預測與決策用途的效度主張。\n3. 說明假陽性、假陰性及低收入群體差異可能造成的監督、服務、公平與倫理風險；不武斷認定偏差成因。\n4. 提出本地化驗證、分群檢查、人工覆核、定期稽核、用途告知及申覆安排。", "id": "md-e6dc35f3b1662e569988"}, {"date": "2026-10-06", "subject": "心理學", "question": "請說明Selye「一般適應症候群」（General Adaptation Syndrome, GAS）的三個階段及其對身體的影響。並以一位長期處於家庭衝突、學業壓力與保護管束雙重壓力的少年個案為例，描述其可能經歷的身心反應，以及觀護人可運用的心理學策略，協助預防個案進入耗竭階段。（25分）", "issues": "1. GAS三階段的生理與心理機制。\n2. 少年個案多重壓力源與GAS的對應。\n3. 觀護實務中預防耗竭的具體介入策略（結合認知、行為與支持系統）。", "outline": "1. 前言：簡述GAS理論背景與觀護實務關聯。\n2. 理論說明（表格呈現）：\n\n\n\n3. 個案分析：連結題目事實，說明各階段可能表現。\n4. 介入策略：認知重建、放鬆訓練、社會支持網絡、漸進式目標設定、必要時轉介心理衡鑑。\n5. 結論：強調早期介入與復原力培養對少年司法處遇的意義。\n\n---", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["Selye 一般適應症候群（GAS）", "主張壓力反應為非特定生理反應，分為三階段：1. 警覺期（交感神經啟動、腎上腺分泌、戰鬥或逃跑反應）；2. 抗拒期（身體試圖適應持續壓力，資源消耗增加）；3. 耗竭期（資源耗盡，免疫下降、身心疾病風險升高）。強調長期壓力累積的病理機制，易與「特定壓力源→特定疾病」混淆。", "警覺期、抗拒期、耗竭期、非特定反應、適應能量", "少年因家庭衝突（父母爭吵／疏離）、學業挫折與保護管束規範產生多重壓力。警覺期可能出現失眠、易怒、心跳加速；抗拒期勉強維持上學與報到，但出現注意力下降、身體不適；若未介入，進入耗竭期可能導致逃學、再犯、憂鬱或自傷。觀護人可於抗拒期介入，協助辨識壓力源、建立因應策略。"]], "sourceReference": "民國105年觀護人考試「心理學」第1題（Selye一般適應症候群）。", "reviewStatus": "待核對", "warnings": ["原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "- 壓力理論核心：警覺（alarm）→ 抗拒（resistance）→ 耗竭（exhaustion）。\n- 少年發展特殊性：青春期荷爾蒙、認知成熟度、家庭系統影響。\n- 與觀護工作連結：保護管束中的壓力管理、資源連結、復原力培養。\n- 易混淆：GAS與Lazarus認知評估理論、Holmes & Rahe生活事件量表之區別。", "id": "md-29d516291883754e3378"}, {"date": "2026-10-06", "subject": "心理學", "question": "某16歲少年因多次夜間離家、網路衝突與校內違規接受觀護。其父母長期衝突，少年近期又須照顧罹病祖父，出現失眠、易怒、注意力下降及對輔導抗拒。請以 Selye 一般適應症候群分析其壓力歷程，並結合觀護實務提出避免進入耗竭階段的處遇方案。答案應說明如何區分壓力反應、心理疾病診斷與少年違規行為，並提出轉介與危機評估原則。", "issues": "1. 警報期、抗拒期、耗竭期的定義與身心反應。\n2. 長期家庭壓力、照顧負荷與少年外化行為的連結，但避免單因果推論。\n3. 觀護處遇的壓力評估、支持系統、睡眠與情緒調節、家庭合作及必要轉介。\n4. 心理模型可協助理解與處遇，不等於臨床診斷；應保留個別差異與文化脈絡。", "outline": "1. 破題定義：說明 GAS 是壓力下的生理與心理適應歷程，並指出少年行為須採多因素評估。\n2. 分段分析：依警報期、抗拒期、耗竭期，逐段連結題目中的失眠、易怒、離家、網路衝突與注意力下降。\n3. 處遇方案：先做安全與功能評估，再安排個別晤談、家庭會談、學校合作、照顧資源與心理／精神醫療轉介。\n4. 觀護角色：設定可量化的短期目標、定期追蹤、記錄風險變化，並兼顧少年表意權、隱私與家庭參與。\n5. 結論：強調預防耗竭不是要求少年單獨忍耐，而是降低壓力源、增加支持資源並建立可持續的因應方式。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["一般適應症候群（GAS）", "Selye 將持續壓力下的身體適應概括為警報期、抗拒期與耗竭期。警報期是威脅引發喚起與戰逃反應；抗拒期是個體動員資源維持功能，表面可能恢復但仍消耗資源；耗竭期則因長期負荷與資源不足而出現身心功能下降。GAS 是壓力反應模型，不是少年偏差行為的完整犯罪或診斷理論；實務上須避免把所有失眠、易怒直接歸因於壓力。", "警報、抗拒、耗竭、身心資源、長期壓力", "少年初期可能因家庭衝突與照顧祖父而警覺、失眠；其後以離家、網路衝突或拒絕輔導維持暫時控制感；若支持不足，可能進入耗竭，表現為注意力下降、退縮、憂鬱或更高風險行為。觀護人應分階段介入，評估自傷、他傷、家庭暴力、物質使用與學校功能。"], ["壓力—因應觀點", "壓力結果取決於事件評估、可用資源與因應方式；同一事件對不同少年影響不同。問題焦點因應可處理實際困難，情緒焦點因應可降低情緒喚起；二者須依情境搭配，不能把逃避一概視為惡意。", "初級／次級評估、因應、資源、社會支持", "先與少年共同畫出壓力來源與可控部分，再建立睡眠、求助、衝突降溫與照顧替代方案；以短期可完成目標提高自我效能。"]], "sourceReference": "2025年（民國114年）司法特考三等觀護人「心理學（包括心理測驗）」第4題。原題要求說明一般適應症候群三階段，並以長期照顧病重親人為例分析身心反應及預防耗竭。", "reviewStatus": "待核對", "warnings": ["原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "", "id": "md-4e5f37d5ebeacf1064ad"}, {"date": "2026-10-06", "subject": "心理學", "question": "少年甲，16 歲，國中畢業後未升學，以打零工維生；父母離異，由祖母照顧。甲因擔任詐騙集團車手，經少年法院裁定交付保護管束。晤談時甲說：「我也不知道自己要做什麼，反正學校和工作都沒意思。」又說：「大哥說我很夠義氣，大家都叫我『兄弟』，我就是這種人。」\n\n請回答：\n(一) 說明 Erikson 所稱青少年「認同危機」之意涵，並析論甲的情形。（8 分）\n(二) 說明 Marcia 的四種認同狀態，並判斷甲較接近何種狀態，說明理由與尚需補充之資訊。（9 分）\n(三) 若你是負責甲的觀護人（少年保護官），請依上述分析提出處遇的方向與晤談策略。（8 分）", "issues": "1. Erikson 的「危機」≠ 一般情緒危機，是發展轉捩點。\n2. Erikson 與 Marcia 分屬不同層次：階段論 vs. 認同狀態分類。\n3. 判斷甲的狀態：缺乏探索＋對偏差角色快速認同，不是單純的「迷失」，要處理資訊不足的問題。\n4. 處遇連結：把認同理論轉為可操作的晤談策略。", "outline": "(一) Erikson 認同危機（約 8 分）\n1. 破題：Erikson 八階段論，青少年期任務為認同 vs. 角色混淆。\n2. 定義：認同危機＝發展轉捩點，不是單純情緒危機；成因（生理、認知、社會期待）。\n3. 成敗結果：忠誠 vs. 角色混淆／負向認同；心理社會延緩期。\n4. 涵攝甲：離校、家庭解組，缺乏正向延緩期，被偏差同儕角色填補。\n\n(二) Marcia 四狀態（約 9 分）\n1. 先寫兩向度（探索、承諾），再列四狀態各一句定義＋典型表現。\n2. 明示：Marcia 是對 Erikson 的操作化，狀態可移動。\n3. 判斷甲：寫出「傾向迷失，並對偏差角色早閉」的推論過程，並指出尚需補充的資訊（避免武斷）。\n4. 若甲開始懷疑／探索→延遲，說明其處遇意義。\n\n(三) 處遇（約 8 分）\n1. 原則：以保護管束的法定義務為框架（遵守事項、報到、查訪），不因處遇而放棄監督。\n2. 策略：MI 晤談（OARS、change talk）、生涯探索與職訓、取代偏差同儕的正向支持（家庭、學校、社區）。\n3. 風險管理：評估再被利用的風險，聯繫相關機關。\n4. 結語：認同重建是長期歷程，應定期評估狀態移動。\n\n常見失分點： 把四狀態說成 Erikson 的；只背名詞不涵攝案情；只談處遇、未回應「判斷理由」；對甲過早貼標籤。\n\n---", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["Erikson 心理社會發展論（青少年期：認同 vs. 角色混淆）", "Erikson 主張人格終身分八個階段發展，每階段有一組對立的心理社會任務。青少年期（約 12–18 歲）的任務是「認同對角色混淆」：生理成熟、抽象思考、學業與職涯抉擇及社會期待同時湧現，青少年須把過去經驗、現在角色與未來方向整合成連貫的「我是誰」。「認同危機」指此階段的轉捩點，即舊有兒童身分不再足夠、新身分尚未穩固時，個體經歷自我懷疑、探索與抉擇，並非單純的情緒危機。順利解決者形成穩定認同並獲得「忠誠」美德；失敗者出現角色混淆，可能退縮、過度認同同儕或偶像，或選擇「負向認同」（以社會不認可的角色，如偏差角色，來定義自己）。社會若允許「心理社會延緩期」，青少年得以試探角色而不必立即承擔成人責任。易混淆：(1) Erikson 的 crisis 是發展轉捩點，Marcia 才把它操作化為「探索」；(2) Erikson 是階段論，四種認同狀態不是 Erikson 提出；(3) 前一階段（勤奮 vs. 自卑）受挫者，較易在此階段陷入混淆。", "認同 vs. 角色混淆；認同危機＝轉捩點；心理社會延緩期；忠誠；負向認同；過度認同", "甲離開學校後沒有正向角色（學生、學徒）可試探，自述「不知道要做什麼」，延緩期被同儕團體取代；「兄弟、夠義氣」成為他唯一被肯定的身分，屬負向認同風險。家庭解組與中輟使其缺乏支持資源來度過轉捩點。"], ["Marcia 認同狀態論", "Marcia 以 Erikson 理論為基礎，用兩個向度分類：探索（是否主動思考並嘗試不同選項，早期稱 crisis）與承諾（是否對職業、價值、意識形態等領域做出投入）。交叉形成四種狀態：①認同達成：已探索並已承諾；②認同延遲（未定）：正在探索、尚未承諾；③認同早閉：未經探索即承諾，多承襲自父母或權威；④認同迷失（擴散）：既未探索也未承諾。狀態是針對特定領域的暫時分類，可隨經驗移動，並非一路向前的階段。易混淆：延遲與迷失都「尚未承諾」，差別在前者有主動探索；早閉與達成都「已承諾」，差別在有無探索。", "探索；承諾；達成／延遲／早閉／迷失；領域特定；可移動", "甲對學業、職業等正向領域既無探索也無承諾，傾向「迷失」；但對幫派角色「未經比較即全盤接受」，又帶有對偏差角色的早閉特徵。單憑晤談逐字稿不足以定案，需補充：曾否嘗試過其他工作或學習、對未來的想像、對「兄弟」身分是否有懷疑。若甲開始質疑或想探索其他可能，即轉向「延遲」，這是處遇的契機。"], ["動機式晤談（MI）", "由 Miller 與 Rollnick 發展的合作式、以個案為中心但有方向的晤談法。核心精神是夥伴關係、接納、同理與喚起（個案本身即有改變的資源）。流程包含：建立關係、聚焦、喚起、規劃。改變機制是透過開放式問句、肯定、反映式傾聽與摘要（OARS），探索個案「現況與價值之間的落差」，引出個案自己說出的改變言談（change talk），由個案自我說服而非被他人說服。易混淆：MI 不是說教或勸導，也不是診斷認同狀態；適用於「矛盾未解、動機不足」的階段，尤其是延遲或迷失者；對保護管束這種非自願個案，須誠實說明觀護人的法定角色與必須遵守的規範，再在可談的範圍內運用。", "夥伴關係；喚起；OARS；落差；change talk；自我說服；矛盾", "甲說「大家都這樣」時不爭辯，改以反映雙向感受（「義氣讓你覺得被需要，同時你也在保護管束中」），探詢「你想成為怎樣的人？」，引出如「想有穩定工作照顧祖母」等個人價值，作為轉向延遲／達成的基礎，並同步結合生涯探索、職訓與正向同儕資源。"]], "sourceReference": "- 改編自： 107 年公務人員特種考試司法人員考試三等考試 觀護人（選試少年事件處理法）類科「心理學（包括心理測驗）」第一題。\n- 原題要旨： Erikson 所稱青少年「認同危機」為何？Marcia 所提青少年認同狀態有哪些？分別說明。\n- 來源與查證： 法源法律網法學題庫 https://www.lawbank.com.tw/exam/exam.aspx?EID=6204 。我只核對到此頁面所列題目文字；考選部原卷未開啟，建議以考選部「考畢試題查詢平臺」複核題號與配分。", "reviewStatus": "待核對", "warnings": ["原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "- Erikson 八階段（信任／自主／主動／勤奮／認同／親密／生產／統整）與各階段美德；特別是第 4 階段受挫如何影響第 5 階段。\n- Marcia 兩向度（探索、承諾）與四狀態判準；狀態可移動，不是終點。\n- 跨科連結：負向認同 ↔ 犯罪學標籤理論（次級偏差）、差別接觸；晤談技術 ↔ 諮商與輔導（明日科目）。\n- 同科延伸（已核對的歷屆）： 112 年觀護人心理學第一題（情緒調節歷程模型）、第二題（人際心理治療的四項人際議題）、第三題（童年逆境經驗 ACEs）。來源：https://www.lawbank.com.tw/exam/exam.aspx?EID=7363", "id": "md-ae6f8b5f84c788a4ea09"}, {"id": "2026-10-05-1", "date": "2026-10-05", "subject": "犯罪學（週一固定輪替）", "question": "少年甲現年 16 歲，國中畢業後未繼續升學，亦無正當工作。甲自幼父母離異，由長期在外打零工之單親父親撫養，父親對甲之交友與行蹤採取消極放任態度。甲平日日夜顛倒，經常流連於 24 小時夾娃娃機店、撞球館、宮廟陣頭及網咖等處所。某日，甲受校外成年角頭乙之利誘，以每次新臺幣 2,000 元之代價，擔任第三級新興毒品「依託咪酯煙彈（俗稱睡眠煙彈）」之運送「小蜜蜂」。因依託咪酯煙彈體積小巧、黑市價格高且極易隱匿於口袋，甲在街頭頻繁交易，並自行於聚會中免費吸食。某日凌晨 2 時許，甲依指示攜帶市值約 5 萬元之煙彈，前往某處缺乏照明之偏僻宮廟廣場進行交易。未料買家丙等人因缺錢購毒，預謀「黑吃黑」，見甲單獨一人且身形瘦弱，遂持西瓜刀對甲進行強盜，甲奮力反抗，遭丙等人砍傷背部與手臂成重傷，身上煙彈與現金全數被劫走。案經路人報警將甲送醫急救，警方並循線查獲甲涉嫌持有並運送毒品，依法移送少年法院處理。試問：(一) 請依 Cohen 與 Felson 之「日常活動理論（Routine Activity Theory）」，剖析少年甲為何會在特定時空下同時成為毒品違法者與嚴重暴力被害人（加害者-被害者重疊現象）？並論述現代社會生活型態轉變對青少年偏差行為之影響？（15 分）(二) 少年調查保護官在接案擬定保護管束處遇計畫時，應如何運用犯罪學理論（如 Clarke 之情境犯罪預防理論、生活型態暴露理論），透過「阻斷犯罪機會」與「重建有能力監控者」以防範甲再度再犯與被害？請以標準四欄表格具體分析說明。（10 分）", "issues": "爭點一：日常活動理論（RAT）的三大核心要素時空匯聚\n有動機的加害者：街頭黑幫丙等人。\n合適的標的（VIVA 模型）：高價值（Value）、體積小易隱匿攜帶（Inertia）、可見度高（Visibility）、可接近性高（Access）。甲身形瘦弱、單獨赴約且攜帶高價毒品，構成極佳之侵害標的。\n缺乏有能力的監控者：單親父親放任、深夜偏僻宮廟無警察巡邏或監視設備，缺乏正式與非正式監控。\n爭點二：加害者-被害者重疊現象（Victim-Offender Overlap）\n少年從事違法活動時，其所處時空與互動人群高度重疊於犯罪熱點（Hot Spots），使其同時暴露於極端暴力侵害之風險中。\n爭點三：情境犯罪預防（Clarke）之五大策略在少年觀護之應用\n增加阻力（目標加固）、提高風險（加強監控與採尿）、降低報酬、減少刺激、移除藉口。", "outline": "(一) 以日常活動理論剖析甲之成因與加害者-被害者重疊\n日常活動理論之核心概念：\nCohen & Felson 主張，犯罪之發生係「有動機的加害者」、「合適的標的」與「缺乏有能力的監控者」在特定時空下的匯聚。\n甲案事實之要素涵攝與時空交會：\n缺乏有能力的監控者（Absence of Capable Guardian）：甲家庭親職監控完全瓦解，且凌晨處於無警力與監視器之偏僻宮廟。\n合適的標的（Suitable Target - VIVA 模型）：依託咪酯煙彈具高黑市價值（Value）、體積輕巧易攜帶（Inertia）；甲隻身一人且身形瘦弱，易於接近且反抗能力弱（Access & Visibility）。\n有動機的加害者（Motivated Offender）：黑幫買家丙等人覬覦毒品且缺乏道德拘束。\n加害者-被害者重疊與現代生活型態轉變：\n甲因運毒而進入街頭高風險網絡，其違法活動與被害情境發生於同一時空，印證了青少年犯罪人與被害人在生活軌跡上的高度重疊性。現代青少年日常活動脫離家庭與學校核心，流連虛擬社群與夜間娛樂熱點，大幅增加此類雙重風險。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["科恩與費爾森之日常活動理論（Cohen & Felson's Routine Activity Theory, RAT）", "Marcus Felson 與 Lawrence Cohen 於 1979 年提出，屬於情境與機會犯罪學取向。核心主張：犯罪並非單純源於加害人的病態心理或社會結構壓力，而是取決於社會結構變遷導致日常活動形態在「時間與空間」上的重組。犯罪的發生必須在特定時空同時匯聚三大要素：(1) 具有動機與能力的潛在加害者（Motivated Offender）；(2) 合適的標的物或被害人（Suitable Target，以 VIVA 模式衡量：價值 Value、體積慣性 Inertia、可見度 Visibility、可接近性 Access）；(3) 缺乏有能力的監控者（Absence of Capable Guardian，包括正式執法警察，以及非正式的父母、鄰里、甚至監視器設備）。當日常活動由家庭內部轉移至公共空間，使得合適標的暴露於缺乏監控之環境中，犯罪機會即大幅增加。易混淆處：常與「生活型態暴露理論」混淆；日常活動理論著重「宏觀社會結構與作息模式變遷對犯罪機會在時空匯聚之影響」，生活型態暴露理論則更聚焦於「個人人口學特徵（年齡、性別、社交模式）如何直接增加其個人被害風險」。", "三大要素時空匯聚、有動機加害者、合適標的（VIVA模式）、缺乏有能力監控者、情境犯罪機會", "甲長期輟學且單親無人管教，缺乏父母或學校等「有能力的監控者」；其日常作息轉移至深夜街頭熱點（宮廟、網咖），隨身攜帶易藏匿且具高轉售價值之依託咪酯煙彈（符合 VIVA 高價值、低體積、高可接近性之合適標的），並在該時空遭遇尋找搶劫目標之黑幫分子（有動機之加害者），導致犯罪時空重疊，既從事販運毒品又成為被刺傷搶劫之被害人。保護官處遇應重在打破此時空匯聚：透過宵禁規範、改變甲的日常活動軌跡，並引入親職輔導與社區導師重建「有能力的監控者」。"], ["克拉克之情境犯罪預防理論（Ronald V. Clarke's Situational Crime Prevention, SCP）", "植基於理性選擇理論與日常活動理論，主張與其耗費龐大資源試圖從根本改造加害人的深層性格或消除社會貧困，不如從「犯罪發生的具體微觀情境」著手，透過改變環境物理結構與管理規則，達到防範再犯與再被害之目的。Clarke 提出五大核心策略（共 25 項具體技術）：(1) 增加犯罪阻力（Increase the Effort，如門禁管制、目標加固）；(2) 提高犯罪風險（Increase the Risks，如加強出入口監視、強化正式與自然監控）；(3) 降低犯罪報酬（Reduce the Rewards，如財物標記、快速移除誘因）；(4) 減少犯罪誘因與刺激（Reduce Provocations，如控制同儕聚集爭端、避免酒後衝突）；(5) 移除犯罪藉口（Remove Excuses，如明確公告法規禁止吸毒、設立明確規則）。易混淆處：常被批評僅會導致「犯罪轉移（Crime Displacement）」；實證研究證實，情境預防不僅犯罪轉移有限，更常產生「犯罪預防效益的擴散（Diffusion of Benefits）」。", "情境犯罪預防、五大策略（增阻力/提風險/降報酬/減刺激/除藉口）、目標加固、自然監控、機會阻斷", "針對甲在深夜宮廟與網咖頻繁交易與吸食依託咪酯之行為，少年保護官應運用情境犯罪預防策略：(1) 增加阻力：命令甲交出涉案通訊軟體帳號，由家長或機構協助管控手機使用時間；(2) 提高風險：設定夜間非預告家庭訪視與突擊採尿檢驗，使其感知違規風險極高；(3) 降低報酬與減少誘因：協助其斷絕黑幫通訊群組，沒收涉案載具；(4) 移除藉口：在保護管束報到時簽署明確的生活常規契約，明定不得涉足特定宮廟陣頭場所，切斷犯罪機會。"], ["辛德蘭、戈特弗雷德森與加洛法洛之生活型態暴露理論（Lifestyle-Exposure Theory）", "由 Michael Hindelang 等人於 1978 年提出，專門解釋個人生活型態與被害風險之間的直接關聯。核心主張：個人的社會人口學特徵（如年齡、性別、收入、婚姻狀況）決定了其結構性角色與社會期望，進而塑造出其獨特的「日常生活型態（Lifestyle）」（包括工作、休閒與社交活動模式）。某些生活型態（如年輕男性、單身無業、經常於深夜在公共場所飲酒或參與高風險社交活動）會顯著增加個人在「危險時間（夜間）、危險地點（治安死角）、與高危險人群（偏差同儕、幫派分子）」共同接觸的機率，進而呈現不成比例的高被害率。易混淆處：該理論並非「責備被害人（Victim Blaming）」，而是「客觀分析行為模式與物理時空暴露度之機率分布」，指出被害並非隨機發生，而是生活型態暴露的統計必然結果。", "生活型態、角色期待、危險時空暴露、高風險社交、被害機率分佈、加害者-被害者重疊", "甲身為 16 歲輟學青年，其日常休閒生活完全脫離家庭與學校軌道，高度暴露於深夜街頭與混雜人口場所，結交具有暴力與前科背景之陣頭份子。這種高風險的生活型態，使其在涉案擔任車手的同時，極易成為同儕黑吃黑行搶的對象。觀護人在進行審前調查與擬定保護管束計畫時，應向甲詳細解構其「生活型態與重傷被害之因果關聯」，引導其覺察到「留在危險圈子裡，下一次可能丟掉性命」；進而結合就業培力與日間規律運動社團，重構其健康合法的常規生活型態，從根源降低其雙重風險。"]], "sourceReference": "108 年公務人員特種考試司法人員三等考試觀護人類科（選試少年事件處理法）「犯罪學」第 1 題", "reviewStatus": "待核對"}, {"date": "2026-10-05", "subject": "犯罪學", "question": "某16歲少年近期與同儕參與商店竊盜。初步資料顯示，他小學時沒有已知的持續嚴重違規；中學後為融入較年長同儕而開始缺課、抽菸。家庭監督不足，且與主要照顧者關係緊張；但有支持他的導師、姑姑，也曾穩定參與運動社團。觀護人尚未取得完整發展史或專業評估。請：\n\n1. 比較Moffitt的LCP與AL路徑之特徵及成因，包括神經認知／氣質風險、累積性環境互動、成熟鴻溝及同儕模仿。\n2. 辨析本案的風險與保護因子，說明為何不能只憑一次事件判定LCP或AL。\n3. 運用RNR原則提出觀護處遇及再評估計畫。", "issues": "- 發展路徑是理論原型，不是診斷標籤。LCP通常指童年較早起始、跨情境且持續的反社會行為；其成因可包括神經心理或自我調節脆弱性，與不利養育及環境交互累積。AL通常在青少年期較突出；Moffitt以生理成熟先於成人角色、權利或地位的「成熟鴻溝」，以及同儕模仿與地位追求，解釋此路徑可能在成人角色逐步取得後減少。Dunedin男性出生世代研究中，符合該研究操作定義的LCP少於10%、AL約四分之一；這是特定世代的研究估值，不是臺灣或普遍人口比例。[31][32]\n- 個案必須呈現證據限制。較晚出現的違規及同儕影響可作為AL方向的線索，但仍缺幼年發展史、跨情境紀錄與完整評估，不能據此定型。家庭監督不足、缺課、反社會同儕及物質使用可作為待評估的風險；導師、姑姑與運動社團則是可動員的支持資源。\n- RNR不是只做風險標籤。風險原則：介入強度與再犯風險匹配；需求原則：優先處理可改變且與犯罪相關的需求，例如反社會同儕、犯罪態度或家庭監督；回應性原則：採有效方法，並依少年的認知、語言、學習能力、動機及優勢調整。Big Four包括反社會行為史、反社會人格模式、反社會認知、反社會同儕／交往；不可把所有生活困難都視為犯罪生成需求，也避免低風險者接受過度密集介入。[33]", "outline": "1. 先定義比較軸線（約3分）：交代LCP、AL為發展犯罪學路徑原型，按起始年齡、跨情境持續性、成因機制及可能中止時間比較。\n2. 分述兩路徑與研究限制（約5分）：LCP說明童年起始、神經認知／氣質與不利環境的累積互動；AL說明成熟鴻溝、同儕模仿與可能中止，並限定Dunedin男性樣本比例不可外推為普遍盛行率。[31][32]\n3. 對照個案並指出資料缺口（約7分）：指出較晚起始及同儕影響偏向AL線索；家庭監督、缺課列為可評估的動態風險；導師、姑姑、運動社團列為保護資源。提出補查幼年發展、學習／注意力、自我控制、家庭及校園紀錄、同儕與物質使用資料；不以一次事件或單一性別／症狀判定軌跡。\n4. 提出RNR個別計畫（約10分）：以合宜工具及少年、家長、學校等多源資料評估，再按風險配置服務強度；聚焦可改變需求，透過認知行為／社會學習方法、合作式晤談及適齡形式執行；連結正向成人、學校與社區活動，並定期複評。以出席、違規頻率、家庭合作及正向同儕參與等指標追蹤。RNR應形成評估、介入、再評估的循環，而非靜態貼標。[33]", "theoryTable": [], "sourceReference": "", "reviewStatus": "待核對", "warnings": ["來源缺少有效四欄理論表，保留題目並待補表格。", "原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "1. 先定義比較軸線（約3分）：交代LCP、AL為發展犯罪學路徑原型，按起始年齡、跨情境持續性、成因機制及可能中止時間比較。\n2. 分述兩路徑與研究限制（約5分）：LCP說明童年起始、神經認知／氣質與不利環境的累積互動；AL說明成熟鴻溝、同儕模仿與可能中止，並限定Dunedin男性樣本比例不可外推為普遍盛行率。[31][32]\n3. 對照個案並指出資料缺口（約7分）：指出較晚起始及同儕影響偏向AL線索；家庭監督、缺課列為可評估的動態風險；導師、姑姑、運動社團列為保護資源。提出補查幼年發展、學習／注意力、自我控制、家庭及校園紀錄、同儕與物質使用資料；不以一次事件或單一性別／症狀判定軌跡。\n4. 提出RNR個別計畫（約10分）：以合宜工具及少年、家長、學校等多源資料評估，再按風險配置服務強度；聚焦可改變需求，透過認知行為／社會學習方法、合作式晤談及適齡形式執行；連結正向成人、學校與社區活動，並定期複評。以出席、違規頻率、家庭合作及正向同儕參與等指標追蹤。RNR應形成評估、介入、再評估的循環，而非靜態貼標。[33]", "id": "md-fc47c0d01e8af07c4e5f"}, {"date": "2026-10-05", "subject": "犯罪學", "question": "（情境化＋跨科連結）\n16 歲中輟少年阿凱，居住於都市老舊社區，父母長年忙於工作、疏於關心；他常與中輟同伴聚集於網咖，因缺錢而遭幫派分子吸收，先擔任詐欺車手領取贓款，其後遭帶往汽車旅館監禁並施打毒品。司法警察於查緝詐欺機房時一併查獲阿凱（本案具「成人與少年共同犯罪」情節）。\n請分別從社會結構學派與社會控制學派各擇一具代表性理論，分析阿凱產生偏差與犯罪行為之成因；並依各該理論提出具體之防治與處遇對策，說明其在少年保護事件程序（少年調查官調查、保護處分之選擇）中之應用。（25 分）", "issues": "1. 社會結構學派之選題與套用：社會解組（社區結構削弱非正式控制）、緊張理論（目標—手段落差）、差異機會（合法與非法機會結構並存——阿凱「缺錢→幫派吸收」正是非法機會開放）三者擇一即可，擇一後須全程貫扣。\n2. 社會控制學派（Hirschi 社會鍵）之套用：四鍵中「附著」（父母疏於關心→親職附著弱）、「奉獻」（中輟→無教育目標可失去）、「參與」（網咖遊蕩→無正向時間占據）、「信念」（幫派次文化稀釋守法信念）逐一對應事實，是本題最容易「背理論卻不套題」而失分之處。\n3. 兩學派對策層次之差異：結構學派→社區營造、教育與就業機會結構改造（鉅視）；控制學派→強化家庭監督、親職教育、規律活動安排（微視）。\n4. 易混淆處：①「差別交往」（Sutherland，學習理論）非社會結構學派，勿誤植；②Merton 經典緊張理論與 Agnew 一般化緊張理論（擴及負面情緒與人際刺激）不同，擇一寫清楚；③控制理論假設「人人都可能犯罪，問題為何沒人犯罪」，與標籤理論、緊張理論問法相反。", "outline": "1. 破題（2–3 行）：界定少年偏差/犯罪行為成因之多元性，點出本題兩學派分別代表「結構決定」與「關係控制」兩種解釋取徑，並預告將套用於阿凱個案。\n2. 社會結構學派（約 8 行）：理論主張→成因機制→套用阿凱事實（老舊社區＝解組；缺錢＋幫派＝非法機會開放）。\n3. 社會控制學派（約 8 行）：Hirschi 四鍵逐一對應阿凱事實（附著弱、奉獻低、參與偏、信念稀釋）。\n4. 防治與處遇對策（約 8 行）：分「鉅視—結構面」與「微視—個人/家庭面」兩層；具體對策落點到少年保護事件程序——少年調查官調查報告之建議方向（如：聲請保護管束並附帶親職教育、轉介中輟復學輔導、安置輔導脫離幫派環境），並引 CRC GC No.24 之最小干預原則。\n5. 結語（2–3 行）：兩學派非互斥，整合「改善結構機會」與「修復社會鍵」方能兼顧少年最佳利益與社會安全（扣合少事法§18-2 立法意旨）。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["Merton 緊張理論（社會結構學派）", "主張犯罪源自「文化目標」與「制度化合法手段」之結構性落差：社會鼓勵人人追求財富成功，但階層結構使底層少年缺乏合法達標手段，產生「緊張」，遂以「創新型」（用非法手段達標）等方式適應。行為成因是結構決定機會分配，而非個人病態。易混淆：此為古典緊張理論，與 Agnew 一般化緊張理論（加入負面刺激與情緒）不同。", "目標—手段落差、創新型適應、結構性緊張", "阿凱缺錢（目標壓力）而合法機會封閉（中輟、無技能），轉由幫派提供「創新型」非法致富管道（車手）；對策應開放合法機構會／職訓，而非僅處罰。"], ["Shaw & McKay 社會解組理論（社會結構學派）", "主張少年犯罪集中於貧窮、人口流動率高、異質性高的社區；此類社區「非正式社會控制」（鄰里監督、機構連結）解組，縱使人口更替，犯罪率長期穩定（集中效應）。行為成因是社區結構削弱控制、偏差規範代間傳遞。易混淆：解組的是「社區」而非個人心理。", "社會解組、集中效應、非正式社會控制、集體效能", "阿凱居住都市老舊社區、缺乏社區監督，網咖遊蕩無人介入；對策採社區營造、青少年活動據點、鄰里與學校合作之「復育控制網」。"], ["Cloward & Ohlin 差異機會理論（社會結構學派）", "主張犯罪學習（差別交往）需有「機會結構」配合：合法機會與非法機會同樣呈結構性分配。底層少年依其所處非法機會網絡，分別加入犯罪型（有組織牟利）、衝突型（暴力爭鬥）、退縮型（藥物逃避）次文化。易混淆：本理論是「學習＋結構」的整合，屬結構學派分支。", "合法／非法機會結構、犯罪／衝突／退縮次文化", "阿凱被幫派「吸收」正是非法機會結構開放：有組織地提供車手工作與毒品接觸；對策在切斷幫派招募網絡並提供替代經濟機會與安置（脫離接觸）。"], ["Hirschi 社會鍵理論（社會控制學派）", "主張人人皆有犯罪可能，真正問題是「為何多數人不犯罪」：少年與社會的社會鍵越強，越不會犯罪。四鍵：①附著（對父母師長的情感連結與在意其評價）②奉獻（對教育、職業目標的投入，犯錯損失大）③參與（規律活動占據時間與精力）④信念（認同守法規範）。成因是控制不足而非推力。易混淆：問法與緊張理論相反（推力 vs 斷鍵）。", "附著、奉獻、參與、信念；控制取向", "阿凱四鍵俱弱：父母疏於關心（附著）、中輟無目標（奉獻）、網咖遊蕩（參與偏差）、幫派次文化洗蝕守法信念。對策為親職教育、復學輔導重建附著、規律安置活動，少年調查官可建議保護管束並附帶假日生活輔導。"], ["Sampson & Laub 生命歷程理論（控制理論延伸）", "主張童年社會鍵決定早期犯罪，但人生「轉捩點」（婚姻、就業、服兵役）可在成年後切斷偏差軌跡；關鍵機制是轉捩點帶來的「結構性羈絆」（新的依附與監督）與「人類能動性」。少年時期累積的「累積劣勢」會放大偏差路徑。易混淆：屬縱貫／發展取向的控制理論，非靜態分類。", "轉捩點、結構性羈絆、累積劣勢、能動性", "阿凱正處「累積劣勢」起點（中輟→車手→毒品）；及時安置輔導、復學或技能訓練即是在少年階段「製造轉捩點」，避免軌跡鎖定——對策時間感比 Hirschi 更強調介入時機。"]], "sourceReference": "", "reviewStatus": "待核對", "warnings": ["原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "- Merton 五種個人適應模式（順從型、創新型、儀式型、退縮型、叛逆型）——能畫表默寫。\n- Shaw & McKay 芝加哥學派：社會解組、集中效應（concentrated disadvantage）、文化移轉；延伸讀 Sampson 的集體效能。\n- Cloward & Ohlin 差異機會理論：犯罪次文化、衝突次文化、退縮次文化三型——對應幫派吸收情境最貼。\n- Hirschi 社會鍵四要素＋Sampson & Laub 生命歷程轉捩點（婚姻、就業、軍職）作為控制理論延伸。\n- 連結《少年事件處理法》：保護處分四種（訓誡、保護管束、安置輔導、感化教育，少事法第 42 條）與少年調查官「調查—建議」角色；本日備查之少事法§18-2 草案（成少共犯同行程序）正好是「幫派利用少年」情境的最新立法動態，可在答題結語帶一句時事，展開制度視野。\n- 連結 CRC GC No.24：處遇應符合「最後手段／最小干預」，剝奪自由僅為例外——申論對策段可引為正當性依據。", "id": "md-86f751f7e06760a13d2e"}, {"date": "2026-10-05", "subject": "犯罪學", "question": "題目來源標示：改編自 113 年司法特考觀護人犯罪學科目之考古題風格與爭點；此處為模擬改編題，非重製原題。\n\n17 歲少年 A 就讀高職夜間部，白天在工地打工。近一年多次夥同友人竊盜工地金屬材料，並於網路販售贓物。A 自幼父母離異，由祖母扶養；國中時遭同學長期排擠，高中後逐漸與輟學同儕混跡。最近一次竊盜被逮後，少年法院裁定交付觀護，並命接受法治教育與社區服務。請依犯罪學理論，分析 A 的犯罪行為成因，並說明如何結合緊張理論、差別接觸理論與社會控制理論設計處遇計畫。（25 分）", "issues": "- 多理論整合：區分結構性壓力、犯罪學習與社會連結弱化。\n- 事實涵攝：連結家庭、學校、同儕、就業與網路販售行為。\n- 處遇可操作性：提出可執行、可追蹤的觀護措施。", "outline": "1. 前言：說明少年犯罪具多因性，採整合理論分析。\n2. 成因分析：分別說明三理論主張，再將題目事實逐一涵攝。\n3. 觀護處遇：提出「風險降低＋保護因子增強」的具體計畫。\n4. 成效追蹤：設定就學出席、正當就業、同儕接觸、家庭互動與再犯風險等可評估指標。\n5. 結語：強調教育、復歸與個別化處遇，而非單純懲罰。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["緊張理論", "當個人無法透過合法途徑達成被社會認可的目標，或遭受負向刺激與正向刺激剝奪，可能產生壓力、憤怒或挫折；部分人會以違法方式因應。重點不只是貧窮，而是目標、資源與處境之間的失衡。", "目標－手段斷裂、負向情緒、創新適應", "A 面臨家庭支持有限、就學與工讀並行及經濟壓力；竊取金屬並販售可能被其視為快速取得收入的非法替代手段。"], ["差別接觸理論", "犯罪行為與守法行為均可透過互動習得；個人會學到犯罪技巧、動機、合理化語言與對法律的定義。接觸的頻率、持續性、優先性與強度會影響學習結果。不可僅以「交到壞朋友」概括，應分析具體學到何種技巧與價值。", "學習犯罪、犯罪定義、頻率、持續性、優先性、強度", "A 與輟學同儕多次共同竊盜且販售贓物，顯示可能從同儕習得目標選擇、行竊方式、銷贓管道及合理化說詞。"], ["社會控制理論", "人不犯罪的重要原因在於與傳統社會有連結；依附、承諾、參與及信念愈強，偏差行為的代價愈高。此理論重點是解釋何以沒有被社會連結約束，而非主張控制本身即可治療所有問題。", "依附、承諾、參與、信念", "A 與父母依附薄弱，學校投入與正向活動可能不足，且受同儕影響而弱化法規範信念；處遇應重建其家庭、學校與社區連結。"]], "sourceReference": "改編自 113 年司法特考觀護人犯罪學科目之考古題風格與爭點；此處為模擬改編題，非重製原題。\n\n17 歲少年 A 就讀高職夜間部，白天在工地打工。近一年多次夥同友人竊盜工地金屬材料，並於網路販售贓物。A 自幼父母離異，由祖母扶養；國中時遭同學長期排擠，高中後逐漸與輟學同儕混跡。最近一次竊盜被逮後，少年法院裁定交付觀護，並命接受法治教育與社區服務。請依犯罪學理論，分析 A 的犯罪行為成因，並說明如何結合緊張理論、差別接觸理論與社會控制理論設計處遇計畫。（25 分）", "reviewStatus": "待核對", "warnings": ["原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "", "id": "md-0561b5f12b42a84733d2"}, {"date": "2026-10-05", "subject": "犯罪學", "question": "阿哲，15 歲，國三，與祖母同住，父母離異。學業落後、被標籤為「問題學生」，社區經濟弱勢且缺乏課後資源，逐漸疏離學校，與學長團體往來，被指使參與傷害與詐欺車手工作。請（一）以社會結構學派代表理論、（二）以社會控制學派代表理論分別分析成因，（三）依各自理論提出防治對策，（四）說明觀護人在保護管束中如何整合運用。（25 分）", "issues": "結構學派問「為何被推向犯罪」，控制學派問「為何多數人不犯罪」；理論須貼合事實，並區分歸類。", "outline": "1. 破題：偏差成因多元，兩學派各有解釋力。\n2. 結構學派：選一理論（Agnew 或 Merton），寫主張、概念、套用阿哲、對策。\n3. 控制學派：社會鍵四要素逐一連結事實，再提對策。\n4. 比較：人性假設、解釋層次、對策重點。\n5. 觀護人整合：風險需求評估、處遇計畫、跨機關合作。\n6. 結論：兩理論互補，兼顧壓力調節與連結重建。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["一般緊張理論（Agnew，結構／緊張取向）", "偏差來自負面壓力源所生的負面情緒，在缺乏有效因應資源時以偏差行為作為出口。壓力源有三類：目標受阻、正向刺激被剝奪、負向刺激出現。易混淆：Merton 談結構與文化目標、合法手段的落差，偏宏觀；Agnew 聚焦個人感受的壓力與情緒，偏微觀。", "目標受阻、失去正向刺激、負向刺激、負面情緒、因應資源", "學業落後被標籤、家庭破裂、社區資源匱乏，累積挫折與憤怒，缺乏合法出口，轉依附學長團體。"], ["社會鍵理論（Hirschi，社會控制）", "假設人人有犯罪動機，社會鍵強弱決定是否越軌；四要素為依附、投入、參與、信念，鍵越弱越可能偏差。易混淆：談「控制減弱」，不同於差別接觸認為偏差是學來的。", "依附、投入、參與、信念", "與祖母依附薄弱、疏離學校、規範信念鬆動，轉向學長團體。"], ["社會解組理論（Shaw & McKay，結構補充）", "解釋犯罪率的地區差異：貧窮、人口流動使社區難以形成非正式社會控制。易混淆：屬社區層次，不直接解釋個人為何犯罪。", "社區貧窮、居民流動、非正式社會控制", "社區弱勢、缺乏課後資源，監督與支持薄弱。"], ["保護管束處遇方向（實務應用）", "緊張取向偏重資源與壓力調節，控制取向偏重重建連結與依附，可整合：先做風險與需求評估，再訂處遇計畫。", "風險需求評估、資源轉介、關係重建", "轉介課後輔導與福利資源，並強化與祖母、學校、正向同儕的連結。"]], "sourceReference": "114 年司法特考三等觀護人（犯罪學）第 1 題（25 分）。原題主旨：從社會結構學派與社會控制學派各舉一個代表理論，說明青少年偏差行為成因與防治對策。（來源：法律人 LawPlayer，原題引自考選部）", "reviewStatus": "待核對", "warnings": ["原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "", "id": "md-c2f1953022ffa3263e9b"}, {"date": "2026-10-05", "subject": "犯罪學", "question": "近年成年人利用少年擔任詐欺車手、運送毒品之「成少共犯」案件增加。16 歲少年 A 生長於資源匱乏社區，國中中輟後經同儕介紹，透過通訊軟體加入提款車手集團。A 表示：「反正考不上好學校，做這行比較快有錢；朋友都在做，被抓頂多保護管束。」其父長期在外、母親工時長，學校對 A 的缺課幾無後續。請分別從 社會結構學派 與 社會控制學派 各舉一個具代表性的理論，說明 A 產生偏差行為的原因，並依各理論提出觀護處遇與防治對策。另請以 標籤理論 簡評：若對此類少年改採提高假釋門檻、限制前案塗銷等嚴罰取向，可能產生之效應。", "issues": "1. 社會結構 vs 社會控制的提問方向不同：前者問「社會為何把人推進犯罪」；後者問「為何有人不犯罪、A 的抑制鍵為何斷裂」。\n2. A 的台詞同時有「結構性無出路」與「沒有被綁住」兩層，不能只用一個學派寫完。\n3. 「被抓頂多保護管束」是對少年司法標籤與威嚇的主觀解讀，正好接到少事法塗銷／假釋與利雅德準則「避免過早標籤化」。\n4. 成少共犯中，A 可能同時是行為人與被利用的被害人，處遇不能只寫罰則。", "outline": "1. 破題與個案定位（約 3–4 分）  \n   先定性：A 是 16 歲、中輟、貧困社區、被成人網路招募的車手，屬典型「機會型財產犯罪＋成少共犯」。\n2. 社會結構學派：Merton 緊張理論（約 7–8 分）  \n   寫理論主張 → 套 A 的「考不上／比較快有錢」→ 處遇對策（結構面：就學就業、社區機會）。\n3. 社會控制學派：Hirschi 社會鍵理論（約 7–8 分）  \n   四鍵逐一對 A 斷裂情形 → 觀護處遇對應重建哪一鍵。點出控制理論預設「不犯罪才要解釋」，與結構理論互補而非互斥。\n4. 標籤理論簡評嚴罰取向＋綜合處遇（約 5–6 分）  \n   提高假釋門檻、限制塗銷可能強化次級偏差。結論：對成人利用端應嚴查，對 A 應風險需求回應（RNR）＋修復／就業。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["Merton 緊張／迷亂理論（社會結構）", "社會以財富、學歷等文化目標要求所有人，卻未平等提供合法手段。手段與目標失衡時產生迷亂（anomie），個人可能以創新（犯罪）、形式主義、退縮、反叛等適應。易混淆：它解釋的是「結構壓力」，不是「朋友教你怎麼做」（那是差別接觸）；也不是「社區失序導致監控消失」（那是社會解組）。", "文化目標；制度手段；迷亂；創新型適應", "A 接受「要賺錢、要出頭」的目標，但中輟與社區資源匱乏使合法手段（升學、穩定工作）看起來不可得，於是把車手提款當成「比較快的創新手段」。觀護處遇應開合法成功路徑：技訓、中介就業、生活津貼轉介，使「創新」不必走向詐欺。"], ["Cloward & Ohlin 差別機會理論（社會結構，可作補強）", "在 Merton 之上補一句：連違法機會都不是人人平等。少年能否加入哪種犯罪次文化（犯罪型、衝突型、退縮型），取決於社區是否存在穩定的違法結構。易混淆：不是所有貧窮少年都有「組織完善的詐欺集團」可加入。", "合法機會結構；違法機會結構；犯罪次文化", "A 並非獨自發明詐欺，而是通訊軟體與成人集團提供現成的違法機會（車手、領款點、教學）。防治要同時打斷成人端招募（成少共犯偵查）與降低少年端可被招募性（缺課預警、數位誘騙辨識）。"], ["Hirschi 社會鍵理論（社會控制）", "控制理論不問「為何犯罪」，而問「為何多數人不犯罪」。人因與社會的鍵而自我約束：依附（對父母、師長的情感）、奉獻（時間精力投注於學業／前途）、參與（結構化活動占滿時間）、信念（對規範的認同）。鍵弱則偏差門檻下降。易混淆：Gottfredson & Hirschi 的低自我控制是「穩定的個人特質＋早期教養」，本題主軸是當下四鍵斷裂，不宜整題改寫成自我控制。", "依附；奉獻；參與；信念", "A 父缺席、母工時長→依附弱；中輟→奉獻中斷；無社團或工作→參與空窗，通訊軟體填滿時間；「被抓頂多保護管束」顯示信念鍵把少年司法理解成低成本。觀護應指定可靠成人、強制就學或職訓時數、排結構化日課、對「保護管束不是沒事」做清楚的規範與後果說明。"], ["標籤理論（Lemert／Braithwaite）", "初級偏差普遍且未必穩定；一旦被正式標為「犯罪少年」，可能內化標籤、被排除於學校與勞動市場，走向次級偏差。Braithwaite 區分污名化羞恥（把人推出去）與明恥再整合（譴責行為、保留身分、提供回歸）。利雅德準則同樣警告過早司法干預與負面標籤。易混淆：標籤理論不是主張「都不要管」，而是主張干預方式會改變後續認同。", "初級／次級偏差；污名；明恥再整合；塗銷", "A 已有「反正只是保護管束」的預期；若再以「提高假釋門檻、限制前案塗銷」作為對車手少年的主要訊息，可能讓他提早接受犯罪人身分，合法工作更難找，反而延長車手生涯。較符合理論的做法是：對利用少年的成人從重量刑；對 A 用轉向、修復、完成處遇後可預期的塗銷，把羞恥放在行為而非人格。"]], "sourceReference": "民國 114 年觀護人「犯罪學」第 1 題。", "reviewStatus": "待核對", "warnings": ["原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "- 社會結構：Merton 緊張／迷亂、Cohen 地位挫折、Cloward & Ohlin 差別機會、Shaw & McKay 社會解組。本題最適配 Merton + 差別機會。\n- 社會控制：Hirschi 社會鍵（依附、奉獻、參與、信念）。Gottfredson & Hirschi 自我控制可當輔論，但主理論仍用社會鍵。\n- 標籤：Lemert 初級／次級偏差、Braithwaite 明恥再整合 vs 污名化羞恥。\n- 易混淆：差別接觸（Sutherland）是 社會過程／學習，不是社會結構。「朋友都在做」不要寫成結構理論的主軸。", "id": "md-6a781a506e0c4bf05e97-一"}, {"date": "2026-10-05", "subject": "犯罪學", "question": "17 歲少年 B 因施用三級毒品及擔任詐欺車手，經少年法院裁定保護管束。調查報告記載：首次觸法年齡 15 歲、保護事件兩次（靜態）；目前仍與車手群組聯絡、不規則用藥、晝夜顛倒未復學（動態）。矯正署近五年施用毒品罪受刑人占比由 35.1% 降至 24.8%，強調緩起訴附命戒癮與社區分流。請說明靜態與動態風險因素的內涵、差異，結合 RNR 模式說明觀護人應如何決定監督「量」與處遇「質」，並評論僅以靜態前科加嚴（例如限制塗銷）作為再犯預防主軸的限制。", "issues": "1. 靜態＝預測與分級（量）；動態＝矯治標的（質）。只寫定義、不接 RNR 會失分。\n2. Central Eight 中，犯罪史是靜態；其餘七項多為動態／可改變。\n3. 毒品分流政策要對上「成癮是動態犯罪性需求，不是只能關」。\n4. 少年腦部與同儕變化快，動態因素必須 定期再評估，不能一次打分數用三年。", "outline": "1. 定義靜態／動態與差異。\n2. 導入 RNR：風險對監督量、需求對處遇標的、回應性對方法（認知行為、年齡、成癮、識字）。\n3. 套 B：靜態決定中高風險、密集督導；動態決定斷群組、戒癮、復學。\n4. 評論：靜態不可改，加嚴塗銷不降低用藥與群組；社區戒癮完成者復發風險較未完成者低 66.3%（司法官學院研究，可當實務例，記得標來源）。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["靜態風險因素（static risk）", "歷史性、不可透過處遇改變的變項，主要服務「預測再犯機率、決定監督與資源分級」。典型項目：性別、首次觸法年齡、前科／保護事件次數、過去暴力。改變機制：它本身沒有改變機制，功能是分類。易混淆：種族、貧窮常被誤列入「可治療因素」；RNR 反對把無法改變或非犯罪性因素當處遇核心。也易與「危險性鑑定」的精神醫學概念混用——觀護要的是再犯風險，不是診斷標籤。", "不可改變；犯罪史；風險分級；預測", "B 首次觸法 15 歲、保護事件兩次，靜態上屬較早開始、已有累積紀錄，監督量應高於初犯。但不能因為「有兩次」就只加嚴，因為這兩次已無法改回。"], ["動態風險因素／犯罪性需求（dynamic / criminogenic needs）", "目前可改變、且改變後與再犯下降有關的因素。Andrews & Bonta 的 Central Eight：反社會史（偏靜態）、反社會人格模式、反社會認知、反社會同儕、家庭／婚姻、學校／工作、休閒、物質濫用。改變機制：針對需求做認知行為、技能、戒癮、家庭與就學介入，使再犯機率下降。易混淆：低自尊、憂鬱本身常是 非犯罪性需求；不處理可能影響回應性，但只做自尊團體通常不降再犯。另區分穩定動態（物質濫用模式）與急性動態（這週被車手群組催促、突然停藥）。", "可改變；Central Eight；處遇標的；再評估", "B 的可改項目是：車手群組（反社會同儕）、不規則用藥（物質濫用）、未復學（學校）、晝夜顛倒（休閒／作息）。觀護週計畫應寫成可檢查行為：封鎖群組、尿篩與醫療就診、到校時數、夜間門禁，而不是「加強品德」。"], ["RNR：風險原則（Risk）", "處遇與監督強度應與再犯風險匹配：高風險給高強度，低風險給低強度。低風險少年若與高風險混處或過度司法干預，可能不降再犯甚至升高（同儕感染、標籤）。改變機制是「劑量對了才有效」。易混淆：風險高≠必須收容；少年司法仍受 CRC 第 37 條、北京規則「最後手段」拘束，高風險優先想到的是密集社區監督與治療，而非當然入感化。", "風險匹配；劑量；避免低風險過度干預", "依靜態＋動態，B 至少中風險：保護管束應密集面談、不定期訪視、科技或家長協監。若僅月見一次，劑量不足；若直接聲請感化卻未先用盡社區戒癮與斷群組，則違反風險原則與少年最後手段。"], ["RNR：需求原則（Need）", "矯治應打在犯罪性需求上，打錯標的（只做休閒康樂、空泛自尊）與再犯下降無關。改變機制：減少動態風險＝減少再犯。易混淆：被害人修復、創傷處理很重要，但若完全不碰同儕、用藥、認知，需求原則仍未滿足；兩者應並列，不是互代。", "犯罪性需求；對症下藥；處遇質", "對 B，「質」＝戒癮醫療＋拒絕車手話術的認知演練＋復學。這與矯正署分流邏輯一致：單純施用走社區治療，不是靠關來改變成癮。"], ["RNR：回應性原則（Responsivity）", "一般回應性：認知行為、社會學習是較有效的傳遞方式。特定回應性：配合智力、年齡、性別、動機、精神症狀、文化、識字。改變機制：再好的處遇，少年聽不懂、不來、或正在戒斷不適，就進不去。易混淆：回應性不是「個案喜歡什麼就做什麼」；喜歡的活動若與犯罪性需求無關，只能當增進動機的載具。", "一般／特定回應性；CBT；個別化", "B 是 17 歲、可能成癮與作息混亂：處遇要短時間、具體作業、醫療時段避開渴癮高峰；教材用情境演練而非講授刑法。若 B 有注意力或創傷，先調整傳遞方式，否則「不配合」會被誤判成高風險。"]], "sourceReference": "民國 114 年觀護人「犯罪學」第 2 題。", "reviewStatus": "待核對", "warnings": ["原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "Andrews & Bonta《The Psychology of Criminal Conduct》；風險原則、需求原則、回應性原則；Central Eight；YLS/CMI（少年版風險需求）；靜態／動態／急性動態（acute dynamic，如近日停藥、被集團催促）。", "id": "md-6a781a506e0c4bf05e97-二"}, {"date": "2026-10-05", "subject": "犯罪學", "question": "16 歲少年 C 國中起使用新興毒品，近期為籌藥資擔任車手，無暴力前科。家中兄長亦有施用史。請以生物心理社會模式解釋 C 的藥物濫用成因；並說明觀護人如何結合青少年特性（同儕、衝動、認同）設計預防與處遇。請避免把成癮只寫成「意志薄弱」或只寫「應予監禁」。", "issues": "BPS 三層都要有機制，不能生物只寫「有成癮基因」一句。青少年特性要接到大腦發展、同儕、身分。處遇對上分流：C 符合社區戒癮＋保護管束，不是當然入監。", "outline": "1. BPS 定義（Engel 醫學模式移植到成癮）。\n2. 生物／心理／社會三層解釋 C。\n3. 青少年特性：獎賞敏感、延宕折扣、同儕讚許。\n4. 觀護策略：醫療、CBT／預防復發、家庭、斷藥友、復學；成功完成緩起訴附命戒癮者復發風險較低的實證當佐證。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["生物心理社會模式（Biopsychosocial Model）", "Engel 主張疾病不能還原為單一生物病灶，成癮同樣是生物易感性、心理歷程與社會環境交互的結果。生物層：遺傳、神經適應、青春期多巴胺系統對獎賞更敏感、執行功能未成熟。心理層：情緒調節失敗、自我療癒、效能不足、偏差認知（「控制得住」）。社會層：家庭示範、藥友、取得容易、污名與排除。改變機制是多系統同時改，單戒生理渴癮或單講道理都會復發。易混淆：不是「三項平均加總」；也不是精神醫學診斷本身。BPS 是成因架構，處遇仍要靠 RNR 選犯罪性需求。", "生物易感；心理調節；社會脈絡；交互作用", "C 有兄長施用（生物＋社會示範）、青春期、為藥資去當車手（成癮已連結犯罪機會）。觀護不能只尿篩，要同時轉介成癮醫療、處理焦慮或睡眠、調整家庭與藥友網絡。"], ["Bandura 社會學習／差別接觸（心理—社會交接）", "行為經觀察學習、增強與定義形成。Sutherland 差別接觸強調：犯罪行為是在親密團體中學會技術與「這是 OK 的」定義；接觸次數、優先性、強度、持續性決定學習效果。Bandura 再補自我效能與替代增強（看到同學沒被抓）。易混淆：社會學習不是結構理論；「兄長在用」若只寫貧窮，就寫錯層。", "觀察學習；增強；定義；自我效能", "C 很可能在家中與同儕學會怎麼取得、怎麼用、怎麼合理化。處遇要提供 替代示範（同儕志工、戒癮成功學長）與反向增強（用藥就被密集監督，戒癮就得到自由與技能），並減少高強度藥友接觸。"], ["一般化犯罪理論中的低自我控制（心理，輔論）", "Gottfredson & Hirschi 認為低自我控制（衝動、短視、刺激尋求、缺乏毅力）來自兒童早期無效教養，穩定影響偏差與類比行為（菸酒肇事、共病成癮）。改變機制在其原典偏悲觀（早期定型）；實務上仍可用結構化監督補足「當下控制」。易混淆：不能用它否定成癮的神經生物性；也不能說青少年改不了。發展犯罪學已顯示青春期後自我控制仍可提升。", "衝動；短視；早期教養；類比行為", "C 為籌藥資當車手，符合短視與刺激尋求。觀護用外在結構（門禁、到班、每次領錢需說明）暫代不足的內在控制，同時做延宕滿足訓練，而不是罵「沒志氣」。"], ["預防復發與社區戒癮處遇（方法）", "Marlatt 預防復發把復發看成高危險情境＋效能不足＋放縱效應（一次破功就全盤放棄）。社區戒癮（緩起訴附命治療、保護管束併醫療）讓少年留在真實誘因中練習拒絕，避免監所藥頭交流。改變機制：辨識誘因、拒絕技巧、緊急連絡、醫療維持。易混淆：社區治療≠除罪化；涉及暴力或合併其他重大犯罪仍可能入矯正機關。", "高危險情境；放縱效應；分流；治療完成", "C 無暴力前科、主問題是成癮與車手，適合社區醫療＋保護管束。處遇契約寫：週尿篩、門診、封鎖車手與藥友、復學。若僅強調監禁，與目前分流實證（完成治療者復發風險較低）相反，也較不符合少年拘禁最後手段。"]], "sourceReference": "民國 114 年觀護人「犯罪學」第 4 題。", "reviewStatus": "待核對", "warnings": ["原始考題出處依來源文件標示，尚未逐題核對。"], "studyNotes": "", "id": "md-6a781a506e0c4bf05e97-三"}, {"id": "2026-10-04-1", "date": "2026-10-04", "subject": "本週跨科整合複盤（融會：犯罪學、心理學、諮商與輔導、少年事件處理法、保安處分執行法、刑事訴訟法）", "question": "少年甲現年 15 歲，自幼生長於高度衝突之單親家庭，父親因案長期服刑，母親以打零工為生且患有重度憂鬱症，無力管教甲。甲自國二起頻繁逃學，與校外宮廟陣頭成員交往，受成年角頭乙之利誘吸收擔任圍事與竊盜把風，並多次在租屋處共同吸食第三級新興毒品「依託咪酯煙彈」。日前，甲與同儕因地盤糾紛，持械聚眾鬥毆將對方圍毆成傷，警方循線將甲拘捕並移送少年法院。少年法院繫屬後，分案由少年調查官調查。調查官調查發現：甲家庭經濟瀕臨崩潰、母親消極放任，甲之學校因其長期缺曠已予以中輟通報，且甲在言談間對吸毒鬥毆毫無悔意，將行為歸咎為「挺兄弟」、「賺錢幫家裡」，但內心深層對未來極度迷茫無助。試問：(一) 少年調查官依《少年事件處理法》第 19 條及第 42 條第 5 項進行調查時，應向何種適當之機關、學校或機構進行網絡徵詢？如何依《少年法院與相關機關處理少年事件聯繫辦法》提出具體適切之保護處遇建議？少年保護官於後續執行保護處分時，應如何深化跨網絡合作以防範再犯？（15 分）(二) 少年調查官與保護官在分析甲之涉案成因與擬定處遇策略時，應如何整合犯罪學理論（如生態系統理論、社會學習理論）與心理諮商處遇模式（如多系統處遇模式 MST），擬定跨系統整合處遇計畫？請以標準四欄表格具體分析說明。（10 分）", "issues": "爭點一：少事法第 19 條審前調查與第 42 條第 5 項徵詢程序\n調查官之品格、經歷、身心狀況、家庭環境調查義務；依第 42 條第 5 項徵詢社政、衛政、教育機關與心理專家意見，落實審前調查之跨專業整合。\n爭點二：聯繫辦法之具體網絡合作機制\n《少年法院與相關機關處理少年事件聯繫辦法》第 7 條（各機關協助義務）、第 27 條（協調直轄市、縣市政府共同辦理）、第 33 條及第 65 條（督促法定代理人、加強就讀學校聯繫、過渡性教育措施銜接）。\n爭點三：跨科理論模型之有機整合\n犯罪學：生態系統理論（微系統、中系統崩解）與社會學習論（差別接觸與差別增強）。\n諮商輔導：多系統處遇模式（MST）賦權家庭，連結學校與社區資源，阻斷司法機構化烙印。", "outline": "(一) 少年調查官之網絡調查、處遇建議及少年保護官之網絡深化\n少年調查官依少事法第 19 條及第 42 條第 5 項之網絡調查：\n跨網絡徵詢對象：\n社政主管機關：查訪甲家是否符合脆弱家庭條件，評估家庭經濟扶助與親職功能重建可能性。\n學校及教育主管機關：函請甲就讀國中提供學業評量、輔導紀錄，評估是否能銜接中介教育學園或過渡性教育措施。\n衛政及醫療機構：安排青少年精神專科醫院實施身心評估與新興毒品成癮鑑定。\n具體適切處遇建議之提出：\n依最後手段原則，甲雖涉暴力與吸毒，但本質源於家庭功能失調與學校排斥。調查官應建議法院裁定少事法第 42 條第 1 項第 2 款交付保護管束，並依第 42 條第 2 項第 2 款命入相當處所施以禁戒治療，併依第 84 條命母親接受親職教育輔導，避免過早動用感化教育。\n少年保護官於執行保護處分時之網絡深化（依聯繫辦法）：\n落實家庭與親職督促：依聯繫辦法第 65 條，定期訪視案家，督促母親善盡親職責任，協同社政社工導入家庭支持資源。\n強化就讀學校雙向聯繫：依聯繫辦法第 33 條及第 65 條，與學校輔導室密切配合，協助甲復學或銜接過渡性教育措施，建立缺曠課與生活常規之即時通報網絡。\n衛政戒癮門診整合：連結地方毒防中心與醫療院所，定期追蹤尿液採驗與心理諮商成效，確保醫療處遇與司法管束無縫銜接。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["布朗芬布倫納之生態系統理論（Bronfenbrenner's Ecological Systems Theory）", "該理論主張個體發展並非孤立的生理歷程，而是個體與其所處的多層次環境系統持續交互作用（PPCT 模型）的產物。系統分為五層次：(1) 微系統（Microsystem，直接面對面接觸之環境，如家庭、學校、同儕）；(2) 中系統（Mesosystem，微系統之間的相互連結，如家校溝通）；(3) 外系統（Exosystem，個體未直接參與但間接影響其生活的環境，如社區治安、父母職場環境）；(4) 巨系統（Macrosystem，文化價值、法制政策）；(5) 時間系統（Chronosystem，歷史重大轉折）。偏差行為之成因在於各系統支持功能瓦解及系統間連結斷裂。改變機制在於透過跨網絡介入修復中系統，並活化微系統正向資源。易混淆處：常被簡化為單純外在環境決定論；生態系統論核心在於「系統間之動態雙向回饋」，少年不僅被動受環境影響，其行為亦會反作用於環境。", "微系統失靈、中系統斷裂、外系統風險、生態多層次互動、跨網絡生態重構", "少年甲家庭微系統失能（單親撫養、嚴重忽略）、學校微系統排斥（中輟被標籤化），且中系統（家校聯繫）完全斷裂；外系統中社區陣頭提供偏差誘引。少年調查保護官在審前調查與處遇計畫中，不應僅單獨約談甲，而應依少事法第 42 條第 5 項啟動「生態網絡重構」：修復家庭微系統功能（親職教育與社政脆弱家庭扶助）、銜接中介教育微系統（過渡性教育學園）、阻斷外系統風險（通報警政加強巡查陣頭），從多層次環境徹底翻轉其偏差生態。"], ["阿克爾之社會學習理論（Akers' Social Learning Theory, SLT）", "結合薩瑟蘭（Sutherland）之差別接觸理論與行為心理學操作制約，發展出具體可操作之犯罪學習模型。核心主張：偏差行為之習得與維持取決於四大核心機制：(1) 差別接觸（Differential Association，與提供偏差行為示範與價值觀之團體親密互動）；(2) 態度定義（Definitions，個案內在對特定行為之評價，包含有利或不利於守法之態度與合理化藉口）；(3) 差別增強（Differential Reinforcement，預期或實際獲得之獎賞大於懲罰，包含實質金錢、同儕認同與生理快感）；(4) 模仿（Imitation，觀察他人示範行為並在特定情境下複製）。改變機制在於透過調整增強結構（消除偏差行為之獎賞，增加其代價）並導入正向楷模，重新塑造個案之態度定義。易混淆處：常與班度拉的社會學習論混淆；Akers 的社會學習理論特別強調「差別增強（操作制約中增強物與懲罰物之平衡計算）」對偏差行為長期維持的決定性作用。", "差別接觸、態度定義、差別增強、行為模仿、操作制約", "甲在陣頭中結識吸毒與涉案同儕（差別接觸），同儕灌輸「吸睡眠煙彈很潮、大家都在抽」之態度定義；甲初次嘗試獲得生理放鬆與同儕高度接納（正向增強），且未立即遭受法律懲罰（負向增強），強化了後續的吸毒與暴力行為。保護官於保護管束執行時，必須阻斷此增強循環：透過定期尿液採驗與法律告誡增加違法代價（正向懲罰），安排甲參與正向技能團體並由模範志工陪伴，以正向合法成就取代毒品快感，建立守法之差別增強機制。"], ["亨格勒之多系統處遇模式（Henggeler's Multisystemic Therapy, MST）", "專門針對高風險、多次涉法且面臨機構收容之青少年發展之實證密集家庭社區處遇模式。植基於社會生態學與結構家庭治療，核心主張：青少年的嚴重犯罪與物質濫用是由其所處之多重生態系統（個人、家庭、同儕、學校、社區）共同驅動的。MST 的九大核心原則強調：以家庭為中心、將處遇焦點放在改善生活脈絡之具體問題、強調家庭成員之力量與優勢、提升日常責任承擔、並透過跨體系 24 小時即時支援維持改變。改變機制在於賦權（Empower）主要照顧者，提升家長之監管、管教與溝通技能，使家庭具備自主解決少年問題之長期能力。易混淆處：MST 並非由專業人員「替代」父母管教，而是「賦權並教導父母成為首要改變推動者」，專業人員扮演教練與生態協調者角色。", "多系統處遇、賦權家庭、生態脈絡介入、以家庭為核心、跨網絡即時支援", "甲多次涉案且家庭管教完全失靈，依傳統觀點極易被直接裁定送入感化教育。若依 MST 理念與少事法第 42 條第 5 項之跨網絡協同：保護官應協調社政家防中心與專業社工團隊進駐甲之家庭，不單向指責母親，而是賦權母親建立具體之居家生活規範（如門禁管理、金錢使用監督）；同時保護官主導聯繫學校輔導室，建立即時缺曠課通報網絡，形成無縫家庭社區防護網，使甲得以在原生社區中完成矯治，避免機構化監禁之標籤創傷。"]], "sourceReference": "112 年公務人員特種考試司法人員三等考試觀護人類科（選試少年事件處理法）「少年事件處理法」第 4 題", "reviewStatus": "待核對"}, {"id": "2026-10-03-1", "date": "2026-10-03", "subject": "刑事訴訟法（週六固定輪替）", "question": "少年甲現年 17 歲，受成年黑幫成員乙之金錢利誘與唆使，加入電信詐欺集團擔任提款車手。甲於民國 114 年 1 月間，依乙之指示，持被害人 A 遭詐騙之提款卡，在新北市某 ATM 接續提領贓款新臺幣（下同）10 萬元交予乙。案經警方查獲甲，少年法院依《少年事件處理法》第 27 條第 1 項規定，裁定將甲移送檢察官偵查起訴。檢察官偵查終結後，僅就甲於「1 月間提領 10 萬元」之加重詐欺犯行向地方法院刑事庭提起公訴。於第一審法院審理中，檢察官另行查獲乙涉有共同詐欺罪嫌，遂於辯論終結前，向法院「追加起訴」乙共同加重詐欺罪嫌；同時，檢察官發現甲於同年 2 月間，亦曾依乙指示在臺北市某 ATM 提領 5 萬元贓款，乃於審理期日具狀請求法院併予審判甲於 2 月間之提款犯行。第一審法院合議庭審理結果，認定：甲 1 月間提款 10 萬元部分事證明確，應成立加重詐欺罪；甲 2 月間提款 5 萬元部分，因該提款卡係甲自己帳戶且款項來源無法證明為詐騙所得，應屬不能證明犯罪；成年被告乙部分，因卷內除甲片面供述外無其他補強證據，其犯罪不能證明。試問：(一) 檢察官對乙追加起訴及請求併辦甲 2 月犯行之程序是否合法？第一審法院合議庭對於甲及乙應如何諭知判決主文與說明理由？（請依《刑事訴訟法》規定及實務見解作答）（15 分）(二) 少年調查保護官受刑事法庭囑託為甲進行量刑前調查時，應如何運用犯罪學與心理學理論（如差別接觸理論、中和技術、自我效能理論），評估甲受成年共犯影響之心理機制，並向法院提出適當之處遇建議？請以標準四欄表格具體分析說明。（10 分）", "issues": "爭點一：追加起訴（刑事訴訟法第 265 條）之合法性\n追加起訴須於第一審辯論終結前，針對與原起訴案件相牽連之犯罪或共同被告提起。乙與甲為加重詐欺之相牽連犯罪案件（一人犯數罪或數人共犯一罪），追加起訴程序合法。\n爭點二：公訴不可分原則（刑事訴訟法第 267 條）與接續犯之判斷\n甲 1 月與 2 月提款行為，時間相隔一個月且犯罪地點、被害人均不相同，非於密切接近之時地為之，在法律評價上難認屬「接續犯（實質上一罪）」，而屬獨立之數罪。\n檢察官就 2 月犯行僅為「移送併辦／請求併辦」，並非正式起訴；因與 1 月犯行不具實質上一罪或裁判上一罪之同一案件關係，公訴不可分之效力不及於 2 月犯行。\n爭點三：判決主文之諭知架構\n甲部分：1 月犯行判處有期徒刑（有罪）；2 月犯行因未受起訴且非起訴效力所及，法院無從審判，應退還檢察官另行處理，不得於主文為無罪之諭知，亦非「不另為無罪之諭知」。\n乙部分：追加起訴之案件係獨立之新訴，法院審判結果認乙犯罪不能證明，應於主文諭知「乙無罪」。", "outline": "(一) 檢察官程序合法性及法院判決主文之諭知\n檢察官程序之合法性檢視：\n追加起訴乙部分合法：依《刑事訴訟法》第 265 條第 1 項規定，於第一審辯論終結前，得就與本案相牽連之犯罪或同時得提起之他罪，追加起訴。乙與甲為共犯關係，屬第 7 條第 2 款之相牽連案件，檢察官於辯論終結前追加起訴，程序合法。\n請求併辦甲 2 月犯行部分未生起訴效力：甲 1 月與 2 月之提款行為，時隔月餘且侵害不同法益，在客觀上難認係基於單一犯意接續為之之接續犯，應屬數罪併罰之獨立行為。檢察官僅請求併予審判，因不合致第 267 條公訴不可分之「同一案件」，法院無從併予實體審判。\n第一審法院判決主文之諭知方式：\n甲之部分：\n就起訴之 1 月加重詐欺犯行，事證明確，應於主文諭知甲有罪（宣告刑罰，並得審酌宣告緩刑併付保護管束）。\n就請求併辦之 2 月提款犯行，因非起訴效力所及，基於不告不理原則（刑事訴訟法第 268 條），法院不得裁判，應於判決理由欄中敘明兩者非實質上一罪，該併辦部分無從審理，退由檢察官另為適法處理，主文欄「不得另為無罪之諭知」，亦「不得為不另為無罪之諭知」。\n乙之部分：\n檢察官追加起訴乙之部分已發生繫屬訴訟關係，法院審理後認事證不足，應依《刑事訴訟法》第 301 條第 1 項規定，於主文正式諭知「乙無罪」。\n(二)", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["薩瑟蘭之差別接觸理論（Sutherland's Differential Association Theory, DAT）", "Edwin Sutherland 主張，犯罪行為不是天生生理缺陷或性格異常，而是在親密人際團體之互動溝通過程中「學習（Learned）」而來的。學習內容包含兩大層面：(1) 犯罪之具體技巧（如操作提款機、逃避警方監視）；(2) 動機、驅力、合理化藉口與「有利於違法之態度定義（Definitions Favorable to Law Violation）」。核心改變原則：當個體接觸有利於違法之定義超過不利於違法之定義時，即會產生犯罪。差別接觸之影響力取決於接觸之「頻率（Frequency）、持久性（Duration）、優先性（Priority）與強度（Intensity）」。易混淆處：常與「社會控制理論」混淆；社會控制論主張「人不犯罪是因為社會鍵拘束，不需學習犯罪動機」，差別接觸理論則強調「犯罪動機、藉口與價值觀必須透過親密團體積極學習傳遞」。", "犯罪學習、親密團體互動、有利違法之定義超過不利定義、頻率/持久性/優先性/強度", "少年甲被成年主謀乙吸收，乙在租屋處為甲提供食宿、給予零用錢，並向甲灌輸「這只是幫忙提款跑腿，賺錢快又沒有傷害任何人，警察抓不到未成年人」等強烈有利於違法的態度定義。甲在與乙高頻率、高強度的同儕互動中，迅速學習車手提款技巧並內化合理化藉口。少年保護官於處遇中，必須「切斷其與犯罪網絡之差別接觸」，透過強制遠離不良社交圈、轉換生活環境，並導入正向楷模（如志工導師、合法實習雇主），重新建立有利於守法的認知定義。"], ["賽克斯與馬薩之中和技術理論（Sykes & Matza's Techniques of Neutralization）", "Gresham Sykes 與 David Matza 提出漂移理論（Drift Theory），主張大多數青少年並非全盤認同犯罪次文化，而是常在主流道德規範與違法行為之間「漂移（Drift）」。個案在從事違法行為前，會運用「中和技術（Techniques of Neutralization）」暫時中斷內在的道德束縛與罪惡感，使偏差行為合理化。五大中和技術包括：(1) 責任之否定（Denial of Responsibility，如「我被成年人逼的、身不由己」）；(2) 損害之否定（Denial of Injury，如「被害人很有錢，這點錢對他們沒差」）；(3) 被害人之否定（Denial of the Victim，如「對方貪心被騙是自找的」）；(4) 責備責備者（Condemnation of the Condemners，如「警察自己也很黑」）；(5) 效忠更高權威（Appeal to Higher Loyalties，如「我是為了挺兄弟才幫忙」）。易混淆處：常與認知失調的事後合理化混淆；中和技術強調是在「行為發生前或當下」先行運作的認知防衛盾牌，使得個案能夠在保留主流道德認同的同時進行犯罪。", "漂移理論、中和技術、責任否定、損害否定、暫時解除道德拘束", "甲在審理中向法官及保護官辯稱：「我只是依指示在 ATM 領錢，錢本來就在裡面，主謀是乙，我只是打工聽命行事，這不叫騙人」，明顯運用了「責任之否定」與「損害之否定」。觀護人於審前調查及輔導晤談時，應精準辨識甲的中和技術，並運用蘇格拉底式提問逐步拆解其防衛盾牌：「當你把被害人一生的積蓄提走時，對方家庭面臨醫療費無著、甚至絕望輕生的痛苦，這真的是沒有傷害嗎？」引導甲直面被害人的真實損害，打破其將自己視為純粹被動受害者的認知迷思。"], ["班度拉自我效能理論與抗拒誘惑重構（Bandura's Self-Efficacy Theory & Refusal Skills）", "Albert Bandura 提出自我效能（Self-Efficacy），指個人對自己在特定情境下能否成功執行特定行為以達成目標之內在信念。低自我效能的青少年面對強勢成年犯罪組織之利誘或威逼時，往往深感無力拒絕（拒絕自我效能低下），進而選擇盲從屈服。自我效能的建立源自四大途徑：(1) 親身成功掌握經驗（Mastery Experiences）；(2) 替代性楷模經驗（Vicarious Experiences）；(3) 社會說服與支持（Social Persuasion）；(4) 生理與情緒狀態調節。改變機制在於透過具體的「斷絕與拒絕技巧演練（Refusal Skills Training）」與成功經驗累積，提升個案在誘惑情境下的自主抵抗信念。易混淆處：自我效能並非抽象的「自信心（Self-Esteem）」，而是針對「具體特定任務（如拒絕黑幫招募、堅持合法工作）」之勝任感評估。", "自我效能、親身成功經驗、拒絕技巧演練、社會說服、情境抗拒能力", "甲因長期學業挫折與單親經濟困頓，對合法自立缺乏信心，面對黑幫大哥乙的高額金錢利誘與同儕邀約時，完全喪失抗拒能力。保護官在擬定保護處遇時，應設計具體的「情境角色扮演（Role-Playing）」：模擬若再次接到昔日詐騙同儕邀約時，如何運用「跳針法、藉故離開、尋求支援」等具體拒絕話術；同時結合青少年培力計畫，協助甲在烘焙或水電技能培訓中累積親身成功經驗，提升其依靠合法勞動自立的自我效能感，徹底根除再次受成年共犯工具化之風險。"]], "sourceReference": "110 年公務人員特種考試司法人員三等考試觀護人類科「刑事訴訟法與保安處分執行法」第 1 題", "reviewStatus": "待核對"}, {"id": "2026-10-02-1", "date": "2026-10-02", "subject": "保安處分執行法（週五固定輪替）", "question": "甲現年 20 歲，於 17 歲時因涉犯加重強制性交罪，經少年法院移送檢察官起訴，判處有期徒刑 4 年確定入監服刑。甲於服刑期間表現平平，刑期屆滿前 6 個月獲准假釋出監，假釋期間交付保護管束。檢察官依《保安處分執行法》及《性侵害犯罪防治法》第 34 條第 1 項規定，命甲應按期向觀護人報到、接受身心治療及輔導教育，並施以夜間宵禁及配戴科技設備監控（電子腳鐐）。於假釋保護管束執行期間，甲對電子腳鐐產生極大排斥，自認已接受刑罰懲罰，司法不應將其「當成野獸全天候監控」。甲先後多次蓄意不替監控設備充電導致訊號中斷離線逾 2 小時，且違反宵禁規定於深夜徘徊於校園周邊，復無正當理由連續三次缺席社區身心治療課程。觀護人實施告誡後，甲仍拒不悔改，日前更被監控中心偵測到蓄意剪斷電子腳環破壞設備，行蹤不明。試問：(一) 甲蓄意破壞監控設備、違反宵禁並拒絕接受身心治療，觀護人及執行機關依《保安處分執行法》與《性侵害犯罪防治法》得採取何種強制處置？若欲撤銷其假釋與保護管束，其法定程序與法律效果各為何？（15 分）(二) 若甲經緝獲後，經身心評估小組鑑定認其再犯危險並未顯著降低，檢察官擬依《刑法》第 91 條之 1 向法院聲請令入相當處所施以強制治療。依司法院釋字第 799 號解釋意旨，法院審理該聲請時應踐行何種正當法律程序？觀護人在處遇介入時，得運用何種矯治心理學或犯罪學理論（如良好生活模式 GLM、性犯罪復發預防模式）擬定輔導策略？請以標準四欄表格具體分析說明。（10 分）", "issues": "爭點一：性侵害保護管束特別遵守事項與破壞設備之強制處置\n《性侵害犯罪防治法》第 34 條第 1 項第 5 款（宵禁）、第 7 款（科技設備監控）、第 3 款（身心治療）。\n強制處置：依同法第 35 條第 2 項，故意拆除或損壞設備者，檢察署得通報警察機關「強制其到場回復設備正常運作」；另涉《刑法》第 138 條毀損公務員職務上掌管物品罪。\n爭點二：撤銷保護管束與撤銷假釋之法定程序及法律效果\n違反遵守事項情節重大，觀護人報請檢察官聲請法院裁定撤銷保護管束（保安處分執行法第 74 條之 3 第 2 項、刑事訴訟法第 481 條）；並報請法務部撤銷假釋（刑法第 78 條之 1）。法律效果為收監執行未執行完畢之殘餘刑期。\n爭點三：釋字第 799 號解釋之正當法律程序要求\n強制治療之宣告與停止，法院應賦予受治療者親自或委任辯護人到庭陳述意見權；心智缺陷無法完全陳述者應有強制辯護；給予專家證人陳述機會；落實定期司法審查避免變相無限期監禁。", "outline": "(一) 強制處置、撤銷保護管束與撤銷假釋之程序及法律效果\n觀護人及執行機關得採取之法定強制處置：\n通報警察機關強制到場：依《性侵害犯罪防治法》第 35 條第 2 項規定，受保護管束人故意拆除、損壞科技設備監控設備者，檢察署得通報警察機關強制其到場，回復設備之正常運作。\n追究刑事毀損責任：甲蓄意剪斷電子腳鐐，涉犯《刑法》第 138 條毀棄、損壞公務員職務上掌管物品罪，得移送司法警察機關偵辦。\n撤銷保護管束與撤銷假釋之程序及法律效果：\n實體要件：甲破壞監控設備、逃避宵禁、拒絕身心治療並行蹤不明，違反《保安處分執行法》第 74 條之 2 及《性侵害犯罪防治法》第 34 條之遵守事項，已達「情節重大」之程度。\n法定程序：\n觀護人檢具違規事證，報請地檢署執行檢察官，由檢察官依《刑事訴訟法》第 481 條第 1 項向管轄法院聲請裁定撤銷保護管束（保安處分執行法第 74 條之 3 第 2 項）。\n同時，檢察官得檢具事證報請法務部撤銷其假釋（刑法第 78 條之 1）。\n法律效果：撤銷假釋後，甲之假釋失其效力，依《刑法》第 79 條第 1 項規定，甲應重行收監執行其假釋前尚未服滿之殘餘徒刑。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["良好生活模式（Good Lives Model, GLM, Ward & Stewart）", "Tony Ward 等人提出之優勢取向（Strengths-based）矯治模式，作為傳統 RNR（風險-需求-反應）模式之革新。核心主張：所有人類（包括性侵害與暴力犯罪者）終其一生都在追求共通的「根本核心生活目標（Primary Human Goods）」，如生命健康、人際親密、知識學習、自主卓越、內心平靜與社群歸屬。偏差與性犯罪並非個案天生邪惡，而是個案在欠缺合法技能、資源或扭曲認知下，採取了不適當、破壞性或侵害他人的方式來滿足這些內在核心需求。改變機制在於透過個別化「良好生活計畫（Good Lives Plan）」，協助個案識別其重視之核心善品，並學習以合法、負責任且具同理心之途徑去實現，從而由根本消除再犯動機。易混淆處：常被誤解為「忽視犯罪風險或過度理想化」；GLM 絕非拋棄風險管理，而是主張「唯有賦予個案對有價值生活的希望與實質能力，嚴格的風險監控與法律處分才能發揮真正的矯治效果」。", "良好生活模式、根本核心善品、優勢取向、合法需求滿足、自主與親密", "少年甲在性侵害案件假釋交付保護管束期間，對宵禁與科技設備監控充滿敵意，認為自己被當成怪物監視，多次拔除電源企圖逃避。觀護人若僅以撤銷假釋威脅，只會強化其對立抗拒。運用 GLM 模式：觀護人應深入晤談甲內在渴望獲得之「社群歸屬」與「自尊認同」，指出其過去之偏差行為係扭曲了親密關係之追求；協助甲重新規劃退伍或就業職涯目標，引導其體會「遵守科技監控與完成身心輔導，是合法獲得社會尊重與重建人生的必經階梯」，激發其由被動受控轉為主動配合。"], ["認知行為治療取向之性偏差復發預防模式（CBT Relapse Prevention, Laws）", "將認知行為治療與成癮復發預防技術應用於性犯罪加害人處遇。核心主張：性偏差行為並非突發之意外，而是存在一條可被識別與阻斷的「性犯罪前置循環鏈（Offense Cycle）」，包含：潛在脆弱性（孤立、低自尊）→ 表面無關之決定（Apparently Irrelevant Decisions, AIDs，如刻意路過案發地、瀏覽刺激影像）→ 高風險情境（夜間獨處、飲酒、情緒低落）→ 認知扭曲與合理化（「對方也想要」、「看一下沒關係」）→ 性幻想強化 → 犯罪著手。改變機制在於透過建立「犯罪循環地圖」，訓練個案辨識自身之早期警訊，學會運用認知中斷法、行為替代策略及求助網絡，阻斷循環向前推進。易混淆處：性犯罪復發預防不同於一般物質成癮；其涉及深層之性偏好與性認知扭曲（如性別刻板、被害人責備），必須配合測謊與行為監控進行嚴格之真實性檢驗。", "性犯罪前置循環、表面無關之決定、高風險情境、認知扭曲辨識、復發預防地圖", "甲夜間多次無故離家並進入校園周邊（表面無關之決定），觸發科技監控圍籬告警。保護官於個別輔導中，應引導甲逐一拆解其「犯行循環圖」：檢視其在情緒低落或孤獨時，如何藉由夜遊尋求刺激，並在腦海中產生認知扭曲；協助甲標記高風險時段與地點，制定「應急安全卡（Safety Card）」，要求甲在衝動萌生時立即執行替代行為（如撥打保護官或心理師緊急諮詢專線、從事劇烈體育活動），有效阻斷偏差循環。"], ["系統性多網絡合作處遇模式（Multi-Agency Public Protection Arrangements, MAPPA）", "源自英國之公共安全跨機構防護網絡模式，專門針對高風險性侵害與重大暴力受保護管束人。核心主張：單一司法或行政機關（如僅靠觀護人或單一警察）無法有效控管高風險再犯，必須整合「司法觀護（法律監督與告誡）」、「警察機關（科技監控查訪、防逃與強制到場）」、「衛生醫療主管機關（臨床身心治療與評估）」及「社政教育網絡（就業與家庭支持）」，形成 24 小時無縫之「整合風險管理網絡」。改變與監控機制在於定期召開跨機構個案協調會議，即時共享告警情資與治療進度，兼顧動態風險評估與支持性處遇。易混淆處：MAPPA 並非各自為政之公文往返，而是「權責分明、即時聯防」之作戰網絡；科技監控僅為工具，真正的核心是各網絡人員對風險信號之迅速回應能力。", "跨機構防護、即時情資共享、動態風險管理、司法警察聯防、處遇與監控並行", "甲出現破壞電子腳鐐、深夜不歸及拒絕到身心治療診所之重大違規情事。觀護人應立即啟動跨網絡合作：第一時間通報科技設備監控中心與轄區分局偵查隊，由警察機關依性侵害犯罪防治法第 35 條強制甲到場回復設備功能；同時召集衛生局心理衛生中心治療師召開個案研討會，評估其再犯危險性是否顯著升高，若經評估認有再犯之高度危險，由觀護人彙整跨網絡報告報請檢察官向法院聲請裁定令入相當處所施以強制治療（刑法第 91 條之 1），確保社區安全與司法正義。"]], "sourceReference": "112 年公務人員特種考試司法人員三等考試觀護人類科「刑事訴訟法與保安處分執行法」第 4 題", "reviewStatus": "待核對"}, {"id": "2026-10-01-1", "date": "2026-10-01", "subject": "少年事件處理法（週四固定輪替）", "question": "少年甲現年 15 歲，就讀國中三年級。甲自幼父母離異，由罹患重度糖尿病之母親單親撫養，因家庭缺乏管管，甲經常逃學並流連宮廟陣頭。某日，甲受校外成年藥頭乙之利誘與同儕唆使，在乙租屋處以電子煙吸食第三級新興管制藥品「依託咪酯（俗稱睡眠煙彈）」一次，並收受乙交付之依託咪酯煙彈 2 顆（驗餘淨重共 3.2 公克，未達刑事處罰標準之純質淨重 5 公克）藏於身上，準備返校販售牟利但尚未售出。翌日傍晚，警員巡邏時見甲於超商前神情恍惚、步履蹣跚，上前盤查當場扣得該 2 顆煙彈，經警依規定採集甲之尿液送驗，呈現依託咪酯代謝陽性反應。警方隨後依規定通知少年住所地之「少年輔導委員會（少輔會）」處理。少輔會開案進行行政輔導先行期間，甲數次拒絕社工訪視，並離家出走不知去向，其母亦表明無力約束，少輔會評估甲之家庭功能完全癱瘓且輔導顯難達成目的，遂依少事法規定請求管轄少年法院處理。試問：(一) 甲先後吸食及持有依託咪酯煙彈之行為，依現行《少年事件處理法》應如何定性？司法警察機關查獲時，依現行法制應遵循何種程序處理？少輔會於何種法定事由下得請求少年法院處理？（15 分）(二) 少年法院受理後，少年調查官依《少年事件處理法》第 19 條進行調查並擬定處遇建議時，應如何運用犯罪學與諮商輔導理論（如跨理論模式 TTM、自我控制理論、生態系統理論），擬定兼顧醫療戒癮與家庭重構之保護管束處遇計畫？請以標準四欄表格具體分析說明。（10 分）", "issues": "爭點一：少年涉入第三級毒品之行為定性（觸法 vs. 曝險）\n施用第三級毒品：《毒品危害防制條例》第 10 條僅處罰施用第一級、第二級毒品，施用第三級毒品僅處行政罰鍰與講習，非觸犯刑罰法律。故符合《少年事件處理法》第 3 條第 1 項第 2 款第 3 目「有施用毒品或迷幻物品之行為而尚未觸犯刑罰法律」之曝險少年。\n持有第三級毒品之數量判斷：純質淨重未達 5 公克者（本案淨重 3.2 公克），依《毒品危害防制條例》第 11 條第 5 項反面解釋，非屬刑事處罰範疇，亦屬曝險行為。\n爭點二：行政輔導先行程序與請求少年法院處理之要件\n依《少年事件處理法》第 18 條第 2 項至第 7 項，司法警察知有曝險少年，應通知少輔會處理（行政輔導先行）。\n依同法第 18 條第 6 項，少輔會輔導時，認有下列情形之一者，得請求少年法院處理：(1) 少年有觸犯刑罰法律之行為；(2) 曝險事由非尋求司法資源難以健全自我成長；(3) 少年或其法定代理人拒絕接受輔導，經協調無效；(4) 其他輔導顯難達成目的之情形。本案甲拒絕訪視且逃家失聯，符合第 6 項請求法院處理之法定要件。\n爭點三：少事法第 19 條、第 42 條保護管束與跨網絡整合處遇\n調查官之社會調查（身心狀況、家庭環境）與第 42 條第 1 項第 2 款保護管束併命入相當處所施以戒癮治療（第 42 條第 2 項第 2 款）。", "outline": "(一) 甲之行為定性、司法警察處理程序及少輔會請求法院要件\n甲之行為定性：屬少事法第 3 條第 1 項第 2 款第 3 目之「曝險少年」：\n依《毒品危害防制條例》規定，施用及持有未達純質淨重 5 公克之第三級毒品，均僅屬行政處罰而未觸犯刑罰法律。\n甲年滿 12 歲未滿 18 歲，其施用並持有依託咪酯之行為，合致《少年事件處理法》第 3 條第 1 項第 2 款第 3 目規定之曝險行為，且有保障其健全自我成長之必要，定性為「曝險少年」。\n司法警察機關之處理程序：\n落實行政輔導先行：依少事法第 18 條第 2 項規定，司法警察於執行職務知有曝險少年時，除符合同條第 7 項前段（因身分不明或其他事由難以通知少輔會，得逕行移送少年法院）之例外情事外，原則上應通知少年住所、居所或所在地之少輔會處理。\n採集尿液與扣押物之移轉：依少事法第 18 條第 4 項，司法警察機關採集之尿液檢驗報告及查扣之第三級毒品煙彈，應造冊隨同相關調查資料函送少輔會併案處理；若日後案件移送少年法院，則移交法院依法沒收或銷燬。\n少輔會請求少年法院處理之法定事由：\n依少事法第 18 條第 6 項第 3 款及第 4 款規定，少輔會於輔導中，若少年或其法定代理人拒絕接受輔導經協調無效，或有行蹤不明等輔導顯難達成目的之情形者，得報請少年法院處理。本案甲多次拒絕訪視、逃家失聯且母親無力管教，符合法定請求要件。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["跨理論模式（Transtheoretical Model, TTM / 改變階段模式, Prochaska & DiClemente）", "該模型主張個體的行為改變非單一瞬間事件，而是歷經五大階段的螺旋動態歷程：(1) 懵懂期（Precontemplation，無改變意圖、合理化吸毒）；(2) 沉思期（Contemplation，意識到問題但處於矛盾）；(3) 準備期（Preparation，擬定具體改變計畫）；(4) 行動期（Action，具體落實戒除行為）；(5) 維持期（Maintenance，預防復發並鞏固新習慣）。改變機制在於依據個案所處之特定階段，提供相應的「改變歷程技術」（如對懵懂期著重意識覺醒，對沉思期著重自我再評價，對行動期著重刺激控制與替代行為）。易混淆處：常被誤認為直線前進模式；實務上個案極常在維持期或行動期「復發（Relapse）」，復發非治療失敗，而是螺旋式重新進入沉思或準備期的學習契機。", "改變階段、懵懂期、沉思期、意識覺醒、自我再評價、復發螺旋", "少年甲起初堅稱「依託咪酯只是提神電子煙、大家都在抽」，拒絕配合少輔會訪視，明顯處於「懵懂期」。保護官在少年法院調查與保護處遇時，不可直接強壓其進入行動期戒癮，而應先透過「意識覺醒（Consciousness Raising）」與「環境再評價」，讓甲觀看依託咪酯造成呼吸抑制、急性致死之醫學個案，並引導其看見家庭照護崩解之現實，促使其由懵懂期跨入「沉思期」，再逐步引導至戒癮治療門診。"], ["赫胥與高福森之自我控制理論（Gottfredson & Hirschi's General Theory of Crime）", "主張犯罪與各類偏差行為之單一核心成因為「低自我控制（Low Self-Control）」。低自我控制者具備六大特質：追求立即滿足、冒險衝動、重視肢體而非認知活動、自我中心、缺乏挫折容忍度、短視近利。該特質係源自童年早期（約 8-10 歲前）主要照顧者未能「監督行為、辨識偏差並及時施予導正矯正」。低自我控制者在面臨犯罪機會（Opportunity）時，極易選擇低風險、高刺激之違法手段以滿足本能。易混淆處：常與「社會控制論」混淆；社會控制論著重青少年「與外在社會鍵的連結程度（依附、致力、參與、信念）」，自我控制論則強調「個體內在衝動抑制特徵的內化與穩定性」。", "低自我控制、追求立即滿足、衝動性、親職教養失靈、犯罪機會", "甲自幼父母離異，缺乏有效之親職監管與規範引導，形成高度追求即時刺激、無法忍受挫折之低自我控制特質。在校外同儕提供免費煙彈與高報酬「跑腿送貨」之犯罪機會誘惑下，甲未能預估長遠法律與身體後果即輕易淪陷。保護官在擬定保護處遇時，除限制其出入聲色場所、阻斷犯罪機會（情境犯罪預防）外，更應設計結構化之自我監控（Self-Monitoring）目標卡，訓練其延宕滿足與衝動抑制能力。"], ["家庭系統理論與生態系統取向處遇（Bowen Family Systems & Ecological Systems Theory）", "布朗芬布倫納（Bronfenbrenner）之生態系統理論強調個體發展深受微系統（家庭、學校）、中系統（家校聯繫）、外系統（父母工作環境、社區治安）及巨系統（文化法規）之互動影響。鮑溫（Bowen）家庭系統論則指出，青少年的脫序行為往往是家庭微系統功能失調（如親職化兒童 Parentified Child、代際界限模糊、未解焦慮傳遞）的表徵。改變機制在於透過跨系統網絡整合，重構家庭功能並連結外部社會資源。易混淆處：生態系統取向絕非單純「向外找資源補助」，而是「評估各系統間之互動斷裂點並修復結構」，將焦點由責備個別少年轉向改變其所處之支持生態。", "微系統失靈、生態網絡整合、家庭系統重構、跨體系資源串聯、多系統處遇", "甲之涉法不僅是個人問題，而是家庭微系統（父親缺席、單親失能）、學校微系統（中輟拒學）及外系統（社區宮廟陣頭誘引）共同交互作用的結果。少年保護官於少事法第 42 條處遇中，應啟動「跨網絡整合會議」：結合社政脆弱家庭扶助修復家庭經濟，協調教育單位提供中介教育復學安置，並會同衛生局毒防中心施以精神醫療戒癮，從根本翻轉其不利之成長生態。"]], "sourceReference": "112 年公務人員特種考試司法人員三等考試觀護人類科（選試少年事件處理法）「少年事件處理法」第 2 題", "reviewStatus": "待核對"}, {"id": "2026-09-30-1", "date": "2026-09-30", "subject": "諮商與輔導", "question": "少年甲現年 16 歲，就讀高中二年級。甲因不滿同班前女友乙提出分手，遂將交往期間拍攝之乙之私密身體照片上傳至私密通訊軟體群組供友人觀看，並附上侮辱性文字，導致該照片在校園內廣為流傳，乙因而產生重度憂鬱並休學。案經乙之家屬提告，少年法院審理後，依《少年事件處理法》第 42 條第 1 項第 2 款裁定甲交付保護管束，並命其定期向觀護人報到及接受認知輔導與心理諮商。於第一次保護管束輔導晤談時，甲由母親陪同到場，甲雙手抱胸、眼神迴避且全程緘默。當觀護人探詢事件始末時，甲憤怒表示：「這只是我和乙私下鬧著玩，而且照片大家都看過了有什麼大不了？我是被法官逼來的，我根本沒有病，為什麼要被當成罪犯看心理諮商？你現在跟我講話，是不是轉頭就會全部寫成報告交給法官告發我？」\n\n試問：(一) 面對少年甲此類「非自願案主（Involuntary Client）」，觀護人在諮商輔導倫理上會面臨何種「知情同意」、「保密原則與限制」及「雙重角色」之衝突與挑戰？觀護人應如何合法且合乎倫理地向甲予以澄清與因應？（15 分）(二) 針對甲之強烈防衛、缺乏同理心與抗拒心態，觀護人得運用何種諮商與心理治療理論（如動機晤談法、焦點解決短期治療、修復式同理心諮商）以突破其心防、喚起改變動機並修復人際傷害？請以標準四欄表格具體分析說明。（10 分）", "issues": "爭點一：非自願案主之知情同意（Informed Consent）與保密限制澄清\n非自願案主欠缺求助動機，知情同意須明確告知「輔導之強制性、法定目的、流程、權利義務及評估報告之後果」。\n保密界限之劃定：非完全絕對保密，亦非毫無隱私。觀護人應依法律與倫理明確劃分「司法監督之事實報告（如按時出庭報到、是否再犯或違法毒品）」與「諮商核心心靈歷程之專業保密」，並說明保密例外（自傷、傷人、兒少保護重大通報）。\n爭點二：雙重關係（Dual Relationship）之倫理平衡\n觀護人兼具「司法官署監督者（執法監督權）」與「助人輔導者（治療同盟建立）」雙重身分。因應之道在於「透明化界限（Transparent Boundaries）」與「真誠一致」。\n爭點三：抗拒是關係未調諧之訊號與改變歷程之常態\n運用動機晤談（MI）避免改正反射（Righting Reflex），以 SFBT 尋找其正向資源，並透過修復式司法喚醒對被害人創傷之真實同理。", "outline": "(一) 非自願案主之倫理衝突檢討與觀護人因應之道\n倫理衝突與實務挑戰剖析：\n知情同意的實質受限：甲係依法院強制裁判前來，缺乏自主求助意志，極易將諮商視為懲罰性審訊。\n保密原則與司法監督義務的張力：少年擔心所言遭轉呈法官而加重處分；若無保密則無信任，但觀護人依法又負有向法院陳報保護管束執行狀況之法定義務。\n雙重角色的內在衝突：觀護人既代表國家行使公權力監督，又須扮演同理接納之專業助人者，易引發個案之敵意投射。\n觀護人合乎法規與倫理之因應處置：\n落實透明化之知情同意結構：在晤談初次階段，明確以白話向甲說明輔導之法律性質、權益保障、會談頻率及目標，給予甲在規範內之自主選擇權。\n明確劃定「保密界限與例外」之紅線：公開澄清「保護管束報告只記載少年的出缺席、配合度與行為改變進展，個人的隱私情感與脆弱心事受到嚴格專業保密」；但亦清楚預告法定保密例外（自傷、傷人、現行重大不法），建立清晰安全的專業界限。\n整合雙重角色為「具支持性的權威（Authoritative Caring）」：展現「溫和而堅定」之態度，表明「我的職責是監督法院命令，但我在此的目的是陪伴你順利結束保護處分、不被標籤化並重新掌控自己的未來」。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["米勒與羅尼克之動機晤談法（Miller & Rollnick's Motivational Interviewing, MI）", "植基於人本主義與自我決定論，專門針對「非自願、抗拒改變與處於矛盾衝突（Ambivalence）」之個案所發展的指導性晤談技術。核心主張：個案的抗拒與防衛不是病態特質，而是晤談關係尚未調諧之訊號；改變的動力必須來自個案內在價值，而非輔導者之外在說服或法規施壓。三大核心精神為：夥伴合作（Partnership）、接納（Acceptance）、同理慈悲（Compassion）、喚起（Evocation）（PACE 精神）。輔導歷程依循四階段：建立關係（Engaging）、聚焦主題（Focusing）、喚起改變動機（Evoking）、擬定行動計畫（Planning）。技術運用 OARS（開放式提問 Open questions、肯定 Affirmations、反映傾聽 Reflective listening、摘要 Summarizing），核心關鍵在於識別並增強個案的「改變語言（Change Talk）」，同時柔和順應「維持現狀語言（Sustain Talk）」。易混淆處：動機晤談並非無原則地順應個案，亦非偽裝成同理的巧妙說服或操縱；輔導者必須真誠放下「改正反射（Righting Reflex）」，避免急於糾正少年的認知錯誤，引導其自行體會現狀與理想生涯之落差。", "非自願案主、矛盾心理、PACE精神、OARS技巧、改變語言、抑制改正反射", "甲面對保護管束充滿防衛，質疑觀護人是法官的密探並堅持「只是惡作劇」。觀護人應先放下法官化身之威權說教，運用 OARS 技巧表達同理：「你覺得自己被大家誤解，心裡很不甘心，而且擔心今天說的話會影響未來的判決。」待防禦降低後，探討甲對未來聲譽與人際關係的期許，對照目前面臨司法處分與學校孤立的現實，喚起其內在不一致感，促使其主動產生「想改善生活、不想被標籤化」的改變語言。"], ["焦點解決短期治療（Solution-Focused Brief Therapy, SFBT, de Shazer & Berg）", "由 Steve de Shazer 與 Insoo Kim Berg 開創之後現代取向諮商模式。核心主張：「問題的成因不等於解決之道」，諮商不應深究病理原因或過去的錯誤，而應聚焦於個案的「優勢、資源、例外經驗與未來期待」。認為個案才是自己生命的專家，微小的改變會引發滾雪球般的骨牌效應。五大核心問句技術包括：奇蹟問句（Miracle Question，描繪問題解決後的未來圖像）、例外問句（Exception Question，找出問題未發生或較不嚴重的時刻及其背後資源）、評量問句（Scaling Question，將抽象狀態量化為 1-10 分以追蹤微幅進步）、因應問句（Coping Question，肯定個案在極端逆境下如何維持至今）、讚賞與任務指派。易混淆處：SFBT 並非忽視當事人的痛苦或盲目粉飾太平，而是「正視問題存在，但拒絕在問題故事中打轉」，迅速引導能量轉向構建解決之道的對話。", "後現代建構、尋找例外、奇蹟問句、評量問句、正向資源賦能、微小改變滾雪球", "甲自認在學校已成為眾矢之的、毫無希望。觀護人可運用評量問句：「如果 1 分是你覺得生活徹底失控，10 分是你完全走出陰影，你現在給自己幾分？為什麼不是 0 分？這 2 分你是靠什麼力量撐過來的？」接著運用例外問句：「在過去這兩週裡，有沒有哪一天你和同學互動時，沒有起衝突或沒有想惡作劇的衝動？那天有什麼不同？你是怎麼做到的？」透過挖掘其未發作時的自控經驗，賦予甲正向自我效能感，打破無力感之死循環。"], ["修復式司法與同理心修復諮商模式（Restorative Justice & Empathy Building）", "修復式司法將犯罪與偏差行為重新定義為「對具體人際關係與社區信任的侵害」，而非單純違反國家抽象法規。輔導焦點從「誰犯了法、該受什麼懲罰」轉向「誰受了傷害、傷害造成了什麼需求、如何共同修復損害並承擔責任」。改變機制在於透過安全且結構化之會談（如修復式會議、致歉與補償協議），促進行為人跳脫自我中心防衛，直面其行為對被害人造成的真實心理、情感與名譽創傷，進而引發由內而生的同理心修復（Empathy Repair）與主動向善意願。易混淆處：修復式諮商絕非逼迫被害人原諒，亦非讓加害人以形式化「說對不起」換取減刑的交易機制；其前提必須是行為人已具備基礎的反思認知，且以「不造成被害人二度傷害」為最高倫理底線。", "關係修復、損害承擔、情感同理心、修復式會談、非懲戒性責任、社區再整合", "甲散布私密影像卻合理化為「同儕玩笑」，顯示其對被害人創傷之同理心嚴重鈍化。觀護人在個別輔導階段，應先引導甲進行「同理心換位思考演練」：透過閱讀匿名被害人自白書或觀看數位性暴力真實紀錄片，引導甲想像「如果這件事發生在自己至親身上，會承受怎樣的社會眼光與窒息痛苦？」在甲產生真實愧疚感後，協助其撰寫非自辯性的真誠反省信，並擬定具體的損害彌補行動（如參與防止網路霸凌志工服務），使其由被動受罰者轉化為主動承擔責任的修復者。"]], "sourceReference": "110 年公務人員特種考試司法人員三等考試觀護人類科「諮商與輔導」第 3 題", "reviewStatus": "待核對"}, {"id": "2026-09-29-1", "date": "2026-09-29", "subject": "心理學（包括心理測驗）", "question": "少年甲現年 15 歲，就讀國中三年級。甲幼年時父母離異，父親入監服刑，甲與失智祖母同住，放學後需打工並照料祖母，長期承受高度壓力。在學校中，甲性格內向，遇同學言語挑釁時習慣強忍不發、低頭不語（長期壓抑外顯表徵），但在深夜獨處時常反覆回想受辱畫面而徹夜難眠。某日，同學乙再次於走廊大聲嘲笑甲之家庭背景並阻擋去路。甲在長期累積之極度憤怒與羞辱感爆發下瞬間失控，抽出美工刀劃傷乙之臉部與手臂。事後甲恐慌無助，在宮廟友人引誘下吸食新興毒品「依託咪酯煙彈」以逃避痛苦，隨後遭警方查獲護送少年法院。少年調查官委請心理測驗員對甲施測，結果顯示：甲在「貝克焦慮量表（BAI）」呈現重度焦慮分數，「青少年人格量表」顯示極高之防衛性與情緒壓抑向度。試問：(一) 請以 James Gross 的「情緒調節歷程模式（Process Model of Emotion Regulation）」，分析少年甲在案發前與案發後所採取之情緒調節策略及其適應性？並結合青少年大腦認知神經發展之特質，解析甲何以在衝突當下產生失控暴力行為？（15 分）(二) 少年保護官在執行保護管束輔導時，應如何運用心理學與諮商輔導理論（如 Gross 之認知重評、DBT 辨證行為治療之痛苦耐受），協助甲建立適應性之情緒調節策略？請以標準四欄表格具體分析說明。（10 分）", "issues": "爭點一：Gross 情緒調節歷程模式之五大階段與適應性辨析（認知重評之適應性 vs. 表達抑制與反芻之非適應性）。\n爭點二：青少年神經發展雙系統模型（Dual-Systems Model）（邊緣系統成熟早而前額葉成熟晚，在熱認知 Hot Cognition 下煞車失靈）。\n爭點三：心理測驗數據與臨床輔導策略之連結（BAI 重度焦慮與 DBT 危機耐受技術）。", "outline": "(一) 以 Gross 情緒調節模式與神經發展模型分析甲之行為\nGross 情緒調節歷程模式之檢視：\n案發前：非適應性策略之疊加（表達抑制與過度反芻）：甲習慣低頭強忍，屬於「反應焦點的表達抑制」，無法消除交感神經激發且消耗認知資源；深夜反覆回想被羞辱經驗屬於「注意力調配中的反芻思維」，持續放大屈辱感。\n案發當下與案發後：情緒調節潰堤與逃避性因應：自我控制資源耗竭致情緒激發突破臨界點，轉為毀滅性暴力；事後吸食依託咪酯係透過藥物麻痺焦慮，為有害的逃避性情緒因應。\n青少年大腦發展雙系統模型之剖析：\n甲年僅 15 歲，掌管情緒衝動之「邊緣系統」高度敏感，而掌管衝動控制之「前額葉皮質」尚未成熟。\n當面羞辱引發強烈之「熱認知（Hot Cognition）」狀態，邊緣系統瞬間癱瘓了前額葉的煞車機制，致甲做出未顧及後果之極端攻擊行為。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["格羅斯情緒調節歷程模式（Gross's Process Model of Emotion Regulation）", "James Gross 提出情緒調節在時間軸展開之歷程模型，包含情境選擇、情境修正、注意力調配、認知重評（前置焦點 Antecedent-focused）與表達抑制（反應焦點 Response-focused）。適應性策略（如認知重評）在源頭重塑意義，有效降低負面情緒；非適應性策略（如長期表達抑制、過度反芻）僅壓抑外在表徵，交感神經仍高度激發且耗損認知資源，易導致衝動爆發或物質濫用。易混淆處：表達抑制並非真正的自我控制，而是壓抑外在表現，反而增加身心耗損；認知重評則是在感受形成前改變認知評價。", "情緒調節歷程、前置焦點、反應焦點、認知重評、表達抑制、注意力調配", "甲在承擔家庭重擔並受同學譏諷時，長期採取「表達抑制」壓抑恥辱，並在內心反覆「反芻」怨懟；當壓力突破臨界點時轉化為極端持刀攻擊，事後以吸食新興毒品麻痺焦慮（有害逃避性因應）。保護官處遇應訓練甲掌握「認知重評」，引導其將同學挑釁重新詮釋為「對方的無知」而非「自我價值的否定」，並建立適度宣洩管道。"], ["青少年雙系統神經發展模型（Dual-Systems Model of Adolescent Brain Development, Steinberg）", "Laurence Steinberg 提出發展神經心理學模型，指出青少年冒險與衝動行為源於兩系統發展不均衡：掌管情緒體驗與同儕敏感度的「社會情緒邊緣系統」在青春期早期因荷爾蒙刺激已高度活躍；而掌管衝動抑制與前瞻規劃之「前額葉皮質」直至 20 歲初至 25 歲才發育成熟。這種「油門強勁而煞車未全」的時間差，使青少年在遭遇急性壓力或情緒高張之「熱認知（Hot Cognition）」情境時，前額葉的執行功能易被邊緣系統癱瘓。易混淆處：該模型並非主張青少年缺乏智力或缺乏道德認知，而是在強烈情緒激發下其煞車控制能力暫時失效。", "雙系統模型、前額葉皮質、邊緣系統、情緒神經發展時間差、熱認知與冷認知", "甲年僅 15 歲，前額葉衝動控制功能未完全成熟，面對同儕當眾嘲弄受刑父親與失智家庭之極端情境，熱認知狀態引發邊緣系統主導大腦，瞬間癱瘓理性預測後果能力，導致其在數秒內拔刀傷人。保護官於調查與保護處遇時，應客觀闡明其神經發展特性，避免將其標籤化為反社會人格，並設計「情緒冷卻與延宕反應」之行為演練。"], ["正念減壓與辨證行為治療之痛苦耐受技術（DBT Distress Tolerance & Mindfulness, Linehan）", "Marsha Linehan 創立之辨證行為治療（DBT），針對情緒高度失調個案強調「接納與改變之辨證平衡」。其「痛苦耐受模組」教導個案在面臨劇烈情緒危機時，不以衝動破壞性行為使情勢惡化，核心技能包含 TIPP 技巧（改變體溫 Temperature、劇烈運動 Intense exercise、節奏呼吸 Paced breathing、肌肉放鬆 Paired muscle relaxation）與自我安撫。正念技術引導個案以非評價態度覺察當下身心感受，讓情緒如浪潮般自然消退。易混淆處：痛苦耐受並非消極忍受或放棄改變，而是避免在情緒風暴中做出災難性衝動之危機處置技術。", "辨證行為治療、痛苦耐受、TIPP技巧、正念覺察、非評價接納", "甲面對重度焦慮（BAI 測驗驗證）與突發衝突時，常出現暴怒並伴隨吸毒逃避傾向。保護官於輔導中應帶領甲具體演練 TIPP 技巧：當感到怒火攻心或急欲吸毒時，透過冰水敷臉、深層腹式節奏呼吸與漸進式肌肉緊繃放鬆，刺激迷走神經反射調降交感神經激發水準；同時建立自我安撫行動清單，在危機當下安全著陸，取代毀滅性行為。"]], "sourceReference": "112 年公務人員特種考試司法人員三等考試觀護人類科「心理學（包括心理測驗）」第 1 題", "reviewStatus": "待核對"}, {"id": "2026-09-28-1", "date": "2026-09-28", "subject": "犯罪學", "question": "少年甲現年 16 歲，原為某私立高中體育班之優秀田徑選手，對未來保送大學體育系懷抱高度憧憬。一年前，甲之父母因家庭暴力協議離婚，母親改嫁後，甲常年遭受繼父無端辱罵與肢體毆打。半年前，母親因繼父經商失敗無力負擔私立學校學費，強令甲辦理休學，甲亦因此被取消代表縣市出賽之運動員資格，其升學與體育夢想一夕破滅。面對家庭破碎與生涯夢碎，甲內心充斥強烈的屈辱、挫折與暴怒，但家庭與學校均未能提供任何支持與抒解管道。甲遂離家出走，於宮廟陣頭結識不良同儕，開始吸食第三級新興毒品「依託咪酯（俗稱睡眠煙彈）」以麻痺痛苦；日前更因同儕與他人發生行車糾紛，甲夥同數名少年手持鐵棍砸毀對方車輛並打傷車主，案經警方移送少年法院審理。\n\n試問：(一) 請以 Robert Agnew 之「一般緊張理論（General Strain Theory, GST）」，深入剖析少年甲之多重緊張來源、負面情緒中介機制及其偏差違法行為之成因？（15 分）(二) 少年調查保護官在接案擬定處遇計畫時，應如何運用犯罪學與心理諮商理論（如一般緊張理論之因應策略、社會學習論、認知行為治療），協助甲建立正向因應策略以防止再犯？請以標準四欄表格具體分析說明。（10 分）", "issues": "爭點一：Agnew 一般緊張理論的三大客觀與主觀緊張來源\n無法達成正向評價之目標：期望（體育保送大學）與實際成就（被迫休學）之脫節；期待與公正結果之差距。\n正向評價刺激之移除：喪失學生身分、失去運動員資格與同儕支持環境。\n負向刺激之呈現：承受繼父長期的家庭暴力與語言侮辱。\n爭點二：負面情緒（Negative Affect）之關鍵中介角色\n緊張並非直接導致犯罪，而是引發「憤怒（Anger）」、「挫折（Frustration）」與「無力感」，其中「憤怒」特別容易引發攻擊與違法報復。\n爭點三：合法因應資源之匱乏與偏差行為選擇\n認知因應（Cognitive Coping）、情緒因應（Emotional Coping）及行為因應（Behavioral Coping）之功能失調。甲以吸毒作為非法的負向情緒因應，以聚眾鬥毆作為非法的行為因應。", "outline": "(一) 以 Agnew 一般緊張理論剖析甲之行為成因\n一般緊張理論之核心架構：\nRobert Agnew 主張，個體在微觀人際關係中面臨不利的緊張環境時，會產生負面情緒狀態（特別是憤怒），若缺乏合法適應能力，即會透過犯罪與偏差行為以紓解、逃避或報復緊張情境。\n甲之三大緊張來源檢視：\n無法達成正向評價目標：甲原企盼透過體育專長保送大學，卻因家庭變故被迫休學，其抱負與實際成就產生不可逆的巨大落差。\n正向評價刺激之移除：體育班身分、運動員代表資格以及規律的運動同儕支持全數喪失，剝奪其自我價值感的主要來源。\n負向刺激之呈現：長期承受繼父的肢體暴力與言語辱罵，人身安全與家庭尊嚴遭受持續侵害。\n負面情緒之中介與適應不良之行為選擇：\n上述多重緊張引發甲內在劇烈的「憤怒」與「不公感」。因缺乏社會資本與健康心理支持，甲選擇了破壞性的適應方式：\n退縮性情緒因應：施用依託咪酯，企圖透過藥物中樞鎮靜麻痺內心痛楚。\n外向性暴力行為因應：透過參與陣頭聚眾砸車與傷人，將內在積壓的暴怒轉嫁於外界，藉此在不良同儕中重新獲得被接納感與虛假的控制權。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["羅伯特·艾格紐之一般緊張理論（Robert Agnew's General Strain Theory, GST）", "Agnew 擴充傳統 Merton 結構緊張論，主張個人微觀人際經驗中的緊張是偏差行為核心促發因素。核心主張：個體因生活中的客觀或主觀緊張事件產生負面情緒狀態（特別是「憤怒 Anger」與挫折），進而引發偏差行為作為減輕或發洩緊張的應對手段。緊張三大來源：(1) 無法達成正向評價之目標（期望與成就差距）；(2) 正向評價刺激之移除（如親人離世、失戀、休學、失去球員資格）；(3) 負向刺激之呈現（如家庭暴力、虐待、霸凌）。若個案欠缺合法的認知、情緒或行為因應資源，犯罪往往成為發洩憤怒或尋求報復之管道。易混淆處：傳統緊張論著重「宏觀社會階級與經濟成功目標之受阻」，一般緊張理論則將焦點轉向「微觀日常人際互動中的挫折與情緒反應」，特別強調「負面情緒（憤怒）」是連結緊張與犯罪之中介關鍵。", "微觀緊張、三大緊張來源、負面情緒中介（憤怒）、認知/情緒/行為因應策略", "少年甲經歷父母離異與繼父家暴（負向刺激呈現）、因經濟受挫被迫放棄熱愛的私立高中體育班與運動員夢想（正向刺激移除及期望成就差距之目標受阻），內心積壓巨大的憤怒與不甘。因家庭無支持、學校無轉銜，甲欠缺有效心理調節機制，憤怒情緒直接轉化為外顯破壞行為（聚眾毀損、砸車）以及透過吸食依託咪酯麻痺痛苦（適應不良之行為因應）。保護官處遇應重在消除負向刺激（聲請保護令、安置）並重建正向刺激（重返校園或職訓體育訓練）。"], ["班度拉社會學習與社會認知論（Bandura's Social Learning Theory & Modeling）", "主張人類行為多數透過「觀察學習（Observational Learning）」與「模仿（Modeling）」而習得。個體目睹楷模（如家庭暴力者或不良同儕）之行為及其所獲得的結果（替代增強 Vicarious Reinforcement），在內在進行注意力、保留、動作再生與動機歷程後表現出相似行為。在暴力傳遞中，目睹家庭暴力的少年常內化「暴力是解決挫折與展現權力之有效手段」的基模。易混淆處：常與 Sutherland 差別接觸理論混淆；差別接觸理論強調「犯罪動機與態度定義（Definitions）之學習」，社會學習論則更具體探討「觀察示範、替代經驗與自我效能感（Self-Efficacy）」之認知操作機制。", "觀察學習、行為模仿、替代增強、攻擊基模內化、自我效能", "甲長期目睹繼父以言語與肢體暴力控制家庭，無形中將「暴力＝力量與主導權」的基模內化；隨後在陣頭團體中，目睹同儕以聚眾鬥毆解決糾紛並受到讚賞（替代增強），甲為尋求認同並排解無力感，迅速模仿並參與群體毀損與暴力行為。觀護人在處遇時，應透過示範正向問題解決技巧（Modeling），協助其建立非暴力的自我效能感，打破暴力代際模仿之循環。"], ["貝克認知行為治療法之情緒聚焦重構（Beck's Cognitive Behavioral Therapy, CBT）", "Aaron Beck 主張，個體的情緒與行為困擾源於其「自動化思考（Automatic Thoughts）」與潛在的「核心認知基模（Core Beliefs）」。當個體面臨重大挫敗或創傷時，易啟動認知扭曲（如全有全無思維、過度推論、災難化與敵意歸因偏誤 Hostile Attribution Bias），進而引發極端憤怒或絕望。改變機制在於透過認知重構（Cognitive Restructuring），協助個案識別自動化思考、檢驗證據、並發展適應性之替代思考與情緒調節技能。易混淆處：CBT 並非單純要個案「正面思考」或壓抑情緒，而是「實事求是地檢驗信念的邏輯性與真實性」，並配合行為實驗進行具體技能演練。", "核心基模、自動化思考、認知扭曲、敵意歸因偏誤、認知重構", "甲在體育班夢碎與遭遇家暴後，形成「整個世界都在跟我作對、我的人生已經全毀了」的災難化核心基模，並在人際互動中產生強烈的「敵意歸因偏誤」，動輒認為外界挑釁其尊嚴而暴怒動手。觀護人於個別面談時，應運用情緒日記與思考記錄表，引導甲覺察從「受挫情境→自動化憤怒思考→砸車吸毒」的連鎖反應，駁斥其認知扭曲，並訓練其「停、看、聽」之情緒冷卻與衝動延宕技巧。"]], "sourceReference": "110 年公務人員特種考試司法人員三等考試觀護人類科「犯罪學」第 1 題", "reviewStatus": "待核對"}, {"id": "2026-09-27-1", "date": "2026-09-27", "subject": "本週跨科整合複盤（融合：犯罪學、心理學、諮商與輔導、少年事件處理法、保安處分執行法、刑事訴訟法）", "question": "少年甲現年 15 歲，自幼生長於高度衝突之離異家庭，母親情緒不穩定且長期將未解焦慮轉嫁於甲身上，父親則長年缺席。甲國二起頻繁逃學，結識校外不良同儕，於租屋處共同吸食第三級新興毒品「依託咪酯（Etomidate，俗稱睡眠煙彈）」，復因缺錢購毒，多次夥同同儕侵入住宅竊取財物。警員循線查獲甲並護送至少年法院。少年法院調查過程中，甲情緒躁動、言詞反覆，且出現嚴重注意力不集中與戒斷戒癮幻覺症狀。少年調查官調查後，認為甲身心狀態堪慮且家庭已完全喪失監督功能。試問：(一) 少年法院於審理前及審理時，得採取何種身心評估與保護處置？若少年法院裁定交付保護管束並命入相當醫療機構施以禁戒治療，其法律依據及與普通刑事訴訟法「暫行安置」之本質與目的有何異同？（請綜合《少年事件處理法》、《保安處分執行法》及《刑事訴訟法》分析）（15 分）(二) 少年保護官在接案擬定處遇計畫時，應如何整合犯罪學理論解釋甲之違法成因？並如何運用心理學與諮商輔導理論（如家庭系統論、現實治療法）介入輔導？請以標準四欄表格具體分析說明。（10 分）", "issues": "爭點一：少事法身心評估與鑑定留置之程序權衡\n《少年事件處理法》第 19 條第 1 項審前調查；第 26 條第 2 款、第 26 條之 2 鑑定留置（至多 2 個月，不得延長）之發動要件與程序正當性。\n爭點二：少事法治療處分 vs. 刑事訴訟法暫行安置\n少事法 §42 第 2 項第 2 款：附屬性處遇，重在「教育保護與醫療矯治」，配合保護處分執行，以保障少年健全自我成長為最高指導原則。\n刑事訴訟法 §121-1 暫行安置：保全處分，重在「防衛社會安全與保全訴訟程序」，針對無責任能力或限制責任能力且具高度危險性之成年被告。\n爭點三：跨科理論模型之有機整合\n犯罪學：社會控制理論之「依附、致力、參與、信念」全面崩解。\n諮商輔導：家庭系統之「情緒三角化與代罪羔羊」；現實治療「WDEP 模式」促成自主負責。", "outline": "(一) 少年法院身心評估與處置，及治療處分與暫行安置之比較\n少年法院得採取之身心評估與處置：\n審理前調查與鑑定留置：依《少年事件處理法》第 19 條第 1 項，調查官應調查甲之身心狀況、家庭環境。因甲有毒品戒斷與精神躁動症狀，法院得依同法第 26 條之 2 裁定將甲交付留置於醫院鑑定其心智狀態，期間不得逾 2 個月。\n裁定保護處分與禁戒治療：法院得依少事法第 42 條第 1 項第 2 款裁定交付保護管束，並依第 42 條第 2 項第 2 款命入相當處所施以治療或禁戒。依《保安處分執行法》第 64 條及第 71 條規定，觀護人應主導連結醫療戒癮資源，促其完成身心治療。\n少事法治療處分與刑訴暫行安置之異同比較：\n本質與目的不同：\n少事法治療處分係基於「國親思想（Parens Patriae）」，目的在於滿足少年的醫療需求與保護其身心成長，非為防禦社會之手段。\n刑訴暫行安置係為填補偵查或審判中對精神障礙被告未達羈押要件之保安漏洞，本質屬於「防衛社會、保全被告及防範再犯」之拘束人身自由強制處分。\n程序與發動階段不同：\n暫行安置得於偵查中或審理中由法官裁定（最長 6 個月，累計不得逾 5 年），受嚴格法官保留與正當程序拘束。\n少事法治療處分通常於終局裁定中與保護處分併為諭知，具有輔助保護處分健全實施之從屬性質。", "theoryTable": [["理論／方法", "理論／方法說明", "核心概念", "少年個案應用"], ["赫胥社會控制理論（Hirschi's Social Bond Theory）", "該理論主張人天生具有追求立即滿足之傾向，個體之所以不從事犯罪，是由於受到與主流社會連結的「社會鍵（Social Bond）」所拘束。當社會鍵削弱或斷裂時，個體即會順應本能從事偏差行為。社會鍵包含四要素：依附（Attachment）、致力（Commitment）、參與（Involvement）、信念（Belief）。易混淆處：常與「自我控制論（General Theory of Crime）」混淆；社會控制論強調「外在社會關係連結與社會制度控制」，自我控制論則強調「個體內在衝動抑制特質的恆定性（童年期建立）」。", "社會鍵、依附、致力、參與、信念、社會控制", "少年甲長期逃學，對學校與常態教育體系之「依附」中斷；對未來學業或生涯缺乏長遠期待與投資（缺乏「致力」）；課餘閒暇時間未參與合法建設性社團（缺乏「參與」）；法律守法意識薄弱（缺乏「信念」），最終受不良同儕吸引而結夥竊盜與吸毒。少年保護官於處遇中，應結合社福網絡安排職業探索與復學轉銜，修復家庭支持，重塑其四項社會鍵。"], ["鮑溫家庭系統理論（Bowen Family Systems Theory）", "鮑溫理論主張家庭為一相互牽動之情緒單元，家庭成員之焦慮與互動模式會跨世代傳遞。核心概念包括「自我分化（Differentiation of Self）」與「情緒三角化（Triangulation）」。當父母婚姻或情感關係破裂時，常將未解之焦慮投射至脆弱子女身上，使子女成為承載家庭病態張力的「症狀承載者（Symptom Bearer）」。易混淆處：常與單純人際衝突理論混淆；家庭系統論強調個案的偏差是「維繫家庭平衡之無意識防衛機轉」，而非個案單純個人本性惡劣。", "自我分化、情緒三角化、家庭投射歷程、代際傳遞、症狀承載者", "甲生長於離異家庭，母親情緒長期不穩且將情感失落與控制焦慮全數傾倒於甲身上，父親則徹底缺席，甲深陷父母未解衝突之情緒三角中，承受巨大窒息感。甲以逃家、結夥吸食依託咪酯等失控行為，實質上是在以症狀表現宣洩家庭張力。保護官在處遇時，除個別輔導外，必須導入家庭親職諮商，協助母親覺察自我焦慮，打破病態三角關係，促進甲之心理分化與情緒獨立。"], ["格拉瑟現實治療法（Glasser's Reality Therapy / WDEP 模式）", "植基於選擇理論（Choice Theory），主張人類所有行為均旨在滿足五大內在心理需求：生存、愛與歸屬、權力與成就、自由、樂趣。個案之所以產生違法或自我毀滅行為，是因其無法以負責任、合法之方式滿足上述需求，進而選擇了無效的「全行為（Total Behavior）」。輔導機制採 WDEP 模式（探索期許 Wants、檢視作為 Doing、自我評估 Evaluation、擬定計畫 Plan）。易混淆處：常與強調外在獎懲的行為主義混淆；現實治療法反對外在控制，堅信唯有內在需求得到釐清，並由個案「自發自我評估」其行為有效性時，改變才會持久。", "選擇理論、五大基本需求、WDEP模式、有效性評估、承擔責任", "甲吸毒與結夥行竊，本質是為在同儕團體中尋求「愛與歸屬」以及掌控生活的「權力與樂趣」，卻誤用破壞性手段。保護官應運用 WDEP 模式：引導甲探索其內心真正渴望的歸屬與尊重（Wants）；攤開檢視其目前吸毒與行竊的具體作為（Doing）；引導其自我評估「這些行為是否真能讓你獲得長久的自由與尊嚴，還是讓你面臨司法收容與身體崩潰？（Evaluation）」；最後引導其共同擬定參加合法才藝或體育團體、遠離毒品聚會的具體可行契約（Plan）。"]], "sourceReference": "111 年公務人員特種考試司法人員三等考試觀護人類科（選試少年事件處理法）「少年事件處理法」第 2 題", "reviewStatus": "待核對"}, {"id": "2026-09-26-1", "date": "2026-09-26", "subj
