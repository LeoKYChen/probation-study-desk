<script>
(() => {
const KEY='probation-study-home-exam-date-v1';
const $=id=>document.getElementById(id);
const value=$('days-left'),hint=$('exam-date-description'),edit=$('date-edit'),form=$('date-form'),input=$('date-input'),cancel=$('date-cancel'),message=$('date-message');
const clock=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'});
let exam=null,canSave=true;
function valid(s){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return false;
 const [y,m,d]=s.split('-').map(Number),v=new Date(Date.UTC(y,m-1,d));
 return y>=1900&&y<=2100&&v.getUTCFullYear()===y&&v.getUTCMonth()===m-1&&v.getUTCDate()===d;
}
function taipeiToday(){
 const x=Object.fromEntries(clock.formatToParts(new Date()).filter(v=>['year','month','day'].includes(v.type)).map(v=>[v.type,Number(v.value)]));
 return Date.UTC(x.year,x.month-1,x.day);
}
function draw(){
 if(!exam){value.textContent='尚未設定';hint.textContent='選擇考試日期後，即會每天自動倒數。';edit.textContent='設定日期';return;}
 const [y,m,d]=exam.split('-').map(Number),n=Math.round((Date.UTC(y,m-1,d)-taipeiToday())/86400000);
 value.textContent=n>0?n+' 天':n===0?'就是今天！':'已過 '+(-n)+' 天';
 hint.textContent='考試日期：'+exam.replace(/-/g,'/');
 edit.textContent='修改日期';
}
function close(){form.hidden=true;edit.setAttribute('aria-expanded','false');message.textContent='';}
edit.addEventListener('click',()=>{if(!form.hidden){close();return;}input.value=exam||'';form.hidden=false;edit.setAttribute('aria-expanded','true');input.focus();});
cancel.addEventListener('click',close);
form.addEventListener('submit',e=>{e.preventDefault();if(!valid(input.value)){message.textContent='請選擇有效的日期。';return;}exam=input.value;try{localStorage.setItem(KEY,exam);}catch{canSave=false;}draw();close();if(!canSave)hint.textContent+='（瀏覽器無法保存設定）';});
try{const s=localStorage.getItem(KEY);if(valid(s))exam=s;}catch{canSave=false;}
draw();
setInterval(draw,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw();});
})();
</script>
