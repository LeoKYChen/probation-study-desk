<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="116年觀護人學習平台統一首頁預覽：專業科目、共同科目、每日模擬題、少年司法知識補給及臺灣法律AI實驗室。">
  <title>116年觀護人學習平台｜統一首頁測試版</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    *,*::before,*::after { box-sizing:border-box; }
    html { min-height:100%; background:#050505; }
    body { margin:0; min-height:100vh; padding:20px; color:#f8f9fa; background:#050505; }
    .shell { width:min(100%,960px); margin:0 auto; padding:34px 32px 30px; border:1px solid #292929; border-radius:31px; background:#030303; }
    header { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:12px; }
    h1,h2,p { margin:0; }
    h1 { font-size:clamp(25px,4vw,44px); font-weight:800; letter-spacing:.005em; line-height:1.36; }
    .pill { display:inline-block; flex:none; border-radius:999px; padding:5px 15px; background:#05371e; color:#28b975; font-size:clamp(13px,2.3vw,21px); font-weight:750; line-height:1.35; }
    .nav-list { margin:0; padding:0; list-style:none; }
    .nav-item { border-bottom:1px solid #202020; }
    .nav-link { display:grid; grid-template-columns:52px minmax(0,1fr); align-items:center; gap:18px; padding:31px 4px 33px; border-radius:12px; color:inherit; text-decoration:none; transition:background-color .15s ease; }
    .nav-link:hover { background:#101314; }
    .nav-link:focus-visible, .lab-link:focus-visible { outline:3px solid #47d999; outline-offset:3px; }
    .nav-icon { width:32px; height:32px; margin-left:0; color:#a5a5a5; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .nav-title { display:block; margin-bottom:8px; font-size:clamp(21px,3.35vw,35px); font-weight:790; line-height:1.35; letter-spacing:.01em; }
    .nav-subtitle { display:block; color:#a2a2a2; font-size:clamp(14px,2.3vw,23px); line-height:1.6; letter-spacing:.005em; }
    .lab { padding:34px 4px 3px; }
    .lab-link { display:block; padding:0; border-radius:10px; color:inherit; text-decoration:none; }
    .lab-link:hover .lab-title { color:#d6f7e6; }
    .lab-title-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .lab-title { font-size:clamp(20px,3vw,30px); font-weight:790; line-height:1.4; }
    .lab-badge { display:inline-block; flex:none; border-radius:999px; padding:5px 13px; background:#262626; color:#e4e4e4; font-size:clamp(12px,2vw,18px); font-weight:730; white-space:nowrap; }
    .lab-description { margin-top:22px; font-size:clamp(14px,2.3vw,22px); line-height:1.65; color:#a2a2a2; }
    .footnote { width:min(100%,960px); margin:15px auto 0; text-align:center; color:#888; font-size:12px; line-height:1.65; }
    @media (max-width:580px) {
      body { padding:10px; }
      .shell { padding:22px 20px 23px; border-radius:23px; }
      header { align-items:flex-start; margin-bottom:8px; }
      h1 { max-width:calc(100% - 72px); }
      .pill { margin-top:3px; padding:4px 11px; }
      .nav-link { grid-template-columns:30px minmax(0,1fr); gap:16px; padding:25px 0 26px; }
      .nav-icon { width:27px; height:27px; }
      .nav-title { margin-bottom:5px; }
      .nav-subtitle { overflow-wrap:anywhere; }
      .lab { padding:26px 0 4px; }
      .lab-title-row { gap:9px; }
      .lab-description { margin-top:17px; }
    }
    @media (prefers-reduced-motion:reduce) { .nav-link { transition:none; } }
  </style>
</head>
