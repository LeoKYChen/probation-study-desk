<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#245b48">
<meta name="description" content="觀護人學習平台：專業科目、共同科目、每日模擬、少年司法知識補給與法律 AI 實驗室。">
<title>觀護人學習平台｜統一首頁測試版</title>
<style>
:root{
  color-scheme:light;
  --ink:#243b35;
  --ink-muted:#68766f;
  --green:#245b48;
  --paper:#f5f5ef;
  --cream:#ebe7d7;
  --soft:#e8f0e9;
  --line:#dde2d8;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.6}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}
.page{max-width:1350px;margin:0 auto;padding:48px clamp(18px,4.8vw,74px) 58px}
.page-header{margin-bottom:40px}
.page-header h1{margin:0;font-size:clamp(33px,4.1vw,60px);font-weight:850;letter-spacing:.014em;line-height:1.25;color:#1c4940}
.countdown{min-width:0;background:var(--cream);padding:22px 28px;margin:0 0 40px;border-radius:3px}
.countdown-top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-width:0;flex-wrap:wrap}
.countdown-label{color:#5f5a46;font-size:clamp(17px,2vw,23px);font-weight:780}
.countdown-calendar{color:#77715f;font-size:14px;font-variant-numeric:tabular-nums}
.countdown-value{margin:5px 0 0;color:#1c4940;font-size:clamp(25px,3vw,39px);font-weight:790;line-height:1.35;font-variant-numeric:tabular-nums}
.countdown[data-style="large"] .countdown-value{font-size:clamp(34px,5vw,58px)}
.countdown[data-accent="emerald"] .countdown-value{color:#167347}
.countdown[data-accent="cream"] .countdown-value{color:#625a45}
.countdown-settings{margin-top:8px;max-width:100%;min-width:0}
.countdown-settings summary{display:inline-flex;align-items:center;gap:8px;list-style:none;border-radius:7px;min-height:44px;padding:8px 5px;color:#245b48;font-size:14px;font-weight:730;cursor:pointer;touch-action:manipulation}
.countdown-settings summary::-webkit-details-marker{display:none}
.countdown-settings summary:focus-visible,.tile:focus-visible{outline:3px solid #367a61;outline-offset:4px}
#countdown-form{max-width:700px;margin-top:10px;padding:18px;border:1px solid #d7d3c1;border-radius:10px;background:rgba(255,255,255,.6)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0;max-width:100%;color:#4c6257;font-size:13px;font-weight:670}
.field input,.field select{display:block;width:100%;min-width:0;max-width:100%;height:45px;margin:0;padding:10px 12px;border:1px solid #b6c8bb;border-radius:8px;background:#fff;color:#243b35;font-size:16px;line-height:1.3}
.field input:focus-visible,.field select:focus-visible{outline:3px solid #4a9672;outline-offset:2px}
.date-input-wrap{display:flex;align-items:stretch;min-width:0;max-width:100%;width:100%;overflow:hidden;border:1px solid #b6c8bb;border-radius:8px;background:#fff}
.field .date-input-wrap #exam-date{display:block;flex:1 1 0%;inline-size:0;min-width:0;max-width:100%;width:0;height:44px;padding:10px 12px;margin:0;border:0;border-radius:0;color:#243b35;background:transparent;color-scheme:light;font-size:16px}
.date-input-wrap:focus-within{outline:3px solid #4a9672;outline-offset:2px}
.field .date-input-wrap #exam-date:focus-visible{outline:none}
#exam-date::-webkit-date-and-time-value{min-inline-size:0;max-inline-size:100%;text-align:start}
#exam-date::-webkit-calendar-picker-indicator{flex:0 0 auto;margin:0}
.form-note{margin:13px 0 0;color:#68766f;font-size:12px;line-height:1.7}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.form-actions button{min-height:44px;padding:10px 18px;max-width:100%;border:1px solid var(--green);border-radius:8px;font-size:14px;font-weight:730;touch-action:manipulation}
.save-button{background:var(--green);color:#fff}
.clear-button{background:#fff;color:var(--green)}
.form-actions button:focus-visible{outline:3px solid #367a61;outline-offset:2px}
.section{margin-top:0;margin-bottom:38px}
.section h2{margin:0 0 16px;color:#62796e;font-size:clamp(17px,1.65vw,20px);font-weight:760;line-height:1.4}
.course-grid,.explore-grid{display:grid;min-width:0;gap:22px}
.course-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.explore-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{display:flex;align-items:center;justify-content:center;min-width:0;padding:24px 16px;text-align:center;transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease;overflow-wrap:anywhere}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(36,59,53,.12)}
.tile:active{transform:translateY(0)}
.course-tile{min-height:154px;background:var(--green);color:#fff}
.explore-tile{min-height:158px;background:#e2ebe5;color:#235a4e}
.tile-title{font-size:clamp(21px,2.3vw,37px);font-weight:820;line-height:1.42}
.explore-tile .tile-title{font-size:clamp(19px,2vw,31px)}
.footnote{max-width:1350px;padding:0 clamp(18px,4.8vw,74px) 20px;margin:-10px auto 0;color:#78847c;font-size:12px;line-height:1.7}
@media(max-width:820px){
  .page{padding:30px 22px 35px}
  .page-header{margin-bottom:26px}
  .countdown{margin-bottom:30px}
  .course-grid,.explore-grid{gap:13px}
  .tile{min-height:116px}
  .section{margin-bottom:30px}
}
@media(max-width:760px){
  .course-grid,.explore-grid{grid-template-columns:minmax(0,1fr);gap:12px}
  .page{padding:24px 15px 38px}
  .page-header{margin-bottom:23px}
  .page-header h1{font-size:clamp(28px,8vw,38px)}
  .countdown{padding:17px 18px;margin-bottom:29px}
  .countdown-value{font-size:clamp(26px,7vw,34px)}
  .countdown[data-style="large"] .countdown-value{font-size:clamp(37px,10vw,48px)}
  .form-grid{grid-template-columns:minmax(0,1fr);gap:14px}
  #countdown-form{padding:14px}
  .form-actions{display:grid;grid-template-columns:minmax(0,1fr)}
  .form-actions button{width:100%;min-width:0;min-height:46px}
  .section{margin-bottom:29px}
  .section h2{margin-bottom:12px}
  .course-tile{min-height:104px}
  .explore-tile{min-height:97px}
  .course-tile .tile-title{font-size:clamp(24px,6.8vw,30px)}
  .explore-tile .tile-title{font-size:clamp(22px,6.5vw,28px)}
  .footnote{padding:0 15px 22px}
}
@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>

<main class="page">
  <header class="page-header"><h1>觀護人學習平台</h1></header>
  <section class="countdown" id="countdown-card" data-style="standard" data-accent="mint" aria-label="考試倒數日">
    <div class="countdown-top">
      <span class="countdown-label" id="countdown-event-label">倒數日</span>
      <span class="countdown-calendar" id="countdown-date-caption"></span>
    </div>
    <p class="countdown-value" id="countdown-value" role="status" aria-live="polite">尚未設定考試日期</p>
    <details class="countdown-settings" id="countdown-settings">
      <summary>設定倒數日 <span aria-hidden="true">✎</span></summary>
      <form id="countdown-form" autocomplete="off">
        <div class="form-grid">
          <label class="field"><span>名稱（可自行修改）</span><input id="event-name" name="name" type="text" maxlength="24" placeholder="例如：觀護人考試" value="觀護人考試"></label>
          <label class="field"><span>考試日期（必填）</span><span class="date-input-wrap"><input id="exam-date" name="examDate" type="date" required min="2000-01-01" max="2100-12-31"></span></label>
          <label class="field"><span>顯示樣式</span><select id="countdown-style" name="style"><option value="standard">簡潔顯示</option><option value="large">大字倒數</option></select></label>
          <label class="field"><span>數字配色</span><select id="countdown-accent" name="accent"><option value="mint">淺綠</option><option value="emerald">翠綠</option><option value="cream">米白</option></select></label>
        </div>
        <p class="form-note" id="settings-message">倒數以臺灣日期計算，設定只儲存在目前瀏覽器，不會影響作答紀錄。</p>
        <div class="form-actions"><button class="save-button" type="submit">儲存設定</button><button class="clear-button" id="reset-countdown" type="button">清除倒數</button></div>
      </form>
    </details>
  </section>
  <section class="section" aria-labelledby="courses-heading">
    <h2 id="courses-heading">課程學習</h2>
    <nav class="course-grid" aria-label="課程學習入口">
      <a class="tile course-tile" href="https://v254-unified-preview.probation-study30-test.pages.dev/" target="_blank" rel="noopener noreferrer" aria-label="專業科目：426題、每日30分鐘與申論練習（另開新分頁）"><span class="tile-title">專業科目</span></a>
      <a class="tile course-tile" href="https://leokychen.github.io/probation-study-desk/common-subjects/" target="_blank" rel="noopener noreferrer" aria-label="共同科目：英文、國文作文及 Staresto 題庫（另開新分頁）"><span class="tile-title">共同科目</span></a>
    </nav>
  </section>
  <section class="section" aria-labelledby="explore-heading">
    <h2 id="explore-heading">練習與探索</h2>
    <nav class="explore-grid" aria-label="練習與探索入口">
      <a class="tile explore-tile" href="https://probation-legal-ai-test.pages.dev/" target="_blank" rel="noopener noreferrer" aria-label="法律 AI 實驗室，獨立測試站（另開新分頁）"><span class="tile-title">法律 AI 實驗室</span></a>
      <a class="tile explore-tile" href="https://leokychen.github.io/probation-study-desk/daily-simulation/" target="_blank" rel="noopener noreferrer" aria-label="每日模擬，獨立管理作答紀錄（另開新分頁）"><span class="tile-title">每日模擬</span></a>
      <a class="tile explore-tile" href="https://leokychen.github.io/probation-study-desk/juvenile-news/" target="_blank" rel="noopener noreferrer" aria-label="少年司法週報、學術研究及 CRC 知識補給（另開新分頁）"><span class="tile-title">知識補給</span></a>
    </nav>
  </section>
</main>
<p class="footnote">統一首頁測試版｜原系統與作答紀錄各自獨立；法律 AI 為獨立測試站。</p>

<script>
(() => {
  'use strict';
  // 本模組與練習站不同，僅使用下列唯一儲存鍵。
  const STORE_KEY = 'psd-home-exam-countdown-v1';
  const card = document.getElementById('countdown-card');
  const value = document.getElementById('countdown-value');
  const eventLabel = document.getElementById('countdown-event-label');
  const dateCaption = document.getElementById('countdown-date-caption');
  const settings = document.getElementById('countdown-settings');
  const form = document.getElementById('countdown-form');
  const nameInput = document.getElementById('event-name');
  const dateInput = document.getElementById('exam-date');
  const styleInput = document.getElementById('countdown-style');
  const accentInput = document.getElementById('countdown-accent');
  const message = document.getElementById('settings-message');
  const validStyle = new Set(['standard','large']);
  const validAccent = new Set(['mint','emerald','cream']);
  let config = null;

  function parseCivilDate(input) {
    if (typeof input !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(input)) return null;
    const [year,month,day] = input.split('-').map(Number);
    if (year < 2000 || year > 2100) return null;
    const d = new Date(Date.UTC(year,month - 1,day));
    if (d.getUTCFullYear() !== year || d.getUTCMonth() !== month - 1 || d.getUTCDate() !== day) return null;
    return {year,month,day,serial: Date.UTC(year,month - 1,day) / 86400000};
  }

  function todayTaipei() {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'
    }).formatToParts(new Date());
    const data = Object.fromEntries(parts.map(part => [part.type,part.value]));
    return Date.UTC(Number(data.year),Number(data.month) - 1,Number(data.day)) / 86400000;
  }

  function normalize(raw) {
    if (!raw || !parseCivilDate(raw.date)) return null;
    return {
      date:raw.date,
      name:typeof raw.name === 'string' ? raw.name.trim().slice(0,24) || '觀護人考試' : '觀護人考試',
      style:validStyle.has(raw.style) ? raw.style : 'standard',
      accent:validAccent.has(raw.accent) ? raw.accent : 'mint'
    };
  }

  function render() {
    card.dataset.style = config?.style || 'standard';
    card.dataset.accent = config?.accent || 'mint';
    if (!config) {
      eventLabel.textContent = '考試倒數';
      dateCaption.textContent = '';
      value.textContent = '尚未設定考試日期';
      return;
    }
    const exam = parseCivilDate(config.date);
    const days = exam.serial - todayTaipei();
    eventLabel.textContent = `距離${config.name}`;
    dateCaption.textContent = `${exam.year}/${String(exam.month).padStart(2,'0')}/${String(exam.day).padStart(2,'0')}`;
    if (days > 0) value.textContent = `${days} 天`;
    else if (days === 0) value.textContent = '就是今天！';
    else value.textContent = `已結束 ${Math.abs(days)} 天`;
  }

  function fill() {
    nameInput.value = config?.name || '觀護人考試';
    dateInput.value = config?.date || '';
    styleInput.value = config?.style || 'standard';
    accentInput.value = config?.accent || 'mint';
  }

  try { config = normalize(JSON.parse(localStorage.getItem(STORE_KEY) || 'null')); }
  catch { config = null; }
  fill();
  render();

  form.addEventListener('submit',event => {
    event.preventDefault();
    const next = normalize({date:dateInput.value,name:nameInput.value,
      style:styleInput.value,accent:accentInput.value});
    if (!next) {message.textContent = '請填入有效日期（2000年至2100年）。';return;}
    try {
      localStorage.setItem(STORE_KEY,JSON.stringify(next));
      config = next;
      render();
      settings.open = false;
      message.textContent = '倒數以臺灣日期計算，設定只儲存在目前瀏覽器，不會影響作答紀錄。';
    } catch {
      config = next;
      render();
      message.textContent = '已更新本次畫面，但瀏覽器無法儲存設定；重新開啟後可能需要重設。';
    }
  });

  document.getElementById('reset-countdown').addEventListener('click',() => {
    try {localStorage.removeItem(STORE_KEY);}
    catch {message.textContent = '瀏覽器無法清除已儲存設定。';return;}
    config = null;
    fill();
    render();
    settings.open = false;
  });
  // 開啟頁面後即使跨過午夜，也會自動重新計算；返回分頁時即時更新。
  setInterval(render,60000);
  window.addEventListener('focus',render);
  window.addEventListener('pageshow',render);
  document.addEventListener('visibilitychange',() => {if (!document.hidden) render();});
})();
</script>
</body>
</html>
