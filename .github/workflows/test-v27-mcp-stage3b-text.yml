name: v2.7 MCP stage 3b constitutional and legislative text audit

on:
  push:
    branches:
      - experiment/v27-mcp-stage3b
    paths:
      - 'experiments/v27-mcp-poc/stage3b_text_sources.py'
      - '.github/workflows/test-v27-mcp-stage3b-text.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-sources:
    name: Independently verify 3 constitutional and 2 legislative sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolate MCP caches
        run: echo "MCP_TAIWAN_LEGAL_DB_HOME=$RUNNER_TEMP/v27-mcp-stage3b-text" >> "$GITHUB_ENV"
      - name: Fetch approved upstream revision
        env:
          UPSTREAM_SHA: ef677ad63c3206fc211a083fad8b1d9ef5015222
        run: |
          git init "$RUNNER_TEMP/legal-mcp"
          git -C "$RUNNER_TEMP/legal-mcp" remote add origin https://github.com/lawchat-oss/mcp-taiwan-legal-db.git
          git -C "$RUNNER_TEMP/legal-mcp" fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C "$RUNNER_TEMP/legal-mcp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/legal-mcp" rev-parse HEAD)" = "$UPSTREAM_SHA"
      - name: Install pinned tool
        run: python -m pip install "$RUNNER_TEMP/legal-mcp"
      - name: Selftest exact matching and official origin guards
        run: |
          python -m py_compile experiments/v27-mcp-poc/stage3b_text_sources.py
          python experiments/v27-mcp-poc/stage3b_text_sources.py --mode selftest
      - name: Verify five official primary sources
        run: timeout 660s python experiments/v27-mcp-poc/stage3b_text_sources.py --mode live
      - name: Save metadata-only comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v27-stage3b-text-audit
          path: v27-mcp-stage3b-text-sources.json
          if-no-files-found: warn
          retention-days: 14
