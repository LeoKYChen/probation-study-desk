name: Police original past papers audit (108-115)
on:
  workflow_dispatch:
    inputs:
      year:
        description: "Limit to one ROC year; leave empty for all 108-115"
        required: false
        type: string
  push:
    branches:
      - feat/police-past-papers-108-115-originals
    paths:
      - 'police-exams/catalog.json'
      - 'police-exams/tools/**'
      - '.github/workflows/police-originals-audit.yml'
permissions:
  contents: read
jobs:
  collect-audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction libraries
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' 'pymupdf>=1.24,<2'
      - name: Unit tests
        run: python -m unittest discover -s police-exams/tools -p 'test_*.py' -v
      - name: Collect only official PDFs to review candidates
        shell: bash
        run: |
          if [ -n "${{ inputs.year }}" ]; then
            python police-exams/tools/collect_originals.py --year "${{ inputs.year }}" --out police-exams/output
          else
            python police-exams/tools/collect_originals.py --out police-exams/output
          fi
      - name: Upload candidate questions and audit for human verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: police-past-papers-candidates-${{ github.run_id }}
          path: police-exams/output/
          if-no-files-found: warn
          retention-days: 14
      - name: Never publish unreviewed text
        run: |
          test ! -f police-exams/questions.approved.js || grep -q 'POLICE_ORIGINAL_QUESTION_BANK' police-exams/questions.approved.js
          echo "Audit outputs are artifacts only. No auto-commit, deployment, or publication."
