name: v2.7 MCP stage 2 historical-letter gap review

on:
  push:
    branches:
      - experiment/v27-mcp-stage2
    paths:
      - 'experiments/v27-mcp-poc/stage2_gap_review.py'
      - '.github/workflows/test-v27-mcp-stage2-gaps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gap-review:
    name: Verify four older letters are official abstract-only records
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure isolated cache
        run: echo "MCP_TAIWAN_LEGAL_DB_HOME=$RUNNER_TEMP/mcp-v27-stage2-gap-cache" >> "$GITHUB_ENV"
      - name: Download approved upstream commit
        env:
          UPSTREAM_SHA: ef677ad63c3206fc211a083fad8b1d9ef5015222
        run: |
          git init "$RUNNER_TEMP/mcp-taiwan-legal-db"
          git -C "$RUNNER_TEMP/mcp-taiwan-legal-db" remote add origin https://github.com/lawchat-oss/mcp-taiwan-legal-db.git
          git -C "$RUNNER_TEMP/mcp-taiwan-legal-db" fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C "$RUNNER_TEMP/mcp-taiwan-legal-db" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mcp-taiwan-legal-db" rev-parse HEAD)" = "$UPSTREAM_SHA"
      - name: Install pinned MCP
        run: python -m pip install "$RUNNER_TEMP/mcp-taiwan-legal-db"
      - name: Focused offline checks
        run: |
          python -m py_compile experiments/v27-mcp-poc/stage2_gap_review.py
          python experiments/v27-mcp-poc/stage2_gap_review.py --mode selftest
      - name: Review four remaining official sources
        run: timeout 540s python experiments/v27-mcp-poc/stage2_gap_review.py --mode live
      - name: Preserve gap classifications, not source texts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v27-mcp-stage2-four-gap-review
          path: v27-mcp-stage2-gaps-report.json
          if-no-files-found: warn
          retention-days: 14
