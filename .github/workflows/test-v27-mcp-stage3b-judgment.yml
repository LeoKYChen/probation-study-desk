name: v2.7 MCP stage 3b judgment exact-check follow-up

on:
  push:
    branches:
      - experiment/v27-mcp-stage3b
    paths:
      - 'experiments/v27-mcp-poc/stage3b_judgment_exact.py'
      - '.github/workflows/test-v27-mcp-stage3b-judgment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  judgment:
    name: Validate 2 public JIDs without storing court text
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolate temporary MCP caches
        run: echo "MCP_TAIWAN_LEGAL_DB_HOME=$RUNNER_TEMP/v27-mcp-stage3b-judgment" >> "$GITHUB_ENV"
      - name: Fetch pinned upstream commit
        env:
          UPSTREAM_SHA: ef677ad63c3206fc211a083fad8b1d9ef5015222
        run: |
          git init "$RUNNER_TEMP/legal-mcp"
          git -C "$RUNNER_TEMP/legal-mcp" remote add origin https://github.com/lawchat-oss/mcp-taiwan-legal-db.git
          git -C "$RUNNER_TEMP/legal-mcp" fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C "$RUNNER_TEMP/legal-mcp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/legal-mcp" rev-parse HEAD)" = "$UPSTREAM_SHA"
      - name: Install MCP
        run: python -m pip install "$RUNNER_TEMP/legal-mcp"
      - name: Run syntax/security fixtures
        run: |
          python -m py_compile experiments/v27-mcp-poc/stage3b_judgment_exact.py
          python experiments/v27-mcp-poc/stage3b_judgment_exact.py --mode selftest
      - name: Recheck 2 public cases and 1 exact JID lookup
        run: timeout 680s python experiments/v27-mcp-poc/stage3b_judgment_exact.py --mode live
      - name: Preserve metadata-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v27-stage3b-judgment-exact-followup
          path: v27-mcp-stage3b-judgments.json
          if-no-files-found: warn
          retention-days: 14
