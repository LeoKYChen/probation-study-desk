name: v2.7 MCP stage 3k linked official appellate pages

on:
  push:
    branches:
      - experiment/v27-mcp-stage3k
    paths:
      - 'experiments/v27-mcp-poc/stage3k_linked_history.py'
      - '.github/workflows/test-v27-mcp-stage3k.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linked-court-samples:
    name: Seven parent lists and up to fourteen independently checked links
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JUDICIAL_API_LIVE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal public-source parsing packages only
        run: python -m pip install 'httpx>=0.27,<0.29' 'beautifulsoup4>=4.12,<5' 'lxml>=5,<7'
      - name: Verify independent link, private-case exclusion and date-check fixtures
        run: |
          python -m py_compile experiments/v27-mcp-poc/stage3k_linked_history.py
          python experiments/v27-mcp-poc/stage3k_linked_history.py --mode selftest
      - name: Bounded official linked-case availability checks
        run: timeout 570s python -u experiments/v27-mcp-poc/stage3k_linked_history.py --mode live
      - name: Verify no credential usage, no court text saved and no public deployment
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('experiments/v27-mcp-poc/stage3k_linked_history.py').read_text()
          for token in ("MAX_PARENT_GET = 7","MAX_HISTORY_GET = 7",
                        "MAX_LINK_GET = 14","LINKS_PER_PARENT = 2",
                        'follow_redirects=False',
                        '"no_new_related_jid_saved":True',
                        '"no_linked_court_text_saved":True',
                        'report["stage3_accepted"]=False'):
              assert token in src, f"Missing safety guard: {token}"
          public=Path('development/v2.7')
          assert public.is_dir()
          assert 'status:404' in Path('services/v2.7-judgment/private-worker.mjs').read_text()
          print('Stage3k remains isolated: no real API, persistent cache or public court endpoint')
          PY
      - name: Retain counts and boolean checks only, no linked JIDs or text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v27-stage3k-linked-official-source-sample
          path: v27-mcp-stage3k-linked-history-sample.json
          if-no-files-found: warn
          retention-days: 14
