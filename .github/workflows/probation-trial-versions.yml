name: Probation trial versions
on:
  pull_request:
    paths:
      - 'v2.5/**'
      - 'verification/trial-versions.test.cjs'
      - '.github/workflows/probation-trial-versions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node verification/trial-versions.test.cjs
