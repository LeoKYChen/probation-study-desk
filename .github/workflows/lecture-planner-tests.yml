name: Lecture planner tests
on:
  push:
    branches: [feature/lecture-planner-20261018]
  pull_request:
    paths:
      - 'lectures/**'
      - 'backup/**'
      - 'index.html'
      - 'offline-manifest.json'
jobs:
  lecture-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate lecture scheduling and backups
        run: |
          node --check lectures/core.js
          node --check lectures/app.js
          node lectures/test.cjs
          node backup/test.cjs

  regenerate-source-locked-zip:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'build(zip): regenerate')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lecture-planner-20261018
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate and verify all JSON bridge bundles
        run: |
          node scripts/generate-file-data.cjs --write
          node scripts/generate-file-data.cjs --check
      - name: Commit only generated bridge files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add file-data/*.generated.js
          if ! git diff --cached --quiet; then
            git commit -m "build(zip): update source-locked offline generated files"
            git push origin HEAD:feature/lecture-planner-20261018
          fi
