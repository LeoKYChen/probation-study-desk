name: Lecture planner isolated Cloudflare preview
on:
  push:
    branches:
      - feature/lecture-planner-20261018
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: lecture-planner-preview
  cancel-in-progress: true

jobs:
  validate-and-preview:
    if: github.repository == 'LeoKYChen/probation-study-desk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Validate course scheduler and backup
        run: |
          node lectures/test.cjs
          node backup/test.cjs
          node --check lectures/core.js
          node --check lectures/app.js
      - name: Build isolated identical static preview
        run: |
          python3 scripts/build-cloudflare-main-mirror.py
          test -s cloudflare-main-mirror-dist/lectures/index.html
          test -s cloudflare-main-mirror-dist/lectures/core.js
          test -s cloudflare-main-mirror-dist/lectures/app.js
      - name: Deploy separate Cloudflare preview branch only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-main-mirror-dist --project-name=probation-study30-test --branch=lecture-planner-preview
      - name: Check preview URL
        run: |
          curl --fail --silent --show-error --location --retry 4 --retry-delay 4 --max-time 20 https://lecture-planner-preview.probation-study30-test.pages.dev/lectures/ | grep -q '函授學習管理'
