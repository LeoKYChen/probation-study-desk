name: IndexedDB foundation draft checks
on:
  pull_request:
    branches: [feature/study30-google-drive-sync-stage3-20261028]
    paths: ['storage/**', '.github/workflows/indexeddb-foundation.yml']
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/psd-idb-test --no-save --ignore-scripts --no-audit fake-indexeddb playwright@1.62.1
      - run: /tmp/psd-idb-test/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: node storage/indexeddb.test.cjs && node storage/browser.test.cjs
        env:
          NODE_PATH: /tmp/psd-idb-test/node_modules
