name: Check common-subjects v0.4
on:
  push:
    branches:
      - feature/common-subjects-v02
      - feature/common-subjects-staresto-links
      - feature/common-subjects-v04-staresto-native
    paths:
      - common-subjects/**
      - .github/workflows/check-common-subjects.yml
  pull_request:
    branches:
      - main
    paths:
      - common-subjects/**
      - .github/workflows/check-common-subjects.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate standalone website
        shell: bash
        run: |
          node --check common-subjects/essay-questions-v1.js
          node --check common-subjects/essay-questions-v2.js
          node --check common-subjects/essay-questions-v3.js
          node --check common-subjects/english-v02.js
          node --check common-subjects/test-v02.cjs
          node common-subjects/test-v02.cjs
          node --check common-subjects/staresto-resources.js
          node --check common-subjects/staresto-integration.js
          node --check common-subjects/test-staresto.cjs
          node common-subjects/test-staresto.cjs
          node --check common-subjects/daily/engine.js
          node --check common-subjects/daily/app.js
          node common-subjects/daily/test-v04.cjs
          node common-subjects/daily/test-ui-v04.cjs
