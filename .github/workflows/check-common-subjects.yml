name: Check common-subjects v0.2
on:
  push:
    branches:
      - feature/common-subjects-v02
    paths:
      - common-subjects/**
      - .github/workflows/check-common-subjects.yml
  pull_request:
    branches:
      - main
    paths:
      - common-subjects/**
      - .github/workflows/check-common-subjects.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate standalone website
        shell: bash
        run: |
          node --check common-subjects/english-v02.js
          node --check common-subjects/test-v02.cjs
          node common-subjects/test-v02.cjs
