name: Read-only Cloudflare production inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Read project settings and preserve current production identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare-production-preflight.py
      - name: Exercise production guard without deploying or rolling back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare-release-control.py prepare --commit '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-read-only-inventory
          path: |
            cloudflare-production-preflight.json
            cloudflare-production-before-release.json
