name: v2.7 MCP stage 1 H20 historical verification

on:
  push:
    branches:
      - experiment/v27-mcp-stage1
    paths:
      - 'experiments/v27-mcp-poc/stage1_history.py'
      - '.github/workflows/test-v27-mcp-stage1-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    name: Independently verify H20 official historical articles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure isolated cache
        run: echo "MCP_TAIWAN_LEGAL_DB_HOME=$RUNNER_TEMP/mcp-v27-history-cache" >> "$GITHUB_ENV"
      - name: Download pinned MCP upstream
        env:
          UPSTREAM_SHA: ef677ad63c3206fc211a083fad8b1d9ef5015222
        run: |
          git init "$RUNNER_TEMP/mcp-taiwan-legal-db"
          git -C "$RUNNER_TEMP/mcp-taiwan-legal-db" remote add origin https://github.com/lawchat-oss/mcp-taiwan-legal-db.git
          git -C "$RUNNER_TEMP/mcp-taiwan-legal-db" fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C "$RUNNER_TEMP/mcp-taiwan-legal-db" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mcp-taiwan-legal-db" rev-parse HEAD)" = "$UPSTREAM_SHA"
      - name: Install pinned MCP
        run: python -m pip install "$RUNNER_TEMP/mcp-taiwan-legal-db"
      - name: Syntax and offline verifier
        run: |
          python -m py_compile experiments/v27-mcp-poc/stage1_history.py
          python experiments/v27-mcp-poc/stage1_history.py --mode selftest
      - name: Independent historical source comparison (H20 only)
        run: timeout 630s python experiments/v27-mcp-poc/stage1_history.py --mode live
      - name: Save evidence for H20
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v27-mcp-stage1-history-h20
          path: v27-mcp-stage1-history-report.json
          if-no-files-found: warn
          retention-days: 14
