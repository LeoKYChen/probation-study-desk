name: v2.7.1c - D1 token diagnostic (read-only)

on:
  push:
    branches: [feature/v2.7-legal-search]
    paths:
      - '.github/workflows/diagnose-v271c-d1-token.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-token:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate dedicated D1 secret formatting without displaying it
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CF_ACCOUNT" ] || [ -z "$CF_TOKEN" ]; then
            echo "::error::Account ID or D1-specific token secret is missing"
            exit 1
          fi
          CLEAN_TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"
          if [ "$CLEAN_TOKEN" != "$CF_TOKEN" ]; then
            echo "::notice::Secret contains whitespace or line breaks (check copied token)"
          fi
          if [[ ! "$CLEAN_TOKEN" =~ ^[a-zA-Z0-9._-]+$ ]] || [ ${#CLEAN_TOKEN} -lt 20 ] || [ ${#CLEAN_TOKEN} -gt 256 ]; then
            echo "::error::Secret format is not a raw Cloudflare API token (do not paste Bearer, curl, labels, or JSON)"
            exit 1
          fi
          echo "Secret formatting looks plausible (content hidden)."
          export CLOUDFLARE_DIAG_TOKEN="$CLEAN_TOKEN"
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ["CLOUDFLARE_DIAG_TOKEN"]
          req = urllib.request.Request(
            "https://api.cloudflare.com/client/v4/user/tokens/verify",
            headers={"Authorization":f"Bearer {token}","Accept":"application/json"})
          try:
              with urllib.request.urlopen(req, timeout=20) as res:
                  response = res.read(64000)
                  http = res.status
          except urllib.error.HTTPError as exc:
              response = exc.read(64000)
              http = exc.code
          try:
              obj=json.loads(response)
          except Exception:
              print(f"Cloudflare verification returned non-JSON HTTP {http}; no token values displayed")
              raise SystemExit(1)
          codes=[str(e.get("code","?")) for e in obj.get("errors",[]) if isinstance(e,dict)]
          success=obj.get("success") is True
          status=(obj.get("result") or {}).get("status")
          print(f"Cloudflare token verification: success={success}; HTTP={http}; codes={','.join(codes) or 'none'}; status={status or 'unknown'}")
          if not success or status not in (None,"active"):
              print("STOP: no D1 databases created. Review token validity/activation or account permissions.")
              raise SystemExit(1)
          print("Token is valid. Next step: read-only D1 scope/database-count check.")
          PY

      - name: Check D1 access on the exact configured account (read-only)
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,re
          token="".join(os.environ["CF_TOKEN"].split())
          account=os.environ["CF_ACCOUNT"].strip()
          if not re.fullmatch(r"[A-Za-z0-9]{32}",account):
              print("Account ID has unexpected format; this check is read-only.")
              raise SystemExit(1)
          req=urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account}/d1/database?per_page=100",
              headers={"Authorization":f"Bearer {token}","Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=25) as response:
                  body=response.read(100000)
                  http=response.status
          except urllib.error.HTTPError as err:
              body=err.read(100000)
              http=err.code
          try:
              data=json.loads(body)
          except Exception:
              print(f"D1 direct access: HTTP {http}, non-JSON response")
              raise SystemExit(1)
          if data.get("success") is not True:
              codes=[str(e.get("code","?")) for e in data.get("errors",[]) if isinstance(e,dict)]
              print(f"D1 direct access denied: HTTP {http}; Cloudflare error codes: {','.join(codes)}")
              print("Token itself is valid. Check D1 permission and specific-account resource selection.")
              raise SystemExit(1)
          databases=data.get("result")
          if not isinstance(databases,list):raise SystemExit("Unexpected D1 response structure")
          count=(data.get("result_info") or {}).get("total_count")
          count=int(count) if count is not None else len(databases)
          planned={"probation-v271c-metadata-synth-20261015","probation-v271c-ledger-synth-20261015"}
          collisions=[db.get("name") for db in databases if db.get("name") in planned]
          print("Read-only D1 access verified on configured Cloudflare account.")
          print(f"Total databases: {count}; free-account headroom for two: {count<=8}")
          print(f"Collision with reserved synthetic names: {bool(collisions)}")
          print("No resources were created, altered or deleted.")
          PY
