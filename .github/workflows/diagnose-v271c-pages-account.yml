name: v2.7.1c - Verify existing Pages account context

on:
  push:
    branches: [feature/v2.7-legal-search]
    paths:
      - '.github/workflows/diagnose-v271c-pages-account.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-context:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check established Pages credentials on exact account (read-only)
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,re
          acc=os.environ.get("CF_ACCOUNT","").strip()
          token=os.environ.get("PAGES_TOKEN","").strip()
          if not re.fullmatch(r"[a-fA-F0-9]{32}",acc) or not token:
              raise SystemExit("Existing Pages account secret invalid or missing")
          url=f"https://api.cloudflare.com/client/v4/accounts/{acc}/pages/projects/probation-legal-ai-test"
          req=urllib.request.Request(url,headers={"Authorization":f"Bearer {token}","Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  data=json.loads(response.read(200000))
                  http=response.status
          except urllib.error.HTTPError as e:
              try: data=json.loads(e.read(200000))
              except Exception: data={}
              http=e.code
          if data.get("success") is True and data.get("result",{}).get("name")=="probation-legal-ai-test":
              print("SUCCESS: GitHub CLOUDFLARE_ACCOUNT_ID matches the active Pages project account.")
              print("Existing Pages Token authenticated to this exact account.")
          else:
              codes=[str(x.get("code","?")) for x in data.get("errors",[]) if isinstance(x,dict)]
              print(f"Unable to confirm Pages project account with existing secret: HTTP {http}; codes={','.join(codes)}")
              raise SystemExit(1)
          print("Read-only test. No Cloudflare resources were changed.")
          PY
