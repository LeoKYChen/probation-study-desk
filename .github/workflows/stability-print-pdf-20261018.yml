name: Phase 1 isolated PDF print QA 20261018
on:
  push:
    branches: [test/phase1-print-pdf-20261018]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase1-print-pdf-20261018
  cancel-in-progress: false
jobs:
  pdf-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify base release unaffected and only QA files added
        shell: bash
        run: |
          set -euo pipefail
          BASE=57055ee27e8698245fb39fc9b2a3212c15203af1
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | sort >/tmp/actual-changes
          printf '%s\n' '.github/workflows/stability-print-pdf-20261018.yml' 'print/qa-fixture-20261018.html' | sort >/tmp/allowed-changes
          diff -u /tmp/allowed-changes /tmp/actual-changes
          echo "PASS: original static website source and main unchanged"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Read-only print model and test fixture integrity
        run: |
          set -euo pipefail
          node --check print/print-model.js
          node --check print/app.js
          node --check print/test.cjs
          node --check print/test-browser.cjs
          node print/test.cjs
          python3 scripts/build-cloudflare-main-mirror.py
          test -s cloudflare-main-mirror-dist/print/qa-fixture-20261018.html
          cmp print/qa-fixture-20261018.html cloudflare-main-mirror-dist/print/qa-fixture-20261018.html
          cmp print/index.html cloudflare-main-mirror-dist/print/index.html
          cmp print/app.js cloudflare-main-mirror-dist/print/app.js
          cmp print/print-model.js cloudflare-main-mirror-dist/print/print-model.js
          echo "PASS: QA test fixture isolated; read-only print source untouched"
      - name: Install isolated browsers
        run: |
          npm install --prefix /tmp/qa-print-browser --no-save playwright@1.62.1
          /tmp/qa-print-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Chromium real A4 PDF output and stored-answer preservation
        env:
          NODE_PATH: /tmp/qa-print-browser/node_modules
        run: |
          node print/test-browser.cjs
          TEST_PATH_PREFIX=/probation-study-desk node print/test-browser.cjs
      - name: WebKit mobile print preview and stored-answer preservation
        env:
          NODE_PATH: /tmp/qa-print-browser/node_modules
          TEST_BROWSER: webkit
        run: node print/test-browser.cjs
      - name: Deploy Cloudflare separate print QA alias only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-main-mirror-dist --project-name=probation-study30-test --branch=qa-print-20261018 --commit-hash=${{ github.sha }}
      - name: Verify every live isolated QA asset byte
        run: python3 scripts/verify-published-bytes.py cloudflare-main-mirror-dist https://qa-print-20261018.probation-study30-test.pages.dev/
      - name: Test real HTTPS synthetic entry and print preview without touching user data
        env:
          NODE_PATH: /tmp/qa-print-browser/node_modules
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/qa-print-live-20261018.cjs <<'NODE'
          const {chromium,webkit}=require('playwright'),assert=require('node:assert/strict');
          const host='https://qa-print-20261018.probation-study30-test.pages.dev';
          (async()=>{
           for(const [name,engine] of [['chromium',chromium],['webkit',webkit]]){
            const browser=await engine.launch({headless:true});
            try{
             const context=await browser.newContext({viewport:{width:390,height:844},locale:'zh-TW'});
             const page=await context.newPage();
             await page.goto(host+'/print/qa-fixture-20261018.html',{waitUntil:'load',timeout:40000});
             await page.locator('#seed').click();
             assert.match(await page.locator('#state').innerText(),/已建立兩篇純假作文/);
             const original=await page.evaluate(()=>localStorage.getItem('psd-common-subjects-v1'));
             assert(original?.includes('QA_PDF_20261018'));
             await page.locator('#printLink').click();
             await page.waitForFunction(()=>document.getElementById('notice')?.textContent.includes('已讀取 2 筆'),{timeout:25000});
             assert.equal(await page.locator('#module').inputValue(),'common');
             await page.locator('#selectVisible').click();
             await page.locator('#preview').click();
             assert.equal(await page.locator('.print-sheet').count(),2);
             let sheets=await page.locator('#paper').innerText();
             assert(sheets.includes('第二篇假作文')&&sheets.includes('純測試舊稿版本')&&sheets.includes('純測試評語'));
             if(name==='chromium'){
              const pdf=await page.pdf({format:'A4',printBackground:false});
              assert.equal(pdf.subarray(0,5).toString(),'%PDF-');
              assert(pdf.length>3000);
             }
             await page.locator('#includeFeedback').uncheck();
             sheets=await page.locator('#paper').innerText();
             assert(!sheets.includes('純測試評語'),'hidden feedback must not print');
             assert.equal(await page.evaluate(()=>localStorage.getItem('psd-common-subjects-v1')),original);
             await page.reload({waitUntil:'load'});
             await page.waitForFunction(()=>document.getElementById('notice')?.textContent.includes('已讀取 2 筆'),{timeout:25000});
             assert.equal(await page.evaluate(()=>localStorage.getItem('psd-common-subjects-v1')),original);
             console.log('PASS live '+name+': HTTPS fixture, two essays, A4 preview, feedback switch, reload, immutable records'+(name==='chromium'?', PDF output':''));
             await context.close();
            } finally { await browser.close(); }
           }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          node /tmp/qa-print-live-20261018.cjs
