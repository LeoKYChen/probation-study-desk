name: v2.7 - Sync current laws from MOJ

on:
  push:
    branches:
      - feature/v2.7-legal-search
    paths:
      - 'development/v2.7/scripts/**'
      - '.github/workflows/sync-v27-official-laws.yml'
  workflow_dispatch:
  schedule:
    # 1st and 15th at 10:15 AM Asia/Taipei
    - cron: '15 2 1,15 * *'

permissions:
  contents: write

concurrency:
  group: v27-law-sync
  cancel-in-progress: false

jobs:
  synchronize:
    name: Verify official snapshot and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only development branch
        uses: actions/checkout@v4
        with:
          ref: feature/v2.7-legal-search
          persist-credentials: true

      - name: Verify importer with synthetic fixtures
        run: python3 -m unittest discover -s development/v2.7/scripts -p 'test_*.py'

      - name: Download official MOJ current laws
        run: python3 development/v2.7/scripts/sync_official_laws.py

      - name: Check generated JSON consistency
        run: |
          python3 - <<'PY'
          import json
          p="development/v2.7/laws.json"
          j=json.load(open(p,encoding="utf-8"))
          from collections import Counter
          c=Counter(a["id"] for a in j["articles"])
          assert c["C0010011"]>=60 and c["I0030002"]>=20, c
          assert len(j["articles"])==sum(c.values())
          print("Verified law counts:",dict(c),"source updated:",j["sourceUpdateDate"])
          PY

      - name: Publish versioned legal dataset to branch
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add development/v2.7/laws.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dataset differences; no commit needed."
          else
            git commit -m "data(v2.7): sync verified MOJ statute snapshot"
            git push origin HEAD:feature/v2.7-legal-search
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT" ] || [ -z "$CF_TOKEN" ]; then
            echo "::error::Cloudflare account ID or token not configured; data was verified but cannot deploy."
            exit 1
          fi

      - name: Deploy verified legal search assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install --no-save wrangler@4
          npx wrangler pages deploy development/v2.7 --project-name=probation-legal-ai-test --branch=feature/v2.7-legal-search
