name: v2.7.1c - D1 remote read-only permission check

on:
  push:
    branches: [feature/v2.7-legal-search]
    paths:
      - '.github/workflows/preflight-v271c-d1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check available Cloudflare secrets (without revealing them)
        id: secrets
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT" ] || [ -z "$CF_TOKEN" ]; then
            echo "::error::Cloudflare D1-specific token or account ID is missing. Set CLOUDFLARE_D1_API_TOKEN without changing Pages token."
            exit 1
          fi
          echo "Secrets are set; never display their values."

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Check D1 read permission, do not provision anything
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          # Cloudflare tokens have no whitespace. Remove accidental copy/paste
          # CR/LF and surrounding spaces in runner memory; do not display value.
          CLEAN_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\\r\\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$CLEAN_TOKEN" ] || [[ "$CLEAN_TOKEN" =~ [[:space:]] ]]; then
            echo "::error::D1 token contains invalid whitespace. Please re-save its value in GitHub Secrets."
            exit 1
          fi
          if [ "$CLEAN_TOKEN" != "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Removed whitespace from D1 token in runner memory only. Consider re-saving GitHub Secret without whitespace."
          fi
          export CLOUDFLARE_API_TOKEN="$CLEAN_TOKEN"
          # Names and database identifiers are not written to workflow logs.
          npx wrangler d1 list --json >/tmp/v271c-d1-list.json
          node - <<'JS'
          const fs=require('node:fs');
          const v=JSON.parse(fs.readFileSync('/tmp/v271c-d1-list.json','utf8'));
          const a=Array.isArray(v)?v:(v.result??[]);
          if(!Array.isArray(a))throw Error('D1 API did not return a list');
          const names=['probation-v271c-metadata-synth-20261015','probation-v271c-ledger-synth-20261015'];
          const hits=names.map(n=>a.some(x=>x.name===n));
          console.log('Cloudflare D1 listing permission: OK');
          console.log('Current D1 database count: '+a.length);
          console.log('Reserved synthetic database names already present: '+hits.map(Boolean).join(', '));
          console.log('READ-ONLY CHECK; ZERO resources created or changed');
          JS

# 2026-10-15: read-only recheck after dedicated D1 token was configured by repository owner.
