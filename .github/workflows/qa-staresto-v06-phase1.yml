name: QA Staresto v0.6 phase1 quality gate
on:
  push:
    branches:
      - feature/staresto-v06-phase1-quality-gate
    paths:
      - staresto-v06/phase1/**
      - common-subjects/catalog/data/**
      - common-subjects/daily/**
      - .github/workflows/qa-staresto-v06-phase1.yml
  pull_request:
    branches:
      - main
    paths:
      - staresto-v06/phase1/**
      - common-subjects/catalog/data/**
      - common-subjects/daily/**
      - .github/workflows/qa-staresto-v06-phase1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Import frozen source corpus into isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/data/staresto-full-catalog-20261016:refs/remotes/origin/data/staresto-full-catalog-20261016
          git worktree add --detach /tmp/staresto-upstream origin/data/staresto-full-catalog-20261016
          mkdir -p staresto-intake
          cp -a /tmp/staresto-upstream/staresto-intake/library staresto-intake/library
      - name: Run catalog source provenance and quality-gate tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile staresto-v06/phase1/audit.py staresto-v06/phase1/test_audit.py staresto-v06/phase1/deep_review.py staresto-v06/phase1/review_anomalies.py staresto-v06/phase1/test_anomalies.py
          python staresto-v06/phase1/audit.py
          python staresto-v06/phase1/test_audit.py
          python staresto-v06/phase1/deep_review.py
          python staresto-v06/phase1/review_anomalies.py
          python staresto-v06/phase1/test_anomalies.py
      - name: Verify existing v0.4 engine regressions (date-independent)
        shell: bash
        run: |
          set -euo pipefail
          node common-subjects/daily/test-v04.cjs
      - name: On PRs require committed reports to match generated evidence
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- staresto-v06/phase1/output
          # git diff alone misses newly generated UNTRACKED outputs.
          if [[ -n "$(git status --porcelain --untracked-files=all -- staresto-v06/phase1/output)" ]]; then
            git status --short --untracked-files=all -- staresto-v06/phase1/output
            echo "Generated report outputs differ from committed evidence."
            exit 1
          fi
      - name: Archive audit evidence without publishing questions
        uses: actions/upload-artifact@v4
        with:
          name: staresto-v06-phase1-audit
          path: staresto-v06/phase1/output/
          retention-days: 30

  publish-audit-evidence:
    needs: audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/staresto-v06-phase1-quality-gate' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: staresto-v06-phase1-audit
          path: staresto-v06/phase1/output/
      - name: Commit reports only if the source branch has not advanced
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/feature/staresto-v06-phase1-quality-gate | cut -f1)"
          if [[ "$current" != "$remote" ]]; then
            echo "A newer branch commit exists; skip stale evidence publication."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- staresto-v06/phase1/output
          if ! git diff --cached --quiet; then
            git commit -m "data(v0.6 phase1): refresh auditable source verification evidence"
            git push origin HEAD:refs/heads/feature/staresto-v06-phase1-quality-gate
          fi
