name: Deploy Study30 Test to Cloudflare Pages

on:
  push:
    branches:
      - feature/study30-v251
    paths:
      - study30-site.zip
      - .github/workflows/deploy-study30-cloudflare.yml
      - study30-addons/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the test branch
        uses: actions/checkout@v6

      - name: Unpack and validate website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-dist
          unzip -q study30-site.zip -d deploy-dist
          node study30-addons/patch-stage3.cjs deploy-dist
          cp study30-addons/essay-review.js deploy-dist/essay-review.js
          node study30-addons/patch-stage4.cjs deploy-dist
          cp study30-addons/essay-analytics.js deploy-dist/essay-analytics.js
          node study30-addons/patch-stage5.cjs deploy-dist
          cp study30-addons/weakness-priority.js deploy-dist/weakness-priority.js
          for required in index.html style.css app.js review-core.js review-simulator.js essay.js essay-rubric-core.js essay-selfcheck.js essay-review.js essay-analytics.js weakness-priority.js; do
            test -s "deploy-dist/$required" || { echo "Missing: $required"; exit 1; }
          done
          for script in deploy-dist/*.js; do node --check "$script"; done
          node --check study30-addons/patch-stage3.cjs
          node --check study30-addons/patch-stage4.cjs
          node --check study30-addons/test-stage4.cjs
          test "$(grep -c 'id="essayAnalyticsSummary"' deploy-dist/index.html)" -eq 1
          node study30-addons/test-stage4.cjs deploy-dist/essay-rubric-core.js
          node --check study30-addons/patch-stage5.cjs
          node --check study30-addons/test-stage5.cjs
          test "$(grep -c 'id=\"weaknessPriorityList\"' deploy-dist/index.html)" -eq 1
          node study30-addons/test-stage5.cjs

      - name: Deploy to existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy-dist --project-name=probation-study30-test --branch=main
