name: Deploy Unified Study30 v2.5.4 Acceptance (isolated)

on:
  push:
    branches:
      - feature/study30-v254-unified-acceptance-1151016
    paths:
      - study30-site.zip
      - .github/workflows/deploy-study30-cloudflare.yml
      - study30-addons/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the test branch
        uses: actions/checkout@v6

      - name: Unpack and validate website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-dist
          unzip -q study30-site.zip -d deploy-dist
          node study30-addons/patch-stage3.cjs deploy-dist
          cp study30-addons/essay-review.js deploy-dist/essay-review.js
          node study30-addons/patch-stage4.cjs deploy-dist
          cp study30-addons/essay-analytics.js deploy-dist/essay-analytics.js
          node study30-addons/patch-stage5.cjs deploy-dist
          cp study30-addons/weakness-priority.js deploy-dist/weakness-priority.js
          # Bundle verified snapshots from the ORIGINAL v2.5 production branch,
          # rather than depend on cross-site scripts at browser runtime.
          git fetch --depth=1 origin main
          git show FETCH_HEAD:v2.5/questions.js > deploy-dist/source-main-questions.js
          git show FETCH_HEAD:v2.5/related-questions.js > deploy-dist/source-related-questions.js
          node study30-addons/patch-stage6.cjs deploy-dist
          cp study30-addons/question-sources.js deploy-dist/question-sources.js
          cp study30-addons/data-health.js deploy-dist/data-health.js
          node study30-addons/patch-stage7.cjs deploy-dist
          cp study30-addons/backup-import.js deploy-dist/backup-import.js
          node study30-addons/patch-stage8.cjs deploy-dist
          cp study30-addons/daily-essay-workbench.js deploy-dist/daily-essay-workbench.js
          node study30-addons/patch-v254.cjs deploy-dist
          cp study30-addons/v254-diagnostics.js deploy-dist/v254-diagnostics.js
          git fetch --depth=1 origin main
          git show FETCH_HEAD:v2.5/shuati-links.js > deploy-dist/study30-shuati-links.js
          git show FETCH_HEAD:v2.5/yamol-links.js > deploy-dist/study30-yamol-links.js
          node study30-addons/patch-stage9-ai-links.cjs deploy-dist
          cp study30-addons/ai-review-links.js deploy-dist/ai-review-links.js
          for required in index.html style.css app.js review-core.js review-simulator.js essay.js essay-rubric-core.js essay-selfcheck.js essay-review.js essay-analytics.js weakness-priority.js source-main-questions.js source-related-questions.js question-sources.js data-health.js backup-import.js daily-essay-workbench.js v254-diagnostics.js study30-shuati-links.js study30-yamol-links.js ai-review-links.js; do
            test -s "deploy-dist/$required" || { echo "Missing: $required"; exit 1; }
          done
          for script in deploy-dist/*.js; do node --check "$script"; done
          node --check study30-addons/patch-stage3.cjs
          node --check study30-addons/patch-stage4.cjs
          node --check study30-addons/test-stage4.cjs
          test "$(grep -c 'id="essayAnalyticsSummary"' deploy-dist/index.html)" -eq 1
          node study30-addons/test-stage4.cjs deploy-dist/essay-rubric-core.js
          node --check study30-addons/patch-stage5.cjs
          node --check study30-addons/test-stage5.cjs
          test "$(grep -c 'id=\"weaknessPriorityList\"' deploy-dist/index.html)" -eq 1
          node study30-addons/test-stage5.cjs
          node --check study30-addons/test-stage3-regression.cjs
          node --check study30-addons/test-integrity.cjs
          node study30-addons/test-stage3-regression.cjs deploy-dist
          node study30-addons/test-integrity.cjs deploy-dist
          node --check study30-addons/patch-stage6.cjs
          node --check study30-addons/test-stage6.cjs
          node --check study30-addons/question-sources.js
          node --check study30-addons/data-health.js
          node study30-addons/test-stage6.cjs deploy-dist
          node --check study30-addons/patch-stage7.cjs
          node --check study30-addons/test-stage7.cjs
          test "$(grep -c 'id="importBackupFile"' deploy-dist/index.html)" -eq 1
          node study30-addons/test-stage7.cjs deploy-dist
          node --check study30-addons/patch-stage8.cjs
          node --check study30-addons/test-stage8.cjs
          node study30-addons/test-stage8.cjs deploy-dist
          node --check study30-addons/patch-v254.cjs
          node --check study30-addons/test-v254.cjs
          node study30-addons/test-v254.cjs deploy-dist
          node --check study30-addons/patch-stage9-ai-links.cjs
          node --check study30-addons/test-stage9-ai-links.cjs
          node study30-addons/test-stage9-ai-links.cjs deploy-dist
          # Apply the separately approved green UI/wording and safe week-backfill patches.
          node study30-addons/patch-content-cleanup.cjs deploy-dist
          node study30-addons/patch-week-practice.cjs deploy-dist
          # Hide backup study tools only in public navigation; preserve their URLs and data.
          node study30-addons/hide-optional-navigation.cjs deploy-dist
          # Cache the FINAL combined bundle, including Stage9 JS and page refinements.
          node study30-addons/install-offline.cjs deploy-dist
          for script in deploy-dist/*.js; do node --check "$script"; done
          node --check deploy-dist/sw.js
          node study30-addons/test-content-cleanup.cjs deploy-dist
          node study30-addons/test-week-behavior.cjs deploy-dist
          node study30-addons/test-offline.cjs deploy-dist
          node study30-addons/test-stage9-ai-links.cjs deploy-dist
      - name: Install isolated Chromium for unified acceptance
        run: |
          npm install --prefix /tmp/daily30-unified --no-save playwright@1.56.1
          /tmp/daily30-unified/node_modules/.bin/playwright install --with-deps chromium
      - name: Test merged website in real browser before deploy
        env:
          NODE_PATH: /tmp/daily30-unified/node_modules
        run: |
          node study30-addons/test-stage9-browser.cjs deploy-dist
          node study30-addons/test-unified-browser.cjs deploy-dist

      - name: Deploy to existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy-dist --project-name=probation-study30-test --branch=v254-unified-preview
