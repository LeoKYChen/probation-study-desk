name: v2.7 Stage 3v documented XML publication source separation

on:
  push:
    branches:
      - experiment/v27-mcp-stage3v
    paths:
      - 'experiments/v27-mcp-poc/stage3v/**'
      - 'experiments/v27-mcp-poc/STAGE3V.md'
      - '.github/workflows/test-v27-mcp-stage3v.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-profile-boundary:
    name: Isolated offline XML source/profile routing tests and prior law standard checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      JUDICIAL_API_LIVE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and source data no-network access audit
        run: |
          node --check experiments/v27-mcp-poc/stage3v/source-profile-gate.cjs
          node --check experiments/v27-mcp-poc/stage3v/source-profile-gate.test.cjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('experiments/v27-mcp-poc/stage3v/source-profile-gate.cjs').read_text()
          for forbidden in (
             'fetch(', 'axios(', 'XMLHttpRequest', 'child_process',
             'require("fs")', 'require("node:fs")',
             'require("node:http")', 'require("node:https")',
             'readFileSync(', 'writeFileSync(', 'process.env'
          ):
             assert forbidden not in p,forbidden
          required=(
             'applicabilityToChineseLawRawXmlIndependentlyVerified: false',
             'officialDataStandardIsXmlTagMapping: false',
             'sourceVerifiedLive: false',
             'canSelectProductionXmlParser: false',
             'stage3Accepted: false',
             'awaiting_authenticated_raw_xml_structure',
             'synthetic_tag_sets_compared_no_real_xml_inference',
          )
          for s in required:
              assert s in p, s
          assert 'status:404' in Path('services/v2.7-judgment/private-worker.mjs').read_text()
          assert Path('development/v2.7').is_dir()
          print('Stage3v no live XML/HTML API, no court data, no production integration')
          PY
      - name: Run Stage3v source-profile safety cases
        run: |
          node --test --test-reporter=tap experiments/v27-mcp-poc/stage3v/source-profile-gate.test.cjs | tee "$RUNNER_TEMP/stage3v-tests.log"
      - name: Preserve prior Stage3t field concepts versus official XML distinction
        run: |
          node --test --test-reporter=tap experiments/v27-mcp-poc/stage3t/official-field-mapper.test.cjs | tee "$RUNNER_TEMP/stage3t-tests.log"
      - name: Anchor this source gate to prior official document and fail-closed result
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const base='experiments/v27-mcp-poc/';
          const gate=require('./'+base+'stage3v/source-profile-gate.cjs');
          const q=require('./'+base+'stage3q-readiness-ledger.cjs');
          const prior=fs.readFileSync(base+'STAGE3U_RESULT.md','utf8');
          assert.match(prior,/official_head_unavailable_no_get/);
          assert.match(prior,/38／38/);
          const doc=fs.readFileSync(base+'STAGE3V.md','utf8');
          assert.match(doc,/英譯法規/);
          assert.match(doc,/applicabilityToChineseLawRawXmlIndependentlyVerified|不能認證中文法規/);
          assert.ok(doc.includes(gate.SRC.MOJ_BRIEF));
          assert.ok(doc.includes(gate.SRC.STANDARD));
          assert.equal(gate.PUBLICATION_FACTS.applicabilityToChineseLawRawXmlIndependentlyVerified,false);
          const x=gate.assessParserSelection({sourceUrl:gate.SRC.RAW,
              claimedProfile:'open_data_law_raw_xml',
              verified:true,authenticatedEvidence:{verified:true}});
          assert.equal(x.canSelectProductionXmlParser,false);
          assert.equal(q.planReview({features:['law_lookup'],approvals:{sourceVerified:true}}).canDeploy,false);
          console.log('Evidence preserved: English XML comparative history, not Chinese schema proof');
          JS
      - name: Prevent mutation of main, v2.5, original v2.7 or Cloudflare
        run: |
          git fetch --no-tags --depth=2 origin experiment/v27-mcp-stage3u
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(
              ['git','diff','--name-only','FETCH_HEAD','HEAD'],text=True).splitlines()
          allowed={
            'experiments/v27-mcp-poc/stage3v/source-profile-gate.cjs',
            'experiments/v27-mcp-poc/stage3v/source-profile-gate.test.cjs',
            'experiments/v27-mcp-poc/STAGE3V.md',
            'experiments/v27-mcp-poc/STAGE3V_RESULT.md',
            '.github/workflows/test-v27-mcp-stage3v.yml',
          }
          assert set(paths).issubset(allowed),paths
          print('Stage3v experiment-only changes:',paths)
          PY
      - name: Write only aggregate source-tag confidence counts
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          function tests(name){
            const txt=fs.readFileSync(process.env.RUNNER_TEMP+'/'+name,'utf8');
            const count=/# tests (\d+)/.exec(txt), pass=/# pass (\d+)/.exec(txt), fail=/# fail (\d+)/.exec(txt);
            if(!count||!pass||!fail||+count[1]!==+pass[1]||+fail[1]!==0)
              throw Error('Test run did not pass: '+name);
            return +pass[1];
          }
          const current=tests('stage3v-tests.log');
          const previous=tests('stage3t-tests.log');
          const model=require('./experiments/v27-mcp-poc/stage3v/source-profile-gate.cjs');
          const report={
            stage:'Stage3v official documentation-based law XML source family gate',
            new_offline_gate_tests_passed:current,
            prior_offline_legal_field_tests_passed:previous,
            total_tests_passed:current+previous,
            test_failures:0,
            documented_xml_difference_case:'historical_English_translation_sample_only',
            documented_xml_tag_families:2,
            actual_chinese_xml_format_equivalence_independently_verified:false,
            official_real_xml_tags_observed:0,
            real_raw_xml_downloads:0,
            xml_xsd_verified:false,
            real_statute_bodies_stored:0,
            production_parser_allowed:false,
            cloudflare_or_v2_5_v2_7_changed:false,
            stage3_accepted:false
          };
          fs.writeFileSync('stage3v-source-profile-summary.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          JS
      - name: Retain only aggregated safety results, no XML/court content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v27-stage3v-official-xml-source-profile-safety
          path: stage3v-source-profile-summary.json
          if-no-files-found: warn
          retention-days: 14
