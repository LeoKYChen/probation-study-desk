name: Deploy isolated study-home preview

on:
  push:
    branches:
      - preview/116-study-home-20261017
    paths:
      - previews/116-study-home/**
      - .github/workflows/deploy-home-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-home-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - name: Verify independent static homepage
        shell: bash
        run: |
          set -euo pipefail
          test -s previews/116-study-home/index.html
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          p=Path("previews/116-study-home/index.html")
          data=p.read_text(encoding="utf-8")
          for x in ['lang="zh-Hant"', 'Asia/Taipei', 'countdown-form', 'exam-date', 'psd-home-exam-countdown-v1', 'https://v254-unified-preview.probation-study30-test.pages.dev/', 'https://leokychen.github.io/probation-study-desk/common-subjects/', 'https://leokychen.github.io/probation-study-desk/daily-simulation/', 'https://leokychen.github.io/probation-study-desk/juvenile-news/', 'https://probation-legal-ai-test.pages.dev/']:
            assert x in data,x
          assert 'localStorage.clear(' not in data
          assert data.count('class="tile course-tile"')==2
          assert data.count('class="tile explore-tile"')==3
          assert '晚間學習室 v2.5 主站' in data
          assert 'workspace-sidebar' in data and 'workspace-topbar' in data
          assert 'room-hero-art' in data
          assert 'date-input-wrap' in data
          assert data.index('課程學習') < data.index('練習與探索')
          explore=data[data.index('<nav class="explore-grid"'):]
          assert explore.index('法律 AI 實驗室') < explore.index('每日模擬') < explore.index('知識補給')
          class A(HTMLParser):
            pass
          A().feed(data)
          print("Verified slide-based 2+3 grid, five isolated links, countdown key and DOM")
          PY
      - name: Deploy only dedicated branch preview (never production)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy previews/116-study-home --project-name=probation-study30-test --branch=home-preview-20261017
      - name: Install browser for live countdown verification
        shell: bash
        run: |
          npm install --prefix /tmp/home-preview-qa --no-save playwright@1.56.1
          /tmp/home-preview-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify mobile input bounding boxes in WebKit and Chromium
        env:
          NODE_PATH: /tmp/home-preview-qa/node_modules
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium,webkit}=require('playwright');
          (async()=>{
            const url='https://home-preview-20261017.probation-study30-test.pages.dev/';
            for(const [kind,engine] of [['chromium',chromium],['webkit',webkit]]){
              const browser=await engine.launch({headless:true});
              try{
                for(const width of [320,375,390,430,580,768,1024,1440]){
                  const context=await browser.newContext({viewport:{width,height:844},locale:'zh-TW',timezoneId:'Asia/Taipei'});
                  const page=await context.newPage();
                  const errors=[];
                  page.on('pageerror',e=>errors.push(String(e)));
                  const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                  assert.equal(response.status(),200);
                  await page.locator('#countdown-settings summary').click();
                  const m=await page.evaluate(()=>{
                    const box=s=>document.querySelector(s).getBoundingClientRect();
                    const card=box('.countdown');
                    return {
                      pageOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                      cardLeft:card.left,cardRight:card.right,
                      fields:['#event-name','.date-input-wrap','#exam-date','#countdown-style','#countdown-accent','.save-button','.clear-button'].map(selector=>{
                        const x=box(selector);return {selector,left:x.left,right:x.right,width:x.width};
                      })
                    };
                  });

                  const design=await page.evaluate(()=>{
                    const body=getComputedStyle(document.body);
                    const course=getComputedStyle(document.querySelector('.course-tile'));
                    const explore=getComputedStyle(document.querySelector('.explore-tile'));
                    const cg=getComputedStyle(document.querySelector('.course-grid'));
                    const eg=getComputedStyle(document.querySelector('.explore-grid'));
                    return {
                      body:body.backgroundColor,text:body.color,
                      courseGradient:course.backgroundImage,courseRadius:course.borderRadius,
                      explore:explore.backgroundColor,exploreAccent:getComputedStyle(document.querySelector('.explore-tile'),'::before').backgroundColor,
                      exploreRadius:explore.borderRadius,
                      sidebar:getComputedStyle(document.querySelector('.workspace-sidebar')).display,
                      topbar:getComputedStyle(document.querySelector('.workspace-topbar')).backgroundColor,
                      hero:getComputedStyle(document.querySelector('.countdown')).backgroundColor,
                      colsCourse:cg.gridTemplateColumns.split(' ').length,
                      colsExplore:eg.gridTemplateColumns.split(' ').length,
                      cards:document.querySelectorAll('.tile').length,
                      headings:[...document.querySelectorAll('section.section h2')].map(n=>n.textContent.trim())
                    };
                  });
                  assert.equal(design.body,'rgb(245, 245, 239)',kind+'/'+width+': not v2.5 paper color');
                  assert.equal(design.text,'rgb(36, 59, 53)',kind+'/'+width+': not v2.5 ink');
                  assert.match(design.courseGradient,/linear-gradient/,kind+'/'+width+': missing reading-room inspired course gradient');
                  assert.equal(design.explore,'rgb(255, 255, 255)',kind+'/'+width+': reading-room card should be white');
                  assert.equal(design.exploreAccent,'rgb(134, 173, 149)',kind+'/'+width+': missing reading-room card accent');
                  assert.equal(design.hero,'rgb(232, 238, 227)',kind+'/'+width+': reading-room pale hero');
                  assert.equal(design.topbar,'rgb(255, 255, 255)',kind+'/'+width+': reading-room white topbar');
                  assert.equal(design.sidebar,width<=860?'none':'flex',kind+'/'+width+': sidebar responsive state');
                  assert.equal(design.courseRadius,'14px',kind+'/'+width+': course card radius');
                  assert.equal(design.exploreRadius,'14px',kind+'/'+width+': exploration card radius');
                  assert.equal(design.cards,5,kind+'/'+width+': expected 5 navigation cards');
                  assert.deepEqual(design.headings,['課程學習','練習與探索']);
                  assert.equal(design.colsCourse,width<=760?1:2,kind+'/'+width+': course grid count');
                  assert.equal(design.colsExplore,width<=760?1:3,kind+'/'+width+': exploration grid count');
                  assert.equal(m.pageOverflow,false,`${kind}/${width}: page overflow`);
                  for(const x of m.fields){
                    assert(x.width>0,`${kind}/${width}: invisible ${x.selector}`);
                    assert(x.left>=m.cardLeft-1&&x.right<=m.cardRight+1,
                      `${kind}/${width}: ${x.selector} overflows the card: ${JSON.stringify(x)}`);
                  }
                  if(width===390){
                    await page.locator('#exam-date').fill('2027-08-14');
                    await page.locator('.save-button').click();
                    assert.match(await page.locator('#countdown-value').innerText(),/^[0-9]+ 天$/);
                    await page.reload({waitUntil:'domcontentloaded'});
                    assert.equal(await page.locator('#countdown-date-caption').innerText(),'2027/08/14');
                  }
                  assert.deepEqual(errors,[],`${kind}/${width}: script errors`);
                  console.log('PASS form layout',kind,width,'px');
                  await context.close();
                }
              }finally{await browser.close();}
            }
          })().catch(e=>{console.error('FAIL mobile layout regression',e);process.exit(1)});
          NODE

      - name: Verify live mobile interactions and record isolation
        env:
          NODE_PATH: /tmp/home-preview-qa/node_modules
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},locale:'zh-TW',timezoneId:'Asia/Taipei'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            const url='https://home-preview-20261017.probation-study30-test.pages.dev/';
            const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
            assert.equal(res.status(),200);
            assert.match(await page.title(),/觀護人學習平台/);
            assert.equal(await page.locator('#countdown-value').innerText(),'尚未設定考試日期');
            await page.evaluate(()=>localStorage.setItem('probation-study30-v251:v1','KEEP_UNCHANGED_TEST'));
            await page.locator('#countdown-settings summary').click();
            assert.equal(await page.locator('#countdown-settings').evaluate(el=>el.open),true);
            await page.locator('#event-name').fill('觀護人測試考試');
            await page.locator('#exam-date').fill('2027-08-14');
            await page.locator('#countdown-style').selectOption('large');
            await page.locator('#countdown-accent').selectOption('emerald');
            await page.getByRole('button',{name:'儲存設定'}).click();
            assert.match(await page.locator('#countdown-value').innerText(),/^\d+ 天$/);
            assert.equal(await page.locator('#countdown-event-label').innerText(),'距離觀護人測試考試');
            let stored=await page.evaluate(()=>JSON.parse(localStorage.getItem('psd-home-exam-countdown-v1')));
            assert.equal(stored.date,'2027-08-14');
            await page.reload({waitUntil:'domcontentloaded'});
            assert.match(await page.locator('#countdown-value').innerText(),/^\d+ 天$/);
            assert.equal(await page.locator('#countdown-event-label').innerText(),'距離觀護人測試考試');
            await page.locator('#countdown-settings summary').click();
            await page.locator('#exam-date').fill('2028-08-12');
            await page.getByRole('button',{name:'儲存設定'}).click();
            stored=await page.evaluate(()=>JSON.parse(localStorage.getItem('psd-home-exam-countdown-v1')));
            assert.equal(stored.date,'2028-08-12');
            await page.locator('#countdown-settings summary').click();
            await page.getByRole('button',{name:'清除倒數'}).click();
            assert.equal(await page.locator('#countdown-value').innerText(),'尚未設定考試日期');
            assert.equal(await page.evaluate(()=>localStorage.getItem('probation-study30-v251:v1')),'KEEP_UNCHANGED_TEST');
            assert.equal(await page.evaluate(()=>localStorage.getItem('psd-home-exam-countdown-v1')),null);
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth),true);
            assert.deepEqual(errors,[]);
            await browser.close();
            console.log('PASS: live HTTPS mobile countdown open, save, reload, modify, reset, existing record untouched, no overflow or JS errors');
          })().catch(e=>{console.error('FAIL live homepage countdown test',e);process.exit(1)});
          NODE

      - name: Audit five live destination sites
        env:
          NODE_PATH: /tmp/home-preview-qa/node_modules
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          const destinations=[
            ['專業科目','https://v254-unified-preview.probation-study30-test.pages.dev/'],
            ['共同科目','https://leokychen.github.io/probation-study-desk/common-subjects/'],
            ['法律 AI 實驗室','https://probation-legal-ai-test.pages.dev/'],
            ['每日模擬','https://leokychen.github.io/probation-study-desk/daily-simulation/'],
            ['知識補給','https://leokychen.github.io/probation-study-desk/juvenile-news/']
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            let failures=0;
            try{
              const context=await browser.newContext({viewport:{width:1280,height:800},locale:'zh-TW'});
              const home=await context.newPage();
              await home.goto('https://home-preview-20261017.probation-study30-test.pages.dev/',{waitUntil:'domcontentloaded'});
              const links=await home.locator('a.tile').evaluateAll(nodes=>nodes.map(el=>({
                href:el.href,label:el.innerText.trim(),target:el.target,rel:el.rel
              })));
              assert.equal(links.length,5);
              for(const [label,url] of destinations){
                const link=links.find(x=>x.href===url);
                assert(link,'Missing homepage link: '+label);
                assert.equal(link.target,'_blank',label+': should open in separate tab');
                assert(link.rel.includes('noopener'),label+': missing noopener');
                const target=await context.newPage();
                let status='N/A',title='',textSize=0,finalUrl='',error='';
                try{
                  const response=await target.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                  status=response?.status()??'NO_HTTP_RESPONSE';
                  title=await target.title();
                  finalUrl=target.url();
                  await target.waitForTimeout(750);
                  textSize=await target.locator('body').innerText().then(x=>x.trim().length).catch(()=>0);
                  if(status!==200 || title.trim().length<2 || textSize<20){
                    failures++;
                    error='Non-200, missing page title or empty page body';
                  }
                }catch(e){failures++;error=String(e).slice(0,240)}
                console.log('ENTRY_RESULT '+JSON.stringify({label,url,status,title,finalUrl,textSize,error}));
                await target.close();
              }
              for(const label of ['專業科目','共同科目','每日模擬','知識補給','法律 AI 實驗室']){
                const link=home.locator('a.tile').filter({hasText:label}).first();
                const [popup]=await Promise.all([home.waitForEvent('popup',{timeout:10000}),link.click()]);
                console.log('LINK_CLICK '+JSON.stringify({label,opened:popup.url()}));
                await popup.close();
              }
              await context.close();
            }finally{await browser.close()}
            assert.equal(failures,0,failures+' destination entries failed live audit');
            console.log('PASS: all five live entries reachable, nonempty, new-tab links, and no navigation regressions');
          })().catch(e=>{console.error('ENTRY_AUDIT_FAILED',e);process.exit(1)});
          NODE

      - name: Smoke test learning module functions
        env:
          NODE_PATH: /tmp/home-preview-qa/node_modules
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const urls={
            professional:'https://v254-unified-preview.probation-study30-test.pages.dev/',
            common:'https://leokychen.github.io/probation-study-desk/common-subjects/',
            daily:'https://leokychen.github.io/probation-study-desk/daily-simulation/',
            weekly:'https://leokychen.github.io/probation-study-desk/juvenile-news/',
            legal:'https://probation-legal-ai-test.pages.dev/'
          };
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const findings=[];
            for(const [name,url] of Object.entries(urls)){
              const ctx=await browser.newContext({acceptDownloads:true,locale:'zh-TW',timezoneId:'Asia/Taipei'});
              const page=await ctx.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              const row={name,status:'pending',url,checks:{},errors};
              try{
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(name==='daily'||name==='weekly'?1800:800);
                row.title=await page.title();
                row.http=response?.status();
                row.checks.content=await page.locator('body').innerText().then(s=>s.trim().length>70);
                if(name==='professional'){
                  row.checks.practiceControls=await page.getByText('30分鐘',{exact:false}).count()>0;
                  row.checks.timer=await page.locator('#timer').count()>0 || await page.getByText('倒數',{exact:false}).count()>0;
                  row.checks.backupExport=await page.getByText('匯出',{exact:false}).count()>0;
                  row.checks.serviceWorker=await page.evaluate(async()=>{
                    if(!('serviceWorker' in navigator))return 'unsupported';
                    await new Promise(resolve=>setTimeout(resolve,1300));
                    const regs=await navigator.serviceWorker.getRegistrations();
                    return regs.map(r=>({scope:r.scope,active:r.active?.state,script:r.active?.scriptURL}));
                  });
                  if(row.checks.serviceWorker.length){
                    try{
                      await page.waitForTimeout(1200);
                      await ctx.setOffline(true);
                      await page.reload({waitUntil:'domcontentloaded',timeout:9000});
                      row.checks.offlineReload=true;
                    }catch(e){row.checks.offlineReload=false;row.checks.offlineError=String(e).slice(0,160)}
                    finally{await ctx.setOffline(false)}
                  }else{row.checks.offlineReload='not verified: service worker absent'}
                }
                if(name==='common'){
                  row.checks.essayTab=await page.locator('#tabEssay').count()===1;
                  row.checks.englishTab=await page.locator('#tabEnglish').count()===1;
                  row.checks.starestoAssistant=await page.locator('a[href="./english-assistant/"]').count()>0;
                  await page.locator('#tabEnglish').click();
                  row.checks.englishPanel=await page.locator('#panelEnglish').isVisible();
                  await page.locator('#tabEssay').click();
                  row.checks.essayPanel=await page.locator('#panelEssay').isVisible();
                  row.checks.export=await page.locator('#export').count()===1;
                }
                if(name==='daily'){
                  row.checks.practicePane=await page.locator('#reader').count()===1;
                  row.checks.backup=await page.locator('#export').count()===1;
                  row.checks.aiClipboard=await page.locator('#copyAI').count()===1;
                  row.checks.questionCount=await page.locator('#total').innerText().catch(()=>'unknown');
                  row.checks.visibleCards=await page.locator('#cards .document-card').count();
                }
                if(name==='weekly'){
                  const r=await page.evaluate(async()=>{const r=await fetch('./issues.json');return {http:r.status,textSize:(await r.text()).length}});
                  row.checks.issues=r;
                  row.checks.readingContent=await page.locator('body').innerText().then(t=>t.includes('少年司法'));
                }
                if(name==='legal'){
                  row.checks.legalSearchUI=(await page.locator('input,textarea,button').count())>2;
                  row.checks.hasPublicLawTerm=await page.locator('body').innerText().then(t=>t.includes('法規')||t.includes('函釋'));
                  row.checks.actualRetrieval='not tested (avoid remote analysis calls)';
                }
                row.status=row.http===200&&row.checks.content?'page-pass':'page-fail';
              }catch(e){row.status='error';row.fail=String(e).slice(0,450)}
              finally{await ctx.close()}
              findings.push(row);
              console.log('MODULE_QA '+JSON.stringify(row));
            }
            await browser.close();
            console.log('MODULE_QA_SUMMARY '+JSON.stringify({pagesReachable:findings.filter(x=>x.status==='page-pass').length,total:findings.length,offline:findings.find(x=>x.name==='professional')?.checks.offlineReload}));
            if(findings.some(x=>x.status!=='page-pass'))process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
