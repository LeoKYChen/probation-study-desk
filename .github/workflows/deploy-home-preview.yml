name: Deploy isolated study-home preview

on:
  push:
    branches:
      - preview/116-study-home-20261017
    paths:
      - previews/116-study-home/**
      - .github/workflows/deploy-home-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-home-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - name: Verify independent static homepage
        shell: bash
        run: |
          set -euo pipefail
          test -s previews/116-study-home/index.html
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          p=Path("previews/116-study-home/index.html")
          data=p.read_text(encoding="utf-8")
          for x in ['lang="zh-Hant"', 'Asia/Taipei', 'countdown-form', 'exam-date', 'psd-home-exam-countdown-v1', 'https://v254-unified-preview.probation-study30-test.pages.dev/', 'https://leokychen.github.io/probation-study-desk/common-subjects/', 'https://leokychen.github.io/probation-study-desk/daily-simulation/', 'https://leokychen.github.io/probation-study-desk/juvenile-news/', 'https://probation-legal-ai-test.pages.dev/']:
            assert x in data,x
          assert 'localStorage.clear(' not in data
          assert data.count('class="tile course-tile"')==2
          assert data.count('class="tile explore-tile"')==3
          assert '晚間學習室樣式參考' in data
          assert 'date-input-wrap' in data
          assert data.index('課程學習') < data.index('練習與探索')
          explore=data[data.index('<nav class="explore-grid"'):]
          assert explore.index('法律 AI 實驗室') < explore.index('每日模擬') < explore.index('知識補給')
          class A(HTMLParser):
            pass
          A().feed(data)
          print("Verified slide-based 2+3 grid, five isolated links, countdown key and DOM")
          PY
      - name: Deploy only dedicated branch preview (never production)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy previews/116-study-home --project-name=probation-study30-test --branch=home-preview-20261017
      - name: Install browser for live countdown verification
        shell: bash
        run: |
          npm install --prefix /tmp/home-preview-qa --no-save playwright@1.56.1
          /tmp/home-preview-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify mobile input bounding boxes in WebKit and Chromium
        env:
          NODE_PATH: /tmp/home-preview-qa/node_modules
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium,webkit}=require('playwright');
          (async()=>{
            const url='https://home-preview-20261017.probation-study30-test.pages.dev/';
            for(const [kind,engine] of [['chromium',chromium],['webkit',webkit]]){
              const browser=await engine.launch({headless:true});
              try{
                for(const width of [320,375,390,430,580,768,1024,1440]){
                  const context=await browser.newContext({viewport:{width,height:844},locale:'zh-TW',timezoneId:'Asia/Taipei'});
                  const page=await context.newPage();
                  const errors=[];
                  page.on('pageerror',e=>errors.push(String(e)));
                  const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                  assert.equal(response.status(),200);
                  await page.locator('#countdown-settings summary').click();
                  const m=await page.evaluate(()=>{
                    const box=s=>document.querySelector(s).getBoundingClientRect();
                    const card=box('.countdown');
                    return {
                      pageOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                      cardLeft:card.left,cardRight:card.right,
                      fields:['#event-name','.date-input-wrap','#exam-date','#countdown-style','#countdown-accent','.save-button','.clear-button'].map(selector=>{
                        const x=box(selector);return {selector,left:x.left,right:x.right,width:x.width};
                      })
                    };
                  });

                  const design=await page.evaluate(()=>{
                    const body=getComputedStyle(document.body);
                    const course=getComputedStyle(document.querySelector('.course-tile'));
                    const explore=getComputedStyle(document.querySelector('.explore-tile'));
                    const cg=getComputedStyle(document.querySelector('.course-grid'));
                    const eg=getComputedStyle(document.querySelector('.explore-grid'));
                    return {
                      body:body.backgroundColor,text:body.color,
                      courseGradient:course.backgroundImage,courseRadius:course.borderRadius,
                      explore:explore.backgroundColor,exploreAccent:explore.backgroundImage,
                      exploreRadius:explore.borderRadius,colsCourse:cg.gridTemplateColumns.split(' ').length,
                      colsExplore:eg.gridTemplateColumns.split(' ').length,
                      cards:document.querySelectorAll('.tile').length,
                      headings:[...document.querySelectorAll('section.section h2')].map(n=>n.textContent.trim())
                    };
                  });
                  assert.equal(design.body,'rgb(245, 245, 239)',kind+'/'+width+': not v2.5 paper color');
                  assert.equal(design.text,'rgb(36, 59, 53)',kind+'/'+width+': not v2.5 ink');
                  assert.match(design.courseGradient,/linear-gradient/,kind+'/'+width+': missing reading-room inspired course gradient');
                  assert.equal(design.explore,'rgb(255, 255, 255)',kind+'/'+width+': reading-room card should be white');
                  assert.match(design.exploreAccent,/linear-gradient/,kind+'/'+width+': missing green card accent');
                  assert.equal(design.courseRadius,'14px',kind+'/'+width+': course card radius');
                  assert.equal(design.exploreRadius,'14px',kind+'/'+width+': exploration card radius');
                  assert.equal(design.cards,5,kind+'/'+width+': expected 5 navigation cards');
                  assert.deepEqual(design.headings,['課程學習','練習與探索']);
                  assert.equal(design.colsCourse,width<=760?1:2,kind+'/'+width+': course grid count');
                  assert.equal(design.colsExplore,width<=760?1:3,kind+'/'+width+': exploration grid count');
                  assert.equal(m.pageOverflow,false,`${kind}/${width}: page overflow`);
                  for(const x of m.fields){
                    assert(x.width>0,`${kind}/${width}: invisible ${x.selector}`);
                    assert(x.left>=m.cardLeft-1&&x.right<=m.cardRight+1,
                      `${kind}/${width}: ${x.selector} overflows the card: ${JSON.stringify(x)}`);
                  }
                  if(width===390){
                    await page.locator('#exam-date').fill('2027-08-14');
                    await page.locator('.save-button').click();
                    assert.match(await page.locator('#countdown-value').innerText(),/^[0-9]+ 天$/);
                    await page.reload({waitUntil:'domcontentloaded'});
                    assert.equal(await page.locator('#countdown-date-caption').innerText(),'2027/08/14');
                  }
                  assert.deepEqual(errors,[],`${kind}/${width}: script errors`);
                  console.log('PASS form layout',kind,width,'px');
                  await context.close();
                }
              }finally{await browser.close();}
            }
          })().catch(e=>{console.error('FAIL mobile layout regression',e);process.exit(1)});
          NODE

      - name: Verify live mobile interactions and record isolation
        env:
          NODE_PATH: /tmp/home-preview-qa/node_modules
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},locale:'zh-TW',timezoneId:'Asia/Taipei'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            const url='https://home-preview-20261017.probation-study30-test.pages.dev/';
            const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
            assert.equal(res.status(),200);
            assert.match(await page.title(),/觀護人學習平台/);
            assert.equal(await page.locator('#countdown-value').innerText(),'尚未設定考試日期');
            await page.evaluate(()=>localStorage.setItem('probation-study30-v251:v1','KEEP_UNCHANGED_TEST'));
            await page.locator('#countdown-settings summary').click();
            assert.equal(await page.locator('#countdown-settings').evaluate(el=>el.open),true);
            await page.locator('#event-name').fill('觀護人測試考試');
            await page.locator('#exam-date').fill('2027-08-14');
            await page.locator('#countdown-style').selectOption('large');
            await page.locator('#countdown-accent').selectOption('emerald');
            await page.getByRole('button',{name:'儲存設定'}).click();
            assert.match(await page.locator('#countdown-value').innerText(),/^\d+ 天$/);
            assert.equal(await page.locator('#countdown-event-label').innerText(),'距離觀護人測試考試');
            let stored=await page.evaluate(()=>JSON.parse(localStorage.getItem('psd-home-exam-countdown-v1')));
            assert.equal(stored.date,'2027-08-14');
            await page.reload({waitUntil:'domcontentloaded'});
            assert.match(await page.locator('#countdown-value').innerText(),/^\d+ 天$/);
            assert.equal(await page.locator('#countdown-event-label').innerText(),'距離觀護人測試考試');
            await page.locator('#countdown-settings summary').click();
            await page.locator('#exam-date').fill('2028-08-12');
            await page.getByRole('button',{name:'儲存設定'}).click();
            stored=await page.evaluate(()=>JSON.parse(localStorage.getItem('psd-home-exam-countdown-v1')));
            assert.equal(stored.date,'2028-08-12');
            await page.locator('#countdown-settings summary').click();
            await page.getByRole('button',{name:'清除倒數'}).click();
            assert.equal(await page.locator('#countdown-value').innerText(),'尚未設定考試日期');
            assert.equal(await page.evaluate(()=>localStorage.getItem('probation-study30-v251:v1')),'KEEP_UNCHANGED_TEST');
            assert.equal(await page.evaluate(()=>localStorage.getItem('psd-home-exam-countdown-v1')),null);
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth),true);
            assert.deepEqual(errors,[]);
            await browser.close();
            console.log('PASS: live HTTPS mobile countdown open, save, reload, modify, reset, existing record untouched, no overflow or JS errors');
          })().catch(e=>{console.error('FAIL live homepage countdown test',e);process.exit(1)});
          NODE
