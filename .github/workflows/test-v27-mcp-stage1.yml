name: v2.7 MCP stage 1 legal accuracy pilot

on:
  push:
    branches:
      - experiment/v27-mcp-stage1
    paths:
      - 'experiments/v27-mcp-poc/stage1_accuracy.py'
      - '.github/workflows/test-v27-mcp-stage1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legal-accuracy:
    name: Twenty read-only legal accuracy checks
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure isolated cache
        run: echo "MCP_TAIWAN_LEGAL_DB_HOME=$RUNNER_TEMP/mcp-v27-stage1-cache" >> "$GITHUB_ENV"
      - name: Fetch pinned external MCP code
        env:
          UPSTREAM_SHA: ef677ad63c3206fc211a083fad8b1d9ef5015222
        run: |
          git init "$RUNNER_TEMP/mcp-taiwan-legal-db"
          git -C "$RUNNER_TEMP/mcp-taiwan-legal-db" remote add origin https://github.com/lawchat-oss/mcp-taiwan-legal-db.git
          git -C "$RUNNER_TEMP/mcp-taiwan-legal-db" fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C "$RUNNER_TEMP/mcp-taiwan-legal-db" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mcp-taiwan-legal-db" rev-parse HEAD)" = "$UPSTREAM_SHA"
      - name: Install MCP dependency without deploying app
        run: |
          python -m pip install "$RUNNER_TEMP/mcp-taiwan-legal-db"
          python -m pip show mcp-taiwan-legal-db
      - name: Verify test script and offline guards
        run: |
          python -m py_compile experiments/v27-mcp-poc/stage1_accuracy.py
          python experiments/v27-mcp-poc/stage1_accuracy.py --mode selftest
      - name: Run 20 legal source and accuracy checks
        run: timeout 840s python experiments/v27-mcp-poc/stage1_accuracy.py --mode live
      - name: Upload results for individual-case review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v27-mcp-stage1-accuracy-report
          path: v27-mcp-stage1-report.json
          if-no-files-found: warn
          retention-days: 14
