name: Staresto v0.6 Link Coach QA
on:
  pull_request:
    paths:
      - 'common-subjects/english-assistant/**'
      - 'common-subjects/index.html'
      - '.github/workflows/check-staresto-link-coach.yml'
  push:
    branches:
      - 'feature/staresto-v06-link-coach-phase1'
    paths:
      - 'common-subjects/english-assistant/**'
      - '.github/workflows/check-staresto-link-coach.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Node unit and static tests
        run: |
          node common-subjects/english-assistant/test.cjs
          node common-subjects/english-assistant/test-vocab.cjs

  browser:
    needs: test
    runs-on: ubuntu-24.04 # Playwright 1.56.1 has no Ubuntu 26.04 browser build.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser-test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium for acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Run real-browser acceptance
        run: node common-subjects/english-assistant/test-browser.cjs
