name: v2.7 legal search - Cloudflare Pages

on:
  push:
    branches:
      - feature/v2.7-legal-search
    paths:
      - 'development/v2.7/**'
      - '.github/workflows/deploy-v27-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v27-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated v2.7 alpha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_ACCOUNT" ] && [ -n "$CF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare deployment is paused. Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN to repository Actions secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check required static entrypoint
        if: steps.credentials.outputs.ready == 'true'
        run: test -s development/v2.7/index.html

      - name: Validate frontend and dataset before publishing
        if: steps.credentials.outputs.ready == 'true'
        run: |
          node --check development/v2.7/app.js
          node --check development/v2.7/interpretations-ui.js
          python3 development/v2.7/scripts/verify_interpretations.py
          node --test services/v2.7-judgment/jdoc-model.test.cjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("development/v2.7/laws.json")
          if p.exists():
              j=json.loads(p.read_text(encoding="utf-8"))
              a=j.get("articles",[])
              assert len(a)>=80 and j.get("schemaVersion")==1
              assert len({(x["id"],x["articleKey"]) for x in a})==len(a)
              print(f"Verified static dataset: {len(a)} articles")
          else:
              print("No complete dataset yet. Site will show labeled sample fallback.")
          PY

      - name: Install Wrangler
        if: steps.credentials.outputs.ready == 'true'
        run: npm install --no-save wrangler@4

      - name: Deploy only v2.7 assets
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy development/v2.7 --project-name=probation-legal-ai-test --branch=feature/v2.7-legal-search
