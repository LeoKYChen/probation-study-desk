name: Stage 5 standalone ZIP, direct file URL validation

on:
  push:
    branches:
      - feature/stage5-file-zip-offline-20261018
    paths:
      - portable/**
      - .github/workflows/stage5-portable-zip.yml
  pull_request:
    branches: [main]
    paths:
      - portable/**
      - .github/workflows/stage5-portable-zip.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage5-portable-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - name: Validate scripts and embed published source data
        shell: bash
        run: |
          set -euo pipefail
          node --check portable/build-portable.cjs
          node --check portable/study-app.js
          node --check portable/test-file-url.cjs
          node portable/build-portable.cjs
          test -s portable-dist/index.html
          test -s portable-dist/README.txt
          python3 - <<'PY'
          from pathlib import Path
          html=Path('portable-dist/index.html').read_text('utf-8')
          assert len(html)>500_000
          assert '<script id="embedded-data" type="application/json">' in html
          assert 'src="http' not in html and 'href="http' not in html
          assert 'file://' in html and '下載練習紀錄 JSON' in html
          print('PASS standalone contains embedded published bank, no CDN or external scripts')
          PY
      - name: Install browser engines for file-scheme acceptance
        shell: bash
        run: |
          npm install --prefix /tmp/stage5-browser --no-save playwright@1.56.1
          /tmp/stage5-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Offline double-click simulation in Chromium
        shell: bash
        env:
          NODE_PATH: /tmp/stage5-browser/node_modules
          PORTABLE_BROWSER: chromium
        run: node portable/test-file-url.cjs
      - name: Offline double-click simulation in Safari engine
        shell: bash
        env:
          NODE_PATH: /tmp/stage5-browser/node_modules
          PORTABLE_BROWSER: webkit
        run: node portable/test-file-url.cjs
      - name: Build deliverable ZIP with index.html at archive root
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          base=Path('portable-dist')
          file=Path('probation-study-desk-stage5-standalone-test.zip')
          names=['index.html','README.txt','LICENSE','manifest.json']
          with zipfile.ZipFile(file,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=8) as z:
            for name in names:
              assert (base/name).is_file(),name
              z.write(base/name,arcname=name)
          with zipfile.ZipFile(file) as z:
            assert set(z.namelist())==set(names)
            assert z.testzip() is None
          print('PASS portable ZIP: '+str(file)+' '+str(file.stat().st_size)+' bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: probation-study-desk-stage5-standalone-test
          path: probation-study-desk-stage5-standalone-test.zip
          if-no-files-found: error
          retention-days: 14
