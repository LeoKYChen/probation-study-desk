name: Psychology 104 past-paper browser acceptance

on:
  push:
    branches: [feature/psychology-exam-analysis-20261104]
    paths:
      - 'v2.5/psychology-*.js'
      - 'v2.5/index.html'
      - 'verification/psychology-*.cjs'
      - 'offline-manifest.json'
      - '.github/workflows/psychology-exam-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2.5/psychology-*.js'
      - 'v2.5/index.html'
      - 'verification/psychology-*.cjs'
      - 'offline-manifest.json'
      - '.github/workflows/psychology-exam-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Chromium / WebKit psychology and psychometrics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts --no-audit playwright@1.62.1
      - run: node verification/psychology-exam-analysis.test.cjs
      - run: node verification/offline-stage4-check.cjs
      - name: Chromium browser acceptance (104 questions and saved answer)
        env:
          PSYCHOLOGY_BROWSER_ENGINE: chromium
        run: node verification/psychology-exam-browser.cjs
      - name: WebKit browser acceptance (iPhone engine and saved answer)
        env:
          PSYCHOLOGY_BROWSER_ENGINE: webkit
        run: node verification/psychology-exam-browser.cjs
