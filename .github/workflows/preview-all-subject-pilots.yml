name: All-subject pilot isolated preview

# Temporary preview for the 426-question all-subject pilot branch; remove before merging into main.
on:
  push:
    branches: [claude/ecstatic-bardeen-qxzzhw]

permissions:
  contents: read

concurrency:
  group: all-subject-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-subject-pilot-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run every Node check and build the exact public artifact
        run: |
          npm test
          python3 scripts/build-cloudflare-main-mirror.py
      - name: Guard dedicated preview against production and existing previews
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          alias='all-subject-pilot'
          request=urllib.request.Request(
              'https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT_ID']+'/pages/projects/probation-study30-test',
              headers={'Authorization':'Bearer '+os.environ['CF_API_TOKEN']})
          with urllib.request.urlopen(request,timeout=30) as response:
              data=json.load(response)
          project=data['result']
          assert data['success'] and project['name']=='probation-study30-test'
          assert project['production_branch'] and project['production_branch']!=alias
          assert alias not in {'main','github-main-mirror','home-preview-20261017','v254-unified-preview','unified-home-v254-20261017','layout-review-20261017'}
          print('PASS: all-subject pilot alias is separate from production and every existing preview')
          PY
      - name: Publish only the all-subject pilot preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-main-mirror-dist --project-name=probation-study30-test --branch=all-subject-pilot --commit-hash=${{ github.sha }}
      - name: Verify preview bytes
        run: python3 scripts/verify-published-bytes.py cloudflare-main-mirror-dist https://all-subject-pilot.probation-study30-test.pages.dev/
