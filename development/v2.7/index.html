<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>v2.7 法律智慧檢索 alpha</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172938;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:890px;margin:auto;padding:24px 16px 64px}header{margin-bottom:20px}h1{font-size:clamp(24px,5vw,34px);margin:5px 0}p{line-height:1.75}.sub,.muted{color:#526476}.label{font-weight:700}button,input,select{font:inherit}button{cursor:pointer}.seg{display:flex;gap:8px;margin:15px 0}.seg button{flex:1;border:1px solid #ccd6df;background:#fff;border-radius:12px;padding:12px}.seg button[aria-pressed=true]{background:#113d60;color:white;border-color:#113d60}.form{display:grid;gap:10px;grid-template-columns:1fr 230px}.form input,.form select{background:white;border:1px solid #bdcbd5;border-radius:10px;padding:13px;width:100%;color:#172938}.panel,.result{background:#fff;border:1px solid #dbe2e8;border-radius:15px;padding:18px;margin:15px 0}.result h2{font-size:18px;margin:0 0 8px}a{color:#125c97}.tag{display:inline-block;font-size:12px;color:#23465d;background:#e6f3fb;border-radius:8px;padding:4px 8px;margin:4px 5px 4px 0}.warning{border-left:4px solid #ad7a29;padding:11px 14px;background:#fff8e9}.law{white-space:pre-wrap;line-height:1.8}.meta{font-size:13px;color:#526476}#count{font-weight:700}.empty{padding:20px;color:#526476}footer{font-size:13px;color:#526476;margin-top:32px}@media(max-width:600px){.form{grid-template-columns:1fr}.shell{padding-top:12px}}@media(prefers-color-scheme:dark){:root{color:#e9edf1;background:#102330}.panel,.result,.seg button,.form input,.form select{background:#1c3442;color:#e9edf1;border-color:#406071}.seg button[aria-pressed=true]{background:#285b7b}.sub,.muted,.meta,footer,.empty{color:#c1ccd5}.warning{background:#443920}.tag{background:#24485f;color:#cde6f7}a{color:#90d0ff}}
button.more{display:block;margin:12px auto;padding:12px 18px;border:1px solid #9faeb9;border-radius:10px;background:#eaf1f6;color:#173a53} </style></head>
<body><main class="shell">
<header><div class="sub">觀護人練習臺｜v2.7.0-alpha · 靜態法規搜尋原型</div><h1>臺灣法律智慧檢索</h1><p class="sub">一套法源資料，兩種使用方式。這是可操作的最小原型，尚未連接AI或自動更新。</p></header>
<div class="warning" role="note"><strong>資料範圍限制：</strong>本系統僅限兩部指定法律之現行法資料快照，不含歷史法、函釋與公開裁判；來源更新頻率並非即時，個別條文施行日仍須核對官方網站。</div>
<nav class="seg" aria-label="使用模式"><button type="button" id="modeExam" aria-pressed="true">📚 國考學習模式</button><button type="button" id="modeResearch" aria-pressed="false">⚖️ 專業研究模式</button></nav>
<section class="panel"><p id="modeDesc">查法條、抓考點；正式申論評分功能尚未接入。</p><div class="form"><label><span class="label">條號或關鍵字</span><input id="q" autocomplete="off" placeholder="例如 第3-1條、少年、保護管束"></label><label><span class="label">指定法規</span><select id="lawFilter"><option value="">全部示範法條</option><option value="C0010011">少年事件處理法</option><option value="I0030002">保安處分執行法</option></select></label></div><p class="meta">按條號、法規名、條文全文進行瀏覽器端搜尋；資料不會上傳。</p></section>
<section><p id="dataInfo" class="meta" role="status">正在載入法規資料…</p><p id="count" role="status"></p><div id="results"></div></section>
<footer>資料來源：法務部全國法規資料庫開放資料；按月檢查更新，更新失敗時保留原資料。本站提供學習檢索，不構成法律意見，不提供歷史法規適用判斷。</footer>
</main>
<script defer src="./app.js"></script></body></html>
