<body>
<header class="study-header"><div class="study-header-inner"><a class="study-brand" href="../v2.5/"><span class="study-brand-mark" aria-hidden="true">觀</span>觀護人練習臺</a><span class="study-test-label">各科重點整理</span><nav class="nav-four" aria-label="主要導覽"><a href="../v2.5/">考古題練習</a><a href="./">申論評分參考</a><a href="summaries.html" aria-current="page">重點整理</a><a href="review.html">失分回想卡</a></nav></div></header>
<main>
<div class="wrap" id="sum-root">
  <div class="top">
    <div>
      <p class="kicker">跨類科・歷屆考題歸納</p>
      <h1>各科重點整理</h1>
      <p class="lede">把觀護人、監獄官、犯罪防治人員、家事調查官、薦任升等與監所管理員 108–115 年的申論題，依主題重新歸納：每個考點列出出題紀錄、核心內容、答題骨架與常見混淆。點題號可回到申論評分參考作答；有自評紀錄時，每科最上方會排出優先複習的主題。內容由 AI 依本站命題者視角拆解整理，法律條文已對照現行法，<strong>不是官方解答或閱卷標準</strong>。</p>
    </div>
    <span class="badge-test">學習用・非官方資料</span>
  </div>

  <div class="sum-subjects" role="group" aria-label="選擇科目" id="sum-subjects"></div>

  <p class="status" id="sum-status" role="status" aria-live="polite"></p>
  <div id="sum-error" class="sheet sum-error" hidden>
    <p style="margin:0 0 10px">這一科的資料沒有載入成功，請確認網路連線後再試一次。</p>
    <button class="btn primary" id="sum-retry" type="button">重新載入</button>
  </div>

  <div class="sum-layout" id="sum-layout" hidden>
    <aside class="sum-aside" aria-label="本科目錄">
      <details class="sum-toc" id="sum-toc" open>
        <summary>目錄</summary>
        <ol id="sum-toc-list"></ol>
      </details>
    </aside>
    <article class="sum-body" id="sum-body" aria-labelledby="sum-title">
      <div class="sum-head">
        <h2 id="sum-title" tabindex="-1"></h2>
        <p class="small muted" id="sum-meta"></p>
      </div>
      <section class="sheet sum-weak" id="sum-weak" aria-labelledby="sum-weak-h" hidden></section>
      <div id="sum-sections"></div>
    </article>
  </div>
</div>
</main>
</body>
</html>
