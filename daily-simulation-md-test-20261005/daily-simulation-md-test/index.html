<script>
'use strict';
const INITIAL_DATA={"schemaVersion":1,"updatedAt":"2026-10-04T13:16:22.442Z","count":12,"questions":[{"id":"2026-10-04-1","date":"2026-10-04","subject":"本週跨科整合複盤（融會：犯罪學、心理學、諮商與輔導、少年事件處理法、保安處分執行法、刑事訴訟法）","question":"少年甲現年 15 歲，自幼生長於高度衝突之單親家庭，父親因案長期服刑，母親以打零工為生且患有重度憂鬱症，無力管教甲。甲自國二起頻繁逃學，與校外宮廟陣頭成員交往，受成年角頭乙之利誘吸收擔任圍事與竊盜把風，並多次在租屋處共同吸食第三級新興毒品「依託咪酯煙彈」。日前，甲與同儕因地盤糾紛，持械聚眾鬥毆將對方圍毆成傷，警方循線將甲拘捕並移送少年法院。少年法院繫屬後，分案由少年調查官調查。調查官調查發現：甲家庭經濟瀕臨崩潰、母親消極放任，甲之學校因其長期缺曠已予以中輟通報，且甲在言談間對吸毒鬥毆毫無悔意，將行為歸咎為「挺兄弟」、「賺錢幫家裡」，但內心深層對未來極度迷茫無助。試問：(一) 少年調查官依《少年事件處理法》第 19 條及第 42 條第 5 項進行調查時，應向何種適當之機關、學校或機構進行網絡徵詢？如何依《少年法院與相關機關處理少年事件聯繫辦法》提出具體適切之保護處遇建議？少年保護官於後續執行保護處分時，應如何深化跨網絡合作以防範再犯？（15 分）(二) 少年調查官與保護官在分析甲之涉案成因與擬定處遇策略時，應如何整合犯罪學理論（如生態系統理論、社會學習理論）與心理諮商處遇模式（如多系統處遇模式 MST），擬定跨系統整合處遇計畫？請以標準四欄表格具體分析說明。（10 分）","issues":"爭點一：少事法第 19 條審前調查與第 42 條第 5 項徵詢程序\n調查官之品格、經歷、身心狀況、家庭環境調查義務；依第 42 條第 5 項徵詢社政、衛政、教育機關與心理專家意見，落實審前調查之跨專業整合。\n爭點二：聯繫辦法之具體網絡合作機制\n《少年法院與相關機關處理少年事件聯繫辦法》第 7 條（各機關協助義務）、第 27 條（協調直轄市、縣市政府共同辦理）、第 33 條及第 65 條（督促法定代理人、加強就讀學校聯繫、過渡性教育措施銜接）。\n爭點三：跨科理論模型之有機整合\n犯罪學：生態系統理論（微系統、中系統崩解）與社會學習論（差別接觸與差別增強）。\n諮商輔導：多系統處遇模式（MST）賦權家庭，連結學校與社區資源，阻斷司法機構化烙印。","outline":"(一) 少年調查官之網絡調查、處遇建議及少年保護官之網絡深化\n少年調查官依少事法第 19 條及第 42 條第 5 項之網絡調查：\n跨網絡徵詢對象：\n社政主管機關：查訪甲家是否符合脆弱家庭條件，評估家庭經濟扶助與親職功能重建可能性。\n學校及教育主管機關：函請甲就讀國中提供學業評量、輔導紀錄，評估是否能銜接中介教育學園或過渡性教育措施。\n衛政及醫療機構：安排青少年精神專科醫院實施身心評估與新興毒品成癮鑑定。\n具體適切處遇建議之提出：\n依最後手段原則，甲雖涉暴力與吸毒，但本質源於家庭功能失調與學校排斥。調查官應建議法院裁定少事法第 42 條第 1 項第 2 款交付保護管束，並依第 42 條第 2 項第 2 款命入相當處所施以禁戒治療，併依第 84 條命母親接受親職教育輔導，避免過早動用感化教育。\n少年保護官於執行保護處分時之網絡深化（依聯繫辦法）：\n落實家庭與親職督促：依聯繫辦法第 65 條，定期訪視案家，督促母親善盡親職責任，協同社政社工導入家庭支持資源。\n強化就讀學校雙向聯繫：依聯繫辦法第 33 條及第 65 條，與學校輔導室密切配合，協助甲復學或銜接過渡性教育措施，建立缺曠課與生活常規之即時通報網絡。\n衛政戒癮門診整合：連結地方毒防中心與醫療院所，定期追蹤尿液採驗與心理諮商成效，確保醫療處遇與司法管束無縫銜接。","theoryTable":[["理論／方法","理論／方法說明","核心概念","少年個案應用"],["布朗芬布倫納之生態系統理論（Bronfenbrenner's Ecological Systems Theory）","該理論主張個體發展並非孤立的生理歷程，而是個體與其所處的多層次環境系統持續交互作用（PPCT 模型）的產物。系統分為五層次：(1) 微系統（Microsystem，直接面對面接觸之環境，如家庭、學校、同儕）；(2) 中系統（Mesosystem，微系統之間的相互連結，如家校溝通）；(3) 外系統（Exosystem，個體未直接參與但間接影響其生活的環境，如社區治安、父母職場環境）；(4) 巨系統（Macrosystem，文化價值、法制政策）；(5) 時間系統（Chronosystem，歷史重大轉折）。偏差行為之成因在於各系統支持功能瓦解及系統間連結斷裂。改變機制在於透過跨網絡介入修復中系統，並活化微系統正向資源。易混淆處：常被簡化為單純外在環境決定論；生態系統論核心在於「系統間之動態雙向回饋」，少年不僅被動受環境影響，其行為亦會反作用於環境。","微系統失靈、中系統斷裂、外系統風險、生態多層次互動、跨網絡生態重構","少年甲家庭微系統失能（單親撫養、嚴重忽略）、學校微系統排斥（中輟被標籤化），且中系統（家校聯繫）完全斷裂；外系統中社區陣頭提供偏差誘引。少年調查保護官在審前調查與處遇計畫中，不應僅單獨約談甲，而應依少事法第 42 條第 5 項啟動「生態網絡重構」：修復家庭微系統功能（親職教育與社政脆弱家庭扶助）、銜接中介教育微系統（過渡性教育學園）、阻斷外系統風險（通報警政加強巡查陣頭），從多層次環境徹底翻轉其偏差生態。"],["阿克爾之社會學習理論（Akers' Social Learning Theory, SLT）","結合薩瑟蘭（Sutherland）之差別接觸理論與行為心理學操作制約，發展出具體可操作之犯罪學習模型。核心主張：偏差行為之習得與維持取決於四大核心機制：(1) 差別接觸（Differential Association，與提供偏差行為示範與價值觀之團體親密互動）；(2) 態度定義（Definitions，個案內在對特定行為之評價，包含有利或不利於守法之態度與合理化藉口）；(3) 差別增強（Differential Reinforcement，預期或實際獲得之獎賞大於懲罰，包含實質金錢、同儕認同與生理快感）；(4) 模仿（Imitation，觀察他人示範行為並在特定情境下複製）。改變機制在於透過調整增強結構（消除偏差行為之獎賞，增加其代價）並導入正向楷模，重新塑造個案之態度定義。易混淆處：常與班度拉的社會學習論混淆；Akers 的社會學習理論特別強調「差別增強（操作制約中增強物與懲罰物之平衡計算）」對偏差行為長期維持的決定性作用。","差別接觸、態度定義、差別增強、行為模仿、操作制約","甲在陣頭中結識吸毒與涉案同儕（差別接觸），同儕灌輸「吸睡眠煙彈很潮、大家都在抽」之態度定義；甲初次嘗試獲得生理放鬆與同儕高度接納（正向增強），且未立即遭受法律懲罰（負向增強），強化了後續的吸毒與暴力行為。保護官於保護管束執行時，必須阻斷此增強循環：透過定期尿液採驗與法律告誡增加違法代價（正向懲罰），安排甲參與正向技能團體並由模範志工陪伴，以正向合法成就取代毒品快感，建立守法之差別增強機制。"],["亨格勒之多系統處遇模式（Henggeler's Multisystemic Therapy, MST）","專門針對高風險、多次涉法且面臨機構收容之青少年發展之實證密集家庭社區處遇模式。植基於社會生態學與結構家庭治療，核心主張：青少年的嚴重犯罪與物質濫用是由其所處之多重生態系統（個人、家庭、同儕、學校、社區）共同驅動的。MST 的九大核心原則強調：以家庭為中心、將處遇焦點放在改善生活脈絡之具體問題、強調家庭成員之力量與優勢、提升日常責任承擔、並透過跨體系 24 小時即時支援維持改變。改變機制在於賦權（Empower）主要照顧者，提升家長之監管、管教與溝通技能，使家庭具備自主解決少年問題之長期能力。易混淆處：MST 並非由專業人員「替代」父母管教，而是「賦權並教導父母成為首要改變推動者」，專業人員扮演教練與生態協調者角色。","多系統處遇、賦權家庭、生態脈絡介入、以家庭為核心、跨網絡即時支援","甲多次涉案且家庭管教完全失靈，依傳統觀點極易被直接裁定送入感化教育。若依 MST 理念與少事法第 42 條第 5 項之跨網絡協同：保護官應協調社政家防中心與專業社工團隊進駐甲之家庭，不單向指責母親，而是賦權母親建立具體之居家生活規範（如門禁管理、金錢使用監督）；同時保護官主導聯繫學校輔導室，建立即時缺曠課通報網絡，形成無縫家庭社區防護網，使甲得以在原生社區中完成矯治，避免機構化監禁之標籤創傷。"]],"sourceReference":"","reviewStatus":"待核對"},{"id":"2026-10-03-1","date":"2026-10-03","subject":"刑事訴訟法（週六固定輪替）","question":"少年甲現年 17 歲，受成年黑幫成員乙之金錢利誘與唆使，加入電信詐欺集團擔任提款車手。甲於民國 114 年 1 月間，依乙之指示，持被害人 A 遭詐騙之提款卡，在新北市某 ATM 接續提領贓款新臺幣（下同）10 萬元交予乙。案經警方查獲甲，少年法院依《少年事件處理法》第 27 條第 1 項規定，裁定將甲移送檢察官偵查起訴。檢察官偵查終結後，僅就甲於「1 月間提領 10 萬元」之加重詐欺犯行向地方法院刑事庭提起公訴。於第一審法院審理中，檢察官另行查獲乙涉有共同詐欺罪嫌，遂於辯論終結前，向法院「追加起訴」乙共同加重詐欺罪嫌；同時，檢察官發現甲於同年 2 月間，亦曾依乙指示在臺北市某 ATM 提領 5 萬元贓款，乃於審理期日具狀請求法院併予審判甲於 2 月間之提款犯行。第一審法院合議庭審理結果，認定：甲 1 月間提款 10 萬元部分事證明確，應成立加重詐欺罪；甲 2 月間提款 5 萬元部分，因該提款卡係甲自己帳戶且款項來源無法證明為詐騙所得，應屬不能證明犯罪；成年被告乙部分，因卷內除甲片面供述外無其他補強證據，其犯罪不能證明。試問：(一) 檢察官對乙追加起訴及請求併辦甲 2 月犯行之程序是否合法？第一審法院合議庭對於甲及乙應如何諭知判決主文與說明理由？（請依《刑事訴訟法》規定及實務見解作答）（15 分）(二) 少年調查保護官受刑事法庭囑託為甲進行量刑前調查時，應如何運用犯罪學與心理學理論（如差別接觸理論、中和技術、自我效能理論），評估甲受成年共犯影響之心理機制，並向法院提出適當之處遇建議？請以標準四欄表格具體分析說明。（10 分）","issues":"爭點一：追加起訴（刑事訴訟法第 265 條）之合法性\n追加起訴須於第一審辯論終結前，針對與原起訴案件相牽連之犯罪或共同被告提起。乙與甲為加重詐欺之相牽連犯罪案件（一人犯數罪或數人共犯一罪），追加起訴程序合法。\n爭點二：公訴不可分原則（刑事訴訟法第 267 條）與接續犯之判斷\n甲 1 月與 2 月提款行為，時間相隔一個月且犯罪地點、被害人均不相同，非於密切接近之時地為之，在法律評價上難認屬「接續犯（實質上一罪）」，而屬獨立之數罪。\n檢察官就 2 月犯行僅為「移送併辦／請求併辦」，並非正式起訴；因與 1 月犯行不具實質上一罪或裁判上一罪之同一案件關係，公訴不可分之效力不及於 2 月犯行。\n爭點三：判決主文之諭知架構\n甲部分：1 月犯行判處有期徒刑（有罪）；2 月犯行因未受起訴且非起訴效力所及，法院無從審判，應退還檢察官另行處理，不得於主文為無罪之諭知，亦非「不另為無罪之諭知」。\n乙部分：追加起訴之案件係獨立之新訴，法院審判結果認乙犯罪不能證明，應於主文諭知「乙無罪」。","outline":"(一) 檢察官程序合法性及法院判決主文之諭知\n檢察官程序之合法性檢視：\n追加起訴乙部分合法：依《刑事訴訟法》第 265 條第 1 項規定，於第一審辯論終結前，得就與本案相牽連之犯罪或同時得提起之他罪，追加起訴。乙與甲為共犯關係，屬第 7 條第 2 款之相牽連案件，檢察官於辯論終結前追加起訴，程序合法。\n請求併辦甲 2 月犯行部分未生起訴效力：甲 1 月與 2 月之提款行為，時隔月餘且侵害不同法益，在客觀上難認係基於單一犯意接續為之之接續犯，應屬數罪併罰之獨立行為。檢察官僅請求併予審判，因不合致第 267 條公訴不可分之「同一案件」，法院無從併予實體審判。\n第一審法院判決主文之諭知方式：\n甲之部分：\n就起訴之 1 月加重詐欺犯行，事證明確，應於主文諭知甲有罪（宣告刑罰，並得審酌宣告緩刑併付保護管束）。\n就請求併辦之 2 月提款犯行，因非起訴效力所及，基於不告不理原則（刑事訴訟法第 268 條），法院不得裁判，應於判決理由欄中敘明兩者非實質上一罪，該併辦部分無從審理，退由檢察官另為適法處理，主文欄「不得另為無罪之諭知」，亦「不得為不另為無罪之諭知」。\n乙之部分：\n檢察官追加起訴乙之部分已發生繫屬訴訟關係，法院審理後認事證不足，應依《刑事訴訟法》第 301 條第 1 項規定，於主文正式諭知「乙無罪」。\n(二)","theoryTable":[["理論／方法","理論／方法說明","核心概念","少年個案應用"],["薩瑟蘭之差別接觸理論（Sutherland's Differential Association Theory, DAT）","Edwin Sutherland 主張，犯罪行為不是天生生理缺陷或性格異常，而是在親密人際團體之互動溝通過程中「學習（Learned）」而來的。學習內容包含兩大層面：(1) 犯罪之具體技巧（如操作提款機、逃避警方監視）；(2) 動機、驅力、合理化藉口與「有利於違法之態度定義（Definitions Favorable to Law Violation）」。核心改變原則：當個體接觸有利於違法之定義超過不利於違法之定義時，即會產生犯罪。差別接觸之影響力取決於接觸之「頻率（Frequency）、持久性（Duration）、優先性（Priority）與強度（Intensity）」。易混淆處：常與「社會控制理論」混淆；社會控制論主張「人不犯罪是因為社會鍵拘束，不需學習犯罪動機」，差別接觸理論則強調「犯罪動機、藉口與價值觀必須透過親密團體積極學習傳遞」。","犯罪學習、親密團體互動、有利違法之定義超過不利定義、頻率/持久性/優先性/強度","少年甲被成年主謀乙吸收，乙在租屋處為甲提供食宿、給予零用錢，並向甲灌輸「這只是幫忙提款跑腿，賺錢快又沒有傷害任何人，警察抓不到未成年人」等強烈有利於違法的態度定義。甲在與乙高頻率、高強度的同儕互動中，迅速學習車手提款技巧並內化合理化藉口。少年保護官於處遇中，必須「切斷其與犯罪網絡之差別接觸」，透過強制遠離不良社交圈、轉換生活環境，並導入正向楷模（如志工導師、合法實習雇主），重新建立有利於守法的認知定義。"],["賽克斯與馬薩之中和技術理論（Sykes & Matza's Techniques of Neutralization）","Gresham Sykes 與 David Matza 提出漂移理論（Drift Theory），主張大多數青少年並非全盤認同犯罪次文化，而是常在主流道德規範與違法行為之間「漂移（Drift）」。個案在從事違法行為前，會運用「中和技術（Techniques of Neutralization）」暫時中斷內在的道德束縛與罪惡感，使偏差行為合理化。五大中和技術包括：(1) 責任之否定（Denial of Responsibility，如「我被成年人逼的、身不由己」）；(2) 損害之否定（Denial of Injury，如「被害人很有錢，這點錢對他們沒差」）；(3) 被害人之否定（Denial of the Victim，如「對方貪心被騙是自找的」）；(4) 責備責備者（Condemnation of the Condemners，如「警察自己也很黑」）；(5) 效忠更高權威（Appeal to Higher Loyalties，如「我是為了挺兄弟才幫忙」）。易混淆處：常與認知失調的事後合理化混淆；中和技術強調是在「行為發生前或當下」先行運作的認知防衛盾牌，使得個案能夠在保留主流道德認同的同時進行犯罪。","漂移理論、中和技術、責任否定、損害否定、暫時解除道德拘束","甲在審理中向法官及保護官辯稱：「我只是依指示在 ATM 領錢，錢本來就在裡面，主謀是乙，我只是打工聽命行事，這不叫騙人」，明顯運用了「責任之否定」與「損害之否定」。觀護人於審前調查及輔導晤談時，應精準辨識甲的中和技術，並運用蘇格拉底式提問逐步拆解其防衛盾牌：「當你把被害人一生的積蓄提走時，對方家庭面臨醫療費無著、甚至絕望輕生的痛苦，這真的是沒有傷害嗎？」引導甲直面被害人的真實損害，打破其將自己視為純粹被動受害者的認知迷思。"],["班度拉自我效能理論與抗拒誘惑重構（Bandura's Self-Efficacy Theory & Refusal Skills）","Albert Bandura 提出自我效能（Self-Efficacy），指個人對自己在特定情境下能否成功執行特定行為以達成目標之內在信念。低自我效能的青少年面對強勢成年犯罪組織之利誘或威逼時，往往深感無力拒絕（拒絕自我效能低下），進而選擇盲從屈服。自我效能的建立源自四大途徑：(1) 親身成功掌握經驗（Mastery Experiences）；(2) 替代性楷模經驗（Vicarious Experiences）；(3) 社會說服與支持（Social Persuasion）；(4) 生理與情緒狀態調節。改變機制在於透過具體的「斷絕與拒絕技巧演練（Refusal Skills Training）」與成功經驗累積，提升個案在誘惑情境下的自主抵抗信念。易混淆處：自我效能並非抽象的「自信心（Self-Esteem）」，而是針對「具體特定任務（如拒絕黑幫招募、堅持合法工作）」之勝任感評估。","自我效能、親身成功經驗、拒絕技巧演練、社會說服、情境抗拒能力","甲因長期學業挫折與單親經濟困頓，對合法自立缺乏信心，面對黑幫大哥乙的高額金錢利誘與同儕邀約時，完全喪失抗拒能力。保護官在擬定保護處遇時，應設計具體的「情境角色扮演（Role-Playing）」：模擬若再次接到昔日詐騙同儕邀約時，如何運用「跳針法、藉故離開、尋求支援」等具體拒絕話術；同時結合青少年培力計畫，協助甲在烘焙或水電技能培訓中累積親身成功經驗，提升其依靠合法勞動自立的自我效能感，徹底根除再次受成年共犯工具化之風險。"]],"sourceReference":"","reviewStatus":"待核對"},{"id":"2026-10-02-1","date":"2026-10-02","subject":"保安處分執行法（週五固定輪替）","question":"甲現年 20 歲，於 17 歲時因涉犯加重強制性交罪，經少年法院移送檢察官起訴，判處有期徒刑 4 年確定入監服刑。甲於服刑期間表現平平，刑期屆滿前 6 個月獲准假釋出監，假釋期間交付保護管束。檢察官依《保安處分執行法》及《性侵害犯罪防治法》第 34 條第 1 項規定，命甲應按期向觀護人報到、接受身心治療及輔導教育，並施以夜間宵禁及配戴科技設備監控（電子腳鐐）。於假釋保護管束執行期間，甲對電子腳鐐產生極大排斥，自認已接受刑罰懲罰，司法不應將其「當成野獸全天候監控」。甲先後多次蓄意不替監控設備充電導致訊號中斷離線逾 2 小時，且違反宵禁規定於深夜徘徊於校園周邊，復無正當理由連續三次缺席社區身心治療課程。觀護人實施告誡後，甲仍拒不悔改，日前更被監控中心偵測到蓄意剪斷電子腳環破壞設備，行蹤不明。試問：(一) 甲蓄意破壞監控設備、違反宵禁並拒絕接受身心治療，觀護人及執行機關依《保安處分執行法》與《性侵害犯罪防治法》得採取何種強制處置？若欲撤銷其假釋與保護管束，其法定程序與法律效果各為何？（15 分）(二) 若甲經緝獲後，經身心評估小組鑑定認其再犯危險並未顯著降低，檢察官擬依《刑法》第 91 條之 1 向法院聲請令入相當處所施以強制治療。依司法院釋字第 799 號解釋意旨，法院審理該聲請時應踐行何種正當法律程序？觀護人在處遇介入時，得運用何種矯治心理學或犯罪學理論（如良好生活模式 GLM、性犯罪復發預防模式）擬定輔導策略？請以標準四欄表格具體分析說明。（10 分）","issues":"爭點一：性侵害保護管束特別遵守事項與破壞設備之強制處置\n《性侵害犯罪防治法》第 34 條第 1 項第 5 款（宵禁）、第 7 款（科技設備監控）、第 3 款（身心治療）。\n強制處置：依同法第 35 條第 2 項，故意拆除或損壞設備者，檢察署得通報警察機關「強制其到場回復設備正常運作」；另涉《刑法》第 138 條毀損公務員職務上掌管物品罪。\n爭點二：撤銷保護管束與撤銷假釋之法定程序及法律效果\n違反遵守事項情節重大，觀護人報請檢察官聲請法院裁定撤銷保護管束（保安處分執行法第 74 條之 3 第 2 項、刑事訴訟法第 481 條）；並報請法務部撤銷假釋（刑法第 78 條之 1）。法律效果為收監執行未執行完畢之殘餘刑期。\n爭點三：釋字第 799 號解釋之正當法律程序要求\n強制治療之宣告與停止，法院應賦予受治療者親自或委任辯護人到庭陳述意見權；心智缺陷無法完全陳述者應有強制辯護；給予專家證人陳述機會；落實定期司法審查避免變相無限期監禁。","outline":"(一) 強制處置、撤銷保護管束與撤銷假釋之程序及法律效果\n觀護人及執行機關得採取之法定強制處置：\n通報警察機關強制到場：依《性侵害犯罪防治法》第 35 條第 2 項規定，受保護管束人故意拆除、損壞科技設備監控設備者，檢察署得通報警察機關強制其到場，回復設備之正常運作。\n追究刑事毀損責任：甲蓄意剪斷電子腳鐐，涉犯《刑法》第 138 條毀棄、損壞公務員職務上掌管物品罪，得移送司法警察機關偵辦。\n撤銷保護管束與撤銷假釋之程序及法律效果：\n實體要件：甲破壞監控設備、逃避宵禁、拒絕身心治療並行蹤不明，違反《保安處分執行法》第 74 條之 2 及《性侵害犯罪防治法》第 34 條之遵守事項，已達「情節重大」之程度。\n法定程序：\n觀護人檢具違規事證，報請地檢署執行檢察官，由檢察官依《刑事訴訟法》第 481 條第 1 項向管轄法院聲請裁定撤銷保護管束（保安處分執行法第 74 條之 3 第 2 項）。\n同時，檢察官得檢具事證報請法務部撤銷其假釋（刑法第 78 條之 1）。\n法律效果：撤銷假釋後，甲之假釋失其效力，依《刑法》第 79 條第 1 項規定，甲應重行收監執行其假釋前尚未服滿之殘餘徒刑。","theoryTable":[["理論／方法","理論／方法說明","核心概念","少年個案應用"],["良好生活模式（Good Lives Model, GLM, Ward & Stewart）","Tony Ward 等人提出之優勢取向（Strengths-based）矯治模式，作為傳統 RNR（風險-需求-反應）模式之革新。核心主張：所有人類（包括性侵害與暴力犯罪者）終其一生都在追求共通的「根本核心生活目標（Primary Human Goods）」，如生命健康、人際親密、知識學習、自主卓越、內心平靜與社群歸屬。偏差與性犯罪並非個案天生邪惡，而是個案在欠缺合法技能、資源或扭曲認知下，採取了不適當、破壞性或侵害他人的方式來滿足這些內在核心需求。改變機制在於透過個別化「良好生活計畫（Good Lives Plan）」，協助個案識別其重視之核心善品，並學習以合法、負責任且具同理心之途徑去實現，從而由根本消除再犯動機。易混淆處：常被誤解為「忽視犯罪風險或過度理想化」；GLM 絕非拋棄風險管理，而是主張「唯有賦予個案對有價值生活的希望與實質能力，嚴格的風險監控與法律處分才能發揮真正的矯治效果」。","良好生活模式、根本核心善品、優勢取向、合法需求滿足、自主與親密","少年甲在性侵害案件假釋交付保護管束期間，對宵禁與科技設備監控充滿敵意，認為自己被當成怪物監視，多次拔除電源企圖逃避。觀護人若僅以撤銷假釋威脅，只會強化其對立抗拒。運用 GLM 模式：觀護人應深入晤談甲內在渴望獲得之「社群歸屬」與「自尊認同」，指出其過去之偏差行為係扭曲了親密關係之追求；協助甲重新規劃退伍或就業職涯目標，引導其體會「遵守科技監控與完成身心輔導，是合法獲得社會尊重與重建人生的必經階梯」，激發其由被動受控轉為主動配合。"],["認知行為治療取向之性偏差復發預防模式（CBT Relapse Prevention, Laws）","將認知行為治療與成癮復發預防技術應用於性犯罪加害人處遇。核心主張：性偏差行為並非突發之意外，而是存在一條可被識別與阻斷的「性犯罪前置循環鏈（Offense Cycle）」，包含：潛在脆弱性（孤立、低自尊）→ 表面無關之決定（Apparently Irrelevant Decisions, AIDs，如刻意路過案發地、瀏覽刺激影像）→ 高風險情境（夜間獨處、飲酒、情緒低落）→ 認知扭曲與合理化（「對方也想要」、「看一下沒關係」）→ 性幻想強化 → 犯罪著手。改變機制在於透過建立「犯罪循環地圖」，訓練個案辨識自身之早期警訊，學會運用認知中斷法、行為替代策略及求助網絡，阻斷循環向前推進。易混淆處：性犯罪復發預防不同於一般物質成癮；其涉及深層之性偏好與性認知扭曲（如性別刻板、被害人責備），必須配合測謊與行為監控進行嚴格之真實性檢驗。","性犯罪前置循環、表面無關之決定、高風險情境、認知扭曲辨識、復發預防地圖","甲夜間多次無故離家並進入校園周邊（表面無關之決定），觸發科技監控圍籬告警。保護官於個別輔導中，應引導甲逐一拆解其「犯行循環圖」：檢視其在情緒低落或孤獨時，如何藉由夜遊尋求刺激，並在腦海中產生認知扭曲；協助甲標記高風險時段與地點，制定「應急安全卡（Safety Card）」，要求甲在衝動萌生時立即執行替代行為（如撥打保護官或心理師緊急諮詢專線、從事劇烈體育活動），有效阻斷偏差循環。"],["系統性多網絡合作處遇模式（Multi-Agency Public Protection Arrangements, MAPPA）","源自英國之公共安全跨機構防護網絡模式，專門針對高風險性侵害與重大暴力受保護管束人。核心主張：單一司法或行政機關（如僅靠觀護人或單一警察）無法有效控管高風險再犯，必須整合「司法觀護（法律監督與告誡）」、「警察機關（科技監控查訪、防逃與強制到場）」、「衛生醫療主管機關（臨床身心治療與評估）」及「社政教育網絡（就業與家庭支持）」，形成 24 小時無縫之「整合風險管理網絡」。改變與監控機制在於定期召開跨機構個案協調會議，即時共享告警情資與治療進度，兼顧動態風險評估與支持性處遇。易混淆處：MAPPA 並非各自為政之公文往返，而是「權責分明、即時聯防」之作戰網絡；科技監控僅為工具，真正的核心是各網絡人員對風險信號之迅速回應能力。","跨機構防護、即時情資共享、動態風險管理、司法警察聯防、處遇與監控並行","甲出現破壞電子腳鐐、深夜不歸及拒絕到身心治療診所之重大違規情事。觀護人應立即啟動跨網絡合作：第一時間通報科技設備監控中心與轄區分局偵查隊，由警察機關依性侵害犯罪防治法第 35 條強制甲到場回復設備功能；同時召集衛生局心理衛生中心治療師召開個案研討會，評估其再犯危險性是否顯著升高，若經評估認有再犯之高度危險，由觀護人彙整跨網絡報告報請檢察官向法院聲請裁定令入相當處所施以強制治療（刑法第 91 條之 1），確保社區安全與司法正義。"]],"sourceReference":"","reviewStatus":"待核對"},{"id":"2026-10-01-1","date":"2026-10-01","subject":"少年事件處理法（週四固定輪替）","question":"少年甲現年 15 歲，就讀國中三年級。甲自幼父母離異，由罹患重度糖尿病之母親單親撫養，因家庭缺乏管管，甲經常逃學並流連宮廟陣頭。某日，甲受校外成年藥頭乙之利誘與同儕唆使，在乙租屋處以電子煙吸食第三級新興管制藥品「依託咪酯（俗稱睡眠煙彈）」一次，並收受乙交付之依託咪酯煙彈 2 顆（驗餘淨重共 3.2 公克，未達刑事處罰標準之純質淨重 5 公克）藏於身上，準備返校販售牟利但尚未售出。翌日傍晚，警員巡邏時見甲於超商前神情恍惚、步履蹣跚，上前盤查當場扣得該 2 顆煙彈，經警依規定採集甲之尿液送驗，呈現依託咪酯代謝陽性反應。警方隨後依規定通知少年住所地之「少年輔導委員會（少輔會）」處理。少輔會開案進行行政輔導先行期間，甲數次拒絕社工訪視，並離家出走不知去向，其母亦表明無力約束，少輔會評估甲之家庭功能完全癱瘓且輔導顯難達成目的，遂依少事法規定請求管轄少年法院處理。試問：(一) 甲先後吸食及持有依託咪酯煙彈之行為，依現行《少年事件處理法》應如何定性？司法警察機關查獲時，依現行法制應遵循何種程序處理？少輔會於何種法定事由下得請求少年法院處理？（15 分）(二) 少年法院受理後，少年調查官依《少年事件處理法》第 19 條進行調查並擬定處遇建議時，應如何運用犯罪學與諮商輔導理論（如跨理論模式 TTM、自我控制理論、生態系統理論），擬定兼顧醫療戒癮與家庭重構之保護管束處遇計畫？請以標準四欄表格具體分析說明。（10 分）","issues":"爭點一：少年涉入第三級毒品之行為定性（觸法 vs. 曝險）\n施用第三級毒品：《毒品危害防制條例》第 10 條僅處罰施用第一級、第二級毒品，施用第三級毒品僅處行政罰鍰與講習，非觸犯刑罰法律。故符合《少年事件處理法》第 3 條第 1 項第 2 款第 3 目「有施用毒品或迷幻物品之行為而尚未觸犯刑罰法律」之曝險少年。\n持有第三級毒品之數量判斷：純質淨重未達 5 公克者（本案淨重 3.2 公克），依《毒品危害防制條例》第 11 條第 5 項反面解釋，非屬刑事處罰範疇，亦屬曝險行為。\n爭點二：行政輔導先行程序與請求少年法院處理之要件\n依《少年事件處理法》第 18 條第 2 項至第 7 項，司法警察知有曝險少年，應通知少輔會處理（行政輔導先行）。\n依同法第 18 條第 6 項，少輔會輔導時，認有下列情形之一者，得請求少年法院處理：(1) 少年有觸犯刑罰法律之行為；(2) 曝險事由非尋求司法資源難以健全自我成長；(3) 少年或其法定代理人拒絕接受輔導，經協調無效；(4) 其他輔導顯難達成目的之情形。本案甲拒絕訪視且逃家失聯，符合第 6 項請求法院處理之法定要件。\n爭點三：少事法第 19 條、第 42 條保護管束與跨網絡整合處遇\n調查官之社會調查（身心狀況、家庭環境）與第 42 條第 1 項第 2 款保護管束併命入相當處所施以戒癮治療（第 42 條第 2 項第 2 款）。","outline":"(一) 甲之行為定性、司法警察處理程序及少輔會請求法院要件\n甲之行為定性：屬少事法第 3 條第 1 項第 2 款第 3 目之「曝險少年」：\n依《毒品危害防制條例》規定，施用及持有未達純質淨重 5 公克之第三級毒品，均僅屬行政處罰而未觸犯刑罰法律。\n甲年滿 12 歲未滿 18 歲，其施用並持有依託咪酯之行為，合致《少年事件處理法》第 3 條第 1 項第 2 款第 3 目規定之曝險行為，且有保障其健全自我成長之必要，定性為「曝險少年」。\n司法警察機關之處理程序：\n落實行政輔導先行：依少事法第 18 條第 2 項規定，司法警察於執行職務知有曝險少年時，除符合同條第 7 項前段（因身分不明或其他事由難以通知少輔會，得逕行移送少年法院）之例外情事外，原則上應通知少年住所、居所或所在地之少輔會處理。\n採集尿液與扣押物之移轉：依少事法第 18 條第 4 項，司法警察機關採集之尿液檢驗報告及查扣之第三級毒品煙彈，應造冊隨同相關調查資料函送少輔會併案處理；若日後案件移送少年法院，則移交法院依法沒收或銷燬。\n少輔會請求少年法院處理之法定事由：\n依少事法第 18 條第 6 項第 3 款及第 4 款規定，少輔會於輔導中，若少年或其法定代理人拒絕接受輔導經協調無效，或有行蹤不明等輔導顯難達成目的之情形者，得報請少年法院處理。本案甲多次拒絕訪視、逃家失聯且母親無力管教，符合法定請求要件。","theoryTable":[["理論／方法","理論／方法說明","核心概念","少年個案應用"],["跨理論模式（Transtheoretical Model, TTM / 改變階段模式, Prochaska & DiClemente）","該模型主張個體的行為改變非單一瞬間事件，而是歷經五大階段的螺旋動態歷程：(1) 懵懂期（Precontemplation，無改變意圖、合理化吸毒）；(2) 沉思期（Contemplation，意識到問題但處於矛盾）；(3) 準備期（Preparation，擬定具體改變計畫）；(4) 行動期（Action，具體落實戒除行為）；(5) 維持期（Maintenance，預防復發並鞏固新習慣）。改變機制在於依據個案所處之特定階段，提供相應的「改變歷程技術」（如對懵懂期著重意識覺醒，對沉思期著重自我再評價，對行動期著重刺激控制與替代行為）。易混淆處：常被誤認為直線前進模式；實務上個案極常在維持期或行動期「復發（Relapse）」，復發非治療失敗，而是螺旋式重新進入沉思或準備期的學習契機。","改變階段、懵懂期、沉思期、意識覺醒、自我再評價、復發螺旋","少年甲起初堅稱「依託咪酯只是提神電子煙、大家都在抽」，拒絕配合少輔會訪視，明顯處於「懵懂期」。保護官在少年法院調查與保護處遇時，不可直接強壓其進入行動期戒癮，而應先透過「意識覺醒（Consciousness Raising）」與「環境再評價」，讓甲觀看依託咪酯造成呼吸抑制、急性致死之醫學個案，並引導其看見家庭照護崩解之現實，促使其由懵懂期跨入「沉思期」，再逐步引導至戒癮治療門診。"],["赫胥與高福森之自我控制理論（Gottfredson & Hirschi's General Theory of Crime）","主張犯罪與各類偏差行為之單一核心成因為「低自我控制（Low Self-Control）」。低自我控制者具備六大特質：追求立即滿足、冒險衝動、重視肢體而非認知活動、自我中心、缺乏挫折容忍度、短視近利。該特質係源自童年早期（約 8-10 歲前）主要照顧者未能「監督行為、辨識偏差並及時施予導正矯正」。低自我控制者在面臨犯罪機會（Opportunity）時，極易選擇低風險、高刺激之違法手段以滿足本能。易混淆處：常與「社會控制論」混淆；社會控制論著重青少年「與外在社會鍵的連結程度（依附、致力、參與、信念）」，自我控制論則強調「個體內在衝動抑制特徵的內化與穩定性」。","低自我控制、追求立即滿足、衝動性、親職教養失靈、犯罪機會","甲自幼父母離異，缺乏有效之親職監管與規範引導，形成高度追求即時刺激、無法忍受挫折之低自我控制特質。在校外同儕提供免費煙彈與高報酬「跑腿送貨」之犯罪機會誘惑下，甲未能預估長遠法律與身體後果即輕易淪陷。保護官在擬定保護處遇時，除限制其出入聲色場所、阻斷犯罪機會（情境犯罪預防）外，更應設計結構化之自我監控（Self-Monitoring）目標卡，訓練其延宕滿足與衝動抑制能力。"],["家庭系統理論與生態系統取向處遇（Bowen Family Systems & Ecological Systems Theory）","布朗芬布倫納（Bronfenbrenner）之生態系統理論強調個體發展深受微系統（家庭、學校）、中系統（家校聯繫）、外系統（父母工作環境、社區治安）及巨系統（文化法規）之互動影響。鮑溫（Bowen）家庭系統論則指出，青少年的脫序行為往往是家庭微系統功能失調（如親職化兒童 Parentified Child、代際界限模糊、未解焦慮傳遞）的表徵。改變機制在於透過跨系統網絡整合，重構家庭功能並連結外部社會資源。易混淆處：生態系統取向絕非單純「向外找資源補助」，而是「評估各系統間之互動斷裂點並修復結構」，將焦點由責備個別少年轉向改變其所處之支持生態。","微系統失靈、生態網絡整合、家庭系統重構、跨體系資源串聯、多系統處遇","甲之涉法不僅是個人問題，而是家庭微系統（父親缺席、單親失能）、學校微系統（中輟拒學）及外系統（社區宮廟陣頭誘引）共同交互作用的結果。少年保護官於少事法第 42 條處遇中，應啟動「跨網絡整合會議」：結合社政脆弱家庭扶助修復家庭經濟，協調教育單位提供中介教育復學安置，並會同衛生局毒防中心施以精神醫療戒癮，從根本翻轉其不利之成長生態。"]],"sourceReference":"","reviewStatus":"待核對"},{"id":"2026-09-30-1","date":"2026-09-30","subject":"諮商與輔導","question":"少年甲現年 16 歲，就讀高中二年級。甲因不滿同班前女友乙提出分手，遂將交往期間拍攝之乙之私密身體照片上傳至私密通訊軟體群組供友人觀看，並附上侮辱性文字，導致該照片在校園內廣為流傳，乙因而產生重度憂鬱並休學。案經乙之家屬提告，少年法院審理後，依《少年事件處理法》第 42 條第 1 項第 2 款裁定甲交付保護管束，並命其定期向觀護人報到及接受認知輔導與心理諮商。於第一次保護管束輔導晤談時，甲由母親陪同到場，甲雙手抱胸、眼神迴避且全程緘默。當觀護人探詢事件始末時，甲憤怒表示：「這只是我和乙私下鬧著玩，而且照片大家都看過了有什麼大不了？我是被法官逼來的，我根本沒有病，為什麼要被當成罪犯看心理諮商？你現在跟我講話，是不是轉頭就會全部寫成報告交給法官告發我？」\n\n試問：(一) 面對少年甲此類「非自願案主（Involuntary Client）」，觀護人在諮商輔導倫理上會面臨何種「知情同意」、「保密原則與限制」及「雙重角色」之衝突與挑戰？觀護人應如何合法且合乎倫理地向甲予以澄清與因應？（15 分）(二) 針對甲之強烈防衛、缺乏同理心與抗拒心態，觀護人得運用何種諮商與心理治療理論（如動機晤談法、焦點解決短期治療、修復式同理心諮商）以突破其心防、喚起改變動機並修復人際傷害？請以標準四欄表格具體分析說明。（10 分）","issues":"爭點一：非自願案主之知情同意（Informed Consent）與保密限制澄清\n非自願案主欠缺求助動機，知情同意須明確告知「輔導之強制性、法定目的、流程、權利義務及評估報告之後果」。\n保密界限之劃定：非完全絕對保密，亦非毫無隱私。觀護人應依法律與倫理明確劃分「司法監督之事實報告（如按時出庭報到、是否再犯或違法毒品）」與「諮商核心心靈歷程之專業保密」，並說明保密例外（自傷、傷人、兒少保護重大通報）。\n爭點二：雙重關係（Dual Relationship）之倫理平衡\n觀護人兼具「司法官署監督者（執法監督權）」與「助人輔導者（治療同盟建立）」雙重身分。因應之道在於「透明化界限（Transparent Boundaries）」與「真誠一致」。\n爭點三：抗拒是關係未調諧之訊號與改變歷程之常態\n運用動機晤談（MI）避免改正反射（Righting Reflex），以 SFBT 尋找其正向資源，並透過修復式司法喚醒對被害人創傷之真實同理。","outline":"(一) 非自願案主之倫理衝突檢討與觀護人因應之道\n倫理衝突與實務挑戰剖析：\n知情同意的實質受限：甲係依法院強制裁判前來，缺乏自主求助意志，極易將諮商視為懲罰性審訊。\n保密原則與司法監督義務的張力：少年擔心所言遭轉呈法官而加重處分；若無保密則無信任，但觀護人依法又負有向法院陳報保護管束執行狀況之法定義務。\n雙重角色的內在衝突：觀護人既代表國家行使公權力監督，又須扮演同理接納之專業助人者，易引發個案之敵意投射。\n觀護人合乎法規與倫理之因應處置：\n落實透明化之知情同意結構：在晤談初次階段，明確以白話向甲說明輔導之法律性質、權益保障、會談頻率及目標，給予甲在規範內之自主選擇權。\n明確劃定「保密界限與例外」之紅線：公開澄清「保護管束報告只記載少年的出缺席、配合度與行為改變進展，個人的隱私情感與脆弱心事受到嚴格專業保密」；但亦清楚預告法定保密例外（自傷、傷人、現行重大不法），建立清晰安全的專業界限。\n整合雙重角色為「具支持性的權威（Authoritative Caring）」：展現「溫和而堅定」之態度，表明「我的職責是監督法院命令，但我在此的目的是陪伴你順利結束保護處分、不被標籤化並重新掌控自己的未來」。","theoryTable":[["理論／方法","理論／方法說明","核心概念","少年個案應用"],["米勒與羅尼克之動機晤談法（Miller & Rollnick's Motivational Interviewing, MI）","植基於人本主義與自我決定論，專門針對「非自願、抗拒改變與處於矛盾衝突（Ambivalence）」之個案所發展的指導性晤談技術。核心主張：個案的抗拒與防衛不是病態特質，而是晤談關係尚未調諧之訊號；改變的動力必須來自個案內在價值，而非輔導者之外在說服或法規施壓。三大核心精神為：夥伴合作（Partnership）、接納（Acceptance）、同理慈悲（Compassion）、喚起（Evocation）（PACE 精神）。輔導歷程依循四階段：建立關係（Engaging）、聚焦主題（Focusing）、喚起改變動機（Evoking）、擬定行動計畫（Planning）。技術運用 OARS（開放式提問 Open questions、肯定 Affirmations、反映傾聽 Reflective listening、摘要 Summarizing），核心關鍵在於識別並增強個案的「改變語言（Change Talk）」，同時柔和順應「維持現狀語言（Sustain Talk）」。易混淆處：動機晤談並非無原則地順應個案，亦非偽裝成同理的巧妙說服或操縱；輔導者必須真誠放下「改正反射（Righting Reflex）」，避免急於糾正少年的認知錯誤，引導其自行體會現狀與理想生涯之落差。","非自願案主、矛盾心理、PACE精神、OARS技巧、改變語言、抑制改正反射","甲面對保護管束充滿防衛，質疑觀護人是法官的密探並堅持「只是惡作劇」。觀護人應先放下法官化身之威權說教，運用 OARS 技巧表達同理：「你覺得自己被大家誤解，心裡很不甘心，而且擔心今天說的話會影響未來的判決。」待防禦降低後，探討甲對未來聲譽與人際關係的期許，對照目前面臨司法處分與學校孤立的現實，喚起其內在不一致感，促使其主動產生「想改善生活、不想被標籤化」的改變語言。"],["焦點解決短期治療（Solution-Focused Brief Therapy, SFBT, de Shazer & Berg）","由 Steve de Shazer 與 Insoo Kim Berg 開創之後現代取向諮商模式。核心主張：「問題的成因不等於解決之道」，諮商不應深究病理原因或過去的錯誤，而應聚焦於個案的「優勢、資源、例外經驗與未來期待」。認為個案才是自己生命的專家，微小的改變會引發滾雪球般的骨牌效應。五大核心問句技術包括：奇蹟問句（Miracle Question，描繪問題解決後的未來圖像）、例外問句（Exception Question，找出問題未發生或較不嚴重的時刻及其背後資源）、評量問句（Scaling Question，將抽象狀態量化為 1-10 分以追蹤微幅進步）、因應問句（Coping Question，肯定個案在極端逆境下如何維持至今）、讚賞與任務指派。易混淆處：SFBT 並非忽視當事人的痛苦或盲目粉飾太平，而是「正視問題存在，但拒絕在問題故事中打轉」，迅速引導能量轉向構建解決之道的對話。","後現代建構、尋找例外、奇蹟問句、評量問句、正向資源賦能、微小改變滾雪球","甲自認在學校已成為眾矢之的、毫無希望。觀護人可運用評量問句：「如果 1 分是你覺得生活徹底失控，10 分是你完全走出陰影，你現在給自己幾分？為什麼不是 0 分？這 2 分你是靠什麼力量撐過來的？」接著運用例外問句：「在過去這兩週裡，有沒有哪一天你和同學互動時，沒有起衝突或沒有想惡作劇的衝動？那天有什麼不同？你是怎麼做到的？」透過挖掘其未發作時的自控經驗，賦予甲正向自我效能感，打破無力感之死循環。"],["修復式司法與同理心修復諮商模式（Restorative Justice & Empathy Building）","修復式司法將犯罪與偏差行為重新定義為「對具體人際關係與社區信任的侵害」，而非單純違反國家抽象法規。輔導焦點從「誰犯了法、該受什麼懲罰」轉向「誰受了傷害、傷害造成了什麼需求、如何共同修復損害並承擔責任」。改變機制在於透過安全且結構化之會談（如修復式會議、致歉與補償協議），促進行為人跳脫自我中心防衛，直面其行為對被害人造成的真實心理、情感與名譽創傷，進而引發由內而生的同理心修復（Empathy Repair）與主動向善意願。易混淆處：修復式諮商絕非逼迫被害人原諒，亦非讓加害人以形式化「說對不起」換取減刑的交易機制；其前提必須是行為人已具備基礎的反思認知，且以「不造成被害人二度傷害」為最高倫理底線。","關係修復、損害承擔、情感同理心、修復式會談、非懲戒性責任、社區再整合","甲散布私密影像卻合理化為「同儕玩笑」，顯示其對被害人創傷之同理心嚴重鈍化。觀護人在個別輔導階段，應先引導甲進行「同理心換位思考演練」：透過閱讀匿名被害人自白書或觀看數位性暴力真實紀錄片，引導甲想像「如果這件事發生在自己至親身上，會承受怎樣的社會眼光與窒息痛苦？」在甲產生真實愧疚感後，協助其撰寫非自辯性的真誠反省信，並擬定具體的損害彌補行動（如參與防止網路霸凌志工服務），使其由被動受罰者轉化為主動承擔責任的修復者。"]],"sourceReference":"","reviewStatus":"待核對"},{"id":"2026-09-29-1","date":"2026-09-29","subject":"心理學（包括心理測驗）","question":"少年甲現年 15 歲，就讀國中三年級。甲幼年時父母離異，父親入監服刑，甲與失智祖母同住，放學後需打工並照料祖母，長期承受高度壓力。在學校中，甲性格內向，遇同學言語挑釁時習慣強忍不發、低頭不語（長期壓抑外顯表徵），但在深夜獨處時常反覆回想受辱畫面而徹夜難眠。某日，同學乙再次於走廊大聲嘲笑甲之家庭背景並阻擋去路。甲在長期累積之極度憤怒與羞辱感爆發下瞬間失控，抽出美工刀劃傷乙之臉部與手臂。事後甲恐慌無助，在宮廟友人引誘下吸食新興毒品「依託咪酯煙彈」以逃避痛苦，隨後遭警方查獲護送少年法院。少年調查官委請心理測驗員對甲施測，結果顯示：甲在「貝克焦慮量表（BAI）」呈現重度焦慮分數，「青少年人格量表」顯示極高之防衛性與情緒壓抑向度。試問：(一) 請以 James Gross 的「情緒調節歷程模式（Process Model of Emotion Regulation）」，分析少年甲在案發前與案發後所採取之情緒調節策略及其適應性？並結合青少年大腦認知神經發展之特質，解析甲何以在衝突當下產生失控暴力行為？（15 分）(二) 少年保護官在執行保護管束輔導時，應如何運用心理學與諮商輔導理論（如 Gross 之認知重評、DBT 辨證行為治療之痛苦耐受），協助甲建立適應性之情緒調節策略？請以標準四欄表格具體分析說明。（10 分）","issues":"爭點一：Gross 情緒調節歷程模式之五大階段與適應性辨析（認知重評之適應性 vs. 表達抑制與反芻之非適應性）。\n爭點二：青少年神經發展雙系統模型（Dual-Systems Model）（邊緣系統成熟早而前額葉成熟晚，在熱認知 Hot Cognition 下煞車失靈）。\n爭點三：心理測驗數據與臨床輔導策略之連結（BAI 重度焦慮與 DBT 危機耐受技術）。","outline":"(一) 以 Gross 情緒調節模式與神經發展模型分析甲之行為\nGross 情緒調節歷程模式之檢視：\n案發前：非適應性策略之疊加（表達抑制與過度反芻）：甲習慣低頭強忍，屬於「反應焦點的表達抑制」，無法消除交感神經激發且消耗認知資源；深夜反覆回想被羞辱經驗屬於「注意力調配中的反芻思維」，持續放大屈辱感。\n案發當下與案發後：情緒調節潰堤與逃避性因應：自我控制資源耗竭致情緒激發突破臨界點，轉為毀滅性暴力；事後吸食依託咪酯係透過藥物麻痺焦慮，為有害的逃避性情緒因應。\n青少年大腦發展雙系統模型之剖析：\n甲年僅 15 歲，掌管情緒衝動之「邊緣系統」高度敏感，而掌管衝動控制之「前額葉皮質」尚未成熟。\n當面羞辱引發強烈之「熱認知（Hot Cognition）」狀態，邊緣系統瞬間癱瘓了前額葉的煞車機制，致甲做出未顧及後果之極端攻擊行為。","theoryTable":[["理論／方法","理論／方法說明","核心概念","少年個案應用"],["格羅斯情緒調節歷程模式（Gross's Process Model of Emotion Regulation）","James Gross 提出情緒調節在時間軸展開之歷程模型，包含情境選擇、情境修正、注意力調配、認知重評（前置焦點 Antecedent-focused）與表達抑制（反應焦點 Response-focused）。適應性策略（如認知重評）在源頭重塑意義，有效降低負面情緒；非適應性策略（如長期表達抑制、過度反芻）僅壓抑外在表徵，交感神經仍高度激發且耗損認知資源，易導致衝動爆發或物質濫用。易混淆處：表達抑制並非真正的自我控制，而是壓抑外在表現，反而增加身心耗損；認知重評則是在感受形成前改變認知評價。","情緒調節歷程、前置焦點、反應焦點、認知重評、表達抑制、注意力調配","甲在承擔家庭重擔並受同學譏諷時，長期採取「表達抑制」壓抑恥辱，並在內心反覆「反芻」怨懟；當壓力突破臨界點時轉化為極端持刀攻擊，事後以吸食新興毒品麻痺焦慮（有害逃避性因應）。保護官處遇應訓練甲掌握「認知重評」，引導其將同學挑釁重新詮釋為「對方的無知」而非「自我價值的否定」，並建立適度宣洩管道。"],["青少年雙系統神經發展模型（Dual-Systems Model of Adolescent Brain Development, Steinberg）","Laurence Steinberg 提出發展神經心理學模型，指出青少年冒險與衝動行為源於兩系統發展不均衡：掌管情緒體驗與同儕敏感度的「社會情緒邊緣系統」在青春期早期因荷爾蒙刺激已高度活躍；而掌管衝動抑制與前瞻規劃之「前額葉皮質」直至 20 歲初至 25 歲才發育成熟。這種「油門強勁而煞車未全」的時間差，使青少年在遭遇急性壓力或情緒高張之「熱認知（Hot Cognition）」情境時，前額葉的執行功能易被邊緣系統癱瘓。易混淆處：該模型並非主張青少年缺乏智力或缺乏道德認知，而是在強烈情緒激發下其煞車控制能力暫時失效。","雙系統模型、前額葉皮質、邊緣系統、情緒神經發展時間差、熱認知與冷認知","甲年僅 15 歲，前額葉衝動控制功能未完全成熟，面對同儕當眾嘲弄受刑父親與失智家庭之極端情境，熱認知狀態引發邊緣系統主導大腦，瞬間癱瘓理性預測後果能力，導致其在數秒內拔刀傷人。保護官於調查與保護處遇時，應客觀闡明其神經發展特性，避免將其標籤化為反社會人格，並設計「情緒冷卻與延宕反應」之行為演練。"],["正念減壓與辨證行為治療之痛苦耐受技術（DBT Distress Tolerance & Mindfulness, Linehan）","Marsha Linehan 創立之辨證行為治療（DBT），針對情緒高度失調個案強調「接納與改變之辨證平衡」。其「痛苦耐受模組」教導個案在面臨劇烈情緒危機時，不以衝動破壞性行為使情勢惡化，核心技能包含 TIPP 技巧（改變體溫 Temperature、劇烈運動 Intense exercise、節奏呼吸 Paced breathing、肌肉放鬆 Paired muscle relaxation）與自我安撫。正念技術引導個案以非評價態度覺察當下身心感受，讓情緒如浪潮般自然消退。易混淆處：痛苦耐受並非消極忍受或放棄改變，而是避免在情緒風暴中做出災難性衝動之危機處置技術。","辨證行為治療、痛苦耐受、TIPP技巧、正念覺察、非評價接納","甲面對重度焦慮（BAI 測驗驗證）與突發衝突時，常出現暴怒並伴隨吸毒逃避傾向。保護官於輔導中應帶領甲具體演練 TIPP 技巧：當感到怒火攻心或急欲吸毒時，透過冰水敷臉、深層腹式節奏呼吸與漸進式肌肉緊繃放鬆，刺激迷走神經反射調降交感神經激發水準；同時建立自我安撫行動清單，在危機當下安全著陸，取代毀滅性行為。"]],"sourceReference":"","reviewStatus":"待核對"},{"id":"2026-09-28-1","date":"2026-09-28","subject":"犯罪學","question":"少年甲現年 16 歲，原為某私立高中體育班之優秀田徑選手，對未來保送大學體育系懷抱高度憧憬。一年前，甲之父母因家庭暴力協議離婚，母親改嫁後，甲常年遭受繼父無端辱罵與肢體毆打。半年前，母親因繼父經商失敗無力負擔私立學校學費，強令甲辦理休學，甲亦因此被取消代表縣市出賽之運動員資格，其升學與體育夢想一夕破滅。面對家庭破碎與生涯夢碎，甲內心充斥強烈的屈辱、挫折與暴怒，但家庭與學校均未能提供任何支持與抒解管道。甲遂離家出走，於宮廟陣頭結識不良同儕，開始吸食第三級新興毒品「依託咪酯（俗稱睡眠煙彈）」以麻痺痛苦；日前更因同儕與他人發生行車糾紛，甲夥同數名少年手持鐵棍砸毀對方車輛並打傷車主，案經警方移送少年法院審理。\n\n試問：(一) 請以 Robert Agnew 之「一般緊張理論（General Strain Theory, GST）」，深入剖析少年甲之多重緊張來源、負面情緒中介機制及其偏差違法行為之成因？（15 分）(二) 少年調查保護官在接案擬定處遇計畫時，應如何運用犯罪學與心理諮商理論（如一般緊張理論之因應策略、社會學習論、認知行為治療），協助甲建立正向因應策略以防止再犯？請以標準四欄表格具體分析說明。（10 分）","issues":"爭點一：Agnew 一般緊張理論的三大客觀與主觀緊張來源\n無法達成正向評價之目標：期望（體育保送大學）與實際成就（被迫休學）之脫節；期待與公正結果之差距。\n正向評價刺激之移除：喪失學生身分、失去運動員資格與同儕支持環境。\n負向刺激之呈現：承受繼父長期的家庭暴力與語言侮辱。\n爭點二：負面情緒（Negative Affect）之關鍵中介角色\n緊張並非直接導致犯罪，而是引發「憤怒（Anger）」、「挫折（Frustration）」與「無力感」，其中「憤怒」特別容易引發攻擊與違法報復。\n爭點三：合法因應資源之匱乏與偏差行為選擇\n認知因應（Cognitive Coping）、情緒因應（Emotional Coping）及行為因應（Behavioral Coping）之功能失調。甲以吸毒作為非法的負向情緒因應，以聚眾鬥毆作為非法的行為因應。","outline":"(一) 以 Agnew 一般緊張理論剖析甲之行為成因\n一般緊張理論之核心架構：\nRobert Agnew 主張，個體在微觀人際關係中面臨不利的緊張環境時，會產生負面情緒狀態（特別是憤怒），若缺乏合法適應能力，即會透過犯罪與偏差行為以紓解、逃避或報復緊張情境。\n甲之三大緊張來源檢視：\n無法達成正向評價目標：甲原企盼透過體育專長保送大學，卻因家庭變故被迫休學，其抱負與實際成就產生不可逆的巨大落差。\n正向評價刺激之移除：體育班身分、運動員代表資格以及規律的運動同儕支持全數喪失，剝奪其自我價值感的主要來源。\n負向刺激之呈現：長期承受繼父的肢體暴力與言語辱罵，人身安全與家庭尊嚴遭受持續侵害。\n負面情緒之中介與適應不良之行為選擇：\n上述多重緊張引發甲內在劇烈的「憤怒」與「不公感」。因缺乏社會資本與健康心理支持，甲選擇了破壞性的適應方式：\n退縮性情緒因應：施用依託咪酯，企圖透過藥物中樞鎮靜麻痺內心痛楚。\n外向性暴力行為因應：透過參與陣頭聚眾砸車與傷人，將內在積壓的暴怒轉嫁於外界，藉此在不良同儕中重新獲得被接納感與虛假的控制權。","theoryTable":[["理論／方法","理論／方法說明","核心概念","少年個案應用"],["羅伯特·艾格紐之一般緊張理論（Robert Agnew's General Strain Theory, GST）","Agnew 擴充傳統 Merton 結構緊張論，主張個人微觀人際經驗中的緊張是偏差行為核心促發因素。核心主張：個體因生活中的客觀或主觀緊張事件產生負面情緒狀態（特別是「憤怒 Anger」與挫折），進而引發偏差行為作為減輕或發洩緊張的應對手段。緊張三大來源：(1) 無法達成正向評價之目標（期望與成就差距）；(2) 正向評價刺激之移除（如親人離世、失戀、休學、失去球員資格）；(3) 負向刺激之呈現（如家庭暴力、虐待、霸凌）。若個案欠缺合法的認知、情緒或行為因應資源，犯罪往往成為發洩憤怒或尋求報復之管道。易混淆處：傳統緊張論著重「宏觀社會階級與經濟成功目標之受阻」，一般緊張理論則將焦點轉向「微觀日常人際互動中的挫折與情緒反應」，特別強調「負面情緒（憤怒）」是連結緊張與犯罪之中介關鍵。","微觀緊張、三大緊張來源、負面情緒中介（憤怒）、認知/情緒/行為因應策略","少年甲經歷父母離異與繼父家暴（負向刺激呈現）、因經濟受挫被迫放棄熱愛的私立高中體育班與運動員夢想（正向刺激移除及期望成就差距之目標受阻），內心積壓巨大的憤怒與不甘。因家庭無支持、學校無轉銜，甲欠缺有效心理調節機制，憤怒情緒直接轉化為外顯破壞行為（聚眾毀損、砸車）以及透過吸食依託咪酯麻痺痛苦（適應不良之行為因應）。保護官處遇應重在消除負向刺激（聲請保護令、安置）並重建正向刺激（重返校園或職訓體育訓練）。"],["班度拉社會學習與社會認知論（Bandura's Social Learning Theory & Modeling）","主張人類行為多數透過「觀察學習（Observational Learning）」與「模仿（Modeling）」而習得。個體目睹楷模（如家庭暴力者或不良同儕）之行為及其所獲得的結果（替代增強 Vicarious Reinforcement），在內在進行注意力、保留、動作再生與動機歷程後表現出相似行為。在暴力傳遞中，目睹家庭暴力的少年常內化「暴力是解決挫折與展現權力之有效手段」的基模。易混淆處：常與 Sutherland 差別接觸理論混淆；差別接觸理論強調「犯罪動機與態度定義（Definitions）之學習」，社會學習論則更具體探討「觀察示範、替代經驗與自我效能感（Self-Efficacy）」之認知操作機制。","觀察學習、行為模仿、替代增強、攻擊基模內化、自我效能","甲長期目睹繼父以言語與肢體暴力控制家庭，無形中將「暴力＝力量與主導權」的基模內化；隨後在陣頭團體中，目睹同儕以聚眾鬥毆解決糾紛並受到讚賞（替代增強），甲為尋求認同並排解無力感，迅速模仿並參與群體毀損與暴力行為。觀護人在處遇時，應透過示範正向問題解決技巧（Modeling），協助其建立非暴力的自我效能感，打破暴力代際模仿之循環。"],["貝克認知行為治療法之情緒聚焦重構（Beck's Cognitive Behavioral Therapy, CBT）","Aaron Beck 主張，個體的情緒與行為困擾源於其「自動化思考（Automatic Thoughts）」與潛在的「核心認知基模（Core Beliefs）」。當個體面臨重大挫敗或創傷時，易啟動認知扭曲（如全有全無思維、過度推論、災難化與敵意歸因偏誤 Hostile Attribution Bias），進而引發極端憤怒或絕望。改變機制在於透過認知重構（Cognitive Restructuring），協助個案識別自動化思考、檢驗證據、並發展適應性之替代思考與情緒調節技能。易混淆處：CBT 並非單純要個案「正面思考」或壓抑情緒，而是「實事求是地檢驗信念的邏輯性與真實性」，並配合行為實驗進行具體技能演練。","核心基模、自動化思考、認知扭曲、敵意歸因偏誤、認知重構","甲在體育班夢碎與遭遇家暴後，形成「整個世界都在跟我作對、我的人生已經全毀了」的災難化核心基模，並在人際互動中產生強烈的「敵意歸因偏誤」，動輒認為外界挑釁其尊嚴而暴怒動手。觀護人於個別面談時，應運用情緒日記與思考記錄表，引導甲覺察從「受挫情境→自動化憤怒思考→砸車吸毒」的連鎖反應，駁斥其認知扭曲，並訓練其「停、看、聽」之情緒冷卻與衝動延宕技巧。"]],"sourceReference":"","reviewStatus":"待核對"},{"id":"2026-09-27-1","date":"2026-09-27","subject":"本週跨科整合複盤（融合：犯罪學、心理學、諮商與輔導、少年事件處理法、保安處分執行法、刑事訴訟法）","question":"少年甲現年 15 歲，自幼生長於高度衝突之離異家庭，母親情緒不穩定且長期將未解焦慮轉嫁於甲身上，父親則長年缺席。甲國二起頻繁逃學，結識校外不良同儕，於租屋處共同吸食第三級新興毒品「依託咪酯（Etomidate，俗稱睡眠煙彈）」，復因缺錢購毒，多次夥同同儕侵入住宅竊取財物。警員循線查獲甲並護送至少年法院。少年法院調查過程中，甲情緒躁動、言詞反覆，且出現嚴重注意力不集中與戒斷戒癮幻覺症狀。少年調查官調查後，認為甲身心狀態堪慮且家庭已完全喪失監督功能。試問：(一) 少年法院於審理前及審理時，得採取何種身心評估與保護處置？若少年法院裁定交付保護管束並命入相當醫療機構施以禁戒治療，其法律依據及與普通刑事訴訟法「暫行安置」之本質與目的有何異同？（請綜合《少年事件處理法》、《保安處分執行法》及《刑事訴訟法》分析）（15 分）(二) 少年保護官在接案擬定處遇計畫時，應如何整合犯罪學理論解釋甲之違法成因？並如何運用心理學與諮商輔導理論（如家庭系統論、現實治療法）介入輔導？請以標準四欄表格具體分析說明。（10 分）","issues":"爭點一：少事法身心評估與鑑定留置之程序權衡\n《少年事件處理法》第 19 條第 1 項審前調查；第 26 條第 2 款、第 26 條之 2 鑑定留置（至多 2 個月，不得延長）之發動要件與程序正當性。\n爭點二：少事法治療處分 vs. 刑事訴訟法暫行安置\n少事法 §42 第 2 項第 2 款：附屬性處遇，重在「教育保護與醫療矯治」，配合保護處分執行，以保障少年健全自我成長為最高指導原則。\n刑事訴訟法 §121-1 暫行安置：保全處分，重在「防衛社會安全與保全訴訟程序」，針對無責任能力或限制責任能力且具高度危險性之成年被告。\n爭點三：跨科理論模型之有機整合\n犯罪學：社會控制理論之「依附、致力、參與、信念」全面崩解。\n諮商輔導：家庭系統之「情緒三角化與代罪羔羊」；現實治療「WDEP 模式」促成自主負責。","outline":"(一) 少年法院身心評估與處置，及治療處分與暫行安置之比較\n少年法院得採取之身心評估與處置：\n審理前調查與鑑定留置：依《少年事件處理法》第 19 條第 1 項，調查官應調查甲之身心狀況、家庭環境。因甲有毒品戒斷與精神躁動症狀，法院得依同法第 26 條之 2 裁定將甲交付留置於醫院鑑定其心智狀態，期間不得逾 2 個月。\n裁定保護處分與禁戒治療：法院得依少事法第 42 條第 1 項第 2 款裁定交付保護管束，並依第 42 條第 2 項第 2 款命入相當處所施以治療或禁戒。依《保安處分執行法》第 64 條及第 71 條規定，觀護人應主導連結醫療戒癮資源，促其完成身心治療。\n少事法治療處分與刑訴暫行安置之異同比較：\n本質與目的不同：\n少事法治療處分係基於「國親思想（Parens Patriae）」，目的在於滿足少年的醫療需求與保護其身心成長，非為防禦社會之手段。\n刑訴暫行安置係為填補偵查或審判中對精神障礙被告未達羈押要件之保安漏洞，本質屬於「防衛社會、保全被告及防範再犯」之拘束人身自由強制處分。\n程序與發動階段不同：\n暫行安置得於偵查中或審理中由法官裁定（最長 6 個月，累計不得逾 5 年），受嚴格法官保留與正當程序拘束。\n少事法治療處分通常於終局裁定中與保護處分併為諭知，具有輔助保護處分健全實施之從屬性質。","theoryTable":[["理論／方法","理論／方法說明","核心概念","少年個案應用"],["赫胥社會控制理論（Hirschi's Social Bond Theory）","該理論主張人天生具有追求立即滿足之傾向，個體之所以不從事犯罪，是由於受到與主流社會連結的「社會鍵（Social Bond）」所拘束。當社會鍵削弱或斷裂時，個體即會順應本能從事偏差行為。社會鍵包含四要素：依附（Attachment）、致力（Commitment）、參與（Involvement）、信念（Belief）。易混淆處：常與「自我控制論（General Theory of Crime）」混淆；社會控制論強調「外在社會關係連結與社會制度控制」，自我控制論則強調「個體內在衝動抑制特質的恆定性（童年期建立）」。","社會鍵、依附、致力、參與、信念、社會控制","少年甲長期逃學，對學校與常態教育體系之「依附」中斷；對未來學業或生涯缺乏長遠期待與投資（缺乏「致力」）；課餘閒暇時間未參與合法建設性社團（缺乏「參與」）；法律守法意識薄弱（缺乏「信念」），最終受不良同儕吸引而結夥竊盜與吸毒。少年保護官於處遇中，應結合社福網絡安排職業探索與復學轉銜，修復家庭支持，重塑其四項社會鍵。"],["鮑溫家庭系統理論（Bowen Family Systems Theory）","鮑溫理論主張家庭為一相互牽動之情緒單元，家庭成員之焦慮與互動模式會跨世代傳遞。核心概念包括「自我分化（Differentiation of Self）」與「情緒三角化（Triangulation）」。當父母婚姻或情感關係破裂時，常將未解之焦慮投射至脆弱子女身上，使子女成為承載家庭病態張力的「症狀承載者（Symptom Bearer）」。易混淆處：常與單純人際衝突理論混淆；家庭系統論強調個案的偏差是「維繫家庭平衡之無意識防衛機轉」，而非個案單純個人本性惡劣。","自我分化、情緒三角化、家庭投射歷程、代際傳遞、症狀承載者","甲生長於離異家庭，母親情緒長期不穩且將情感失落與控制焦慮全數傾倒於甲身上，父親則徹底缺席，甲深陷父母未解衝突之情緒三角中，承受巨大窒息感。甲以逃家、結夥吸食依託咪酯等失控行為，實質上是在以症狀表現宣洩家庭張力。保護官在處遇時，除個別輔導外，必須導入家庭親職諮商，協助母親覺察自我焦慮，打破病態三角關係，促進甲之心理分化與情緒獨立。"],["格拉瑟現實治療法（Glasser's Reality Therapy / WDEP 模式）","植基於選擇理論（Choice Theory），主張人類所有行為均旨在滿足五大內在心理需求：生存、愛與歸屬、權力與成就、自由、樂趣。個案之所以產生違法或自我毀滅行為，是因其無法以負責任、合法之方式滿足上述需求，進而選擇了無效的「全行為（Total Behavior）」。輔導機制採 WDEP 模式（探索期許 Wants、檢視作為 Doing、自我評估 Evaluation、擬定計畫 Plan）。易混淆處：常與強調外在獎懲的行為主義混淆；現實治療法反對外在控制，堅信唯有內在需求得到釐清，並由個案「自發自我評估」其行為有效性時，改變才會持久。","選擇理論、五大基本需求、WDEP模式、有效性評估、承擔責任","甲吸毒與結夥行竊，本質是為在同儕團體中尋求「愛與歸屬」以及掌控生活的「權力與樂趣」，卻誤用破壞性手段。保護官應運用 WDEP 模式：引導甲探索其內心真正渴望的歸屬與尊重（Wants）；攤開檢視其目前吸毒與行竊的具體作為（Doing）；引導其自我評估「這些行為是否真能讓你獲得長久的自由與尊嚴，還是讓你面臨司法收容與身體崩潰？（Evaluation）」；最後引導其共同擬定參加合法才藝或體育團體、遠離毒品聚會的具體可行契約（Plan）。"]],"sourceReference":"","reviewStatus":"待核對"},{"id":"2026-09-26-1","date":"2026-09-26","subject":"刑事訴訟法","question":"少年甲現年 17 歲，因在網路上尋找打工機會，遭電信詐欺集團吸收擔任水房提款車手。某日晚間 9 時，甲在自動櫃員機提領贓款時遭警員當場以現行犯逮捕，並扣押其身上之提款卡與智慧型手機。警員將甲帶回警局後，甲之父母因離異且疏於管教，警方僅撥打一次電話無人接聽即作罷，未再行通知其他適當之人。翌日上午 9 時，警員製作筆錄時，甲明確表示欲選任律師為辯護人，警員乃准予甲聯絡法扶律師並等候。迄同日上午 11 時，因警員急於移送少年法院，乃對甲告稱：「律師等了兩個小時還沒來，我們時間有限，你現在老實招供算你配合，不然移送法院直接收容關起來！」甲因孤立無援且心生恐懼，遂於警詢中坦承知悉所領款項為詐騙贓款，並交出手機解鎖密碼供警員檢視通訊軟體群組對話紀錄。嗣甲經少年法院裁定移送檢察官起訴。於通常刑事審判中，甲之辯護人主張：警員未通知法定代理人到場、未滿 4 小時即逕行訊問且施以脅迫，其警詢自白及衍生之手機通訊紀錄均無證據能力。試問：(一) 請依《刑事訴訟法》、《少年事件處理法》及實務見解，檢討警員對甲之詢問程序是否合法？甲之警詢自白及自其手機取得之通訊紀錄，於法院審判時有無證據能力？（25 分）(二) 少年調查官或觀護人於審前調查中，若發現甲兼具心理順從脆弱性、缺乏家庭依附及合理化犯罪行為之傾向，應如何運用心理學、犯罪學或諮商輔導理論擬定輔導對策？請以標準四欄表格具體分析說明。","issues":"爭點一：偵查中等候辯護人時間之計算與未達法定期間逕行詢問之效果\n《刑事訴訟法》第 31 條之 1 第 2 項後段規定，偵查中等候辯護人到場之時間，自告知時起不得逾「4 小時」。警員僅等候 2 小時即逕行訊問，明顯違反法定等候程序。\n爭點二：少年詢問法定代理人或適當成人在場權之違反\n《少年事件處理法》第 3 條之 1 第 1 項前段明定：「少年受訊問或詢問時，其法定代理人、現在保護少年之人或其他適當之人得陪同在場。」警方未窮盡通知義務，違反少年程序保障與 CRC 第 24 號一般性意見書意旨。\n爭點三：自白任意性之欠缺與違法取證之排除\n警員以「不坦白就直接收容」告稱，構成《刑事訴訟法》第 156 條第 1 項之「強暴、脅迫、利誘、詐欺、疲勞訊問或其他不正之方法」，自白欠缺任意性，依法應絕對排除證據能力。\n手機解鎖通訊紀錄涉及「毒樹果實理論（Fruit of the Poisonous Tree）」在臺灣實務之適用，應依《刑事訴訟法》第 158 條之 4 權衡法則審酌警察違法意圖、人權侵害情節與公共利益。","outline":"(一) 警員詢問程序之合法性及自白與通訊紀錄之證據能力\n警員詢問程序具重大違法：\n違反等候辯護人之法定程序：依《刑事訴訟法》第 31 條之 1 第 2 項後段，司法警察等候辯護人到場之期間不得逾 4 小時。警員僅准予等候 2 小時即逕行訊問，已實質剝奪甲之防禦權。\n違反少年在場權之實質保障：依《少年事件處理法》第 3 條之 1 及 CRC 第 24 號一般性意見書第 60 點，少年受詢問時應有父母或適當之人陪同。警員未積極聯絡其他適當成年人，造成少年處於無任何心理與法律支持之封閉孤立環境。\n施以不正訊問：警員告稱「移送法院直接收容關起來」，係以非法的惡害通知脅迫少年，違反《刑事訴訟法》第 98 條及第 156 條第 1 項規定。\n甲之警詢自白無證據能力：\n依《刑事訴訟法》第 156 條第 1 項規定，自白須具備任意性。警員既施以不正脅迫，且剝奪辯護權與在場權，該自白非出於任意性，應「絕對排除」，不得作為證據。\n自手機取得之通訊紀錄之證據能力（衍生證據）：\n甲交付密碼係因不正訊問之自白所衍生。依我國最高法院實務（如 96 年台上字第 4177 號判決），針對違法自白衍生之二次證據，雖未直接採取美國嚴格之毒樹果實理論，惟仍應類推適用《刑事訴訟法》第 158 條之 4 權衡法則。\n本案警員違法情節重大（兼具脅迫、侵犯少年在場權及辯護權），若容許該手機通訊紀錄作為證據，將形同鼓勵違法取供，嚴重危害司法純潔性與正當程序，法院應裁定排除其證據能力。","theoryTable":[["理論／方法","理論／方法說明","核心概念","少年個案應用"],["Gudjonsson 順從性理論（Gudjonsson Suggestibility Theory）","英國犯罪心理學家 Gisli Gudjonsson 提出，探討個案在封閉、權力不對等之司法詢問情境下產生「虛偽自白（False Confession）」之心理機制。該理論指出，個案在面對權威施壓、缺乏社會支持與高度焦慮時，易採取「依從（Compliance）」策略，即為了逃避眼前的威脅（如被羈押或收容）而屈從陳述。易混淆處：順從性自白並非個案認知上相信自己有罪（不同於內化型虛偽自白 Internalized False Confession），而是外在短期動機驅使的暫時妥協。","心理順從性、權威施壓、孤立情境、虛偽自白","甲年僅 17 歲，遭遇警方逮捕後被隔絕於孤立警局，在父母未到場、律師未陪同之極端恐懼下，警員威脅「移送法院直接收容」，甲為求迅速脫離該高壓情境而產生高度心理順從，符合順從性自白之心理特徵。觀護人於調查時應詳查其自白動機，避免將屈從陳述誤判為具高度惡性之全然認罪。"],["班度拉社會認知論之道德推脫（Moral Disengagement）","Albert Bandura 提出，個人在從事違背普遍道德規範之行為時，會透過內在認知重構以解除道德自我約束，避免內疚與自我譴責。主要機制包括：道德辯護（將行為重塑為具合理價值）、責任分散與轉移（推諉為「我只是聽從群組指令領錢，主謀不是我」）、忽視或曲解後果，以及去人性化。易混淆處：道德推脫並非個案欠缺道德辨識能力，而是藉由認知防衛機轉阻斷道德罪惡感之運作。","道德推脫、責任轉移、認知重構、合理化機制","甲涉入詐欺水房擔任車手，常抱持「我只是單純打工跑腿領錢，騙人的又不是我」之責任轉移心態。觀護人在擬定個別處遇計畫時，應引導甲直面被害人遭詐騙後傾家蕩產的具體痛苦，拆解其「打工賺零用錢」的自我合理化認知，重建其對被害人損害之道德同理心與個人責任感。"],["理情行為治療之非理性信念重構（Ellis's REBT）","Albert Ellis 創立之理情行為治療（REBT）主張，人的情緒與適應不良行為（C）非直接由誘發事件（A）引起，而是源自於對事件的非理性信念（Beliefs, B），如「絕對化要求」、「過度概括」與「災難化思維」。改變機制在於透過積極駁斥（Disputing, D），協助個案建立有效且理性的新哲學（Effective New Philosophy, E）。易混淆處：REBT 並非單純提供情感同理，而是帶有強烈指導性與邏輯思辨之認知介入，需直接挑戰個案根深蒂固的非理性思考。","ABCDE模式、非理性信念、積極駁斥、認知重組","甲生長於離異家庭，長期缺乏親職支持，內心常存有「我家裡沒人管我，我做什麼都無所謂，只有錢能證明我的存在」之災難化與絕對化非理性信念，進而被詐騙高薪誘惑吸引。觀護人輔導時應以 ABC 模式解析其思維盲點，強力駁斥其「物質金錢等於自我價值」之非理性認知，並協助其建立健全的自尊與合法職業認同。"]],"sourceReference":"","reviewStatus":"待核對"},{"id":"2026-09-25-1","date":"2026-09-25","subject":"保安處分執行法","question":"案例事實：甲現年 20 歲，於 17 歲時因涉犯重傷罪，經少年法院依《少年事件處理法》第 27 條第 1 項規定裁定移送檢察官偵查起訴，嗣經判處有期徒刑 3 年確定，並於判決內依《刑法》第 93 條第 1 項規定，諭知於刑之執行完畢後交付保護管束 2 年。甲於入監執行期滿釋放時已滿 20 歲，由地檢署觀護人依《保安處分執行法》執行保護管束。於保護管束執行期間，甲無正當理由多次未於觀護人指定期日報到，觀護人經實施不預告訪視，發現甲多次涉足聲色場所、深夜不歸，且對同住祖母有言語恐嚇與毀損物品行為。觀護人採集其尿液送驗後，呈現第三級毒品愷他命（Ketamine）陽性反應。\n\n試問：(一) 針對甲之上開違規情事，觀護人得採取何種法律上之處置？若擬撤銷其保護管束，其法定要件、法定程序及撤銷後之法律效果各為何？（請依《保安處分執行法》及實務規範作答）(二) 若甲受處分原因兼具精神藥物濫用與童年創傷依附困境，觀護人在擬定個案處遇計畫時，得運用何種犯罪學、心理學或諮商輔導理論以因應其成癮與違規行為？請以標準四欄表格具體分析說明。","issues":"爭點一：保護管束受處分人之遵守義務與觀護人裁量處置\n《保安處分執行法》第 74 條之 2 明定受保護管束人應遵守之各款事項（包括保持善良品行、服從觀護人命令、定期報到、不得與不良分子交往等）。\n觀護人得依同法第 65 條之 1、第 74 條之 3 規定採取約談、告誡、增強訪視頻率，或命其接受醫療、戒癮治療等輔導處置。\n爭點二：撤銷保護管束之要件、程序與法律效果\n要件：違反應遵守事項情節重大（《保安處分執行法》第 74 條之 3 第 1 項、第 2 項）。\n程序：由檢察官聲請管轄法院裁定（刑事訴訟法第 481 條第 1 項、保安處分執行法第 65 條之 1）。\n法律效果：刑後保護管束遭撤銷時，與「假釋中交付保護管束」不同，需檢討《刑法》第 93 條第 1 項宣告之刑後保護管束性質與替代執行之實務適用問題。\n爭點三：跨領域專業處遇之連結\n將行為改變技術、復發預防模式及依附創傷理論，具體扣合甲涉足不良場所、吸毒、家暴衝突與缺席報到之事實。","outline":"(一) 觀護人得採取之處置、撤銷保護管束之要件、程序與法律效果\n觀護人得採取之告誡與處置權限：\n遵守義務違反之確認：甲未按期報到、深夜不歸涉足不當場所、施用毒品及家庭暴力行為，違反《保安處分執行法》第 74 條之 2 第 1 款（保持善良品行）、第 2 款（服從觀護人命令）及第 4 款（定期報告生活狀況）。\n告誡與輔導處置：依《保安處分執行法》第 74 條之 3 第 1 項，觀護人得予以告誡，促其遵守；同時得依個案需要，依同法第 65 條之 1 命其定期接受尿液採驗，並得協調社會福利、醫療機構施以戒癮諮商或毒品危害防制處遇。\n聲請撤銷保護管束之實體要件：\n依《保安處分執行法》第 74 條之 3 第 2 項，受保護管束人違反遵守事項「情節重大」者，得聲請撤銷。\n甲兼具施用毒品、無正當理由拒絕報到、恐嚇家屬等連續且嚴重危害公共安全之行為，已非單純生活規律欠佳，符合情節重大要件。\n管轄與法定程序：\n觀護人報請執行檢察官，由檢察官依《刑事訴訟法》第 481 條第 1 項向該案犯罪事實最後審判之管轄法院裁定。\n撤銷保護管束後之法律效果：\n甲所受者為《刑法》第 93 條第 1 項之「刑後保護管束」，其徒刑 3 年已執行完畢。依現行法制，刑後保護管束與假釋中保護管束不同（後者撤銷會導致入監執行殘刑）；實務上刑後保護管束撤銷後，因母刑已執行完畢，不得再送監執行原宣告刑，此乃保安處分獨立執行之法律特性。","theoryTable":[["理論／方法","理論／方法說明","核心概念","少年個案應用"],["馬勒斯基復發預防模式（Relapse Prevention Model）","此為認知行為取向模式，主張物質成癮與偏差行為的復發並非道德失敗，而是面對高風險情境時「應對技能不足」與「認知失衡」的結果。核心機制在於識別促發誘因、中斷「禁戒破毀效應」，並建立因應策略。易混淆處：常與精神分析之衝突論或道德勸告混淆；復發預防強調「技能訓練與環境控制」，承認微小滑脫（Slip）不等於完全復發（Relapse）。","高風險情境、應對技能、禁戒破毀效應、誘因識別","甲施用三級毒品並深夜流連不良場所，觀護人應會同心理師協助甲繪製「高風險情境地圖」，找出其涉足特定場所與毒品接觸的社交誘因；教導拒絕同儕技巧及壓力應對策略，打破其「吸食一次便自我放棄」的認知偏差。"],["動機晤談法（Motivational Interviewing, MI）","由 Miller 與 Rollnick 提出，植基於人本主義，認為個案的抗拒是輔導關係未調諧的信號而非本性頑劣。改變機制在於透過同理傾聽、引導個案探索其價值觀與現狀間的「內在不一致性」，激發其自我改變語言。易混淆處：非指導性說服或論辯；觀護人不可站在說教者立場直接駁斥甲的防衛，而是引導其自行發現行為後果與生涯期待之衝突。","表達同理、開展不一致、順應抗拒、增強自我效能","甲無正當理由多次拒絕向觀護處所報到，呈現高度防衛與抗拒。觀護人於面談時應避免直接威脅撤銷，改以開放式提問探討甲對滿 20 歲成年後生涯自主的渴望，對照目前因吸毒與家暴面臨刑事處分的現實，促使其自發產生配合定期報到的改變動機。"],["依附理論與創傷知情模式（Attachment Theory & TIC）","Bowlby 之依附理論指出，早期主要照顧者回應不足會形成不安全依附，在成年初期轉化為情緒調節障礙與人際攻擊。創傷知情模式主張「不問你哪裡有問題，而問你經歷了什麼」，個案的恐嚇與攻擊常為長期創傷激發的防衛機轉。易混淆處：並非免除受處分人之違法責任，而是在維持明確規範邊界的同時，理解其破壞性行為背後的情緒失控機制。","不安全依附、創傷知情、安全基地、界限設定","甲對同住祖母施以言語恐嚇與毀損，反映出其家庭依附關係嚴重斷裂與情緒調節瓦解。觀護人介入時一方面設定嚴格人身安全底線（防止暴力），另一方面引介家庭支持資源，協助建立穩定、具支持性的外部安全基地，降低其因家庭衝突引發的暴衝與失序行為。"]],"sourceReference":"103 年公務人員特種考試司法人員三等考試觀護人類科（選試少年事件處理法）「刑事訴訟法與保安處分執行法」第 4 題","reviewStatus":"待核對"},{"date":"2026-10-05","subject":"犯罪學","question":"阿哲，15 歲，國三，與祖母同住，父母離異。學業落後、被標籤為「問題學生」，社區經濟弱勢且缺乏課後資源，逐漸疏離學校，與學長團體往來，被指使參與傷害與詐欺車手工作。請（一）以社會結構學派代表理論、（二）以社會控制學派代表理論分別分析成因，（三）依各自理論提出防治對策，（四）說明觀護人在保護管束中如何整合運用。（25 分）","issues":"結構學派問「為何被推向犯罪」，控制學派問「為何多數人不犯罪」；理論須貼合事實，並區分歸類。","outline":"1. 破題：偏差成因多元，兩學派各有解釋力。\n2. 結構學派：選一理論（Agnew 或 Merton），寫主張、概念、套用阿哲、對策。\n3. 控制學派：社會鍵四要素逐一連結事實，再提對策。\n4. 比較：人性假設、解釋層次、對策重點。\n5. 觀護人整合：風險需求評估、處遇計畫、跨機關合作。\n6. 結論：兩理論互補，兼顧壓力調節與連結重建。","theoryTable":[["理論／方法","理論／方法說明","核心概念","少年個案應用"],["一般緊張理論（Agnew，結構／緊張取向）","偏差來自負面壓力源所生的負面情緒，在缺乏有效因應資源時以偏差行為作為出口。壓力源有三類：目標受阻、正向刺激被剝奪、負向刺激出現。易混淆：Merton 談結構與文化目標、合法手段的落差，偏宏觀；Agnew 聚焦個人感受的壓力與情緒，偏微觀。","目標受阻、失去正向刺激、負向刺激、負面情緒、因應資源","學業落後被標籤、家庭破裂、社區資源匱乏，累積挫折與憤怒，缺乏合法出口，轉依附學長團體。"],["社會鍵理論（Hirschi，社會控制）","假設人人有犯罪動機，社會鍵強弱決定是否越軌；四要素為依附、投入、參與、信念，鍵越弱越可能偏差。易混淆：談「控制減弱」，不同於差別接觸認為偏差是學來的。","依附、投入、參與、信念","與祖母依附薄弱、疏離學校、規範信念鬆動，轉向學長團體。"],["社會解組理論（Shaw & McKay，結構補充）","解釋犯罪率的地區差異：貧窮、人口流動使社區難以形成非正式社會控制。易混淆：屬社區層次，不直接解釋個人為何犯罪。","社區貧窮、居民流動、非正式社會控制","社區弱勢、缺乏課後資源，監督與支持薄弱。"],["保護管束處遇方向（實務應用）","緊張取向偏重資源與壓力調節，控制取向偏重重建連結與依附，可整合：先做風險與需求評估，再訂處遇計畫。","風險需求評估、資源轉介、關係重建","轉介課後輔導與福利資源，並強化與祖母、學校、正向同儕的連結。"]],"sourceReference":"114 年司法特考三等觀護人（犯罪學）第 1 題（25 分）。原題主旨：從社會結構學派與社會控制學派各舉一個代表理論，說明青少年偏差行為成因與防治對策。（來源：法律人 LawPlayer，原題引自考選部）","reviewStatus":"待核對","warnings":[],"studyNotes":"不要只背理論、不套事實；歸類要對（社會解組、緊張屬結構；社會鍵屬控制）。","id":"md-c2f1953022ffa3263e9b"},{"date":"2026-10-05","subject":"犯罪學","question":"17 歲少年 A 就讀高職夜間部，白天在工地打工。近一年多次夥同友人竊盜工地金屬材料，並於網路販售贓物。A 自幼父母離異，由祖母扶養；國中時遭同學長期排擠，高中後逐漸與輟學同儕混跡。最近一次竊盜被逮後，少年法院裁定交付觀護，並命接受法治教育與社區服務。請依犯罪學理論，分析 A 的犯罪行為成因，並說明如何結合緊張理論、差別接觸理論與社會控制理論設計處遇計畫。（25 分）","issues":"- 多理論整合：區分結構性壓力、犯罪學習與社會連結弱化。\n- 事實涵攝：連結家庭、學校、同儕、就業與網路販售行為。\n- 處遇可操作性：提出可執行、可追蹤的觀護措施。","outline":"1. 前言：說明少年犯罪具多因性，採整合理論分析。\n2. 成因分析：分別說明三理論主張，再將題目事實逐一涵攝。\n3. 觀護處遇：提出「風險降低＋保護因子增強」的具體計畫。\n4. 成效追蹤：設定就學出席、正當就業、同儕接觸、家庭互動與再犯風險等可評估指標。\n5. 結語：強調教育、復歸與個別化處遇，而非單純懲罰。","theoryTable":[["理論／方法","理論／方法說明","核心概念","少年個案應用"],["緊張理論","當個人無法透過合法途徑達成被社會認可的目標，或遭受負向刺激與正向刺激剝奪，可能產生壓力、憤怒或挫折；部分人會以違法方式因應。重點不只是貧窮，而是目標、資源與處境之間的失衡。","目標－手段斷裂、負向情緒、創新適應","A 面臨家庭支持有限、就學與工讀並行及經濟壓力；竊取金屬並販售可能被其視為快速取得收入的非法替代手段。"],["差別接觸理論","犯罪行為與守法行為均可透過互動習得；個人會學到犯罪技巧、動機、合理化語言與對法律的定義。接觸的頻率、持續性、優先性與強度會影響學習結果。不可僅以「交到壞朋友」概括，應分析具體學到何種技巧與價值。","學習犯罪、犯罪定義、頻率、持續性、優先性、強度","A 與輟學同儕多次共同竊盜且販售贓物，顯示可能從同儕習得目標選擇、行竊方式、銷贓管道及合理化說詞。"],["社會控制理論","人不犯罪的重要原因在於與傳統社會有連結；依附、承諾、參與及信念愈強，偏差行為的代價愈高。此理論重點是解釋何以沒有被社會連結約束，而非主張控制本身即可治療所有問題。","依附、承諾、參與、信念","A 與父母依附薄弱，學校投入與正向活動可能不足，且受同儕影響而弱化法規範信念；處遇應重建其家庭、學校與社區連結。"]],"sourceReference":"改編自 113 年司法特考觀護人犯罪學科目之考古題風格與爭點；此處為模擬改編題，非重製原題。","reviewStatus":"待核對","warnings":["日期待核對：檔名 2026-10-05；內文 2025-10-05。依檔名排序，不代表已確認題目日期。","原始考題出處待核對；不得視為已確認的逐題改編。"],"studyNotes":"- 緊張理論導向：評估經濟與家庭需求；連結社福、職訓、技能檢定與就學銜接；協助建立合法收入與可達成的短中期目標。\n- 差別接觸理論導向：降低與共犯及犯罪同儕的非必要接觸；安排具結構性的課業、職訓、運動或志工活動；以認知行為方法處理犯罪合理化。\n- 社會控制理論導向：辦理家庭會談、強化與祖母的支持關係；與學校輔導系統合作；透過法治教育、修復式對話或有意義的社區服務，提升規範信念與歸屬感。","id":"md-0561b5f12b42a84733d2"}],"templates":[{"subject":"犯罪學","date":"2026-10-05","content":"# 觀護人考試申論題答題模板（犯罪學）\n\n適用週一犯罪學練習；可依題目要求增減段落。建議總篇幅控制在 800–1200 字。\n\n---\n\n## 一、答題前檢核（1–2 分鐘）\n\n- [ ] 題目要求：理論分析？處遇設計？兩者都要？\n- [ ] 關鍵事實：家庭、學校、同儕、工作、社區、網路、前科、保護因子。\n- [ ] 指定理論：是否明確列出？若未指定，自行選 2–3 個最貼合的理論。\n- [ ] 時間分配：成因分析約 60%，處遇設計約 40%。\n\n---\n\n## 二、答題架構（建議標題）\n\n### （一）前言（約 80–120 字）\n\n- 簡述少年犯罪成因具多因性，單一理論難以完整解釋。\n- 點明本題將運用哪些理論（例：緊張理論、差別接觸理論、社會控制理論），並說明將連結題目事實與觀護處遇。\n\n範例句型：  \n「少年犯罪行為通常係結構壓力、同儕影響與社會連結弱化等多重因素交互作用所致。本題擬依緊張理論、差別接觸理論及社會控制理論，分析○○之犯罪成因，並據以設計觀護處遇計畫。」\n\n---\n\n### （二）理論分析與事實涵攝（約 400–600 字）\n\n#### 1. 理論表格（建議先列表格，再補充文字）\n\n| 理論／方法 | 理論／方法說明 | 核心概念 | 少年個案應用（連結題目事實） |\n|---|---|---|---|\n| 緊張理論 |  |  |  |\n| 差別接觸理論 |  |  |  |\n| 社會控制理論 |  |  |  |\n\n填寫要點：\n- 「理論說明」：用 2–3 句交代主張、行為成因機制與易混淆處。\n- 「核心概念」：列出 3–5 個關鍵詞即可。\n- 「少年個案應用」：一定要引用題目中的具體事實（家庭、學校、同儕、工作、網路等）。\n\n#### 2. 文字補充（每理論約 80–120 字）\n\n對每個理論再寫一小段，說明：\n- 該理論如何解釋「起始犯罪」與「持續犯罪」。\n- 題目中最能支持此理論的 1–2 個事實。\n- 若有必要，簡要說明該理論的限制（例如：較難解釋偶發性犯罪）。\n\n範例句型：  \n「就緊張理論而言，○○面臨……，使其難以透過合法途徑達成……，因而可能以竊盜作為快速取得金錢的替代手段。此理論較能解釋其因經濟壓力與機會受阻所生之財產犯罪，但對其與同儕共同犯罪之學習歷程則解釋力較弱。」\n\n---\n\n### （三）觀護處遇計畫設計（約 300–400 字）\n\n寫作原則：  \n「理論 → 處遇目標 → 具體措施 → 可追蹤指標」\n\n#### 1. 緊張理論導向處遇\n\n- 處遇目標： 降低結構性壓力，增加合法達成目標的機會。\n- 具體措施：  \n  - 連結職訓、就業輔導、就學銜接。  \n  - 評估經濟扶助需求（低收入、急難救助等）。  \n- 可追蹤指標： 穩定就學／就業月數、收入來源合法化、經濟壓力主觀評分。\n\n#### 2. 差別接觸理論導向處遇\n\n- 處遇目標： 減少與犯罪同儕之高強度接觸，增加正向互動。\n- 具體措施：  \n  - 安排結構化日程（課業、職訓、運動、志工）。  \n  - 引導參與正向同儕團體。  \n  - 認知行為團體：挑戰犯罪合理化信念。  \n- 可追蹤指標： 與犯罪同儕接觸頻率、參與正向活動次數、對犯罪態度量表變化。\n\n#### 3. 社會控制理論導向處遇\n\n- 處遇目標： 強化與家庭、學校、社區及法規範的連結。\n- 具體措施：  \n  - 家庭會談、親職輔導，強化主要照顧者支持。  \n  - 與學校輔導系統合作，提升就學承諾與參與。  \n  - 法治教育、修復式對話或有意義社區服務。  \n- 可追蹤指標： 家庭互動頻率、學校出席率、社區服務完成度、再犯風險評估結果。\n\n---\n\n### （四）成效評估與調整（約 80–120 字）\n\n- 說明將如何定期檢視處遇成效（例：每 3 個月檢視一次）。\n- 提出若成效不佳時的調整方向（例：加強家庭介入、轉介心理治療、調整社區服務內容）。\n\n範例句型：  \n「觀護期間擬每三個月檢視就學、就業、家庭互動及同儕接觸等指標，並視再犯風險評估結果調整處遇強度。若發現同儕影響仍強，則增加認知行為團體次數，並強化正向活動安排。」\n\n---\n\n### （五）結語（約 60–80 字）\n\n- 總結：犯罪成因係多理論交互作用。\n- 強調：處遇應兼顧風險降低與保護因子增強，並以教育與復歸為核心。\n\n範例句型：  \n「綜上，○○之犯罪行為係緊張、學習與控制弱化共同作用之結果。觀護處遇應以多理論整合為基礎，兼顧風險降低與保護因子增強，並朝向教育、復歸與社會接納之目標。」\n\n---\n\n## 三、常見扣分點與避免方式\n\n- [ ] 只寫理論不連結事實：每個理論都要引用題目中的具體情節。\n- [ ] 理論混淆：緊張≠同儕影響；控制≠懲罰。寫作前先釐清核心機制。\n- [ ] 處遇空泛：避免只寫「加強輔導」「多關心」，要寫出「誰、做什麼、多久、如何評估」。\n- [ ] 忽略少年特性：強調教育、復歸、最小干預與最後手段原則。\n\n---\n\n## 四、每日練習建議\n\n1. 選一則少年個案新聞或模擬題。\n2. 用本模板寫一題完整申論（控制在 60–90 分鐘）。\n3. 對照答案或老師講評，標記：\n   - 理論說明是否清楚？\n   - 事實涵攝是否具體？\n   - 處遇是否可執行、可評估？\n4. 每週選一題重寫，精簡冗句、強化邏輯。\n\n---\n\n本模板可依不同理論組合（例如：標籤理論、社會學習理論、一般化緊張理論等）調整表格與處遇段落，但整體結構建議維持「前言→理論分析→處遇設計→成效評估→結語」。","reviewStatus":"待核對","id":"md-23cb33cc04882f000027"}]};

const category=q=>q.subject.includes('跨科')?'跨科整合':q.subject.replace(/（.*$/,'').trim();
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function mdHTML(text){
 const lines=String(text).split('\n');let html='',table=[];
 const flush=()=>{if(!table.length)return;const rows=table.filter(r=>!r.every(c=>/^:?-+:?$/.test(c.replace(/\s/g,''))));html+='<div class="table-wrap"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>'<'+(i?'td':'th')+'>'+esc(c)+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table></div>';table=[];};
 for(const line of lines){if(/^\s*\|/.test(line)){table.push(line.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));continue;}flush();const h=line.match(/^#{1,6}\s+(.*)/);if(h)html+='<h3>'+esc(h[1])+'</h3>';else if(/^---+$/.test(line.trim()))html+='<hr>';else if(line.trim())html+='<p>'+esc(line)+'</p>';}flush();return html;
}
function validRecord(r){return r&&typeof r==='object'&&typeof r.answer==='string'&&r.answer.length<=100000&&typeof r.review==='boolean'&&typeof r.updatedAt==='string'&&(r.questionSnapshot===undefined||typeof r.questionSnapshot==='string');}
try{rawStorage=localStorage.getItem(KEY)||'{}';const parsed=JSON.parse(rawStorage);if(!parsed||typeof parsed!=='object'||Array.isArray(parsed)||!Object.values(parsed).every(validRecord))throw Error();records=Object.fromEntries(Object.entries(parsed));}catch(e){storageWritable=false;$('notice').textContent='原有本機紀錄無法讀取，已保留原資料；請先匯出備份。本次作答暫存於頁面。';}
function visible(){return questions.filter(q=>!$('subject').value||category(q)===$('subject').value);}
function persist(){if(!storageWritable)return false;try{localStorage.setItem(KEY,JSON.stringify(records));return true;}catch(e){$('notice').textContent='本機儲存失敗，請匯出學習紀錄。';return false;}}
function save(){const q=questions.find(q=>q.id===current);if(!q||!$('answer'))return;records[current]={answer:$('answer').value,review:$('review').checked,updatedAt:new Date().toISOString(),questionSnapshot:signature(q)};const ok=persist();$('draft-status').textContent=(ok?'草稿已儲存於此瀏覽器':'草稿暫存在此頁，請匯出備份')+' · '+records[current].answer.length+' 字';renderList();}
function renderList(){const list=visible();$('list').innerHTML=list.map(q=>`<button data-id="${esc(q.id)}" aria-current="${q.id===current}"><small>${esc(category(q))} · ${records[q.id]?.review?'★ 待複習':records[q.id]?.answer?'已有草稿':'尚未作答'}</small><br>${esc(q.date)}${q.id.startsWith('md-')?' · MD':''}</button>`).join('');for(const b of $('list').querySelectorAll('button'))b.onclick=()=>{current=b.dataset.id;render();};}
function render(){renderList();const q=questions.find(q=>q.id===current);if(!q){$('main').innerHTML='<p>此科目目前沒有題目。</p>';return;}const template=templates.find(t=>t.subject===category(q));const r=records[q.id]||{answer:'',review:false};const changed=r.questionSnapshot&&r.questionSnapshot!==signature(q);const table=q.theoryTable;const list=visible(),index=list.findIndex(x=>x.id===q.id);
 $('main').innerHTML=`<h2>${esc(q.date)}｜${esc(category(q))}</h2><span class="badge">待內容核對</span><p class="muted">${esc(q.subject)}</p>${changed?'<p class="error">本題參考內容已更新，原作答仍保留；請重新對照。</p>':''}${(q.warnings||[]).map(w=>`<p class="error">${esc(w)}</p>`).join('')}<h3>案例與問題</h3><div class="text">${esc(q.question)}</div><h3>我的作答</h3>${template?`<details><summary>看答題模板（犯罪學）</summary><p class="muted">以下為來源模板，非評分標準；篇幅、時間與理論選擇請依本題要求調整。</p><div class="text">${mdHTML(template.content)}</div></details>`:''}<textarea id="answer" maxlength="100000" aria-label="我的作答" placeholder="先列爭點，再寫規範、案例涵攝與結論。"></textarea><label class="review-control"><input id="review" type="checkbox">★ 待複習</label><p id="draft-status" class="muted"></p>${q.studyNotes?`<details><summary>隨題複習：易錯提醒／處遇重點</summary><div class="text">${esc(q.studyNotes)}</div></details>`:''}<details><summary>核心爭點與複習方向</summary><div class="text">${esc(q.issues)}</div></details><details><summary>參考答題架構</summary><div class="text">${esc(q.outline)}</div></details><details><summary>理論與個案應用四欄表格</summary><div class="table-wrap"><table><thead><tr>${table[0].map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${table.slice(1).map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details><details><summary>原始考題出處</summary><p class="text">${esc(q.sourceReference||'來源文件未擷取到獨立出處欄位，待補充核對。')}</p><p class="muted">以上依來源文件標示，尚未核對考選部原卷。</p></details><div class="nav"><button id="previous" ${index<=0?'disabled':''}>上一題</button><span class="muted">${index+1} / ${list.length}</span><button id="next" ${index>=list.length-1?'disabled':''}>下一題</button></div>`;
 $('answer').value=r.answer;$('review').checked=r.review;$('draft-status').textContent=r.updatedAt?'上次作答：'+new Date(r.updatedAt).toLocaleString('zh-TW'):'尚未作答';$('answer').oninput=save;$('review').onchange=save;
 $('previous').onclick=()=>{current=list[index-1].id;render();};$('next').onclick=()=>{current=list[index+1].id;render();};
}
function validateData(d){if(d.schemaVersion!==1||!Array.isArray(d.questions)||!d.questions.length||d.count!==d.questions.length)throw Error('題庫格式不符');const ids=new Set();for(const q of d.questions){if(!q||typeof q.id!=='string'||ids.has(q.id)||!/^\d{4}-\d{2}-\d{2}$/.test(q.date)||!['subject','question','issues','outline'].every(k=>typeof q[k]==='string'&&q[k].trim())||!Array.isArray(q.theoryTable)||q.theoryTable.length<2||!q.theoryTable.every(row=>Array.isArray(row)&&row.length===4&&row.every(c=>typeof c==='string')))throw Error('題目或表格格式不符');ids.add(q.id);}if(/(?:docs|drive)\.google\.com/i.test(JSON.stringify(d)))throw Error('題庫含不應公開的來源連結');}
async function load(){if(loading)return;loading=true;$('refresh').disabled=true;try{let data;if(location.protocol==='file:'){data=INITIAL_DATA;}else{const response=await fetch('./questions.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);data=await response.json();}validateData(data);templates=data.templates||[];const filter=$('subject').value;questions=data.questions.slice().sort((a,b)=>b.date.localeCompare(a.date));$('subject').innerHTML='<option value="">全部科目</option>'+[...new Set(questions.map(category))].map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');if(questions.some(q=>category(q)===filter))$('subject').value=filter;if(!visible().some(q=>q.id===current))current=visible()[0]?.id||'';$('status').textContent='測試題庫 '+questions.length+' 題 · 來源最後更新：'+new Date(data.updatedAt).toLocaleString('zh-TW');render();}catch(e){$('status').textContent='題庫更新失敗：'+e.message+'。請稍後再試。';if(!questions.length)$('main').innerHTML='<p>目前無法載入題庫，請點「更新題庫」重試。</p>';}finally{loading=false;$('refresh').disabled=false;}}
function download(body,name){const url=URL.createObjectURL(new Blob([typeof body==='string'?body:JSON.stringify(body,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 $('subject').onchange=()=>{current=visible()[0]?.id||'';render();};$('refresh').onclick=load;
 $('export').onclick=()=>{download({format:'probation-daily-github-records',schemaVersion:1,exportedAt:new Date().toISOString(),records},'daily-simulation-records-'+new Date().toISOString().slice(0,10)+'.json');if(!storageWritable&&rawStorage!=='{}')download(rawStorage,'daily-simulation-original-storage.json');$('notice').textContent='已匯出，請保存下載檔案。';};
 $('import').onclick=()=>$('upload').click();$('upload').onchange=async()=>{try{const file=$('upload').files[0];if(!file)return;if(file.size>5*1024*1024)throw Error('檔案超過 5 MB');const data=JSON.parse(await file.text());if(data.format!=='probation-daily-github-records'||data.schemaVersion!==1||!data.records||typeof data.records!=='object'||Array.isArray(data.records)||!Object.values(data.records).every(validRecord))throw Error('紀錄格式不符，請使用此 GitHub 模擬題頁面的備份');const entries=Object.entries(data.records);if(!entries.length)throw Error('檔案沒有作答紀錄');if(!confirm('匯入 '+entries.length+' 筆紀錄，會取代同題的現有作答。是否繼續？'))return;records=Object.fromEntries([...Object.entries(records),...entries]);if(!storageWritable)$('notice').textContent='紀錄已載入此頁，原本無法讀取的本機資料仍保留；請匯出備份。';else if(persist())$('notice').textContent='紀錄已匯入。';render();}catch(e){$('notice').textContent='匯入失敗：'+e.message;}finally{$('upload').value='';}};
 $('print').onclick=()=>{const states=[...$('main').querySelectorAll('details')].map(d=>[d,d.open]);for(const[d]of states)d.open=true;window.print();for(const[d,open]of states)d.open=open;};
 load();
</script></body></html>
